record: cisa-ai-in-ot-principles
example: monitoring-predictive-maintenance
locator: "§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19"
reviewed_by: ""
# Verbatim from the source (capture blocks p19.b9-p19.b15).
source:
  introduction: "The example below demonstrates how operators and engineers should monitor a predictive maintenance system (with read-only access to OT data output) in the data zone that uses ML to produce recommendations:"
  components:
    - name: "AI System Output"
      text: "Predictive maintenance recommendations for equipment downtime."
      requirement: "R-0111"
    - name: "Anomaly Detection Algorithm"
      text: "Statistical process control that detects outliers in predicted downtime values."
      requirement: "R-0112"
    - name: "Monitoring Tools"
      text: "Real-time dashboards, charts, or metrics that track AI system performance and detect anomalies—ideally, these are integrated into existing human-machine interface (HMI) views for consolidated monitoring."
      requirement: "R-0113"
    - name: "Audit Trail"
      text: "Logging of all AI system operating data (including timestamps, inputs, and outputs) for auditing and analysis of AI system behavior."
      requirement: "R-0114"
    - name: "Offensive Security Assessments/AI Red Teaming"
      text: "Regularly evaluate AI system functions, identifying vulnerabilities and testing resilience."
      requirement: "R-0115"
    - name: "Network and Egress Security"
      text: "Define and enforce network controls; see CISA’s Cybersecurity Performance Goals (CPGs) 2.F."
      requirement: "R-0116"
expected_result:
  stated_by_source: false
  note: "A reference monitoring setup, not a test with an outcome. Use it as a fixture: a model of this system should hold one ML component with read-only access to OT data output in the data zone, and these six monitoring elements as mitigations."
exercises: ["R-0110"]
