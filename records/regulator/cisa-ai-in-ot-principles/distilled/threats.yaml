weaknesses:
  - id: "W-01"
    name: "LLMs in safety decisions"
    description: "As such, AI such as LLMs almost certainly should not be used to make safety decisions for OT environments."
    locator: "Table 2, p. 9"
    kind: "stated"
    external_id: ["CWE-1426"]
    note: "CWE-1426 Improper Validation of Generative AI Output (GenAI only); inferred."
  - id: "W-02"
    name: "persistent inbound access from AI systems into OT"
    description: "Prefer push-based or brokered architectures that move required features or summaries out of OT without granting persistent inbound access."
    locator: "§4.1, p. 20"
    kind: "inferred"
    external_id: ["CWE-653"]
    note: "The weakness is the negation of the recommendation; our reading. CWE-653 Improper Isolation or Compartmentalization (Allowed); inferred."
  - id: "W-03"
    name: "AI identity indistinguishable in logs"
    description: "Configure logging so AI decisions can be tracked for compliance and forensic analysis, and so the logged AI identity is distinct from any typical machine or user identifiers."
    locator: "§4.1, p. 19"
    kind: "inferred"
    external_id: ["CWE-778", "CWE-223"]
    note: "The weakness is the negation of the recommendation; our reading. CWE-778 Insufficient Logging, CWE-223 Omission of Security-relevant Information (both Allowed); inferred."
  - id: "W-04"
    name: "active AI control without a human in the loop"
    description: "Limit active control of OT infrastructure by AI without a human in the loop to account for safety concerns and latency limitations."
    locator: "§2.4, p. 16"
    kind: "inferred"
    note: "The weakness is the negation of the recommendation; our reading."
  - id: "W-05"
    name: "lack of AI vendor transparency"
    description: "AI Vendor Transparency. Lack of vendor transparency could prevent insight into functions that make external connections or modify standard engineering workflows."
    locator: "§2.4, p. 15"
    kind: "stated"
    note: "Was a threat in pass 1; a lack of transparency is a weakness, not a threat (threat-mapping review, 2026-10-22). No CWE fits."
