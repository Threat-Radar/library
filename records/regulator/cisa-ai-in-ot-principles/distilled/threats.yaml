note: >
  The threats and weaknesses the source DESCRIBES, each quoted verbatim (description) with
  its locator. kind: stated = the source describes it; inferred = our reading (a weakness
  read as the negation of a recommendation). external_id holds our mapping as opaque
  strings: NIST AI 100-2 E2025 index ids (NISTAML.*) and MITRE ATLAS 2026.09 technique ids
  (AML.T*), the latter checked against the ATLAS data served by atlas.mitre.org. The source
  prints neither. attack_class uses the NIST AI 100-2 E2025 classes plus three labels of
  ours: non-adversarial (not an attack), conventional (an attack outside the AML taxonomy)
  and general / unclear / out-of-scope. addressed_by lists the requirements whose maps_to
  shares an id with the threat (derived; threats with no id list none). Nothing here is
  instantiated against a product: no risk vector, no mitigation state (artifact.schema.yaml).
threats:
  - id: "T-01"
    name: "Cybersecurity Risks (manipulation, guardrail bypass, prompt injection)"
    description: "Cybersecurity Risks: AI data, models, and deployment software can be manipulated to cause incorrect outcomes or bypass security and functional safety measures or guardrails. Traditional cybersecurity risks remain within AI systems; as such, security measures like access control, auditing, and encryption still apply for securing AI and AI-enabled systems. In addition, AI-enabled systems are subject to AI-specific cybersecurity risks, such as prompt injection."
    affected_asset: ["AI data", "models", "deployment software"]
    impact: "Impacted system availability, functional safety risks, financial losses, reputational damage, network/OT compromise, cascading compromise."
    external_id: ["NISTAML.013", "NISTAML.026", "NISTAML.04", "NISTAML.018", "NISTAML.015", "AML.T0020", "AML.T0018", "AML.T0054", "AML.T0051"]
    external_id_names: ["NISTAML.013 Data Poisoning", "NISTAML.026 Model Poisoning", "NISTAML.04 Misuse Violations", "NISTAML.018 Prompt Injection", "NISTAML.015 Indirect Prompt Injection", "AML.T0020 Training Data Poisoning", "AML.T0018 Manipulate AI Model", "AML.T0054 LLM Jailbreak", "AML.T0051 LLM Prompt Injection"]
    attack_class: ["poisoning", "misuse", "direct-prompt-injection", "indirect-prompt-injection"]
    locator: "Table 2, p. 7"
    kind: "stated"
    addressed_by: ["R-0008", "R-0031", "R-0034", "R-0037", "R-0089", "R-0090", "R-0096", "R-0108"]
  - id: "T-02"
    name: "Data Quality (centralised operational data as a target)"
    description: "Data Quality: AI models can only be as effective as the quality of their training data. Collecting high-quality, normalized sensor data can be difficult, especially in distributed OT environments. Centralizing this operational data creates its own risk as threat actors can use it to create a more targeted engineering impact."
    actor: "threat actors"
    affected_asset: ["centralised operational data"]
    impact: "Reduced OT safety and system availability from poor data quality."
    external_id: ["AML.T0036"]
    external_id_names: ["AML.T0036 Data from Information Repositories"]
    attack_class: ["non-adversarial", "conventional"]
    locator: "Table 2, p. 7"
    kind: "stated"
    addressed_by: ["R-0038"]
  - id: "T-03"
    name: "AI Model Drift"
    description: "AI Model Drift: AI models may become less accurate over time due to data being introduced to the model that is not represented by the model’s initial training data. Alterations to production processes can affect model performance."
    impact: "Increased dependencies on changes, loss of productivity, reduced OT safety and system availability."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "Table 2, p. 8"
    kind: "stated"
    addressed_by: []
  - id: "T-04"
    name: "Lack of Explainability"
    description: "Lack of Explainability: Understanding an AI model’s decision-making process may be difficult; this makes it challenging to diagnose and correct errors or properly audit a system."
    impact: "Increased recovery time, functional safety risks, reduced system availability, complexity in troubleshooting."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "Table 2, p. 8"
    kind: "stated"
    addressed_by: []
  - id: "T-05"
    name: "Operator Cognitive Load and Unnecessary Downtime"
    description: "Operator Cognitive Load and Unnecessary Downtime: AI may generate alarm errors that could cause unnecessary downtime or safety incidents. These alarm errors increase cognitive load, distract operators, and potentially lead to further human error."
    impact: "Reduced system availability, functional safety risks, financial losses, reputational damage."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "Table 2, p. 8"
    kind: "stated"
    addressed_by: []
  - id: "T-06"
    name: "Regulatory Compliance"
    description: "Regulatory Compliance: Compliance with regulatory requirements, such as those related to OT safety or privacy, can be challenging due to the evolving nature of AI, technical standards, and regulatory frameworks. For example, while producing a robust audit trail of AI-driven decision-making may be difficult, it may be required for regulatory compliance."
    impact: "Functional safety risks, financial losses, reputational damage."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "Table 2, p. 8"
    kind: "stated"
    addressed_by: []
  - id: "T-07"
    name: "AI Dependency"
    description: "AI Dependency: Overreliance on AI can lead to operators missing critical safety-related information if the AI misses it, and losing valuable skills for safely operating equipment manually or without the AI functionality."
    impact: "Dependence on technology, complexity in troubleshooting."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "Table 2, p. 8"
    kind: "stated"
    addressed_by: []
  - id: "T-08"
    name: "Interoperability Issues"
    description: "Interoperability Issues: Integrating AI systems with existing OT infrastructure can be complicated by interoperability challenges, which may arise from differences in OT communication protocols or data formats."
    impact: "Increased maintenance costs, recovery challenges."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "Table 2, p. 9"
    kind: "stated"
    addressed_by: []
  - id: "T-09"
    name: "Complexity"
    description: "Complexity: Incorporating AI usually requires increasing the complexity of the overall system to support process automation."
    impact: "Functional safety risks, complexity in troubleshooting."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "Table 2, p. 9"
