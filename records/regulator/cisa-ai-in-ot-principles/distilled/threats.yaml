    addressed_by: []
  - id: "T-10"
    name: "Reliability (hallucination)"
    description: "Reliability: AI may not be reliable enough to independently make critical decisions in industrial environments. AI can also hallucinate (i.e., fabricate a plausible, but false, response or data), which would provide operators with incorrect information for decision-making."
    impact: "Decisions made by AI developers may pose OT safety and reliability risks, increased documentation costs, uncertainty due to changes in automated decision-making over time, increased risk of cascading failure due to tighter coupling of actions. False information provided to decision makers poses risks of unsafe operating conditions, equipment damage, production halts."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "Table 2, p. 9"
    kind: "stated"
    addressed_by: []
  - id: "T-11"
    name: "Dependency Risks and Skill Erosion"
    description: "Dependency Risks and Skill Erosion. Heavy reliance on AI may cause OT personnel to lose manual skills needed for managing systems during AI failures or system outages."
    external_id: []
    attack_class: ["non-adversarial"]
    locator: "§1.3, p. 10"
