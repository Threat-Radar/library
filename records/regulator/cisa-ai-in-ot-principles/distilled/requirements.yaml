note: >
  One entry per normative statement, in source order, ids R-0001.. assigned in that order
  and never reused. A list lead-in ('should:', 'may include:', 'This includes:') is its own
  entry and the list items carry `parent`. Item texts keep every sentence of the item
  unless a sentence is separately testable (then split, never spliced). `text` is verbatim
  from the capture, which drops footnote markers and bullet glyphs. The guidance binds
  nobody (Disclaimer), so even 'must' is typed by its wording, not by force. DERIVED fields
  need human review: actor, phase, nature, testable, bears_on (the tmodel decisions the
  statement bears on; design-notes.md explains each; ADR-0006 accepts DEC-003, ADR-0007
  accepts DEC-002, ADR-0010 accepts DEC-001a, tmodel#130 is a proposal, not a decision).
  maps_to carries two kinds of link:
  (1) provenance: published = a framework the source itself names at that statement
  (NCSC-UK/CISA guidelines, CISA Secure by Design and Secure by Demand, NIST AI RMF, MITRE
  ATLAS and ATT&CK, the three ETSI SAI documents, CISA CPG 2.F); frameworks named only in
  footnotes are kept in the entry's notes, not maps_to;
  (2) provenance: ours = our threat mapping, the attack class the statement defends against
  as NIST AI 100-2 E2025 index ids and MITRE ATLAS technique ids (checked against ATLAS
  2026.09 as served by atlas.mitre.org); kind: stated means the statement's own words name
  the risk (source_text), kind: inferred means our reading.
