reconciliation: "Not a BCP 14 document: bin/bcp14-count finds 0 uppercase keywords, so both BCP 14 counts are 0. The guidance is written in lower-case recommendation forms and imperatives, and says it 'does not create policies, impose requirements, mandate actions' (Disclaimer, p. 22). Own-form baseline over the whole document (.cache capture: page furniture dropped, footnotes counted), source -> extracted: should 40 -> 40; must 5 -> 4; may 37 -> 9; can 53 -> 23; encourage* 2 -> 2; recommend* 9 -> 4; essential 4 -> 4; critical (not \"critical infrastructure\") 10 -> 7; vital 3 -> 2; crucial 2 -> 1; necessary 2 -> 1. In addition, 60 entries carry an imperative verb with no modal (e.g. 'Log and monitor inputs and outputs'); imperatives cannot be counted by pattern, so every imperative sentence in §1.1-§4.2 was read and extracted unless it is navigation ('See ...', 'Visit ...'), part of the fictional §2.1 example (kept whole in examples/: 'Use an AI system for predictive maintenance ...', 'Implement an AI-powered predictive maintenance solution ...'), or the §2.3 trend forecast 'As technology advances, expect the emergence of ...' (p. 13). Every excluded occurrence of each form is itemised with its block in distilled/verification.md: no should is excluded; the one excluded must is the fictional example's design target ('requirements that technology must meet', p. 11; the example is kept as a fixture in examples/); may and can exclusions are possibility or capability (Table 1 and Table 2 cells, the challenge lists, the TLP notice, footnotes, e.g. 'AI models may become less accurate'); the critical, vital, crucial and necessary exclusions are descriptive ('critical decisions', 'vital public services', 'OT vendors play a crucial role', 'may be necessary to accommodate'); recommend* exclusions are nouns or the example's 'to recommend using AI'. Counts are by inclusion in an extracted text, so a form used descriptively inside an extracted sentence (e.g. 'essential public services' in R-0001) counts as extracted."
