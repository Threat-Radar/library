      note: "Source read in full. PDF sha256 matches content.sha256. Capture .cache/cisa-ai-in-ot-principles.capture.txt built from PyMuPDF text blocks (scratchpad cisa_capture.py; rules in verification.md) because sorted-line text interleaves table columns. 123 statements written to a spec (cisa_spec.yaml) and built by cisa_build.py, which fails on any text not found verbatim, on overlapping spans, and on any ATLAS id not in ATLAS-2026.09.yaml from atlas.mitre.org; all passed first run. Own-form counts and itemised exclusions by script (cisa_forms.py)."

