  not_applicable:
    - kind: schema
      reason: "No data format or field structure is defined. The SBOM it asks vendors for is specified elsewhere (footnote 6 defers to CISA's 2025 Minimum Elements, which have their own records); the data usage policy and cloud contract clauses name topics, not fields."
    - kind: messages
      reason: "No message format. Vendor notifications (§2.3), review sessions (§4.1) and incident communication (§4.2) are named without any content structure."
    - kind: protocol
      reason: "No defined exchange between roles. The architecture advice (push-based or brokered transfer, one-way transfer, audited staging buffers, DMZ or jump host; §2.4, §4.1) constrains data-flow direction and zones, not a message sequence; design-notes.md maps it to tmodel#130 DataFlow and TrustBoundary."
    - kind: state-machine
      reason: "No states or transitions. The fallback to non-AI operation (§2.4 failsafe, §3.4 thresholds, §4.2 failure states) is the nearest lifecycle, but the only trigger given is 'if AI system outputs fall below performance and safety thresholds', with no states or guards; a machine would be invented. Recorded as DEC-009 input in design-notes.md."
