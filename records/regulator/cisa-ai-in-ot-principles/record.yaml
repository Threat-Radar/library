    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "123 entries in source order (108 recommendation, 5 principle, 4 permission, 3 requirement, 1 prohibition, 1 scope, 1 informative lead-in); list lead-ins are entries and list items carry parent. Every text machine-checked verbatim against the capture. BCP 14 0/0; own-form baseline reconciled: should 40->40, must 5->4, may 37->9, can 53->17, encourage* 2->2, recommend* 9->4, essential 4->4, critical (not 'critical infrastructure') 10->7, vital 3->2, crucial 2->1, necessary 2->1, plus 53 imperative entries; every exclusion itemised in verification.md. maps_to: frameworks the source names (provenance published) and our threat mapping (NIST AI 100-2 E2025, ATLAS 2026.09; stated or inferred). Derived fields need review."
      reviewed_by: ""
    - kind: threats
      path: distilled/threats.yaml
      coverage: "24 threats and risks the guidance describes (all 10 Table 2 rows, §1.3, §2.2, §2.4, §4.1, §4.2) and 4 weaknesses (1 stated, 3 read as the negation of a recommendation), each quoted verbatim with locator, NIST and ATLAS ids where a class fits, and the statements that address it. No vulnerabilities named."
      reviewed_by: ""
    - kind: examples
      path: distilled/examples
      coverage: "Both worked examples as verbatim fixtures: the §2.1 business-case assessment (with our derived numeric checks, marked as ours) and the §4.1 monitoring setup (linked to R-0098..R-0104). The source states no expected result for either."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "Per statement: tmodel decisions (ADR-0006, ADR-0007, ADR-0010 + tmodel#130, DEC-001b, DEC-008, DEC-009, R-018) and the AI attack class it defends against (NIST AI 100-2 E2025 ids, ATLAS ids, stated/inferred), generated from requirements.yaml; adopt/adapt/gap per decision, incl. Table 2 impacts vs the ADR-0006 S/F/O/P vector and Purdue zones vs tmodel#130; 6 open questions."
      reviewed_by: ""
    - kind: verification
