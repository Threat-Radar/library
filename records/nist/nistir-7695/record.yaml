  not_applicable:
    - kind: protocol
      reason: "NIST IR 7695 defines a logical name (the WFN, §5) and two string bindings of it (§6.1, §6.2), with procedures to bind, unbind and convert them (§6.1.2, §6.1.3, §6.2.2, §6.2.3, §7). It names producers and consumers of CPE names (§4 items 2 to 4), binds names 'for machine interchange and processing' (§2.1, Bind, L307; §5.1), and §3.2 motivates the WFN by 'the ways in which machines exchange product descriptions' (L410). It defines no parties that exchange messages, no transport, no sequence of steps between parties and no error path between them. Every procedure (bind_to_URI, unbind_URI, bind_to_fs, unbind_fs, convert_uri_to_fs, convert_fs_to_uri) is a single-party function over one input. requirements.yaml, messages.yaml and the examples carry these rules."
    - kind: state-machine
      reason: "No lifecycle, persistent state or transitions: 'The WFN is a logical construct only.' (§5.1, L544), and bound names are strings. new, get and set (§5.4) are pass-by-value functions (§1.3, L278) that return a new value. Whether an attribute is specified is a property of the value, not a state it moves through. The only state in the source is the scanning flag `embedded` in decode() (§6.1.3.2, L1533) and add_quoting() (§6.2.3.2, L2162). It enforces the placement rule for special characters in §5.3.2 item 4, a property of one string already expressed by Figures 5-1, 6-2 and 6-3 and by messages.yaml (wfn-value-string). 'deprecated' appears once, for the edition attribute (§5.3.3.6, L766), not for a name; the deprecation lifecycle of dictionary names belongs to NIST IR 7697."
