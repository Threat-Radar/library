    text: "The algorithm defined here assumes that the input WFN complies with the requirements defined in Section 5.2. The behavior of bind_to_URI is undefined if its input is not well formed."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "Says where no result is required."
    status: "active"
    notes: >-
      Verb none. Only Section 5.2 is named, not Section 5.3, so it is unclear whether a WFN whose
      value strings break §5.3.2 (for example an embedded unquoted '*') counts as 'not well formed'.
      transform_for_uri() drops without an error any unquoted character other than a letter, digit,
      underscore, '?' or '*' (R-0170).
  - id: "nistir-7695#R-0147"
    normativity: "permission"
    verb: "OPTIONAL"
    actor: "URI binding implementation"
    condition: "unconditional"
    object: "URI binding procedure"
    field: "following the pseudocode"
    locator: "§6.1.2 Binding a WFN to a URI, para 2, sentence 1 / p. 18 (PDF 24) / L1050-L1051"
