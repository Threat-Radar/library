    notes: >-
      add_quoting() quotes every character other than a letter, digit, underscore, '*', '?' or an
      already quoted pair, so '8.0.6001' becomes '8\.0\.6001' (R-0236).
  - id: "nistir-7695#R-0231"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string unbinding implementation"
    condition: "unconditional"
    object: "formatted string unbinding procedure"
    field: "error checking"
    locator: "§6.2.3.1 Summary of algorithm, sentence 7 / p. 36 (PDF 42) / L2084-L2085"
    text: "The unbinding procedure performs limited error checking, only ensuring that unquoted special characters adhere to syntax requirements specified in Figure 5-1."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0225"
    testable: "yes"
    status: "active"
    notes: >-
      add_quoting() implements the checks (R-0234, R-0235). It is more permissive than Figure 5-1
      for question marks ('foo??bar' passes) and for '**'; it does not check lang against LANGTAG,
      part against h, o and a, the prefix or the number of fields.
  - id: "nistir-7695#R-0232"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string unbinding implementation"
    condition: "unconditional"
    object: "formatted string unbinding"
    field: "field parsing"
    locator: "§6.2.3.2 Pseudocode for algorithm, function get_comp_fs(fs,i) / p. 37 (PDF 43) / L2124-L2138"
    text: |-
      function get_comp_fs(fs,i)
      ;; Return the i’th field of the formatted string. If i=0,
      ;; return the string to the left of the first forward slash.
      ;; The colon is the field delimiter unless prefixed by a
      ;; backslash.
      ;; For example, given the formatted string:
      ;; cpe:2.3:a:foo:bar\:mumble:1.0:*:…
      ;; get_comp_fs(fs,0) = "cpe"
      ;; get_comp_fs(fs,1) = "2.3"
      ;; get_comp_fs(fs,2) = "a"
      ;; get_comp_fs(fs,3) = "foo"
      ;; get_comp_fs(fs,4) = "bar\:mumble"
      ;; get_comp_fs(fs,5) = "1.0"
      ;; etc.
      end.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0225"
    testable: "yes"
    status: "active"
    notes: >-
      Source defect: 'the string to the left of the first forward slash' fits a URI (in 'cpe:/...'
      it is 'cpe:', what get_comp_uri() returns for i=0), not a formatted string, which has no
      slash; the example shows field 0 as 'cpe', the text left of the first colon. A quoted colon stays quoted in the field ('bar\:mumble'). The 'unless
      prefixed by a backslash' test misreads a colon after an escaped backslash (R-0226). The
      example line ends with the ellipsis character (U+2026).
  - id: "nistir-7695#R-0233"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string unbinding implementation"
    condition: "for a quoted pair"
    object: "formatted string unbinding"
    field: "quoted characters kept"
    locator: "§6.2.3.2 Pseudocode for algorithm, function add_quoting(s) / p. 38 (PDF 44) / L2180-L2186"
    text: |-
      if c = "\" then
      ;; Anything quoted in the bound string stays quoted
      ;; in the unbound string.
      result := strcat(result,substr(s,idx,idx+1)).
      idx := idx + 2.
      embedded := true.
      continue.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0225"
    testable: "yes"
    status: "active"
    notes: >-
      A quoted pair is copied unchanged, so '\-' or '\.' in a formatted string (which Figure 6-3
      does not allow, R-0214) is accepted and stays quoted, as would '\a', which Figure 5-1 does not
      allow either.
  - id: "nistir-7695#R-0234"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string unbinding implementation"
    condition: "for an unquoted '*'"
    object: "formatted string unbinding"
    field: "position of '*'"
    locator: "§6.2.3.2 Pseudocode for algorithm, function add_quoting(s) / p. 38 (PDF 44) / L2188-L2197"
    text: |-
      if (c = "*") then
      ;; An unquoted asterisk must appear at the beginning or
      ;; end of the string.
      if (idx = 0 or idx = (strlen(s)-1)) then
      result := strcat(result,c).
      idx := idx + 1.
      embedded := true.
      continue.
      else error.
      endif.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0225"
    testable: "yes"
    status: "active"
    notes: >-
      An unquoted '*' is accepted only as the first or last character; elsewhere it is an error
      (example 6.2.3.3.3, '7.4.*.1570'). A field that is only '*' never gets here (it is ANY,
      R-0228), but '**' does: the first '*' is at index 0 and the second at the end, so '**' unbinds
      to a value R-0041 forbids.
  - id: "nistir-7695#R-0235"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string unbinding implementation"
    condition: "for an unquoted '?'"
    object: "formatted string unbinding"
    field: "position of '?'"
    locator: "§6.2.3.2 Pseudocode for algorithm, function add_quoting(s) / p. 38 (PDF 44) / L2198-L2212"
    text: |-
      if (c = "?") then
      ;; An unquoted question mark must appear at the beginning or
      ;; end of the string, or in a leading or trailing sequence.
      if ;; ? legal at beginning or end
      (((idx = 0) or (idx = (strlen(s)-1))) or
      ;; embedded is false, so must be preceded by ?
      (!embedded and (substr(s,idx-1,idx-1) = "?")) or
      ;; embedded is true, so must be followed by ?
      (embedded and (substr(s,idx+1,idx+1) = "?"))) then
      result := strcat(result,c).
      idx := idx + 1.
      embedded := false.
      continue.
      else error.
      endif.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0225"
    testable: "yes"
    status: "active"
    notes: >-
      Source defect: the branch sets embedded := false after accepting a '?', so in 'foo??bar' the
      first '?' passes (a '?' follows it) and so does the second (embedded is now false and a '?'
      precedes it); the field unbinds to a value with an embedded run of question marks, which
      R-0039 forbids. decode() does not reset embedded for '%01' and rejects the URI form
      'foo%01%01bar' (R-0188). A single embedded '?' ('foo?bar') is rejected as intended. Both
      results were checked by running a literal port of the pseudocode.
  - id: "nistir-7695#R-0236"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string unbinding implementation"
    condition: "for any other unquoted character"
    object: "formatted string unbinding"
    field: "quoting added"
    locator: "§6.2.3.2 Pseudocode for algorithm, function add_quoting(s) / p. 38 (PDF 44) / L2213-L2216"
    text: |-
      ;; all other characters must be quoted
      result := strcat(result,"\",c).
      idx := idx + 1.
      embedded := true.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0225"
    testable: "yes"
    status: "active"
    notes: >-
      Every other unquoted character gains a backslash, including '.' and '-' ('7.4.0.1570' unbinds
      to '7\.4\.0\.1570'). A character that may not appear in a WFN, such as a space, is quoted
      rather than rejected, giving a value that breaks R-0032.
  - id: "nistir-7695#R-0237"
    normativity: "recommendation"
