  - id: "nistir-7695#R-0150"
    normativity: "requirement"
    verb: "SHALL"
    actor: "URI binding implementation"
    condition: "when an attribute value is ANY"
    object: "URI binding"
    field: "logical value ANY"
    locator: "§6.1.2.1.1 Handling logical values / p. 18 (PDF 24) / L1063-L1065"
    text: "The logical value ANY SHALL bind to what [CPE22] calls a “blank” (i.e., an empty component, indicated by two sequential colons) in the URI."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Trailing blanks are trimmed afterwards (R-0167), so ANY in the last components leaves no
      colons (example 6.1.2.4.1).
  - id: "nistir-7695#R-0151"
    normativity: "requirement"
    verb: "SHALL"
    actor: "URI binding implementation"
    condition: "when an attribute value is NA"
    object: "URI binding"
    field: "logical value NA"
    locator: "§6.1.2.1.1 Handling logical values / p. 18 (PDF 24) / L1065"
    text: "The logical value NA SHALL bind to a single hyphen."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      For part and language the hyphen has no place in the URI syntax: Figures 6-1 and 6-2 give
      part only 'h', 'o', 'a' or empty (R-0107) and lang only LANGTAG or empty (R-0113, R-0129), so
      a WFN with either set to NA binds to a URI neither figure admits ('cpe:/-:foo',
      'cpe:/a:foo:::::-'), against R-0007 (normative.md D-3; examples BIND-02, URI-NEG-08). The
      formatted string has a form for both (R-0201, R-0207).
  - id: "nistir-7695#R-0152"
