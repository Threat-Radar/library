    text: "Values for this attribute SHOULD describe or identify the person or organization that manufactured or created the product."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "A semantic judgement about who made the product."
    status: "active"
  - id: "nistir-7695#R-0067"
