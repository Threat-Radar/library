  - id: "nistir-7695#R-0227"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string unbinding implementation"
    condition: "unconditional"
    object: "formatted string unbinding procedure"
    field: "eleven fields"
    locator: "§6.2.3.1 Summary of algorithm, sentence 3 / p. 36 (PDF 42) / L2079-L2080"
    text: "The algorithm parses the eleven fields of the formatted string, then unbinds each string result."
    text_kind: "sentence"
