        out: "%28"
      - in: '\)'
        out: "%29"
      - in: '\*'
        out: "%2a"
      - in: '\+'
        out: "%2b"
      - in: '\,'
        out: "%2c"
      - in: '\-'
        out: "-"
      - in: '\.'
        out: "."
      - in: '\/'
        out: "%2f"
      - in: '\:'
        out: "%3a"
      - in: '\;'
        out: "%3b"
      - in: '\<'
        out: "%3c"
      - in: '\='
        out: "%3d"
      - in: '\>'
        out: "%3e"
      - in: '\?'
        out: "%3f"
      - in: '\@'
        out: "%40"
      - in: '\['
        out: "%5b"
      - in: '\\'
        out: "%5c"
      - in: '\]'
        out: "%5d"
      - in: '\^'
        out: "%5e"
      - in: '\`'
        out: "%60"
      - in: '\{'
        out: "%7b"
      - in: '\|'
        out: "%7c"
      - in: '\}'
        out: "%7d"
      - in: '\~'
