    verbs:
      - "SHOULD"
      - "MAY"
    actor: "CPE name creator (whoever assigns attribute values)"
    condition: "unconditional"
    object: "WFN"
    field: "vendor"
    locator: "§5.3.3.2 Vendor, valid-values sentence / p. 12 (PDF 18) / L737-L738"
    text: "Values for this attribute SHOULD be selected from an attribute-specific valid-values list, which MAY be defined by other specifications that utilize this specification."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Testable only against a list another specification supplies (for example the CPE Dictionary,
      nistir-7697); this specification defines none. The MAY clause lets other specifications define
      the list and has no test here.
    status: "active"
    notes: >-
      Not split: the MAY clause binds other specifications and has no test of its own. The same
      sentence recurs word for word for product, update, edition, sw_edition, target_sw and
      target_hw; each copy binds a different attribute ('this attribute') and is its own entry, so
      also_at is not used. Appendix B (Release 4): 'Clarified requirements involving
      attribute-specific valid-values lists.'
