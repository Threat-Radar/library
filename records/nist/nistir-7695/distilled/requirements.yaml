  - id: "nistir-7695#R-0065"
    normativity: "requirement"
    verb: "SHALL"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "part"
    locator: "§5.3.3.1 Part, lead-in / p. 12 (PDF 18) / L729"
    text: "The part attribute SHALL have one of these three string values:"
    text_kind: "sentence"
    enumeration:
      - "The value “a”, when the WFN is for a class of applications."
      - "The value “o”, when the WFN is for a class of operating systems."
      - "The value “h”, when the WFN is for a class of hardware devices."
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The value set {a, o, h} is testable; whether the value matches the class of product is not.
    status: "active"
    notes: >-
      The three bullets are copied into enumeration without the bullet glyph. The text does not say
      whether part may be a logical value instead: §5.3 lets any attribute take ANY or NA (R-0023),
      and Figures 6-1 to 6-3 accept a blank, '*' or '-' for part (R-0107, R-0201).
  - id: "nistir-7695#R-0066"
