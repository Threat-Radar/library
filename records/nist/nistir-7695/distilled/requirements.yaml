      field after the eleventh are never checked, and a string with fewer fields leaves
      get_comp_fs() undefined. Figure 6-3 requires the prefix and exactly eleven fields (R-0199,
      R-0200).
  - id: "nistir-7695#R-0228"
    normativity: "constraint"
    verb: "none"
