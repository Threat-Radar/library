    locator: "§6.1.2.2 Summary of algorithm, step 3, sentence 3 / p. 19 (PDF 25) / L1130-L1132"
    text: "The leading tilde serves as a flag indicating that the contents of the edition field are a packed representation of five separate values, and the internal tildes are used to aid parsing the values out."
    text_kind: "list-item"
