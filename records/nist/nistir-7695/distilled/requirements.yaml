  - id: "nistir-7695#R-0238"
    normativity: "informative"
    verb: "none"
    actor: "bound name converter"
    condition: "unconditional"
    object: "bound name conversion"
    field: "round-trip safety"
    locator: "§7 Bound Name Conversions, para 1, sentence 3 / p. 41 (PDF 47) / L2307-L2309"
    text: "Both conversions are round-trip safe, meaning that taking one of the two bound forms, converting it to the other form, then converting that back to the original binding form, will result in the original binding."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none; a claim with counterexamples under the source's own pseudocode: a URI with
      uppercase letters or uppercase hex digits comes back lowercased (R-0186); a Figure 6-1 URI
      with an unencoded tilde comes back with '%7e'; a formatted string with uppercase letters comes
      back lowercased (the URI leg lowercases); a URI with a percent-encoded form outside Tables 6-1
      and 6-2 cannot be converted at all. With process_quoted_chars() read as intended (R-0222) it
      holds for lowercase names that the binding procedures produce; executed literally, that
      function breaks the URI to formatted string leg for any value with a quoted period, hyphen or
      underscore. The 'round-' / 'trip' line break is joined without a space.
  - id: "nistir-7695#R-0239"
    normativity: "constraint"
    verb: "none"
    actor: "bound name converter"
    condition: "lead-in: 'Given a URI u which conforms to the CPE v2.2 specification, the procedure for converting it to a formatted string fs has two steps:'"
    object: "URI to formatted string conversion"
    field: "procedure"
    locator: "§7.1 Converting a URI to a Formatted String, function convert_uri_to_fs(u) / p. 41 (PDF 47) / L2316-L2320"
    text: |-
      function convert_uri_to_fs(u)
      w := unbind_uri(u).
      fs := bind_to_fs(w).
      return fs.
      end.
