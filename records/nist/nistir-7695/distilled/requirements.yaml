note: >-
  Ids are stable and never reused; cite as nistir-7695#R-NNNN (a bare R-NNNN in notes means the
  same). Entries are in source order by the first line of their text. VERBAL FORMS: §1.3 adopts RFC
  2119 for the quoted uppercase keywords. `verb` holds the keyword as printed, `verbs` lists both
  keywords where one unsplit sentence carries two, and `verb: none` marks a statement without a
  keyword (a declarative format rule, an algorithm step, a pseudocode excerpt, an ABNF rule, a
  definition, an exemption or a claim), and its normativity says which. One entry has the lowercase
  verb 'may' (§6.2, line 1817). NORMATIVITY: MUST and SHALL = requirement; MUST NOT and SHALL NOT =
  prohibition; SHOULD and SHOULD NOT = recommendation (SHOULD NOT is a negative recommendation); MAY
  and OPTIONAL = permission. For verb none: constraint (a rule that fixes a testable property of a
  name or of a procedure's result), definition (a term or helper function the rules depend on),
  exemption (a sentence saying something is not required or a result is undefined) and informative
  (a testable claim the source makes about its own procedures, which obliges nobody). A permission
  on the content of a name is marked testable when it means that validators must accept that
  content; a permission on an implementation's own choices (OPTIONAL, MAY for other specifications)
  is marked testable no. FORCE OF VERB-NONE RULES: the algorithm summaries and the pseudocode bind
  through the four sentences 'the result of an implementation performing a ... MUST produce the same
  result as the suggested pseudocode, processes, etc. would produce' (§6.1.2, §6.1.3, §6.2.2,
  §6.2.3); the ABNF rules bind through the clauses that name the figures (§4 items 2 to 4, §6.1.1)
  and, for Figure 5-1, through §5.3.2. `inherits_from` names those entries. TEXT: `text` is verbatim
  from the PDF's text layer (pdftotext -layout, checked against pdftotext -raw and rendered pages).
  Prose: a sentence wrapped across lines or pages is joined with one space (page headers and footers
  dropped, runs of spaces collapsed to one); a line-final hyphen inside a hyphenated word
  (valid-values, percent-encoding, non-normative, round-trip) is joined without a space; bullet
  glyphs (U+F0B7) and list labels such as '1.' and 'a.' that open an item are omitted, while labels
  inside a split sentence such as '(b)' are kept. Curly quotes, the U+2019 apostrophe, the U+2026
  ellipsis and the U+02DC small tilde are kept as printed. The em dash (U+2014), which house style
  forbids in this library, would be written {U+2014}, as in normative.md; no entry text contains
  one. Pseudocode: one source line per text
  line, leading indentation dropped and runs of spaces inside a line collapsed to one (as pdftotext -raw
  renders them). ABNF: one rule per line, a rule wrapped over several source lines joined with
  single spaces; a rule name with '/=' alternatives keeps one line per alternative. A lead-in that
  introduces a list is the entry text, and the list items are copied verbatim into `enumeration`
  (Tables 6-1 and 6-2 as in/out pairs). SPLITS: a compound sentence is split only where each part is
  separately testable (§4 items 3 and 4, §5.3.2 rule 2, §5.3.3.10, §6.1.2.1.2); each part is a
  contiguous run of the sentence, and a shared lead-in or condition goes into `condition`. REPEATS:
  `also_at` lists other locators of the same text with the same meaning; it is used only for ABNF
  rules printed identically in several figures where every rule they reference is identical too.
  Sentences that recur word for word but bind a different attribute ('this attribute' in §5.3.3) are
  separate entries, and an ABNF rule whose characters recur in another figure with different
  referenced rules (for example 'vendor = string', where string differs between Figures 6-1 and 6-2)
  is a separate entry whose notes name its twin. ACTORS: 'WFN', 'WFN attribute-value string', 'CPE
  URI' and 'CPE formatted string' mark a rule on the name itself, enforced by whoever produces the
  name and checked by consumers and validators; 'CPE name creator' is whoever assigns attribute
  values (a dictionary maintainer or a tool); the procedure actors (URI binding implementation and
  so on) are bound through the 'same result' sentences. LOCATORS: section number and heading, then
  the item, figure rule or function, then 'p. N (PDF M)', where N is the printed page number and M
  the PDF page (M = N + 6 in the body), then L and the line range in nistir7695.txt (pdftotext -layout,
  2443 lines). Derived fields (normativity, actor, condition, object, field, testable,
  testable_reason, notes) are judgement and need human review; `text` and `enumeration` are
  verbatim. No entry is kind inferred. Where a note says that a figure or a pseudocode function
  accepts or rejects a given string and adds that this was checked, a regular-expression translation
  of the figure or a literal port of the function was run on that string. Not extracted: descriptive
  and introductory prose, scope statements, examples (fixtures for examples/), notation conventions,
  definitions other than those listed, rationale, the change log and pseudocode functions that only
  restate extracted rules; `excluded` lists the passages a reader might look for here, each with its
  reason.
