reconciliation: >-
  bin/bcp14-count finds 108 BCP 14 keywords in nistir7695.txt (SHOULD 33, MAY 29, MUST 18, SHALL 15,
  OPTIONAL 5, MUST NOT 4, SHALL NOT 2, SHOULD NOT 2) and the entry texts carry 106. The difference
  of 2 is the Appendix B change log, line 2405 ('Relaxed the requirement to consume legacy CPE names
  from a MUST to a SHOULD'), which names two keywords while recording an editorial change between
  drafts; it constrains nothing and is not extracted (see excluded). Every other counted occurrence,
  all 106 of them in Sections 4 to 7, sits in the text of exactly one entry; keyword_accounting
  lists all of them by line. No counted keyword is in an example, a figure, a table or a caption. No
  keyword sentence is extracted as a verbatim repeat (also_at): the sentences that recur word for
  word in §5.3.3.2 to §5.3.3.11 ('Values for this attribute SHOULD be selected from an
  attribute-specific valid-values list, which MAY be defined by other specifications that utilize
  this specification.' seven times, 'Any character string meeting the requirements for WFNs (cf.
  5.3.2) MAY be specified as the value of the attribute.' nine times) bind a different attribute in
  each subsection and are separate entries, so each copy counts. The keyword-definition sentence of
  §1.3 (lines 252 to 254, 10 keywords) is not part of the 108: bin/bcp14-count strips it as
  boilerplate (_bcp14.strip_boilerplate); without the strip the count is 118. It is not extracted
  either. Splitting does not change the total: each part of a split sentence keeps its own keyword,
  and 10 entries carry two keywords in one unsplit sentence (verbs). One entry (§6.2, line 1817) has
  the lowercase verb 'may' and adds nothing to either count. Lowercase forms of the keywords: 37
  occurrences (must 12, may 12, required 6, should 6, may not 1); 16 sit in entry texts and 21 are
  excluded as description, rationale, examples or change log, each listed by line in
  keyword_accounting (tallies in source_normative_forms and extracted_normative_forms). The document
  cites RFC 2119 but not RFC 8174, and §1.3 defines only the quoted uppercase words, so lowercase
  forms are read as ordinary English.
