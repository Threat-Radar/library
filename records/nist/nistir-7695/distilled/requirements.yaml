  - id: "nistir-7695#R-0230"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string unbinding implementation"
    condition: "unconditional"
    object: "formatted string unbinding procedure"
    field: "restoring quoting"
    locator: "§6.2.3.1 Summary of algorithm, sentence 6 / p. 36 (PDF 42) / L2082-L2084"
    text: "Quoting of non-alphanumeric characters is restored as needed, but the two special characters (asterisk and question mark) are permitted to appear without a preceding escape character."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0225"
