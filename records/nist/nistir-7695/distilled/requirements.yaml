  - id: "nistir-7695#R-0101"
    normativity: "definition"
    verb: "none"
    actor: "binding and unbinding implementations"
    condition: "unconditional"
    object: "WFN operations"
    field: "get(w,a)"
    locator: "§5.4.2 Function get(w,a) / p. 14 (PDF 20) / L844-L845"
    text: "The get(w,a) function takes two arguments, a WFN w and an attribute a, and returns the value of a. If the attribute a is unspecified in w, get(w,a) returns the default value ANY."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
      - "nistir-7695#R-0178"
      - "nistir-7695#R-0220"
