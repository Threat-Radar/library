  - id: "nistir-7695#R-0157"
    normativity: "constraint"
    verb: "none"
    actor: "URI binding implementation"
    condition: "when an extended attribute (sw_edition, target_sw, target_hw, other) has a value other than ANY"
    object: "URI binding"
    field: "edition component (packing)"
    locator: "§6.1.2.1.3 Packing extended attributes, para 1, sentences 2 and 3 / p. 19 (PDF 25) / L1111-L1113"
    text: "When these attributes have values other than ANY in the WFN, they are “packed” in a special format, and in a specified order, into the edition component of the URI. This special format uses the tilde character “~” (without percent-encoding) as a sub-delimiter."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0149"
      - "nistir-7695#R-0148"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none. 'These attributes' are the four extended attributes named in the sentence before.
      The format and order are in §6.1.2.2 step 3 (R-0160) and pack() (lines 1283 to 1295). NA
      counts as 'other than ANY', so an extended attribute set to NA triggers packing. The next
      paragraph ('This capability should be used with care ...') is lowercase advice and is not
      extracted (see excluded).
