    normativity: "requirement"
    verb: "SHALL"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "language"
    locator: "§5.3.3.10 Language, sentence 1, first clause / p. 13 (PDF 19) / L809"
    text: "Values for this attribute SHALL be valid language tags as defined by [RFC5646],"
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Split from one sentence: tag validity (here) and its meaning (R-0093) have different tests. In
      the WFN the tag is a value string, so its hyphen is quoted ('en\-us', rule 5). The bound forms
      accept far fewer tags: Figures 6-2 and 6-3 allow only language ["-" region] (R-0140), so a
      valid RFC 5646 tag such as 'zh-Hant-TW' cannot be carried in a preferred URI or a formatted
      string. This subsection does not say whether ANY and NA are allowed; the figures allow them
      (R-0207).
