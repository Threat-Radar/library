  - id: "nistir-7695#R-0181"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "unconditional"
    object: "URI unbinding procedure"
    field: "edition component (unpacking)"
    locator: "§6.1.3.1 Summary of algorithm, step 3 / p. 25 (PDF 31) / L1461-L1462"
    text: 'The edition component is "unpacked" if a leading tilde indicates it contains a packed collection of five attribute values.'
    text_kind: "list-item"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: "See R-0183 and R-0190."
  - id: "nistir-7695#R-0182"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "unconditional"
    object: "URI unbinding"
    field: "component to attribute mapping (1 to 5)"
    locator: "§6.1.3.2 Pseudocode for algorithm, function unbind_URI(uri) / p. 25 (PDF 31) / L1470-L1479"
    text: |-
      for i := 1 to 7
      do
      v := get_comp_uri(uri,i). ; get the i’th component of uri
      ;; unbind the parsed string.
      case i:
      1: result := set(result,part,decode(v)).
      2: result := set(result,vendor,decode(v)).
      3: result := set(result,product,decode(v)).
      4: result := set(result,version,decode(v)).
      5: result := set(result,update,decode(v)).
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      Components 1 to 5 become part, vendor, product, version and update, each through decode().
      Components after the seventh are never read and the 'cpe:/' scheme is never checked, so the
      pseudocode does not reject a URI with extra components or another prefix; Figure 6-1 does
      (R-0105, R-0106).
  - id: "nistir-7695#R-0183"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "unconditional"
    object: "URI unbinding"
    field: "edition (unpacking) and language"
    locator: "§6.1.3.2 Pseudocode for algorithm, function unbind_URI(uri) / p. 26 (PDF 32) / L1487-L1499"
    text: |-
      6: ;; Special handling for edition component.
      ;; Unpack edition if needed.
      if (v = "" or v = "-" or substr(v,0,0) != "~")
      then
      ;; Just a logical value or a non-packed value.
      ;; So unbind to legacy edition, leaving other
      ;; extended attributes unspecified.
      result := set(result,edition,decode(v)).
      else
      ;; We have five values packed together here
      result := unpack(v,result).
      end.
      7: result := set(result,language,decode(v)).
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      Unpacks exactly when the edition component starts with an unencoded '~'. A non-packed edition
      leaves sw_edition, target_sw, target_hw and other unspecified, which equals ANY (R-0021).
      Component 7 becomes language.
  - id: "nistir-7695#R-0184"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "unconditional"
    object: "URI unbinding"
    field: "component parsing"
    locator: "§6.1.3.2 Pseudocode for algorithm, function get_comp_uri(uri,i) / p. 26 (PDF 32) / L1505-L1517"
    text: |-
      function get_comp_uri(uri,i)
      ;; Return the i’th CPE component of the URI. If i=0,
      ;; return the URI scheme. For example, given URI:
      ;; cpe:/a:foo::bar:-
      ;; get_comp_uri(uri,0) = "cpe:"
      ;; get_comp_uri(uri,1) = "a"
      ;; get_comp_uri(uri,2) = "foo"
      ;; get_comp_uri(uri,3) = ""
      ;; get_comp_uri(uri,4) = "bar"
      ;; get_comp_uri(uri,5) = "-"
      ;; get_comp_uri(uri,6) = ""
      ;; etc.
      end.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      Defined only by this example: components are the colon-separated parts after 'cpe:/', and a
      component past the end of the URI is '' (get_comp_uri(uri,6) for a URI with five), which
      decode() turns into ANY. So omitted trailing components unbind to ANY, matching the trimming
      in binding (R-0167).
  - id: "nistir-7695#R-0185"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "unconditional"
    object: "URI unbinding"
    field: "legal percent-encoded forms"
    locator: "§6.1.3.2 Pseudocode for algorithm, function decode(s) / p. 26 (PDF 32) / L1519-L1524"
    text: |-
      function decode(s)
      ;; This function scans the string s and returns a copy
      ;; with all percent-encoded characters decoded. This
      ;; function is the inverse of pct_encode(s) defined in
      ;; Section 6.1.2.3. Only legal percent-encoded forms are
      ;; decoded. Others raise an error.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      The legal forms are the 29 percent-encoded OUT values of Table 6-1, decoded to the quoted
      character (lines 1588 to 1623), plus '%01' and '%02' under position rules (R-0188, R-0189);
      'else: error. ; any other form is an error' (line 1624). So a Figure 6-1 URI with any other
      percent-encoded byte fails to unbind (§6.1.3.3.6: '%07'), which conflicts with R-0121. Within
      decode() a backslash between double quotes is escaped by a second backslash (its comment at
      line 1560: 'pseudocode below uses \ within quotes as escape char'), while transform_for_uri(),
      process_quoted_chars() and add_quoting() write a lone backslash between double quotes without
      escaping it.
  - id: "nistir-7695#R-0186"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "unconditional"
    object: "URI unbinding"
    field: "case normalization"
    locator: "§6.1.3.2 Pseudocode for algorithm, function decode(s) / p. 26 (PDF 32) / L1529-L1530"
    text: |-
      ;; Normalize: convert all uppercase letters to lowercase first.
      s := to_lowercase(s).
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      Every URI component is lowercased before decoding, including the hex digits of percent-encoded
      forms ('%2A' becomes '%2a'). Appendix B (Release 2): 'Ensured that uppercase letters are
      transformed to lowercase in unbind_URI.' Formatted string unbinding has no such step, so the
      two unbinding procedures treat case differently, and URIs with uppercase letters do not
      survive a round trip (R-0238).
  - id: "nistir-7695#R-0187"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "unconditional"
    object: "URI unbinding"
    field: "quoting of '.', '-' and '~'"
    locator: "§6.1.3.2 Pseudocode for algorithm, function decode(s) / p. 26-27 (PDF 32-33) / L1537-L1546"
    text: |-
      ;; deal with dot, hyphen and tilde: decode with quoting
      if ((c = '.') or (c = '-') or (c = '~')) then
      result := strcat(result,"\\",c).
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      Adds the quoting a WFN needs for '.', '-' and '~' (§5.3.2 rule 5). The third line follows a
      page break (p. 26 to 27). §6.1.3.1 step 2 names only periods and hyphens (R-0180). A component
      that is exactly '-' was already decoded to NA.
  - id: "nistir-7695#R-0188"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "for a '%01' form"
    object: "URI unbinding"
    field: "position of '%01'"
    locator: "§6.1.3.2 Pseudocode for algorithm, function decode(s) / p. 27 (PDF 33) / L1561-L1578"
    text: |-
      "%01": if ;; %01 legal at beginning or end
      (((idx = 0) or (idx = (strlen(s)-3))) or
      ;; embedded is false, so must be preceded by %01
      (!embedded and (substr(s,idx-3,idx-1) = "%01")) or
      ;; embedded is true, so must be followed by %01
      (embedded and (strlen(s) >= idx+6) and
      (substr(s,idx+3,idx+5) = "%01")))
      then
      ;; A percent-encoded question mark is found
      ;; at the beginning or the end of the string,
      ;; or embedded in sequence as required.
      ;; Decode to unquoted form.
      result := strcat(result,"?").
      idx := idx + 3.
      continue.
      else
      error. ;; raise an exception
      endif.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      '%01' decodes to an unquoted '?' at the start or end of the component or inside a run of '%01'
      that reaches the start or end; anywhere else it is an error (R-0039). The branch leaves
      embedded unchanged, so the run check works: 'a%01%01' and '%01%01a' decode, 'a%01%01b' raises
      an error (checked by running a literal port of the pseudocode).
  - id: "nistir-7695#R-0189"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "for a '%02' form"
    object: "URI unbinding"
    field: "position of '%02'"
    locator: "§6.1.3.2 Pseudocode for algorithm, function decode(s) / p. 27 (PDF 33) / L1579-L1587"
    text: |-
      "%02": if ((idx = 0) or (idx = (strlen(s)-3)))
      then
      ;; Percent-encoded asterisk is at the beginning
      ;; or the end of the string, as required.
      ;; Decode to unquoted form.
      result := strcat(result,"*").
      else
      error. ;; raise an exception
      endif.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      '%02' decodes to an unquoted '*' only as the first or last three characters; elsewhere it is
      an error (§6.1.3.3.8). Two departures from §5.3.2 rule 4: a component that is exactly '%02'
      decodes to a lone '*' (R-0040), and '%02%02' decodes to '**' (R-0041).
  - id: "nistir-7695#R-0190"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "for a packed edition component"
    object: "URI unbinding"
    field: "packed edition fields"
    locator: "§6.1.3.2 Pseudocode for algorithm, function unpack(s,wfn) / p. 29 (PDF 35) / L1672-L1677"
    text: |-
      wfn := set(wfn,edition,decode(ed)).
      wfn := set(wfn,sw_edition,decode(sw_ed)).
      wfn := set(wfn,target_sw,decode(t_sw)).
      wfn := set(wfn,target_hw,decode(t_hw)).
      wfn := set(wfn,other,decode(oth)).
      return wfn.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "yes"
    status: "active"
    notes: >-
      The five packed fields, in order, become edition, sw_edition, target_sw, target_hw and other,
      each through decode() (an empty field becomes ANY). The parsing above these lines (1636 to
      1671) uses strchr() and assumes four more tildes after the first; with fewer, strchr() returns
      nil and the result is not defined. Figure 6-2's packed rule requires five fields (R-0134).
  - id: "nistir-7695#R-0191"
    normativity: "definition"
    verb: "none"
    actor: "implementation reproducing the pseudocode"
    condition: "unconditional"
    object: "pseudocode helper"
    field: "strchr()"
    locator: "§6.1.3.2 Pseudocode for algorithm, function strchr(str,chr,off) / p. 29 (PDF 35) / L1680-L1687"
    text: |-
      function strchr(str,chr,off)
      ;; Searches the string str for the character chr starting
      ;; at offset off into the string. Returns the offset of
      ;; the chr if found, otherwise nil.
      ;; Defined similar to the standard C function strchr.
      ;; But this version takes a third argument off, which
      ;; is an offset into the str to begin the search.
      end.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0178"
    testable: "no"
    testable_reason: "A helper used inside unpack(); observable only through results."
    status: "active"
    notes: "Unlike C strchr() it returns an offset, not a pointer, and nil when not found."
  - id: "nistir-7695#R-0192"
    normativity: "constraint"
    verb: "none"
    actor: "CPE formatted string"
    condition: "unconditional"
    object: "formatted string binding"
    field: "prefix and field delimiter"
    locator: "§6.2 Formatted String Binding, para 2, sentence 1 / p. 31 (PDF 37) / L1803"
    text: 'The formatted string binding is a colon-delimited list of fields prefixed with the string "cpe:2.3:".'
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0006"
      - "nistir-7695#R-0009"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none. Appendix B (Release 2): the prefix changed from 'cpe23:' to 'cpe:2.3:'. The next
      sentence explains that the distinct prefix lets tools tell a formatted string from a URI. The
      paragraph before says the binding is defined 'to be a “formatted string” rather than a URI in
      order to relax the requirements that typically apply to URIs as specified in [RFC3986]', so
      RFC 3986 rules do not apply.
  - id: "nistir-7695#R-0193"
    normativity: "constraint"
    verb: "none"
    actor: "CPE formatted string"
    condition: "unconditional"
    object: "formatted string binding"
    field: "field order"
    locator: "§6.2 Formatted String Binding, para 3 / p. 31 (PDF 37) / L1808-L1809"
    text: "Similar to the URI binding, the formatted string binds the attributes in a WFN in a fixed order, separated by the colon character:"
    text_kind: "sentence"
    enumeration:
      - "cpe:2.3: part : vendor : product : version : update : edition : language : sw_edition : target_sw : target_hw : other"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0006"
      - "nistir-7695#R-0009"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none. The displayed line (two source lines joined) is copied into enumeration; the
      attribute names are italic in the PDF. bind_to_fs() uses the same order (lines 1904 to 1905).
  - id: "nistir-7695#R-0194"
    normativity: "constraint"
    verb: "none"
    actor: "CPE formatted string"
    condition: "unconditional"
    object: "formatted string binding"
    field: "unquoted characters"
    locator: "§6.2 Formatted String Binding, para 4, sentence 1 / p. 31 (PDF 37) / L1814-L1815"
    text: "In a formatted string binding, the alphanumeric characters plus hyphen (“-”), period (“.”) and underscore (“_”) appear unquoted."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0006"
      - "nistir-7695#R-0009"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none. Unlike a WFN, where '-' and '.' are quoted; process_quoted_chars() removes those
      escapes when binding (R-0222).
  - id: "nistir-7695#R-0195"
    normativity: "constraint"
    verb: "none"
    actor: "CPE formatted string"
    condition: "when a field is a lone '*' or '-'"
    object: "formatted string binding"
    field: "logical values"
    locator: "§6.2 Formatted String Binding, para 4, sentence 2 / p. 31 (PDF 37) / L1815-L1816"
    text: "When used alone, the asterisk (“*”) represents the logical value ANY, and the hyphen (“-”) represents the logical value NA."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0006"
      - "nistir-7695#R-0009"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none. A WFN value string cannot be a lone '*' (R-0040) or a lone quoted hyphen (R-0045),
      so the logical forms cannot collide with strings.
  - id: "nistir-7695#R-0196"
    normativity: "requirement"
    verb: "MUST"
    actor: "CPE formatted string"
    condition: "unconditional"
    object: "formatted string binding"
    field: "quoting"
    locator: "§6.2 Formatted String Binding, para 4, sentence 3 / p. 31 (PDF 37) / L1816-L1817"
    text: "All other non-alphanumeric characters, if used, MUST be quoted (preceded by the backslash)."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      'All other' leaves out the hyphen, period and underscore (R-0194) and, by the next sentence,
      unquoted special characters. Figure 6-3's quoted and punc rules list the characters (R-0214,
      R-0215).
  - id: "nistir-7695#R-0197"
    normativity: "permission"
    verb: "may"
    actor: "CPE formatted string"
    condition: "unconditional"
    object: "formatted string binding"
    field: "unquoted '*' and '?'"
    locator: "§6.2 Formatted String Binding, para 4, sentence 4 / p. 31 (PDF 37) / L1817-L1818"
    text: "The special characters asterisk and question mark may appear without quoting, in which case they are open to special interpretation by other CPE specifications."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Lowercase 'may': §1.3 defines only the quoted uppercase keywords, so this is not a BCP 14
