    field: "pct-encoded"
    locator: "§6.1.1 URI Binding Syntax, Figure 6-1, rule pct-encoded / p. 16 (PDF 22) / L956"
    text: 'pct-encoded = "%" HEXDIG HEXDIG'
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0007"
      - "nistir-7695#R-0121"
      - "nistir-7695#R-0010"
    testable: "yes"
    status: "active"
    notes: >-
      Any percent-encoded byte, '%00' to '%ff' (HEXDIG is case-insensitive). So '%01', '%02' and
      '%07' all match, and §6.1.1 obliges URI consumers to accept them (R-0121), yet decode() raises
      an error for every form outside Tables 6-1 and 6-2 (R-0185; §6.1.3.3.6 rejects '%07').
      §6.1.1's own description gives the range as '%01-ff'.
