    testable: "no"
    testable_reason: "Used only inside the pseudocode; observable through binding results."
    status: "active"
    notes: >-
      Verb none. Returning ANY for an unspecified attribute is what makes unspecified attributes
      bind like ANY (R-0021).
  - id: "nistir-7695#R-0102"
    normativity: "definition"
    verb: "none"
    actor: "binding and unbinding implementations"
    condition: "unconditional"
    object: "WFN operations"
    field: "set(w,a,v)"
    locator: "§5.4.3 Function set(w,a,v) / p. 14 (PDF 20) / L855-L858"
    text: "The set(w,a,v) function takes three arguments, a WFN w, an attribute a, and a value v. If the attribute a is unspecified in w, set(w,a,v) adds the attribute-value pair a=v to w. If the attribute a is specified in w, set(w,a,v) replaces its value with v. If v is nil, set(w,a,v) deletes a from w if a is specified in w, otherwise has no effect. The function always returns the new value of w."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
      - "nistir-7695#R-0178"
      - "nistir-7695#R-0220"
      - "nistir-7695#R-0225"
    testable: "no"
    testable_reason: "Used only inside the pseudocode; observable through unbinding results."
    status: "active"
    notes: >-
      Verb none. The unbinding procedures call set() with ANY for a blank or '*' field, so an
      unbound WFN names every attribute the procedure reads (all eleven from a formatted string;
      from a URI, seven, or all eleven when the edition is packed, R-0183), as the examples show
      (edition=ANY, language=ANY and so on), while a WFN built by hand may leave attributes out; by
      R-0021 the two are equivalent.
  - id: "nistir-7695#R-0103"
    normativity: "constraint"
    verb: "none"
    actor: "producer or consumer of CPE names carried in XML"
    condition: "when CPE names are carried in XML"
    object: "XML binding of bound names"
    field: "authoritative XML schema"
    locator: "§6 Name Binding and Unbinding, para 2 / p. 16 (PDF 22) / L916-L918"
    text: "The XML schema implementation of these format requirements, which is the authoritative XML binding definition, can be found at http://scap.nist.gov/schema/cpe/2.3/cpe-naming_2.3.xsd."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The schema's two patterns can be run (the file is schema/cpe-naming_2.3.xsd in this record),
      but the text calls it authoritative without saying which governs where it disagrees with
      Figures 6-1 to 6-3, and it does disagree (messages.yaml, external_xsd_note; design-notes.md,
      defect 20).
    status: "active"
    notes: >-
      Verb none. The preceding sentence: 'This section defines the formats for acceptable bound CPE
      names.' The printed http address redirects to
      https://csrc.nist.gov/schema/cpe/2.3/cpe-naming_2.3.xsd, which served the file held in
      schema/ (SHA-256 d37f813f...dd69); pass 2 fetched it again on 2026-10-19 and got the same
      bytes.
  - id: "nistir-7695#R-0104"
    normativity: "informative"
    verb: "none"
    actor: "URI binding implementation"
    condition: "unconditional"
    object: "bind_to_URI result"
    field: "conformance to [CPE22]"
    locator: "§6.1 URI Binding, para 1 / p. 16 (PDF 22) / L924-L925"
    text: "The procedure defined here for creating a URI binding ensures that when a WFN is bound to a URI, it will satisfy the requirements of [CPE22] for CPE names."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none; a design claim about the procedure, not an obligation. Checkable against Figure
      6-1, the [CPE22] Appendix A syntax: bound URIs match it except when part or language is NA
      (see R-0007), and the '%01' and '%02' forms are not among those [CPE22] Section 5.4 expects (§6.1.1: [CPE22] 'suggests that only certain
      printable non-alphanumeric characters should be percent-encoded').
  - id: "nistir-7695#R-0105"
    normativity: "constraint"
    verb: "none"
    actor: "CPE URI"
    condition: "for a CPE name in URI form (the full syntax consumers MUST accept)"
    object: "URI binding (Figure 6-1)"
    field: "cpe-name"
    locator: "§6.1.1 URI Binding Syntax, Figure 6-1, rule cpe-name / p. 16 (PDF 22) / L934"
    text: 'cpe-name = "cpe:/" component-list'
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0007"
      - "nistir-7695#R-0121"
      - "nistir-7695#R-0010"
    testable: "yes"
    status: "active"
    notes: >-
      Figure 6-1 reproduces the [CPE22] Appendix A syntax ('For ease of reference it is shown in
      Figure 6-1'). Under RFC 2234 a quoted string is case-insensitive, so 'CPE:/' also matches;
      unbind_URI() never checks the scheme (R-0182). Because component-list may be empty, 'cpe:/'
      alone is a valid name. Figure 6-2 has the same characters (R-0122).
  - id: "nistir-7695#R-0106"
    normativity: "constraint"
    verb: "none"
    actor: "CPE URI"
    condition: "for a CPE name in URI form (the full syntax consumers MUST accept)"
    object: "URI binding (Figure 6-1)"
    field: "component-list"
    locator: "§6.1.1 URI Binding Syntax, Figure 6-1, rule component-list (eight alternatives) / p. 16 (PDF 22) / L936-L945"
    text: |-
      component-list = part ":" vendor ":" product ":" version ":" update ":" edition ":" lang
      component-list /= part ":" vendor ":" product ":" version ":" update ":" edition
      component-list /= part ":" vendor ":" product ":" version ":" update
      component-list /= part ":" vendor ":" product ":" version
      component-list /= part ":" vendor ":" product
      component-list /= part ":" vendor
      component-list /= part
      component-list /= empty
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0007"
      - "nistir-7695#R-0121"
      - "nistir-7695#R-0010"
    testable: "yes"
    status: "active"
    notes: >-
      Up to seven components in a fixed order, or none: trailing components may be left out. Omitted
      components unbind to ANY (R-0184), which matches the trimming of trailing colons when binding
      (R-0167). Each of the eight lines is one alternative; wrapped lines are joined. Figure 6-2 has
      the same characters (R-0123).
  - id: "nistir-7695#R-0107"
    normativity: "constraint"
    verb: "none"
    actor: "CPE URI"
    condition: "for a CPE name in URI form (the full syntax consumers MUST accept)"
