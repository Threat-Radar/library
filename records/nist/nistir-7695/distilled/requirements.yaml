excluded:
  - locator: "§1.3 Document Conventions, para 1 / p. 2 (PDF 8) / L252-L254"
    text: "The key words “MUST”, “MUST NOT”, “REQUIRED”, “SHALL”, “SHALL NOT”, “SHOULD”, “SHOULD NOT”, “RECOMMENDED”, “MAY”, and “OPTIONAL” in this document are to be interpreted as described in [RFC2119]."
    reason: >-
      The BCP 14 keyword-definition sentence: it defines the keywords and constrains no actor.
      bin/bcp14-count strips it (_bcp14.strip_boilerplate), so its 10 keywords are not part of
      source_keyword_count (118 without the strip). It cites RFC 2119 only, not RFC 8174.
  - locator: "§1.3 Document Conventions, para 4, sentence 1 / p. 2 (PDF 8) / L269-L270"
    text: "This document uses an abstract pseudocode programming language to specify expected computational behavior."
    reason: >-
      Explains the role of the pseudocode (it is to 'clearly define the desired behavior', and
      implementers choose the design); the operative rules are the four 'same result' sentences
      (R-0148, R-0178, R-0220, R-0225).
  - locator: "§3.2 CPE Version 2.2, para 1 / p. 5 (PDF 11) / L400"
    text: "The CPE version 2.3 specifications, including this specification, collectively replace [CPE22]."
    reason: "A relationship statement between documents; it constrains no implementation."
  - locator: "§5 Well-Formed CPE Name Data Model, para 4 / p. 8 (PDF 14) / L524"
    text: "WFNs are used solely for product classes."
    reason: >-
      A scope statement; its testable part is the SHOULD NOT on instance-specific data (R-0097).
  - locator: "§5.1 Definitions and Notation, para 3, sentence 1 / p. 9 (PDF 15) / L558-L559"
    text: "An attribute-value pair is a tuple a=v in which a (the attribute) is an alphanumeric label (used to represent a property or state of some entity), and v (the value) is the value assigned to the attribute."
    reason: "A definition; the permitted attribute names are fixed by R-0019."
  - locator: "§5.1 Definitions and Notation, para 3, sentence 3 / p. 9 (PDF 15) / L561-L562"
    text: "By convention, attributes will be written in all lowercase letters, with the underscore (“_”) character used to separate distinct words within an attribute."
    reason: "A notation convention of this document."
  - locator: "§5.1 Definitions and Notation, para 5, sentence 1 / p. 9 (PDF 15) / L573-L574"
    text: "That is, WFNs will be notated as lists of attribute-value pairs enclosed in square brackets, prefixed with the string “wfn:”."
    reason: "The wfn:[...] notation, used only to explain and illustrate (R-0017)."
  - locator: "§5.2 WFN Attributes, last paragraph / p. 9 (PDF 15) / L598-L599"
    text: "The attributes sw_edition, target_sw, target_hw, and other are newly introduced in this specification and are referred to collectively as the extended attributes."
    reason: "Defines the term 'extended attributes' that the packing rules use (R-0157)."
  - locator: "§5.3.1 Logical values, last paragraph / p. 10 (PDF 16) / L624-L625"
    text: "In WFNs, these logical values will be written in all uppercase characters, without surrounding quotation marks, on the right side of the equal sign, as in these examples:"
    reason: "A notation convention for the wfn:[...] examples."
  - locator: "§5.3.2 Restrictions on attribute-value strings, para 2 / p. 10 (PDF 16) / L635-L636"
    text: "In WFNs, attribute-value strings will be enclosed in double quotes as in the examples below. The quotation marks are, of course, not considered part of the string values themselves."
    reason: "A notation convention for the wfn:[...] examples."
  - locator: "§5.3.2 Restrictions on attribute-value strings, examples after Figure 5-1 / p. 11 (PDF 17) / L699"
    text: "The following are examples of allowable value strings in WFNs:"
    reason: "Examples of valid value strings; they belong in examples/ as fixtures."
  - locator: "§5.3.3 Per-attribute value restrictions, para 1 / p. 11 (PDF 17) / L716-L717"
    text: "This section specifies value restrictions on each WFN attribute and provides recommendations for how suitable value strings should be chosen."
    reason: "Describes the section; lowercase 'should'."
  - locator: "§5.5 WFN Examples / p. 14 (PDF 20) / L870-L872"
    text: "This section illustrates a variety of WFNs. The examples below are intended only to illustrate names that are well formed according to the rules defined above. These examples do not necessarily illustrate “correct” or “valid” assignments of values to attributes."
    reason: >-
      Examples; the section itself says they 'do not necessarily illustrate “correct” or “valid”
      assignments of values to attributes'.
  - locator: "§6.1.1 URI Binding Syntax, para 2 / p. 17 (PDF 23) / L970-L971"
    text: "This syntax specification is less restrictive than suggested by other text in [CPE22] as well as current CPE operational practice."
    reason: >-
      Describes [CPE22] and operational practice; the lowercase 'should' in this paragraph reports
      what [CPE22] suggests.
  - locator: "§6.1.1 URI Binding Syntax, bullets after Figure 6-2 / p. 18 (PDF 24) / L1031-L1033"
    text: "It introduces support for “packing” multiple attribute values into the edition component. It introduces support for the use of special characters. It strictly enumerates the allowed percent-encoded forms."
    reason: "Describes features of Figure 6-2, whose rules are extracted one by one."
  - locator: "§6.1.2.1.2 Handling non-alphanumeric and special characters, para 1, sentences 3 to 5 / p. 18 (PDF 24) / L1071-L1074"
    text: "In most cases, quoted non-alphanumeric characters are bound to a percent-encoded form; certain quoted non-alphanumeric characters, however, are passed through without percent-encoding. When special characters appear without quoting, they are mapped to special percent-encoded forms."
    reason: "A prose summary of Tables 6-1 and 6-2 (R-0155, R-0156)."
  - locator: "§6.1.2.1.2 Handling non-alphanumeric and special characters, para 2, sentences 2 and 3 / p. 18-19 (PDF 24-25) / L1078-L1089"
    text: 'So, for example, if the substring "\(" (exclusive of double quotes) is encountered within an attribute-value string, it would be bound to the substring "%28". As a second example, if the substring "\-" is encountered within an attribute-value string, it would be bound to the single character "-".'
    reason: "Examples of Table 6-1."
  - locator: "§6.1.2.1.3 Packing extended attributes, para 2 / p. 19 (PDF 25) / L1115-L1119"
