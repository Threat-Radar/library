    locator: "§7 Bound Name Conversions, para 1, sentence 1 / p. 41 (PDF 47) / L2305-L2306"
    text: "This section specifies the procedures that SHOULD be followed when converting between the two required bound forms of WFNs."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Lowercase 'required' (the two bound forms the specification requires). §4 item 4(c) (R-0011)
