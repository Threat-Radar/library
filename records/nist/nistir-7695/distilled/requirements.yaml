  - id: "nistir-7695#R-0180"
    normativity: "constraint"
    verb: "none"
    actor: "URI unbinding implementation"
    condition: "unconditional"
    object: "URI unbinding procedure"
    field: "decoding of components"
    locator: "§6.1.3.1 Summary of algorithm, step 2 / p. 25 (PDF 31) / L1458-L1460"
    text: 'For URI components 1-5 and 7, decode the string and set the corresponding WFN attribute value. Decoding entails: converting sole "" to ANY, sole "-" to NA, adding quoting to embedded periods and hyphens, and decoding percent-encoded forms.'
    text_kind: "list-item"
