    testable: "no"
    testable_reason: "A permission: how the result is computed is free."
    status: "active"
    notes: >-
      The text calls the pseudocode and processes 'non-normative information', yet the next sentence
      makes their results normative (R-0148). Appendix B (Release 4) explains the intent:
      implementations 'must achieve the same results as the provided pseudocode, processes, etc.,
      but do not have to implement the pseudocode, processes, etc.'
  - id: "nistir-7695#R-0148"
    normativity: "requirement"
    verb: "MUST"
