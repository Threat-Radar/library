    object: "WFN"
    field: "vendor"
    locator: "§5.3.3.2 Vendor, last sentence / p. 12 (PDF 18) / L738-L739"
    text: "Any character string meeting the requirements for WFNs (cf. 5.3.2) MAY be specified as the value of the attribute."
