  - id: "nistir-7695#R-0144"
    normativity: "informative"
    verb: "none"
    actor: "URI binding implementation"
    condition: "unconditional"
    object: "bind_to_URI result"
    field: "conformance to Figure 6-2"
    locator: "§6.1.1 URI Binding Syntax, para 5, sentence 1 / p. 18 (PDF 24) / L1035-L1036"
    text: "The bind_to_URI procedure (cf. 6.1.2) is designed to produce URIs that obey the syntax shown in Figure 6-2."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none; a design claim. It fails for a WFN value that is a lone '?' or only question marks,
      which binds to '%01' or a run of '%01' (R-0156) that Figure 6-2 rejects (R-0132), for a
      language value outside language ["-" region] (R-0140), and for part or language NA, which
      binds to '-' (R-0151) where Figure 6-2 has no hyphen form (R-0107, R-0129).
  - id: "nistir-7695#R-0145"
