  - id: "nistir-7695#R-0221"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string binding implementation"
    condition: "unconditional"
    object: "formatted string binding procedure"
    field: "order, logical values, colons"
    locator: "§6.2.2.1 Summary of algorithm / p. 33 (PDF 39) / L1894-L1896"
    text: "The procedure iterates over the eleven allowed attributes in a fixed order. Corresponding attribute values are obtained from the input WFN and conversions of logical values are applied. A result string is formed by concatenating the attribute values separated by colons."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0220"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none; three sentences kept together as one summary. The order is R-0193. Unlike the URI
      summary it does not mention the 'cpe:2.3:' prefix or the removal of escapes by
      process_quoted_chars() (R-0222).
  - id: "nistir-7695#R-0222"
    normativity: "constraint"
    verb: "none"
    actor: "formatted string binding implementation"
    condition: "for a quoted character"
    object: "formatted string binding"
    field: "escapes kept or removed"
    locator: "§6.2.2.2 Pseudocode for algorithm, function process_quoted_chars(s) / p. 33-34 (PDF 39-40) / L1941-L1959"
    text: |-
      case nextchr:
      ;; the period, hyphen and underscore pass unharmed.
      ".":
      "-":
      "_": result := strcat(result,nextchr).
      idx = idx + 2.
      else:
      ;; all others retain escaping
      result := strcat(result,"\",nextchr).
      idx := idx + 2.
      continue.
      end.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0220"
    testable: "yes"
    status: "active"
    notes: >-
      Removes the escape from '\.', '\-' and '\_' and keeps it on every other quoted character ('\$'
      stays '\$', example 6.2.2.3.5). The excerpt spans a page break (p. 33 to 34). Source defect:
      the first branch writes 'idx = idx + 2.' (not ':=') and has no 'continue.'. Read as an
      assignment, idx then also gets 'idx := idx + 1.' after the case and the next character is
      skipped ('8\.0\.6001' becomes '8..001'); read as a comparison, as '=' is used elsewhere in the
      pseudocode, idx moves by one and the period is copied twice ('8..0..6001'). Either way the
      result differs from the '8.0.6001' of example 6.2.2.3.1 (checked by running literal ports).
      The intended step is idx := idx + 2 followed by continue.
  - id: "nistir-7695#R-0223"
