    locator: "§6.1.1 URI Binding Syntax, para 3 / p. 17 (PDF 23) / L976-L978"
    text: "To ensure full backward compatibility with [CPE22], any implementation that consumes URIs and claims to be conformant with this Naming specification MUST accept as valid input any URI that obeys the full syntax shown in Figure 6-1."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Conflicts with the unbinding procedure, whose results implementations MUST reproduce (R-0178):
      Figure 6-1 admits every percent-encoded byte (R-0117), including an embedded '%01' or '%02',
      but decode() raises an error for any form outside Tables 6-1 and 6-2 (R-0185; §6.1.3.3.6
      rejects '%07') and for an embedded special form (R-0188, R-0189; §6.1.3.3.8). Whether 'accept
      as valid input' means a successful unbinding or only syntactic acceptance is not stated. See
      also R-0010.
