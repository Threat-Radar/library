    text: "function bind_value_for_fs(v)"
    reason: "Restates R-0195 and calls process_quoted_chars()."
  - locator: "§6.2.2.3 Examples of binding a WFN to a formatted string / p. 34 (PDF 40) / L1968"
    text: "This section presents examples illustrating the results of binding various WFNs to formatted strings."
    reason: "Examples with expected results; they belong in examples/ as fixtures."
  - locator: "§6.2.3.1 Summary of algorithm, sentence 1 / p. 36 (PDF 42) / L2077-L2078"
    text: "Unbinding a formatted string is straightforward, since the attribute values are encoded explicitly and in a fixed left-to-right order in the binding, delimited by colons."
    reason: "Describes the procedure; the rules follow in sentences 2 to 7 (R-0226 to R-0231)."
  - locator: "§6.2.3.2 Pseudocode for algorithm, function unbind_fs(fs) / p. 36 (PDF 42) / L2089"
    text: "function unbind_fs(fs)"
    reason: "Restates §6.2.3.1 (R-0227); the field order is R-0193."
  - locator: "§6.2.3.2 Pseudocode for algorithm, function unbind_value_fs(s) / p. 37 (PDF 43) / L2140"
    text: "function unbind_value_fs(s)"
    reason: "Restates R-0228 and R-0229 and calls add_quoting()."
  - locator: "§6.2.3.3 Examples of unbinding a formatted string to a WFN / p. 38 (PDF 44) / L2223-L2224"
    text: "This section provides a number of examples illustrating the results of unbinding a formatted string to a WFN."
    reason: >-
      Examples with expected results (one of them an error case); they belong in examples/ as
      fixtures.
  - locator: "Appendix A References / p. 42 (PDF 48) / L2343-L2344"
    text: "The following documents are indispensable references for understanding the application of this specification."
    reason: "Reference list."
  - locator: "Appendix B Change Log, Release 1 / p. 43 (PDF 49) / L2404-L2405"
    text: "Relaxed the requirement to consume legacy CPE names from a MUST to a SHOULD, since some applications may have no need to consume legacy content."
    reason: >-
      Change log: records that a requirement was relaxed between drafts and names the keywords;
      constrains nothing. Its 'MUST' and 'SHOULD' (line 2405) are the only counted keywords not
      extracted.

requirements:
  - id: "nistir-7695#R-0001"
    normativity: "definition"
    verb: "none"
    actor: "implementation reproducing the pseudocode"
    condition: "when reading or porting the pseudocode"
    object: "pseudocode semantics"
    field: "argument passing"
    locator: "§1.3 Document Conventions, bullet 1 under 'When reading pseudocode' / p. 2 (PDF 8) / L278-L280"
    text: "All pseudocode functions are pass by value, meaning that any changes applied to the supplied arguments within the scope of the function do not affect the values of the variables in the caller’s scope."
    text_kind: "bullet"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
      - "nistir-7695#R-0178"
      - "nistir-7695#R-0220"
      - "nistir-7695#R-0225"
    testable: "no"
    testable_reason: >-
      A reading convention with no observable effect of its own; it matters only through the binding
      and unbinding results that the four 'same result' sentences make binding (R-0148, R-0178,
      R-0220, R-0225).
    status: "active"
    notes: >-
      Verb none. Lead-in, lowercase and not BCP 14: 'When reading pseudocode the following should be
      kept in mind:'. It is why unpack() and set() return the updated WFN instead of changing their
      argument (R-0190, R-0102).
  - id: "nistir-7695#R-0002"
    normativity: "definition"
    verb: "none"
    actor: "implementation reproducing the pseudocode"
    condition: "when reading or porting the pseudocode"
    object: "pseudocode semantics"
    field: "string helper functions"
    locator: "§1.3 Document Conventions, bullet 2 under 'When reading pseudocode' / p. 2 (PDF 8) / L281-L284"
    text: "In a few cases, the pseudocode functions reference (more or less) standard library functions, particularly to support string handling. In most cases semantically equivalent functions can be found in the GNU C library, cf. http://www.gnu.org/software/libc/manual/html_node/index.html#toc_String-and-Array-Utilities."
    text_kind: "bullet"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
      - "nistir-7695#R-0178"
      - "nistir-7695#R-0220"
      - "nistir-7695#R-0225"
    testable: "no"
    testable_reason: >-
      Points to an external library for the meaning of helper functions; it states no checkable
      property.
    status: "active"
    notes: >-
      Verb none. 'In most cases' leaves the exceptions open, and the helpers that matter differ from
      GNU C: substr() takes an inclusive end index (R-0171) and strchr() returns an offset or nil
      (R-0191).
  - id: "nistir-7695#R-0003"
    normativity: "definition"
    verb: "none"
    actor: "binding implementation"
    condition: "unconditional"
    object: "binding (URI and formatted string)"
    field: "determinism"
    locator: "§2.1 Definitions, term 'Bind' / p. 3 (PDF 9) / L307-L308"
    text: "Bind: To deterministically transform a logical construct into a machine-readable representation suitable for machine interchange and processing."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Determinism is testable: binding the same WFN twice gives the same string. The rest is a
      definition of the term.
    status: "active"
    notes: >-
      Verb none; a definition extracted for 'deterministically', which fixes a property of every
      binding. The next sentence names the result: 'The result of this transformation is called a
      binding.' Other §2.1 terms are not extracted.
  - id: "nistir-7695#R-0004"
    normativity: "definition"
    verb: "none"
    actor: "unbinding implementation"
    condition: "unconditional"
    object: "unbinding (URI and formatted string)"
    field: "determinism"
    locator: "§2.1 Definitions, term 'Unbind' / p. 4 (PDF 10) / L353"
    text: "Unbind: To deterministically transform a binding into its logical-form construct."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: "Determinism is testable: unbinding the same string twice gives the same WFN."
    status: "active"
    notes: "Verb none; a definition extracted for 'deterministically', as for Bind (R-0003)."
  - id: "nistir-7695#R-0005"
    normativity: "requirement"
    verb: "MUST"
    actor: "conforming implementation"
    condition: "for an implementation claiming conformance with this specification"
    object: "end-user documentation"
    field: "explicit conformance claim"
    locator: "§4 Conformance, item 1 / p. 7 (PDF 13) / L469-L470"
    text: "An implementation MUST make an explicit claim of conformance to this specification in any documentation provided to end users."
    text_kind: "list-item"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Checked by inspecting the implementation's end-user documentation, not by running it. 'in any
      documentation' does not say whether every document must carry the claim or at least one.
    status: "active"
    notes: >-
      Lead-in for items 1 to 5: 'The following apply to all implementations claiming conformance
      with this specification:' Appendix B (Release 1) records that this item was added.
  - id: "nistir-7695#R-0006"
    normativity: "requirement"
    verb: "MUST"
    actor: "CPE name producer"
    condition: "if the implementation produces (generates as an output) CPE names"
    object: "formatted string binding"
    field: "syntax"
    locator: "§4 Conformance, item 2 / p. 7 (PDF 13) / L472-L474"
    text: "If the implementation produces (i.e., generates as an output) CPE names, it MUST produce syntactically correct formatted string bindings as needed to describe or identify applications, operating systems, and hardware devices (cf. 6.2)."
    text_kind: "list-item"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Syntax is testable against Figure 6-3 (R-0199 and the rules under it). 'as needed to describe
      or identify' does not say when a producer that also emits URIs must emit formatted strings.
    status: "active"
    notes: >-
      Every producer, whatever else it emits, has to be able to produce the formatted string
      binding. 'syntactically correct' points to §6.2; the WFN rules of §5 constrain the values
      carried (R-0028).
  - id: "nistir-7695#R-0007"
    normativity: "requirement"
    verb: "MUST"
    actor: "CPE name producer (URI form)"
    condition: "if the implementation produces CPE names in URI form"
    object: "URI binding"
    field: "syntax (Figure 6-1)"
    locator: "§4 Conformance, item 3, first clause / p. 7 (PDF 13) / L476-L477"
    text: "If the implementation produces CPE names in URI form, it MUST produce URIs that adhere to the syntax rules specified in Figure 6-1,"
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Split from one sentence: the MUST (Figure 6-1, here) and the SHOULD (Figure 6-2, R-0008) have
      different tests. URIs from the binding procedure match Figure 6-1, which admits every
      percent-encoded byte, except when part or language is NA: NA binds to a hyphen (R-0151) that
      Figure 6-1 does not admit in those two components (R-0107, R-0113), so for such a WFN this
      MUST and the same-result MUST of R-0148 cannot both be met (normative.md D-3; examples
      BIND-02). The source's claim that bound URIs match Figure 6-2 (R-0144) fails for more values.
  - id: "nistir-7695#R-0008"
    normativity: "recommendation"
    verb: "SHOULD"
    actor: "CPE name producer (URI form)"
    condition: "if the implementation produces CPE names in URI form"
    object: "URI binding"
    field: "syntax (Figure 6-2)"
    locator: "§4 Conformance, item 3, second clause / p. 7 (PDF 13) / L477-L478"
    text: "and it SHOULD produce URIs that adhere to the more constrained rules specified in Figure 6-2."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Second part of the split sentence (R-0007). §6.1.1 repeats the recommendation for all CPE URIs
      in other words (R-0143). Some valid WFN values cannot be bound into a Figure 6-2 URI (R-0132).
  - id: "nistir-7695#R-0009"
    normativity: "requirement"
    verb: "MUST"
    actor: "CPE name consumer"
    condition: "if the implementation consumes (accepts as valid input) CPE names"
    object: "formatted string binding"
    field: "acceptance as input"
    locator: "§4 Conformance, item 4(a) / p. 7 (PDF 13) / L480-L482"
    text: "If the implementation consumes (i.e., accepts as valid input) CPE names, (a) it MUST consume syntactically correct formatted string bindings as needed to describe or identify applications, operating systems, and hardware devices (cf. 6.2);"
    text_kind: "list-item"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Acceptance of Figure 6-3 strings is testable; 'as needed to describe or identify' gives no
      criterion for which inputs must be consumed.
    status: "active"
    notes: >-
      Split from one sentence into (a), (b) and (c), each with its own keyword and test (R-0010,
      R-0011). The rejection of strings outside Figure 6-3 is not stated; the unbinding procedure
      performs only limited checks (R-0231).
  - id: "nistir-7695#R-0010"
    normativity: "recommendation"
    verb: "SHOULD"
    actor: "CPE name consumer"
    condition: "if the implementation consumes (accepts as valid input) CPE names"
    object: "URI binding"
    field: "acceptance as input (Figures 6-1 and 6-2)"
    locator: "§4 Conformance, item 4(b) / p. 7 (PDF 13) / L482-L483"
    text: "(b) it SHOULD be able to consume any CPE name that meets the syntax requirements specified in Figure 6-1 or Figure 6-2;"
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      §6.1.1 makes acceptance of every Figure 6-1 URI a MUST for an implementation that consumes
      URIs (R-0121), so this SHOULD adds force only for consumers that take no URIs, for example a
      formatted-string-only consumer. Appendix B (Release 1): 'Relaxed the requirement to consume
      legacy CPE names from a MUST to a SHOULD'.
  - id: "nistir-7695#R-0011"
    normativity: "recommendation"
    verb: "SHOULD"
    actor: "CPE name consumer"
    condition: "if the implementation consumes (accepts as valid input) CPE names"
    object: "URI to formatted string conversion"
    field: "§7.1 procedure"
    locator: "§4 Conformance, item 4(c) / p. 7 (PDF 13) / L483-L485"
    text: "and (c) it SHOULD be able to convert input CPE names in URI form to syntactically correct formatted string bindings (cf. 7.1)."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Testable through convert_uri_to_fs() (R-0239); §7 recommends that procedure (R-0237)."
  - id: "nistir-7695#R-0012"
    normativity: "permission"
    verb: "OPTIONAL"
    actor: "conforming implementation"
    condition: "for an implementation claiming conformance with this specification"
    object: "formatted string to URI conversion"
    field: "offering the conversion"
    locator: "§4 Conformance, item 5, sentence 1 / p. 7 (PDF 13) / L487-L488"
    text: "It is OPTIONAL for implementations to be able to convert any syntactically correct formatted string binding to a valid CPE name that meets the requirements specified in [CPE22] (cf. 7.2)."
    text_kind: "list-item"
    kind: "stated"
    testable: "no"
    testable_reason: "A permission: an implementation may offer the conversion or not."
    status: "active"
    notes: >-
      The item's last sentence ('This functionality may enable an implementation to interoperate to
      a limited extent with implementations conforming to [CPE22] and possibly prior releases as
      well.') is rationale with a lowercase 'may' and is not extracted.
  - id: "nistir-7695#R-0013"
    normativity: "recommendation"
    verb: "SHOULD"
    actor: "conforming implementation"
    condition: "if the implementation offers conversion of formatted strings to [CPE22] names"
    object: "formatted string to URI conversion"
    field: "§7.2 procedure"
    locator: "§4 Conformance, item 5, sentence 2 / p. 7 (PDF 13) / L488-L490"
    text: "An implementation that offers this functionality SHOULD implement the procedure defined in Section 7.2."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Testable through convert_fs_to_uri() (R-0240)."
  - id: "nistir-7695#R-0014"
    normativity: "definition"
    verb: "none"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "structure (unordered set of attribute-value pairs)"
    locator: "§5.1 Definitions and Notation, para 1 / p. 8 (PDF 14) / L539-L542"
    text: "A WFN is an unordered set of attribute-value pairs that collectively (a) describe or identify a software application, operating system, or hardware device, and (b) satisfy the criteria specified in Section 5.2. Unordered means that there is no prescribed order for the attribute-value pairs, and there is no specified relationship (hierarchical, set-theoretic, or otherwise) among attributes or attribute-value pairs."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Order-insensitivity is testable: two WFNs that differ only in the order of their pairs are the
      same WFN and bind to the same strings. Criterion (a) is not testable.
    status: "active"
    notes: >-
      Verb none; a definition extracted because it fixes two testable properties: the pairs are
      unordered, and a WFN must satisfy §5.2 (R-0018).
  - id: "nistir-7695#R-0015"
    normativity: "exemption"
    verb: "none"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "implementation internals"
    field: "WFN data structures"
    locator: "§5.1 Definitions and Notation, para 2 / p. 8 (PDF 14) / L547-L548"
    text: "There is no requirement that CPE-conformant tools create or manipulate WFN-like data structures internally to their implementations."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "States the absence of a requirement."
    status: "active"
    notes: >-
      Verb none. The paragraph calls the WFN 'a logical construct only', 'not intended to be a data
      format, encoding, or any other kind of machine-readable representation'. Conformance is
      therefore judged on bound names and on results equal to the pseudocode's, never on internal
      data structures. See also R-0017.
  - id: "nistir-7695#R-0016"
    normativity: "prohibition"
    verb: "SHALL NOT"
    verbs:
      - "SHALL NOT"
      - "SHALL"
    actor: "any implementation that reads WFN attribute names"
    condition: "unconditional"
    object: "WFN"
    field: "attribute names (case)"
    locator: "§5.1 Definitions and Notation, para 3 / p. 9 (PDF 15) / L560-L561"
    text: "Lexical case SHALL NOT distinguish attributes from one another, e.g., the attributes Foo, foo, FOO, etc., SHALL be considered equivalent."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Testable only where attribute names appear, which is never in a bound name: both bindings
      carry attributes by position. It applies to WFN-like data an implementation chooses to
      exchange, for example through an API.
    status: "active"
    notes: >-
      Not split: the 'e.g.' clause restates the first clause, so the two keywords share one test.
      The next sentence ('By convention, attributes will be written in all lowercase letters ...')
      is a notation convention and is not extracted. The case of attribute VALUES is a different
      matter: URI unbinding lowercases them (R-0186), formatted string unbinding keeps them.
  - id: "nistir-7695#R-0017"
    normativity: "exemption"
    verb: "none"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "WFN notation"
    field: "wfn:[...] notation"
    locator: "§5.1 Definitions and Notation, para 5 / p. 9 (PDF 15) / L575-L576"
    text: "There is no requirement that implementations represent WFNs explicitly or use this notation in any way."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "States the absence of a requirement."
    status: "active"
    notes: >-
      Verb none. The 'wfn:[a1=v1, ...]' notation exists only to explain and illustrate; see also
      R-0015.
  - id: "nistir-7695#R-0018"
    normativity: "requirement"
    verb: "MUST"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "criteria 1 to 3"
    locator: "§5.2 WFN Attributes, lead-in / p. 9 (PDF 15) / L580"
    text: "WFNs MUST satisfy these criteria:"
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      An umbrella over the three numbered criteria (R-0019; R-0020 and R-0021; R-0022).
    status: "active"
    notes: "Lead-in to a numbered list; each criterion is its own entry."
  - id: "nistir-7695#R-0019"
    normativity: "requirement"
    verb: "SHALL"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "attribute names"
    locator: "§5.2 WFN Attributes, item 1 / p. 9 (PDF 15) / L581"
    text: "Only the following attributes SHALL be permitted in a WFN attribute-value pair:"
    text_kind: "list-item"
    enumeration:
      - "part"
      - "vendor"
      - "product"
      - "version"
      - "update"
      - "edition"
      - "language"
      - "sw_edition"
      - "target_sw"
      - "target_hw"
      - "other"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The eleven names are copied into enumeration in the source's order, without the list letters
      a. to k. The formatted string binds all eleven in this order (R-0193); the URI binds the first
      seven in this order and packs the last four into edition (R-0168, R-0160). sw_edition,
      target_sw, target_hw and other are the 'extended attributes' (§5.2, last paragraph).
  - id: "nistir-7695#R-0020"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "attribute repetition"
    locator: "§5.2 WFN Attributes, item 2, sentence 1 / p. 9 (PDF 15) / L593"
    text: "Each permitted attribute MAY be used at most once in a WFN."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      normativity is permission because the verb is MAY; the operative content is the bound 'at most
      once', which forbids repeating an attribute. Each attribute has one position in either
      binding, so repetition cannot arise in a bound name.
  - id: "nistir-7695#R-0021"
    normativity: "requirement"
    verb: "SHALL"
    actor: "WFN"
    condition: "if an attribute is not used in a WFN"
    object: "WFN"
    field: "unspecified attributes"
    locator: "§5.2 WFN Attributes, item 2, sentence 2 / p. 9 (PDF 15) / L593-L595"
    text: "If an attribute is not used in a WFN, it is said to be unspecified, and its value SHALL default to the logical value ANY (cf. 5.3.1)."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Observable through binding: an unspecified attribute binds like ANY, to a blank in a URI
      (R-0150) and to '*' in a formatted string (R-0195); get() returns ANY for it (R-0101). §5.3.1
      recommends NA, not ANY, for an attribute 'not used as part of the description' (R-0026):
      leaving the attribute out gives ANY, so NA has to be assigned explicitly.
  - id: "nistir-7695#R-0022"
    normativity: "requirement"
    verb: "MUST"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "attribute values"
    locator: "§5.2 WFN Attributes, item 3 / p. 9 (PDF 15) / L596"
    text: "Attribute values of WFNs MUST satisfy the requirements specified in Section 5.3."
    text_kind: "list-item"
    kind: "stated"
    testable: "partial"
    testable_reason: "An umbrella over §5.3 (R-0023 and the rules under it)."
    status: "active"
    notes: "Restates for criterion 3 the SHALL of §5.3 (R-0023)."
  - id: "nistir-7695#R-0023"
    normativity: "requirement"
    verb: "SHALL"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "attribute values"
    locator: "§5.3 WFN Attribute Values, lead-in / p. 9 (PDF 15) / L603"
    text: "Attributes of WFNs SHALL be assigned one of the following values:"
    text_kind: "sentence"
    enumeration:
      - "A logical value specified in Section 5.3.1"
      - "A character string satisfying both (a) the requirements on string values specified in Section 5.3.2, and (b) the per-attribute value restrictions specified in Section 5.5.3."
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The two list items are copied into enumeration without their numbers. Source defect: item 2
      cites 'Section 5.5.3', which does not exist (Section 5.5 is WFN Examples and has no
      subsections); the per-attribute value restrictions are in Section 5.3.3 (R-0065 and the
      entries after it).
  - id: "nistir-7695#R-0024"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN"
    field: "logical values ANY and NA"
    locator: "§5.3.1 Logical values, lead-in / p. 10 (PDF 16) / L617"
    text: "An attribute of a WFN MAY be assigned one of these logical values:"
    text_kind: "sentence"
    enumeration:
      - "ANY (i.e., “any value”)."
      - "NA (i.e., “not applicable/not used”)."
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The value set is testable: ANY and NA are the only logical values (Appendix B, Release 1:
      'Removed all mention of and support for the logical value UNKNOWN'). The first sentence of
      each list item, which names the value, is copied into enumeration; the SHOULD sentences after
      them are R-0025 and R-0026. In the wfn:[...] notation the values are written in uppercase
      without quotation marks (notation only).
  - id: "nistir-7695#R-0025"
    normativity: "recommendation"
    verb: "SHOULD"
    actor: "CPE name creator (whoever assigns attribute values)"
    condition: "when there are no restrictions on acceptable values for the attribute"
    object: "WFN"
    field: "logical value ANY"
    locator: "§5.3.1 Logical values, item 1 / p. 10 (PDF 16) / L618-L619"
    text: "The logical value ANY SHOULD be assigned to an attribute when there are no restrictions on acceptable values for that attribute."
    text_kind: "list-item"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      Whether there are 'no restrictions on acceptable values' is a judgement about the product
      class that a test cannot make.
    status: "active"
  - id: "nistir-7695#R-0026"
    normativity: "recommendation"
    verb: "SHOULD"
    actor: "CPE name creator (whoever assigns attribute values)"
    condition: "when there is no legal or meaningful value for the attribute, or the attribute is not used as part of the description"
    object: "WFN"
    field: "logical value NA"
    locator: "§5.3.1 Logical values, item 2 / p. 10 (PDF 16) / L620-L622"
    text: "The logical value NA SHOULD be assigned when there is no legal or meaningful value for that attribute, or when that attribute is not used as part of the description. This includes the situation in which an attribute has an obtainable value that is null."
    text_kind: "list-item"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      Whether a value is legal, meaningful or null is a judgement about the product.
    status: "active"
    notes: >-
      Two adjacent sentences; the second has no keyword and widens the condition. Appendix B
      (Release 1): 'Clarified the view that the logical value NA should also be used if an attribute
      value is assessed to be null.' Tension with R-0021: an attribute left out of a WFN defaults to
      ANY, while an attribute 'not used as part of the description' should be NA.
  - id: "nistir-7695#R-0027"
    normativity: "requirement"
    verb: "SHALL"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "encoding, character range, non-empty"
    locator: "§5.3.2 Restrictions on attribute-value strings, para 1 / p. 10 (PDF 16) / L631-L633"
    text: "Value strings assigned to attributes of WFNs SHALL be non-empty contiguous strings of bytes encoded using printable Unicode Transformation Format-8 (UTF-8) characters with hexadecimal values between x00 and x7F [RFC3629]."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      x00 to x1F and x7F are not printable, so the usable range is x20 to x7E; x20 (space) is
      excluded by R-0032, and Figure 5-1 admits only letters, digits, underscore, backslash, the two
      special characters and the listed punctuation (R-0047). 'contiguous' is not defined further. An empty value string is
      invalid; ANY and NA are logical values, not strings.
  - id: "nistir-7695#R-0028"
    normativity: "requirement"
    verb: "SHALL"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "rules 1 to 6"
    locator: "§5.3.2 Restrictions on attribute-value strings, lead-in to rules 1 to 6 / p. 10 (PDF 16) / L640"
    text: "Value strings in WFNs SHALL satisfy all of the following requirements:"
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: "An umbrella over rules 1 to 6 (R-0029 to R-0045)."
    status: "active"
    notes: "Figure 5-1 summarizes the six rules (R-0046) and inherits its force from this sentence."
  - id: "nistir-7695#R-0029"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "letters and digits"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 1 / p. 10 (PDF 16) / L641-L642"
    text: "Uppercase letters, lowercase letters or digit characters MAY be used (ASCII x41-x5a, x30-x39 and x61-x7a)."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Case is kept in a WFN value. URI unbinding lowercases every value (R-0186); formatted string
      unbinding does not.
  - id: "nistir-7695#R-0030"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "underscore"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 2, first clause / p. 10 (PDF 16) / L643"
    text: "The underscore (x5f) MAY be used,"
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Split from one sentence into three parts with different tests (R-0031, R-0032). The pseudocode
      treats the underscore as alphanumeric (R-0172).
  - id: "nistir-7695#R-0031"
    normativity: "recommendation"
    verb: "SHOULD"
    actor: "CPE name creator (whoever assigns attribute values)"
    condition: "where the name being recorded contains whitespace"
    object: "WFN attribute-value string"
    field: "underscore in place of whitespace"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 2, second clause / p. 10 (PDF 16) / L643"
    text: "and it SHOULD be used in place of whitespace characters"
    text_kind: "list-item"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      A producer guideline: where a product name has a space, the value should have an underscore
      ('internet_explorer'). Whether an underscore replaced a space cannot be seen in the result.
    status: "active"
  - id: "nistir-7695#R-0032"
    normativity: "prohibition"
    verb: "SHALL NOT"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "whitespace characters"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 2, parenthesis / p. 10 (PDF 16) / L644"
    text: "(which SHALL NOT be used)."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Third part of the split sentence; 'which' refers to 'whitespace characters'. No Figure 5-1
      rule matches any whitespace character. The formatted string unbinding procedure quotes a space
      instead of rejecting it (R-0236).
  - id: "nistir-7695#R-0033"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "backslash (escape character)"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 3, sentence 1 / p. 10 (PDF 16) / L645"
    text: "The backslash (x5c) MAY be used, and is designated the escape character."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "nistir-7695#R-0034"
    normativity: "recommendation"
    verb: "SHOULD"
    actor: "CPE name creator (whoever assigns attribute values)"
    condition: "when the interpretation of the following character has to be modified"
    object: "WFN attribute-value string"
    field: "quoting"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 3, sentence 2 / p. 10 (PDF 16) / L645-L647"
    text: "It SHOULD be used in a value string when required to modify the interpretation of the character that immediately follows (see below)."
    text_kind: "list-item"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Where quoting is mandatory (rule 5, R-0044) the MUST governs and this SHOULD adds nothing; for
      '*' and '?' quoting is a choice that changes meaning (R-0037).
    status: "active"
    notes: >-
      Tension: rule 5 makes quoting of other printable non-alphanumeric characters a MUST, while
      this sentence makes using the escape character 'when required' a SHOULD. The next sentence
      defines the term: 'In these circumstances, the character following the backslash is said to be
      quoted.' Figure 5-1 lets the escape precede only a backslash, '?', '*' or listed punctuation
      (R-0055, R-0056), so quoting a letter, digit or underscore is invalid; the prose never says
      so.
  - id: "nistir-7695#R-0035"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "special characters '*' and '?'"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 1 / p. 10 (PDF 16) / L649-L650"
    text: "The asterisk (x2a) and the question mark (x3f) MAY be used, and are designated special characters."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "nistir-7695#R-0036"
    normativity: "permission"
    verb: "MAY"
    actor: "other CPE specifications"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "interpretation of special characters"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 2 / p. 10 (PDF 16) / L650-L651"
    text: "These two characters MAY be assigned special interpretations by other CPE specifications."
    text_kind: "list-item"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      Grants latitude to other specifications (for example CPE Name Matching, nistir-7696); nothing
      in this specification can test it.
    status: "active"
  - id: "nistir-7695#R-0037"
    normativity: "constraint"
    verb: "none"
    actor: "CPE name creator (whoever assigns attribute values)"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "quoting of special characters"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 3 / p. 10 (PDF 16) / L651-L652"
    text: "To block special interpretation of these characters, precede them with the escape character, otherwise leave them unquoted in the value string."
    text_kind: "list-item"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
    testable: "yes"
    status: "active"
    notes: >-
      An imperative without a keyword (verb none). A quoted '\*' or '\?' is a literal character and
      binds to '%2a' or '%3f' (R-0155); an unquoted one is special and binds to '%02' or '%01'
      (R-0156).
  - id: "nistir-7695#R-0038"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "special characters at the edges"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 4 / p. 10 (PDF 16) / L652-L653"
    text: "A special character MAY be included at the beginning of an otherwise non-empty value string, and/or at the end of the string."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      'otherwise non-empty' suggests that a value made only of special characters is outside this
      permission; the rule then allows a lone '?' and repeated '?' (R-0042, R-0043) but forbids a
      lone '*' (R-0040). Whether '*?' or '??*' is valid is not stated; Figure 5-1 accepts both
      (R-0047).
  - id: "nistir-7695#R-0039"
    normativity: "prohibition"
    verb: "MUST NOT"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "embedded special characters"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 5 / p. 10 (PDF 16) / L654"
    text: "A special character MUST NOT be embedded within a value string."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      'Embedded' means neither at the beginning nor at the end (contrast R-0038). Unbinding enforces
      it for '%01' and '%02' (R-0188, R-0189) and for '*' and '?' (R-0234, R-0235), but the
      formatted string check accepts an embedded run of two or more question marks, for example
      'foo??bar' (R-0235).
  - id: "nistir-7695#R-0040"
    normativity: "prohibition"
    verb: "MUST NOT"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "lone asterisk"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 6 / p. 10 (PDF 16) / L654-L655"
    text: "A single asterisk MUST NOT be used by itself as an attribute value."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The keyword is split across a line break ('MUST' / 'NOT'). The logical value ANY, not the
      string '*', expresses any value; in a formatted string a lone '*' is the bound form of ANY
      (R-0195). Figure 5-1 accepts a lone '*' (R-0047), and decode() turns a URI component that is
      exactly '%02' into a lone unquoted '*' (R-0189).
  - id: "nistir-7695#R-0041"
    normativity: "prohibition"
    verb: "MUST NOT"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "repeated asterisk"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 7 / p. 10 (PDF 16) / L655-L656"
    text: "The asterisk MUST NOT be used more than once in sequence."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Figure 5-1 accepts '**' (a leading and a trailing spec_chrs, R-0047); decode() accepts
      '%02%02' (R-0189) and add_quoting() accepts '**' (R-0234).
  - id: "nistir-7695#R-0042"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "lone question mark"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 8 / p. 10 (PDF 16) / L656"
    text: "A single question mark MAY be used by itself as an attribute value."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Neither preferred bound form can carry such a value: a lone '?' binds to the URI component
      '%01' (R-0156), which Figure 6-2 does not accept (R-0132), and to the formatted string field
      '?', which Figure 6-3 does not accept (R-0212). Figure 6-1 accepts '%01', and decode() unbinds
      it (R-0188).
  - id: "nistir-7695#R-0043"
    normativity: "permission"
    verb: "MAY"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "repeated question mark"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 4, sentence 9 / p. 10 (PDF 16) / L656-L657"
    text: "The question mark MAY be used more than once in sequence."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Only at the beginning or the end (R-0039). A value made only of question marks meets the same
      bound-form gap as R-0042.
  - id: "nistir-7695#R-0044"
    normativity: "requirement"
    verb: "MUST"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "quoting of punctuation"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 5 / p. 10 (PDF 16) / L658-L660"
    text: "All other printable non-alphanumeric characters (i.e., all punctuation marks, brackets, delimiters and other special purpose symbols, except for the special characters defined above) MUST be quoted when embedded in value strings."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      'when embedded' could be read, as in rule 4, as 'not at the beginning or end', which would
      leave a leading or trailing '!' unquoted. Figure 5-1 requires quoting at every position
      (R-0060), and §6.1.2.1.2 states the rule without the qualifier (R-0152). The underscore counts
      as alphanumeric (R-0030, R-0172).
  - id: "nistir-7695#R-0045"
    normativity: "prohibition"
    verb: "MUST NOT"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "lone quoted hyphen"
    locator: "§5.3.2 Restrictions on attribute-value strings, rule 6 / p. 10 (PDF 16) / L661"
    text: "A quoted hyphen MUST NOT be used by itself as a value string."
    text_kind: "list-item"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      A lone hyphen is the bound form of NA in both bindings (R-0151, R-0195). Figure 5-1 also
      rejects a quoted hyphen followed only by special characters, such as '\-*' (R-0051), which
      this sentence does not forbid.
  - id: "nistir-7695#R-0046"
    normativity: "constraint"
    verb: "none"
    actor: "WFN"
    condition: "unconditional"
    object: "WFN attribute-value string"
    field: "Figure 5-1"
    locator: "§5.3.2 Restrictions on attribute-value strings, sentence after rule 6 / p. 11 (PDF 17) / L671-L672"
    text: "These requirements are summarized by the Augmented Backus-Naur Form (ABNF) grammar [RFC2234] for avstring shown in Figure 5-1."
    text_kind: "sentence"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
    testable: "yes"
    status: "active"
    notes: >-
      Verb none. Makes Figure 5-1 the formal summary of rules 1 to 6 (R-0047 and the rules under
      it). The figure departs from the prose in places (a lone '*', '**', '\-*', quoting of letters
      or the underscore) and the source does not say which governs. RFC 2234 is obsoleted by RFC
      5234; both make quoted strings case-insensitive.
  - id: "nistir-7695#R-0047"
    normativity: "constraint"
    verb: "none"
    actor: "WFN attribute-value string"
    condition: "for every WFN value string"
    object: "WFN attribute-value string (Figure 5-1)"
    field: "avstring"
    locator: "§5.3.2 Restrictions on attribute-value strings, Figure 5-1, rule avstring / p. 11 (PDF 17) / L675"
    text: "avstring = ( body / ( spec_chrs *body2 )) *1spec_chrs"
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
      - "nistir-7695#R-0046"
    testable: "yes"
    status: "active"
    notes: >-
      Top rule of the WFN value-string grammar. Read with RFC 2234 semantics it accepts a lone '*'
      and '**', which §5.3.2 rule 4 forbids (R-0040, R-0041), and values made only of special
      characters such as '*?' (see R-0038); it rejects the empty string (R-0027) and a quoted hyphen
      followed only by special characters such as '\-*' (see R-0045). The source does not say
      whether the figure or the six prose rules govern where they differ. Checked by running a
      regular-expression translation of the figure.
  - id: "nistir-7695#R-0048"
    normativity: "constraint"
    verb: "none"
    actor: "WFN attribute-value string; CPE formatted string"
    condition: "wherever the rule is referenced in the figures listed"
    object: "WFN attribute-value string and formatted string binding (Figures 5-1 and 6-3)"
    field: "spec_chrs"
    locator: "§5.3.2 Restrictions on attribute-value strings, Figure 5-1, rule spec_chrs / p. 11 (PDF 17) / L676"
    also_at:
      - "§6.2.1 Syntax for Formatted String Binding, Figure 6-3, rule spec_chrs / p. 32 (PDF 38) / L1852"
    text: "spec_chrs = 1*spec1 / spec2"
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
      - "nistir-7695#R-0046"
      - "nistir-7695#R-0006"
      - "nistir-7695#R-0009"
    testable: "yes"
    status: "active"
    notes: >-
      A run of one or more '?' or exactly one '*' (§5.3.2 rule 4: '?' may repeat, R-0043; '*' may
      not, R-0041). Printed identically in Figure 6-3 (also_at); Figure 6-2 has the same characters
      with other meanings (R-0133).
  - id: "nistir-7695#R-0049"
    normativity: "constraint"
    verb: "none"
    actor: "WFN attribute-value string; CPE formatted string"
    condition: "wherever the rule is referenced in the figures listed"
    object: "WFN attribute-value string and formatted string binding (Figures 5-1 and 6-3)"
    field: "spec1"
    locator: "§5.3.2 Restrictions on attribute-value strings, Figure 5-1, rule spec1 / p. 11 (PDF 17) / L677"
    also_at:
      - "§6.2.1 Syntax for Formatted String Binding, Figure 6-3, rule spec1 / p. 32 (PDF 38) / L1855"
    text: 'spec1 = "?"'
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
      - "nistir-7695#R-0046"
      - "nistir-7695#R-0006"
      - "nistir-7695#R-0009"
    testable: "yes"
    status: "active"
    notes: >-
      The question mark, a special character (§5.3.2 rule 4). Printed identically in Figure 6-3
      (also_at).
  - id: "nistir-7695#R-0050"
    normativity: "constraint"
    verb: "none"
    actor: "WFN attribute-value string; CPE formatted string"
    condition: "wherever the rule is referenced in the figures listed"
    object: "WFN attribute-value string and formatted string binding (Figures 5-1 and 6-3)"
    field: "spec2"
    locator: "§5.3.2 Restrictions on attribute-value strings, Figure 5-1, rule spec2 / p. 11 (PDF 17) / L678"
    also_at:
      - "§6.2.1 Syntax for Formatted String Binding, Figure 6-3, rule spec2 / p. 32 (PDF 38) / L1856"
    text: 'spec2 = "*"'
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
      - "nistir-7695#R-0046"
      - "nistir-7695#R-0006"
      - "nistir-7695#R-0009"
    testable: "yes"
    status: "active"
    notes: >-
      The asterisk, a special character (§5.3.2 rule 4). Printed identically in Figure 6-3
      (also_at).
  - id: "nistir-7695#R-0051"
    normativity: "constraint"
    verb: "none"
    actor: "WFN attribute-value string"
    condition: "for every WFN value string"
    object: "WFN attribute-value string (Figure 5-1)"
    field: "body"
    locator: "§5.3.2 Restrictions on attribute-value strings, Figure 5-1, rule body / p. 11 (PDF 17) / L679"
    text: "body = ( body1 *body2 ) / 2*body2"
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
      - "nistir-7695#R-0046"
    testable: "yes"
    status: "active"
    notes: >-
      A body1 followed by any number of body2, or at least two body2. body1 cannot be a quoted
      hyphen, so a value that is exactly '\-' has no body (§5.3.2 rule 6, R-0045), and neither has
      '\-' followed only by special characters.
  - id: "nistir-7695#R-0052"
    normativity: "constraint"
    verb: "none"
    actor: "WFN attribute-value string"
    condition: "for every WFN value string"
    object: "WFN attribute-value string (Figure 5-1)"
    field: "body1"
    locator: "§5.3.2 Restrictions on attribute-value strings, Figure 5-1, rule body1 / p. 11 (PDF 17) / L680"
    text: "body1 = unreserved / quoted1"
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
      - "nistir-7695#R-0046"
    testable: "yes"
    status: "active"
    notes: "A letter, digit or underscore, or a quoted character other than a quoted hyphen."
  - id: "nistir-7695#R-0053"
    normativity: "constraint"
    verb: "none"
    actor: "WFN attribute-value string"
    condition: "for every WFN value string"
    object: "WFN attribute-value string (Figure 5-1)"
    field: "body2"
    locator: "§5.3.2 Restrictions on attribute-value strings, Figure 5-1, rule body2 / p. 11 (PDF 17) / L681"
    text: "body2 = unreserved / quoted2"
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0028"
      - "nistir-7695#R-0046"
    testable: "yes"
    status: "active"
    notes: "A letter, digit or underscore, or any quoted character including a quoted hyphen."
  - id: "nistir-7695#R-0054"
    normativity: "constraint"
    verb: "none"
    actor: "WFN attribute-value string"
    condition: "for every WFN value string"
    object: "WFN attribute-value string (Figure 5-1)"
    field: "unreserved"
    locator: "§5.3.2 Restrictions on attribute-value strings, Figure 5-1, rule unreserved / p. 11 (PDF 17) / L682"
    text: 'unreserved = ALPHA / DIGIT / "_"'
    text_kind: "abnf-rule"
    kind: "stated"
    inherits_from:
