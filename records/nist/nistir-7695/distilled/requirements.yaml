    field: "component order"
    locator: "§6.1.2.3 Pseudocode for algorithm, function bind_to_URI(w) / p. 20 (PDF 26) / L1162"
    text: "foreach a in {part,vendor,product,version,update,edition,language}"
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
    testable: "yes"
    status: "active"
    notes: >-
      The only place in §6.1.2 that gives the order of the seven URI components (§6.1.2.2 step 2
      defers to [CPE22:5.2]); Figures 6-1 and 6-2 (component-list, R-0106, R-0123) and unbind_URI()
      (R-0182, R-0183) give the same order. The formatted string starts with the same seven
      (R-0193).
  - id: "nistir-7695#R-0169"
    normativity: "constraint"
    verb: "none"
    actor: "URI binding implementation"
    condition: "for the edition component"
    object: "URI binding"
    field: "edition component (packing)"
    locator: "§6.1.2.3 Pseudocode for algorithm, function bind_to_URI(w) / p. 20 (PDF 26) / L1164-L1173"
    text: |-
      if a = edition
      then
      ;; Call the pack() helper function to compute the proper
      ;; binding for the edition element.
      ed := bind_value_for_URI(get(w,edition)).
      sw_ed := bind_value_for_URI(get(w,sw_edition)).
      t_sw := bind_value_for_URI(get(w,target_sw)).
      t_hw := bind_value_for_URI(get(w,target_hw)).
      oth := bind_value_for_URI(get(w,other)).
      v := pack(ed,sw_ed,t_sw,t_hw,oth).
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
    testable: "yes"
    status: "active"
    notes: >-
      Each of the five values is bound on its own (ANY to blank, NA to '-', Tables 6-1 and 6-2
      applied) before pack() joins them, so a tilde inside a value is percent-encoded ('%7e') and
      cannot be mistaken for a delimiter.
  - id: "nistir-7695#R-0170"
    normativity: "constraint"
    verb: "none"
    actor: "URI binding implementation"
    condition: "unconditional"
    object: "URI binding"
    field: "letters, digits and underscore"
    locator: "§6.1.2.3 Pseudocode for algorithm, function transform_for_uri(s) / p. 21 (PDF 27) / L1214-L1217"
    text: |-
      ;; alphanumerics (incl. underscore) pass untouched.
      if (is_alphanum(thischar))
      then
      result := strcat(result,thischar).
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
    testable: "yes"
    status: "active"
    notes: >-
      Letters keep their case, so 'Microsoft' binds to 'Microsoft', while URI unbinding lowercases
      (R-0186): a URI with uppercase letters does not survive a round trip (R-0238). Any other
      unquoted character that is not '\', '?' or '*' falls through the loop and is dropped without
      an error; a WFN meeting §5.3.2 never contains one. pct_encode() has no case for a quoted
      letter or digit, so '\a' has no defined result.
  - id: "nistir-7695#R-0171"
    normativity: "definition"
    verb: "none"
    actor: "implementation reproducing the pseudocode"
    condition: "unconditional"
    object: "pseudocode helper"
    field: "substr()"
    locator: "§6.1.2.3 Pseudocode for algorithm, function substr(s,b,e) / p. 23 (PDF 29) / L1333-L1337"
    text: |-
      function substr(s,b,e)
      ;; Returns a substring of s, beginning at the b’th character,
      ;; with 0 being the first character, and ending at the e’th
      ;; character. b must be <= e. Returns nil if b >= strlen(s).
      end.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
      - "nistir-7695#R-0178"
      - "nistir-7695#R-0220"
      - "nistir-7695#R-0225"
    testable: "no"
    testable_reason: "A helper used inside the pseudocode; observable only through results."
    status: "active"
    notes: >-
      Indexes are 0-based and the end index is inclusive, unlike most library substring functions:
      substr(s,idx,idx) is one character and substr(s,idx,idx+2) is three. Lowercase 'must' states a
      precondition.
  - id: "nistir-7695#R-0172"
    normativity: "definition"
    verb: "none"
    actor: "implementation reproducing the pseudocode"
    condition: "unconditional"
    object: "pseudocode helper"
    field: "is_alphanum()"
    locator: "§6.1.2.3 Pseudocode for algorithm, function is_alphanum(c) / p. 23 (PDF 29) / L1345-L1348"
    text: |-
      function is_alphanum(c)
      ;; Returns TRUE iff c is an uppercase letter, a lowercase letter,
      ;; a digit, or the underscore, otherwise FALSE.
      end.
    text_kind: "pseudocode"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
      - "nistir-7695#R-0178"
      - "nistir-7695#R-0220"
      - "nistir-7695#R-0225"
    testable: "no"
    testable_reason: "A helper used inside the pseudocode; observable only through results."
    status: "active"
    notes: >-
      The underscore counts as alphanumeric throughout the pseudocode (transform_for_uri(),
      add_quoting()), matching §5.3.2 rules 1 and 2. Only ASCII letters and digits are meant (§5.3.2
      rule 1).
  - id: "nistir-7695#R-0173"
