  - id: "nistir-7695#R-0160"
    normativity: "constraint"
    verb: "none"
    actor: "URI binding implementation"
    condition: "unconditional"
    object: "URI binding procedure"
    field: "edition component (packing format)"
    locator: "§6.1.2.2 Summary of algorithm, step 3, sentences 1 and 2 / p. 19 (PDF 25) / L1127-L1130"
    text: "Special handling of edition: When binding to a 2.2 URI, the edition component (the sixth element of the URI) is used as the location to “pack” five attribute values in the WFN: (legacy) edition, sw_edition, target_sw, target_hw, and other. The “packing” process involves concatenating the five values together, prefixed and separated by the tilde."
    text_kind: "list-item"
    kind: "stated"
    inherits_from:
      - "nistir-7695#R-0148"
    testable: "yes"
    status: "active"
    notes: >-
      pack() gives the exact form: '~' ed '~' sw_ed '~' t_sw '~' t_hw '~' oth, five tildes and no
      trailing tilde (lines 1283 to 1295); Figure 6-2's packed rule says the same (R-0134). Each
      packed value is first bound like any other component (R-0169).
  - id: "nistir-7695#R-0161"
    normativity: "constraint"
