  - name: logical-value
    locator: "§5.3.1 / p. 16; §5.2 / p. 15; §6.1.2.1.1 / p. 24; §6.2 / p. 37; Figure 6-3"
    encoding: 'WFN: the bare upper-case words ANY and NA; URI: empty component and "-"; formatted string: "*" and "-"'
    structure: enum
    kind: stated
    constrained_by:
      - "nistir-7695#R-0023"
      - "nistir-7695#R-0024"
    constrained_by_locators:
      - "§5.2"
      - "§5.3.1"
      - "§6.1.2.1.1"
      - "§6.1.2.2"
      - "§6.2"
      - "§6.2.1"
    rules:
      - text: 'An attribute of a WFN MAY be assigned one of these logical values:'
        locator: "§5.3.1 / p. 16 / L617"
      - text: 'In WFNs, these logical values will be written in all uppercase characters, without surrounding quotation marks, on the right side of the equal sign, as in these examples:'
        locator: "§5.3.1 / p. 16 / L624"
      - text: 'The logical values ANY and NA are defined as possible attribute values in WFNs. The logical value ANY SHALL bind to what [CPE22] calls a “blank” (i.e., an empty component, indicated by two sequential colons) in the URI. The logical value NA SHALL bind to a single hyphen.'
        locator: "§6.1.2.1.1 / p. 24 / L1063"
      - text: 'When used alone, the asterisk (“*”) represents the logical value ANY, and the hyphen (“-”) represents the logical value NA.'
        locator: "§6.2 / p. 37 / L1815"
      - text: 'logical = "*" / "-"'
        locator: "§6.2.1 / p. 38 / L1853"
      - text: 'Removed all mention of and support for the logical value UNKNOWN.'
        locator: "Appendix B / p. 49 / L2410"
      - text: 'Clarified the view that the logical value NA should also be used if an attribute value is assessed to be null.'
        locator: "Appendix B / p. 49 / L2411"
    flags:
      - '§5.2 item 2 makes an attribute "not used in a WFN" unspecified, with the value ANY, while §5.3.1 says NA "SHOULD be assigned ... when that attribute is not used as part of the description". The two phrases are close enough to be read as one case with opposite values; our reading is that §5.2 speaks of a missing pair and §5.3.1 of a pair the describer chose to mark not applicable.'
      - 'NA has no URI form for part and language (Figures 6-1 and 6-2 allow only empty besides real values); see structure wfn, fields part and language.'
    inferred:
      - statement: 'No value string can be bound as "*" or "-" alone, because both bindings reserve those spellings for ANY and NA; §5.3.2 forbids a lone unquoted asterisk and a lone quoted hyphen in a WFN, which closes both collisions.'
        basis: '§5.3.2 items 4 and 6; §6.2 (L1815); bind_value_for_fs and bind_value_for_URI (§6.2.2.2, §6.1.2.3).'
        kind: inferred
    fields:

      - name: ANY
        position: 1
        type: 'logical value'
        meaning: 'no restriction on acceptable values'
        wfn_form: 'ANY (unquoted, upper case)'
        uri_form: "'' (an empty component; trailing empty components are trimmed)"
        fs_form: "'*'"
        default_for: 'every unspecified attribute (§5.2 item 2; get(w,a), §5.4.2)'
        unbinding: 'URI: decode("") returns ANY; formatted string: unbind_value_fs("*") returns ANY'
        rules:
          - text: 'ANY (i.e., “any value”). The logical value ANY SHOULD be assigned to an attribute when there are no restrictions on acceptable values for that attribute.'
            locator: "§5.3.1 / p. 16 / L618"
          - text: 'If the attribute is unspecified, or its logical value is ANY, bind it to blank (“”) in the URI.'
            locator: "§6.1.2.2 / p. 26 / L1146"
        locator: "§5.3.1; §6.1.2.1.1; §6.2"
        kind: stated
        constrained_by:
