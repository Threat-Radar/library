  # =========================================================================
  # PART 2. THE URI BINDING (section 6.1)
  # =========================================================================

  - name: uri-binding
    locator: "§6 / p. 22; §6.1 to §6.1.3 / p. 22 to 37; Figures 6-1 and 6-2; Tables 6-1 and 6-2; §4 items 3 and 4"
    encoding: 'ASCII URI, scheme name cpe: ([CPE22] §5.1). Value characters: letters, digits, underscore, period and hyphen unencoded; every other quoted WFN character percent-encoded per Table 6-1; unquoted ? and * as %01 and %02 per Table 6-2; tilde unencoded only as the packing sub-delimiter in the preferred syntax. Logical values: ANY as the empty component, NA as "-".'
    structure: sequence
    layout: 'cpe:/part:vendor:product:version:update:edition:language, with trailing empty components and their colons removed'
    grammar: 'Figure 6-1 (CPE 2.2 syntax: what a consumer MUST accept) and Figure 6-2 (preferred syntax: what a producer SHOULD emit); both are reproduced verbatim by the schema artifact'
    external_xsd_type: "cpe22Type"
    external_xsd_pattern: '[c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9\._\-~%]*){0,6}'
    external_xsd_note: 'On base xsd:anyURI. Looser than Figure 6-2: each component is any run of letters, digits, period, underscore, hyphen, tilde and percent sign, so neither the percent-encoded forms, nor the place of %01 and %02, nor the packed edition is checked. Unlike Figure 6-1 under RFC 2234, the first letter must be a lower-case c. Its tilde is the ASCII ~. Observation, not source text.'
    kind: stated
    constrained_by:
      - "nistir-7695#R-0003"
      - "nistir-7695#R-0004"
      - "nistir-7695#R-0007"
      - "nistir-7695#R-0008"
      - "nistir-7695#R-0010"
      - "nistir-7695#R-0011"
      - "nistir-7695#R-0013"
      - "nistir-7695#R-0103"
      - "nistir-7695#R-0104"
      - "nistir-7695#R-0105"
      - "nistir-7695#R-0106"
      - "nistir-7695#R-0121"
      - "nistir-7695#R-0122"
      - "nistir-7695#R-0123"
      - "nistir-7695#R-0143"
      - "nistir-7695#R-0144"
      - "nistir-7695#R-0145"
      - "nistir-7695#R-0146"
      - "nistir-7695#R-0148"
      - "nistir-7695#R-0149"
      - "nistir-7695#R-0155"
      - "nistir-7695#R-0156"
      - "nistir-7695#R-0159"
      - "nistir-7695#R-0166"
      - "nistir-7695#R-0167"
      - "nistir-7695#R-0168"
      - "nistir-7695#R-0173"
      - "nistir-7695#R-0176"
      - "nistir-7695#R-0178"
      - "nistir-7695#R-0179"
      - "nistir-7695#R-0184"
      - "nistir-7695#R-0237"
      - "nistir-7695#R-0238"
      - "nistir-7695#R-0239"
      - "nistir-7695#R-0240"
    constrained_by_note: 'The conversions of §4 item 4(c), §4 item 5 and §7 (R-0011, R-0013, R-0237 to R-0240) read or write this binding and are wired to both bound forms, as are R-0003 and R-0004 (§2.1, Bind and Unbind). R-0147 and R-0177 (it is OPTIONAL to follow the pseudocode) constrain no structure. R-0152 and R-0153, at §6.1.2.1.2, bind WFN value strings and are wired to structure wfn-value-string.'
    constrained_by_locators:
      - "§4"
      - "§6"
      - "§6.1"
      - "§6.1.1"
      - "§6.1.2"
      - "§6.1.2.1"
      - "§6.1.2.1.1"
      - "§6.1.2.1.2"
      - "§6.1.2.2"
      - "§6.1.3"
      - "§6.1.3.1"
    rules:
      - text: 'This section defines the formats for acceptable bound CPE names. The XML schema implementation of these format requirements, which is the authoritative XML binding definition, can be found at http://scap.nist.gov/schema/cpe/2.3/cpe-naming_2.3.xsd.'
        locator: "§6 / p. 22 / L916"
      - text: 'The URI Binding is included in this specification for backward compatibility with prior CPE versions. Section 5.1 of [CPE22] specifies that a CPE name is a percent-encoded URI [RFC3986] with each name having the URI scheme name “cpe:”. The procedure defined here for creating a URI binding ensures that when a WFN is bound to a URI, it will satisfy the requirements of [CPE22] for CPE names.'
        locator: "§6.1 / p. 22 / L922"
      - text: 'This syntax specification is less restrictive than suggested by other text in [CPE22] as well as current CPE operational practice. Specifically, it allows any character in the range %01-ff to be percent-encoded, but Section 5.4 of [CPE22] suggests that only certain printable non-alphanumeric characters should be percent-encoded.'
        locator: "§6.1.1 / p. 23 / L970"
      - text: 'To ensure full backward compatibility with [CPE22], any implementation that consumes URIs and claims to be conformant with this Naming specification MUST accept as valid input any URI that obeys the full syntax shown in Figure 6-1.'
        locator: "§6.1.1 / p. 23 / L976"
      - text: 'Although the freer syntax is allowed as valid input, CPE URIs SHOULD obey the more restricted syntax shown in Figure 6-2. The syntax shown in Figure 6-2 has the following features:'
        locator: "§6.1.1 / p. 23 / L1021"
      - text: 'It introduces support for “packing” multiple attribute values into the edition component.'
        locator: "§6.1.1 / p. 24 / L1031"
      - text: 'It introduces support for the use of special characters.'
        locator: "§6.1.1 / p. 24 / L1032"
      - text: 'It strictly enumerates the allowed percent-encoded forms.'
        locator: "§6.1.1 / p. 24 / L1033"
      - text: 'The bind_to_URI procedure (cf. 6.1.2) is designed to produce URIs that obey the syntax shown in Figure 6-2. The unbind_URI procedure (cf. 6.1.3) is designed to accept as valid input URIs that obey the syntax shown in either Figure 6-1 or Figure 6-2.'
        locator: "§6.1.1 / p. 24 / L1035"
      - text: 'The algorithm defined here assumes that the input WFN complies with the requirements defined in Section 5.2. The behavior of bind_to_URI is undefined if its input is not well formed.'
        locator: "§6.1.2 / p. 24 / L1046"
      - text: 'It is OPTIONAL for implementations of URI binding to follow the pseudocode, processes, and other non-normative information provided in this section. However, the result of an implementation performing a URI binding MUST produce the same result as the suggested pseudocode, processes, etc. would produce.'
        locator: "§6.1.2 / p. 24 / L1050"
      - text: 'The procedure for binding WFNs to URIs MUST address the following issues:'
        locator: "§6.1.2.1 / p. 24 / L1056"
      - text: 'In WFN attribute-value strings, non-alphanumeric characters generally MUST be quoted, with the exception that the special characters “*” and “?” MAY appear without quoting. When forming the URI binding, certain transformations MUST be applied.'
        locator: "§6.1.2.1.2 / p. 24 / L1069"
      - text: 'Following Table 6-1, the binding procedure SHALL replace quoted non-alphanumeric substrings shown under the columns labeled IN with the substitute character or percent-encoded string shown to its right under the columns labeled OUT.'
        locator: "§6.1.2.1.2 / p. 24 / L1076"
      - text: 'When an unquoted special character is encountered in an attribute-value string, it SHALL be bound to the special percent-encoded form shown in Table 6-2.'
        locator: "§6.1.2.1.2 / p. 25 / L1099"
      - text: 'Initialize the output URI binding to the string "cpe:/".'
        locator: "§6.1.2.2 / p. 25 / L1124"
      - text: 'Append the attribute-value string to the output URI, followed by a trailing colon.'
        locator: "§6.1.2.2 / p. 26 / L1152"
      - text: 'Return the output URI, trimming away all trailing colons for compactness.'
        locator: "§6.1.2.2 / p. 26 / L1154"
      - text: 'Given a CPE v2.2-conformant URI, the procedure to unbind it to a WFN is specified in pseudocode below.'
        locator: "§6.1.3 / p. 31 / L1435"
      - text: 'The algorithm expects that the syntax of the input URI conforms to the ABNF in Figure 6-1 or Figure 6-2. (This is guaranteed if the URI is the result of binding a WFN.) The algorithm performs some limited error checking and handling: (1) if an illegal percent-encoded form is encountered, an error is raised; (2) if unquoted special characters are used in a way that violates the legal syntax, an error is raised. A fully robust implementation of the unbinding procedure SHOULD implement additional syntax checks, such as making sure that non-alphanumeric characters do not appear without percent-encoding.'
        locator: "§6.1.3 / p. 31 / L1441"
      - text: 'It is OPTIONAL for implementations of URI unbinding to follow the pseudocode, processes, and other non-normative information provided in this section. However, the result of an implementation performing a URI unbinding MUST produce the same result as the suggested pseudocode, processes, etc. would produce.'
        locator: "§6.1.3 / p. 31 / L1448"
      - text: 'For URI components 1-5 and 7, decode the string and set the corresponding WFN attribute value. Decoding entails: converting sole "" to ANY, sole "-" to NA, adding quoting to embedded periods and hyphens, and decoding percent-encoded forms.'
        locator: "§6.1.3.1 / p. 31 / L1458"
      - text: ';; Normalize: convert all uppercase letters to lowercase first.'
        locator: "§6.1.3.2 / p. 32 / L1529"
      - text: 'Ensured that uppercase letters are transformed to lowercase in unbind_URI.'
        locator: "Appendix B / p. 49 / L2423"
      - text: 'If the implementation produces CPE names in URI form, it MUST produce URIs that adhere to the syntax rules specified in Figure 6-1, and it SHOULD produce URIs that adhere to the more constrained rules specified in Figure 6-2.'
        locator: "§4 / p. 13 / L476"
      - text: '(b) it SHOULD be able to consume any CPE name that meets the syntax requirements specified in Figure 6-1 or Figure 6-2; and (c) it SHOULD be able to convert input CPE names in URI form to syntactically correct formatted string bindings (cf. 7.1).'
        locator: "§4 / p. 13 / L482"
    quoted_character_bindings:
      locator: "Table 6-1 / §6.1.2.1.2 / p. 25 / L1091"
      note: 'IN is the quoted pair in a WFN value string, OUT what bind_to_URI writes; decode() maps each OUT back to its IN, and maps an unencoded period, hyphen or tilde to its quoted form. 31 rows, cells verbatim.'
      rows:
        - in: '\!'
          out: '%21'
        - in: '\"'
          out: '%22'
        - in: '\#'
          out: '%23'
        - in: '\$'
          out: '%24'
        - in: '\%'
          out: '%25'
        - in: '\&'
          out: '%26'
        - in: '\'''
          out: '%27'
        - in: '\('
          out: '%28'
        - in: '\)'
          out: '%29'
        - in: '\*'
          out: '%2a'
        - in: '\+'
          out: '%2b'
        - in: '\,'
          out: '%2c'
        - in: '\-'
          out: '-'
        - in: '\.'
          out: '.'
        - in: '\/'
          out: '%2f'
        - in: '\:'
          out: '%3a'
        - in: '\;'
          out: '%3b'
        - in: '\<'
          out: '%3c'
        - in: '\='
          out: '%3d'
        - in: '\>'
          out: '%3e'
        - in: '\?'
          out: '%3f'
        - in: '\@'
          out: '%40'
        - in: '\['
          out: '%5b'
        - in: '\\'
          out: '%5c'
        - in: '\]'
          out: '%5d'
        - in: '\^'
          out: '%5e'
        - in: '\`'
          out: '%60'
        - in: '\{'
          out: '%7b'
        - in: '\|'
          out: '%7c'
        - in: '\}'
          out: '%7d'
        - in: '\~'
          out: '%7e'
    special_character_bindings:
      locator: "Table 6-2 / §6.1.2.1.2 / p. 25 / L1102"
      note: 'Unquoted special characters; decode() accepts %01 only at the start or end or inside a leading or trailing run of %01, and %02 only as the first or last form, and raises an error otherwise.'
      rows:
        - in: '?'
          out: '%01'
        - in: '*'
          out: '%02'
    flags:
      - 'Figure 6-1 writes its tilde as "˜" (U+02DC SMALL TILDE in the text layer; the page image shows a small raised tilde): unreserved = ALPHA / DIGIT / "-" / "." / "_" / "˜". Every other tilde in the document is the ASCII x7E, §6.1.3.3.7 says "The original v2.2 URI syntax allows tildes to appear without encoding", and the XSD allows ASCII ~. Read literally, Figure 6-1 rejects the §6.1.3.3.7 input cpe:/a:foo~bar:big%7emoney_2010, which unbinds without error.'
      - 'Figures 6-1 and 6-2 are not RFC 2234 ABNF as printed: they write the incremental alternative as "/=" where RFC 2234 §3.3 defines "=/", and Figure 6-2 continues the pct-encoded rule on four lines that each begin with "=" (L1010 to L1013).'
      - 'MUST accept versus MUST error: §6.1.1 obliges a consumer to accept every Figure 6-1 URI as valid input, and Figure 6-1 admits any "%" HEXDIG HEXDIG (the text says "%01-ff"), but decode() raises an error for any form outside Tables 6-1 and 6-2 and §6.1.3 requires the same result as the pseudocode. Example 6 (§6.1.3.3.6, %07) shows the error; %2e, %20 and %41 fail the same way (probe P6).'
      - 'An edition that begins with a tilde but is not a five-part packed string (cpe:/a:foo:bar:1.0:sp1:~x, legal under Figure 6-1 with the tilde reading above) sends unbind_URI into unpack(), where strchr returns nil and the result is undefined (probe P6).'
      - 'A lone %02 component, legal under Figure 6-1, unbinds to the value "*", which §5.3.2 forbids in a WFN (probe P6).'
      - 'unbind_URI lowercases every value (decode, Appendix B), so cpe:/a:Microsoft and cpe:/a:microsoft unbind to the same WFN; unbind_fs does not lowercase (structure formatted-string-binding).'
      - 'transform_for_uri silently drops any unquoted character it has no branch for: given a WFN that is not well formed, such as version "8.0" with an unquoted period, it writes 80 (probe P9). §6.1.2 leaves this undefined.'
      - '§6 calls the external XSD "the authoritative XML binding definition", yet its cpe22Type differs from both figures (external_xsd_note above) and nothing says which governs when they disagree (design-notes.md, defect 20).'
    worked_examples:
      - uri: 'cpe:/a:microsoft:internet_explorer:8.0.6001:beta'
        locator: "§1 / p. 7 / L208"
