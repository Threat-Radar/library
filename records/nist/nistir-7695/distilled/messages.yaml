        locator: "§5.3.2 / p. 17 / L700"
      - text: '"Acrobat_Reader"'
        locator: "§5.3.2 / p. 17 / L701"
      - text: '"\"oh_my\!\"" (quotation marks and exclamation point are quoted)'
        locator: "§5.3.2 / p. 17 / L702"
