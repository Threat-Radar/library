  # =========================================================================
  # PART 3. THE FORMATTED STRING BINDING (section 6.2)
  # =========================================================================

  - name: formatted-string-binding
    locator: "§6.2 to §6.2.3 / p. 37 to 46; Figure 6-3; §7 / p. 47; §4 items 2, 4 and 5"
    encoding: 'ASCII string, defined not to be a URI; values use backslash quoting (no percent-encoding); fields separated by unquoted colons'
    structure: sequence
    layout: 'cpe:2.3:part:vendor:product:version:update:edition:language:sw_edition:target_sw:target_hw:other'
    grammar: 'Figure 6-3 (formstring); reproduced verbatim by the schema artifact'
    external_xsd_type: "cpe23Type"
    external_xsd_pattern: 'cpe:2\.3:[aho\*\-](:(((\?*|\*?)([a-zA-Z0-9\-\._]|(\\[\\\*\?!"#$$%&''\(\)\+,/:;<=>@\[\]\^`\{\|}~]))+(\?*|\*?))|[\*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[\*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-\._]|(\\[\\\*\?!"#$$%&''\(\)\+,/:;<=>@\[\]\^`\{\|}~]))+(\?*|\*?))|[\*\-])){4}'
    external_xsd_note: 'On base xsd:string; XML entities (&quot;, &amp;, &lt;, &gt;) decoded. Same shape as Figure 6-3 except case: the regular expression admits only the lower-case prefix and part letter, where RFC 2234 literals are case-insensitive. Observation, not source text.'
    kind: stated
    constrained_by:
      - "nistir-7695#R-0003"
      - "nistir-7695#R-0004"
      - "nistir-7695#R-0006"
      - "nistir-7695#R-0009"
      - "nistir-7695#R-0011"
      - "nistir-7695#R-0013"
      - "nistir-7695#R-0103"
      - "nistir-7695#R-0192"
      - "nistir-7695#R-0193"
      - "nistir-7695#R-0198"
      - "nistir-7695#R-0199"
      - "nistir-7695#R-0200"
      - "nistir-7695#R-0218"
      - "nistir-7695#R-0220"
      - "nistir-7695#R-0221"
      - "nistir-7695#R-0223"
      - "nistir-7695#R-0225"
      - "nistir-7695#R-0226"
      - "nistir-7695#R-0227"
      - "nistir-7695#R-0231"
      - "nistir-7695#R-0232"
      - "nistir-7695#R-0237"
      - "nistir-7695#R-0238"
      - "nistir-7695#R-0239"
      - "nistir-7695#R-0240"
    constrained_by_note: 'R-0219 and R-0224 (it is OPTIONAL to follow the pseudocode) and R-0012 (it is OPTIONAL to offer the §7.2 conversion) constrain no structure. R-0198 (all eleven values MUST appear) is also wired to the eleven attribute fields.'
    constrained_by_locators:
      - "§4"
      - "§6.2"
      - "§6.2.1"
      - "§6.2.2"
      - "§6.2.2.1"
      - "§6.2.3"
      - "§6.2.3.1"
      - "§7"
      - "§7.1"
      - "§7.2"
    rules:
      - text: 'The formatted string binding is new to CPE version 2.3. In keeping with the spirit of the v2.2 specification, the formatted string binding looks similar to the URI binding; however, it is defined simply to be a “formatted string” rather than a URI in order to relax the requirements that typically apply to URIs as specified in [RFC3986].'
        locator: "§6.2 / p. 37 / L1798"
      - text: 'The formatted string binding is a colon-delimited list of fields prefixed with the string "cpe:2.3:". Use of a prefix distinct from the v2.2 URI binding enables tools to inspect a given input string and use a simple syntactic test to determine whether to process the input as a URI or as a formatted string.'
        locator: "§6.2 / p. 37 / L1803"
      - text: 'Similar to the URI binding, the formatted string binds the attributes in a WFN in a fixed order, separated by the colon character:'
        locator: "§6.2 / p. 37 / L1808"
      - text: 'In a formatted string binding, the alphanumeric characters plus hyphen (“-”), period (“.”) and underscore (“_”) appear unquoted. When used alone, the asterisk (“*”) represents the logical value ANY, and the hyphen (“-”) represents the logical value NA. All other non-alphanumeric characters, if used, MUST be quoted (preceded by the backslash). The special characters asterisk and question mark may appear without quoting, in which case they are open to special interpretation by other CPE specifications. Note that all eleven (11) attribute values MUST appear in the formatted string binding.'
        locator: "§6.2 / p. 37 / L1814"
      - text: 'This section specifies the procedure that SHALL be followed when binding a WFN to a formatted string.'
        locator: "§6.2.2 / p. 38 / L1874"
      - text: 'It is OPTIONAL for implementations of formatted string binding to follow the pseudocode, processes, and other non-normative information provided in this section. However, the result of an implementation performing a formatted string binding MUST produce the same result as the suggested pseudocode, processes, etc. would produce.'
        locator: "§6.2.2 / p. 38 / L1879"
      - text: 'The procedure iterates over the eleven allowed attributes in a fixed order. Corresponding attribute values are obtained from the input WFN and conversions of logical values are applied. A result string is formed by concatenating the attribute values separated by colons.'
        locator: "§6.2.2.1 / p. 39 / L1894"
      - text: 'Given a formatted string binding, the procedure that SHALL be followed to unbind it to a WFN is specified in pseudocode below.'
        locator: "§6.2.3 / p. 42 / L2063"
      - text: 'It is OPTIONAL for implementations of formatted string unbinding to follow the pseudocode, processes, and other non-normative information provided in this section. However, the result of an implementation performing a formatted string unbinding MUST produce the same result as the suggested pseudocode, processes, etc. would produce.'
        locator: "§6.2.3 / p. 42 / L2070"
      - text: 'Unbinding a formatted string is straightforward, since the attribute values are encoded explicitly and in a fixed left-to-right order in the binding, delimited by colons. (Because a colon may appear embedded in a value string if preceded by the escape character, the parsing function needs to ignore escaped colons.) The algorithm parses the eleven fields of the formatted string, then unbinds each string result. If a field contains only an asterisk, it is unbound to the logical value ANY. If a field contains only a hyphen, it is unbound to the logical value NA. Quoting of non-alphanumeric characters is restored as needed, but the two special characters (asterisk and question mark) are permitted to appear without a preceding escape character. The unbinding procedure performs limited error checking, only ensuring that unquoted special characters adhere to syntax requirements specified in Figure 5-1.'
        locator: "§6.2.3.1 / p. 42 / L2077"
      - text: 'If the implementation produces (i.e., generates as an output) CPE names, it MUST produce syntactically correct formatted string bindings as needed to describe or identify applications, operating systems, and hardware devices (cf. 6.2).'
        locator: "§4 / p. 13 / L472"
      - text: 'If the implementation consumes (i.e., accepts as valid input) CPE names, (a) it MUST consume syntactically correct formatted string bindings as needed to describe or identify applications, operating systems, and hardware devices (cf. 6.2);'
        locator: "§4 / p. 13 / L480"
      - text: 'It is OPTIONAL for implementations to be able to convert any syntactically correct formatted string binding to a valid CPE name that meets the requirements specified in [CPE22] (cf. 7.2). An implementation that offers this functionality SHOULD implement the procedure defined in Section 7.2.'
        locator: "§4 / p. 13 / L487"
      - text: 'This section specifies the procedures that SHOULD be followed when converting between the two required bound forms of WFNs.'
        locator: "§7 / p. 47 / L2305"
      - text: 'Both conversions are round-trip safe, meaning that taking one of the two bound forms, converting it to the other form, then converting that back to the original binding form, will result in the original binding.'
        locator: "§7 / p. 47 / L2307"
      - text: 'Changed the prefix of the formatted string binding from "cpe23:" to "cpe:2.3:".'
        locator: "Appendix B / p. 49 / L2418"
    quoting_on_binding:
      text: ';; the period, hyphen and underscore pass unharmed.'
      locator: "§6.2.2.2 / p. 39 / L1942"
      note: 'process_quoted_chars() writes a quoted period, hyphen or underscore of the WFN without its backslash and keeps the backslash on every other quoted character; unquoted characters, including unquoted ? and *, pass through.'
    quoting_on_unbinding:
      text: ';; add quoting to any unquoted non-alphanumeric characters, ;; but leave the two special characters alone, as they may ;; appear quoted or unquoted.'
      locator: "§6.2.3.2 / p. 43 / L2149"
      note: 'add_quoting() keeps every backslash pair, accepts an unquoted * only as the first or last character, accepts an unquoted ? at the start or end or in a leading or trailing run, and quotes every other non-alphanumeric character (so 8.0 becomes 8\.0). It never changes case.'
    flags:
      - 'The bind pseudocode does not give the result the examples show. In process_quoted_chars (§6.2.2.2) the branch for a quoted period, hyphen or underscore sets idx = idx + 2 (written with "=", not ":=") and has no continue, so the loop also runs idx := idx + 1. Read as an assignment, the next character is skipped and the §6.2.2.3.1 version 8\.0\.6001 binds to 8..001; read as a comparison, as = is used elsewhere in the pseudocode, the quoted character is copied twice (8..0..6001). Neither is the 8.0.6001 of the example (probe P1). Every binding of a value with a quoted period, hyphen or underscore is affected, and §6.2.2 makes the pseudocode''s result the normative one.'
      - 'add_quoting accepts an embedded run of question marks: after an unquoted ? it sets embedded to false, so a??b passes and unbinds to a WFN value that §5.3.2 forbids, while decode() rejects the URI equivalent a%01%01b (probe P2).'
      - 'get_comp_fs is documented as "If i=0, return the string to the left of the first forward slash", but a formatted string has no slash; its own example gives get_comp_fs(fs,0) = "cpe".'
      - 'The negative example of §6.2.3.3.3, cpe:2.3:a:hp:insight_diagnostics:7.4.*.1570:*:*:*:*:*:*, has ten attribute fields, not eleven; the text blames only the embedded asterisk (probe P7).'
      - 'unbind_fs keeps case and unbind_URI lowercases, so FS to URI to FS turns cpe:2.3:a:Microsoft:... into cpe:2.3:a:microsoft:..., and URI to FS to URI turns cpe:/a:foo~bar into cpe:/a:foo%7ebar (probe P3); §7 calls both conversions round-trip safe.'
      - '§6.2.2 says the procedure "SHALL be followed" and, two sentences later, that following the pseudocode is OPTIONAL; §6.2.3 does the same. Our reading: the result is binding, the steps are not.'
      - 'A lone ? value (valid in a WFN) binds to a field that Figure 6-3 and the XSD pattern reject (probe P5).'
      - 'RFC 2234 §2.3 makes the literals "cpe:2.3:", "h", "o" and "a" case-insensitive, so Figure 6-3 admits CPE:2.3:A:...; the XSD pattern does not, and unbind_fs would keep the upper-case part.'
      - 'Figure 6-3 comments ALPHA = %x41-5a / %x61-7A with "; a-z" although the rule includes A to Z.'
    worked_examples:
      - fs: 'cpe:2.3:a:microsoft:internet_explorer:8.0.6001:beta:*:*:*:*:*:*'
        locator: "§1 / p. 7 / L214"
        components: 'scheme cpe; cpe_version 2.3; part a; vendor microsoft; product internet_explorer; version 8.0.6001; update beta; edition, language, sw_edition, target_sw, target_hw and other ANY'
        kind: inferred
      - fs: 'cpe:2.3:a:foo\\bar:big\$money_2010:*:*:*:*:special:ipod_touch:80gb:*'
        locator: "§6.2.2.3.5 / p. 41 / L2048"
        components: 'part a; vendor foo\\bar (a quoted backslash); product big\$money_2010 (a quoted dollar sign); version, update, edition and language ANY; sw_edition special; target_sw ipod_touch; target_hw 80gb; other ANY'
        kind: inferred
    notes: 'The decompositions are our parse with the transcribed unbind_fs (probe), not text from the source.'
    fields:

      - name: scheme
        position: 0
        type: string
        required: true
        value: "cpe"
        separator_after: "':'"
        case: 'lower case in Figure 6-3 and the XSD pattern; Figure 6-3 literals are case-insensitive under RFC 2234'
        grammar_rule: 'formstring = "cpe:2.3:" component-list'
        rules:
          - text: 'formstring = "cpe:2.3:" component-list'
            locator: "§6.2.1 / p. 38 / L1834"
          - text: ';; NB: the cpe scheme is the 0th component, the cpe version is the ;; 1st. So we start parsing at the 2nd component.'
            locator: "§6.2.3.2 / p. 42 / L2092"
        locator: "§6.2; Figure 6-3; §6.2.3.2"
