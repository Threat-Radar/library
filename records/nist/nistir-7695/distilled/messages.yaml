        position: 2
        type: 'logical value (structure logical-value) or value string (structure wfn-value-string)'
        required: true
        allowed_values: 'per attribute, structure wfn field rules'
        rules:
          - text: 'Attributes of WFNs SHALL be assigned one of the following values:'
            locator: "§5.3 / p. 15 / L603"
        locator: "§5.1; §5.3"
        kind: stated
