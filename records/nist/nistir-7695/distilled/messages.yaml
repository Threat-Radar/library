  - name: wfn-attribute-value-pair
    locator: "§5.1 / p. 15; §5.3.1 / p. 16; §5.3.2 / p. 16"
    encoding: 'none (logical); notated a=v inside wfn:[...]'
    structure: 'tuple (attribute, value)'
    layout: 'attribute=value, with a value string in straight double quotes and a logical value unquoted in upper case (wfn:[…,update="sr1",…], wfn:[…,update=ANY,…])'
    kind: stated
    constrained_by:
      - "nistir-7695#R-0014"
    constrained_by_note: 'R-0014 says there is no order and no relationship among the pairs. The definition of a pair (§5.1, normative.md N-0045) has no entry.'
    constrained_by_locators:
      - "§5.1"
      - "§5.2"
      - "§5.3"
    rules:
      - text: 'An attribute-value pair is a tuple a=v in which a (the attribute) is an alphanumeric label (used to represent a property or state of some entity), and v (the value) is the value assigned to the attribute.'
        locator: "§5.1 / p. 15 / L558"
      - text: 'In WFNs, these logical values will be written in all uppercase characters, without surrounding quotation marks, on the right side of the equal sign, as in these examples:'
        locator: "§5.3.1 / p. 16 / L624"
      - text: 'In WFNs, attribute-value strings will be enclosed in double quotes as in the examples below. The quotation marks are, of course, not considered part of the string values themselves.'
        locator: "§5.3.2 / p. 16 / L635"
    flags:
      - 'The attribute is called "an alphanumeric label", yet three of the eleven names (sw_edition, target_sw, target_hw) contain an underscore; the pseudocode''s is_alphanum (§6.1.2.3) also counts the underscore as alphanumeric.'
      - 'The four example pairs of §5.1 (color=“red” and so on) are printed with curly quotation marks; every other WFN in the document uses straight double quotes.'
    fields:

      - name: attribute
        position: 1
        type: 'attribute name: one of part, vendor, product, version, update, edition, language, sw_edition, target_sw, target_hw, other'
        required: true
        allowed_values: 'the eleven names of §5.2 item 1 (structure wfn, fields)'
        case: 'case-insensitive; written in lower case by convention'
        rules:
          - text: 'Lexical case SHALL NOT distinguish attributes from one another, e.g., the attributes Foo, foo, FOO, etc., SHALL be considered equivalent. By convention, attributes will be written in all lowercase letters, with the underscore (“_”) character used to separate distinct words within an attribute.'
            locator: "§5.1 / p. 15 / L560"
        inferred:
          - statement: 'target_HW in the §6.1.3.3.5 example names the attribute target_hw.'
            basis: 'The case rule above; the example writes target_HW=ANY where every other example writes target_hw.'
            kind: inferred
        locator: "§5.1; §5.2"
        kind: stated
        constrained_by:
          - "nistir-7695#R-0016"
          - "nistir-7695#R-0019"
        constrained_by_locators:
          - "§5.1"
          - "§5.2"

