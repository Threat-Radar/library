      - "§6.1.3.1"
    rules:
      - text: 'The version 2.3 specification introduces four new attributes{U+2014}the extended attributes{U+2014}that have no assigned position in the URI binding. When these attributes have values other than ANY in the WFN, they are “packed” in a special format, and in a specified order, into the edition component of the URI. This special format uses the tilde character “~” (without percent-encoding) as a sub-delimiter.'
        locator: "§6.1.2.1.3 / p. 25 / L1110"
      - text: 'The capability to bind WFNs to URIs is provided primarily for use by CPE dictionary creators and maintainers, to allow them to create new CPE names that take full advantage of all features introduced in this specification, while still having a backward-compatible path for creating approximate names that conform to [CPE22]. This capability should be used with care, as CPE v2.2-conformant tools may be unable to properly match names that differ in terms of packed attribute values.'
        locator: "§6.1.2.1.3 / p. 25 / L1115"
      - text: 'Special handling of edition: When binding to a 2.2 URI, the edition component (the sixth element of the URI) is used as the location to “pack” five attribute values in the WFN: (legacy) edition, sw_edition, target_sw, target_hw, and other. The “packing” process involves concatenating the five values together, prefixed and separated by the tilde. The leading tilde serves as a flag indicating that the contents of the edition field are a packed representation of five separate values, and the internal tildes are used to aid parsing the values out. In the special case in which the four extended attributes are not specified, or all are ANY, only the edition attribute is used and no packing is performed.'
        locator: "§6.1.2.2 / p. 25 / L1127"
      - text: 'The edition component is "unpacked" if a leading tilde indicates it contains a packed collection of five attribute values.'
        locator: "§6.1.3.1 / p. 31 / L1461"
      - text: 'packed = "~" string "~" string "~" string "~" string "~" string'
        locator: "§6.1.1 / p. 23 / L1003"
    inferred:
      - statement: 'Packing happens when any extended attribute is NA or a value string, not only for value strings: pack() tests for blanks, and only ANY binds to a blank.'
        basis: 'pack() in §6.1.2.3 (if sw_ed, t_sw, t_hw and oth are all "" return ed) with bind_value_for_URI (ANY to "", NA to "-").'
        kind: inferred
      - statement: 'A tilde inside a packed value is written %7e, so the five parts never contain a raw tilde in the preferred syntax.'
        basis: 'Table 6-1 (\~ to %7e) and Figure 6-2, whose string has no tilde in unreserved.'
        kind: inferred
    flags:
      - 'unpack() has no error path: when an edition begins with a tilde but has fewer than five parts, strchr returns nil and start := end+1 is undefined (probe P6).'
      - 'unpack() puts everything after the fifth tilde into other, so a sixth part (legal under Figure 6-1, not under Figure 6-2) becomes part of the other value, with its tilde quoted by decode().'
      - 'CPE 2.2 consumers see the whole packed string as one edition value (Figure 6-1 has no packed rule), which is the matching risk §6.1.2.1.3 names.'
