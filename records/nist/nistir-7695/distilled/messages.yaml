        allowed_values: 'ANY, NA, or any value string meeting §5.3.2; no valid-values list is suggested for this attribute'
        permitted_characters: 'as structure wfn-value-string; periods and hyphens are quoted in the WFN ("8\.0\.6001")'
        case: 'not stated'
        rules:
          - text: 'Values for this attribute SHOULD be vendor-specific alphanumeric strings characterizing the particular release version of the product. Version information SHOULD be copied directly (with escaping of printable non-alphanumeric characters as required) from discoverable data and SHOULD NOT be truncated or otherwise modified. Any character string meeting the requirements for WFNs (cf. 5.3.2) MAY be specified as the value of the attribute.'
            locator: "§5.3.3.4 / p. 18 / L750"
        inferred:
