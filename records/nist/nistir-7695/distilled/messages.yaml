    constrained_by_note: 'R-0155 is wired because a tilde inside a packed value binds to %7e (Table 6-1), so the five parts hold no raw tilde in the preferred syntax (the inferred statement). Each part is encoded as uri-binding.vendor, so the Figure 6-2 string, binding and decoding rules wired there are wired to the parts too; R-0163 (step 4a) excludes edition, and the parts are bound by bind_value_for_URI (R-0169).'
    constrained_by_locators:
