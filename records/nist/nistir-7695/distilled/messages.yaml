extracted_by: "claude (FX-1 pass 1, structures and design-notes agent D, effort max)"
note: 'CPE Naming 2.3 defines no wire protocol and no message exchange. It defines one logical construct and two string encodings of it, and this file decomposes all of them: (1) the well-formed CPE name (structure wfn: an unordered set of at most eleven attribute-value pairs), its pair (wfn-attribute-value-pair), its two logical values (logical-value) and the grammar of an attribute value string (wfn-value-string, Figure 5-1); (2) the URI binding of section 6.1 (uri-binding: the cpe:/ prefix and seven components) with the packed edition component (uri-packed-edition); (3) the formatted string binding of section 6.2 (formatted-string-binding: thirteen colon-separated components, cpe, 2.3 and eleven attribute fields); and (4) the language tag that both bindings restrict (binding-language-tag). Conventions. Every value of a key named text or source_phrase is verbatim from the PDF: a sentence the PDF wraps is joined with one space, or with nothing where the line ends in a hyphen inside a compound such as percent-encoded; list numbers and bullet glyphs are left out; the Symbol-font arrow that pdftotext renders as U+F0AE is written as U+2192, as the page shows it. The em dash (U+2014) is written {U+2014}, because house style forbids the character in this library (as in normative.md); replace each {U+2014} with U+2014 to recover the source. Locators read section / PDF page / line in the pdftotext -layout rendering nistir7695.txt (2443 lines); for the body, PDF page n is printed page n minus 6. Short values under keys such as allowed_values, permitted_characters, case, encoding, separator_before and separator_after are our structured restatement of the verbatim rules beside them, never a substitute for them. Anything implied but not stated sits under an inferred key or carries kind: inferred with its basis. Flags record places where the source disagrees with itself; the probes they cite (P1 to P9) are runs of our own literal transcription of the pseudocode, kept in the extraction scratchpad and not committed, and design-notes.md lists the results. Keys named external_xsd_* describe the XML schema that section 6 calls the authoritative XML binding definition; it is not printed in the PDF, so those values are an observation of the file as served on 2026-10-19 (SHA-256 d37f813fe223922fb7456751d453482009fc7075a3f5ad5e1999d075d190dd69), not source text. constrained_by (pass 3, cross-check) lists the requirements.yaml ids that constrain each structure and field: the entries at the sections in constrained_by_locators, kept where the entry''s object, field and text reach that structure or field, plus the entries that the field''s own keys cite (allowed_values, permitted_characters, encoding, case, logical_value_forms, binding_forms, required_source). A binding or unbinding step is wired to every component whose permitted values it can act on. A structure-level constrained_by holds the entries that bind the structure as a whole: its grammar root, its order and separators, its conformance and same-result requirements, and the conversions between the two bindings. constrained_by_locators is the pass-1 list, kept unchanged, and constrained_by_note says where the entries at a listed section are wired when they bind another structure. 11 entries constrain no structure (R-0002, R-0005, R-0012, R-0136, R-0147, R-0171, R-0172, R-0177, R-0191, R-0219, R-0224); distilled/verification.md, pass 3, gives the reasons.'

