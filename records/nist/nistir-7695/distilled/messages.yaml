  - name: wfn-value-string
    locator: "§5.3.2 / p. 16 to 17; Figure 5-1 / p. 17"
    encoding: 'non-empty string of printable ASCII characters (bytes x00 to x7F as UTF-8); backslash quoting; the surrounding double quotes of the notation are not part of the value'
    structure: sequence
    layout: '[leading special characters] body [trailing special characters]'
    grammar: 'Figure 5-1 (avstring); reproduced verbatim by the schema artifact'
    kind: stated
    constrained_by:
      - "nistir-7695#R-0023"
      - "nistir-7695#R-0027"
      - "nistir-7695#R-0028"
      - "nistir-7695#R-0039"
      - "nistir-7695#R-0040"
      - "nistir-7695#R-0042"
      - "nistir-7695#R-0046"
      - "nistir-7695#R-0047"
    constrained_by_note: '§5.3.3, in constrained_by_locators, holds the per-attribute restrictions (R-0065 to R-0099), wired to the fields of structure wfn. R-0152 and R-0153 come from §6.1.2.1.2, outside constrained_by_locators; they restate the quoting rule for WFN value strings and are wired to the fields.'
    constrained_by_locators:
      - "§5.3"
      - "§5.3.2"
      - "§5.3.3"
    rules:
      - text: 'Value strings assigned to attributes of WFNs SHALL be non-empty contiguous strings of bytes encoded using printable Unicode Transformation Format-8 (UTF-8) characters with hexadecimal values between x00 and x7F [RFC3629].'
        locator: "§5.3.2 / p. 16 / L631"
      - text: 'Value strings in WFNs SHALL satisfy all of the following requirements:'
        locator: "§5.3.2 / p. 16 / L640"
      - text: 'Uppercase letters, lowercase letters or digit characters MAY be used (ASCII x41-x5a, x30-x39 and x61-x7a).'
        locator: "§5.3.2 / p. 16 / L641"
      - text: 'The underscore (x5f) MAY be used, and it SHOULD be used in place of whitespace characters (which SHALL NOT be used).'
        locator: "§5.3.2 / p. 16 / L643"
      - text: 'The backslash (x5c) MAY be used, and is designated the escape character. It SHOULD be used in a value string when required to modify the interpretation of the character that immediately follows (see below). In these circumstances, the character following the backslash is said to be quoted.'
        locator: "§5.3.2 / p. 16 / L645"
      - text: 'The asterisk (x2a) and the question mark (x3f) MAY be used, and are designated special characters. These two characters MAY be assigned special interpretations by other CPE specifications. To block special interpretation of these characters, precede them with the escape character, otherwise leave them unquoted in the value string. A special character MAY be included at the beginning of an otherwise non-empty value string, and/or at the end of the string. A special character MUST NOT be embedded within a value string. A single asterisk MUST NOT be used by itself as an attribute value. The asterisk MUST NOT be used more than once in sequence. A single question mark MAY be used by itself as an attribute value. The question mark MAY be used more than once in sequence.'
        locator: "§5.3.2 / p. 16 / L649"
      - text: 'All other printable non-alphanumeric characters (i.e., all punctuation marks, brackets, delimiters and other special purpose symbols, except for the special characters defined above) MUST be quoted when embedded in value strings.'
        locator: "§5.3.2 / p. 16 / L658"
      - text: 'A quoted hyphen MUST NOT be used by itself as a value string.'
        locator: "§5.3.2 / p. 16 / L661"
      - text: 'These requirements are summarized by the Augmented Backus-Naur Form (ABNF) grammar [RFC2234] for avstring shown in Figure 5-1.'
        locator: "§5.3.2 / p. 17 / L671"
    grammar_rules:
      - text: 'avstring = ( body / ( spec_chrs *body2 )) *1spec_chrs'
        locator: "§5.3.2 / p. 17 / L675"
      - text: 'spec_chrs = 1*spec1 / spec2'
        locator: "§5.3.2 / p. 17 / L676"
      - text: 'body = ( body1 *body2 ) / 2*body2'
        locator: "§5.3.2 / p. 17 / L679"
      - text: 'body1 = unreserved / quoted1'
        locator: "§5.3.2 / p. 17 / L680"
      - text: 'body2 = unreserved / quoted2'
        locator: "§5.3.2 / p. 17 / L681"
      - text: 'unreserved = ALPHA / DIGIT / "_"'
        locator: "§5.3.2 / p. 17 / L682"
      - text: 'quoted1 = escape (escape / special / punc-no-dash)'
        locator: "§5.3.2 / p. 17 / L683"
      - text: 'quoted2 = escape (escape / special / punc-w-dash)'
        locator: "§5.3.2 / p. 17 / L684"
    character_classes:
      - name: letters and digits
        chars: 'A to Z, a to z, 0 to 9 (x41-x5a, x61-x7a, x30-x39)'
        in_value: 'written as themselves, never quoted'
      - name: underscore
        chars: '_ (x5f)'
        in_value: 'written as itself; stands in for whitespace'
      - name: whitespace
        chars: 'space and other whitespace'
        in_value: 'not allowed'
      - name: escape character
        chars: '\ (x5c)'
        in_value: 'quotes the next character; a literal backslash is written \\'
      - name: special characters
        chars: '* (x2a) and ? (x3f)'
        in_value: 'unquoted: open to special interpretation, only at the start or the end (one *, or one or more ?); quoted (\*, \?): ordinary characters anywhere'
      - name: punctuation
        chars: '! " # $ % & '' ( ) + , - . / : ; < = > @ [ ] ^ ` { | } ~ (punc-no-dash plus the dash)'
        in_value: 'always quoted; a quoted hyphen alone is not a value'
    inferred:
      - statement: 'Exactly 31 characters can follow the escape character: the 28 punctuation characters, the backslash and the two special characters. Table 6-1 has one row for each of the 31.'
        basis: 'Figure 5-1 quoted1 and quoted2 with punc-w-dash; our count of Table 6-1 (§6.1.2.1.2).'
        kind: inferred
      - statement: 'Quoting is compulsory at any position, not only inside the string.'
        basis: 'Item 5 says "MUST be quoted when embedded in value strings", but Figure 5-1 admits punctuation only through quoted1 and quoted2, at the start as well.'
        kind: inferred
    flags:
      - 'Figure 5-1 is not the summary L671 says it is: avstring admits a lone "*" and "**" (spec_chrs, no body, then *1spec_chrs), which item 4 forbids ("A single asterisk MUST NOT be used by itself", "MUST NOT be used more than once in sequence").'
      - '"printable ... characters with hexadecimal values between x00 and x7F" includes the control characters x00 to x1F and x7F, which are not printable, and the space, which item 2 forbids; the usable range is x21 to x7E (our reading).'
      - 'Verb strength differs for one act: item 3 says the escape character "SHOULD be used" where needed, item 5 says punctuation "MUST be quoted", and Figure 5-1 makes quoting compulsory.'
      - 'Case: upper and lower case letters are both allowed (item 1), and no sentence says whether two values that differ only in case are the same value. unbind_URI lowercases every URI value; unbind_fs keeps case (structures uri-binding and formatted-string-binding).'
      - 'A lone "?" (and "??") is a valid value here and in Figure 5-1, but no formatted string or preferred URI can carry it: Figure 6-3, Figure 6-2 and the XSD pattern all need at least one body character (probe P5).'
    examples_in_source:
