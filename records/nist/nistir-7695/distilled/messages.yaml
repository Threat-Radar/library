  # =========================================================================
  # PART 1. THE LOGICAL CONSTRUCT (section 5)
  # =========================================================================

  - name: wfn
    locator: "§5 / p. 14; §5.1 / p. 14 to 15; §5.2 / p. 15; §5.3 / p. 15; §5.4 / p. 19 to 20"
    encoding: 'none: "The WFN is a logical construct only." (§5.1). The wfn:[...] notation is for illustration only and no implementation has to use it.'
    structure: 'unordered set of attribute-value pairs, at most one pair per attribute (a map keyed by attribute name)'
    layout: 'wfn:[a1=v1, a2=v2, …, an=vn] (illustrative notation, §5.1)'
    kind: stated
    constrained_by:
      - "nistir-7695#R-0001"
      - "nistir-7695#R-0014"
      - "nistir-7695#R-0015"
      - "nistir-7695#R-0017"
      - "nistir-7695#R-0018"
      - "nistir-7695#R-0019"
      - "nistir-7695#R-0020"
      - "nistir-7695#R-0100"
      - "nistir-7695#R-0101"
      - "nistir-7695#R-0102"
    constrained_by_note: 'R-0001 (§1.3) is the calling convention quoted under operations; R-0100 to R-0102 are the operations. R-0016 (attribute case) is wired to wfn-attribute-value-pair.attribute, and R-0021 to R-0024 to the eleven fields. §5, in constrained_by_locators, holds no entry: its sentences are scope statements (normative.md N-0031 to N-0038).'
    constrained_by_locators:
      - "§5"
      - "§5.1"
      - "§5.2"
      - "§5.3"
      - "§5.4"
    rules:
      - text: 'This section defines the foundational logical construct of CPE{U+2014}the well-formed CPE name (WFN).'
        locator: "§5 / p. 14 / L503"
      - text: 'WFNs can be used to describe a set of products or to identify an individual product.'
        locator: "§5 / p. 14 / L504"
      - text: 'The CPE Naming specification leaves all decisions about what distinguishes identifiers and descriptions to the users. All names constitute descriptions of product classes, and a description becomes an identifier when it contains sufficient information to select a single entity from the universe of possibilities.'
        locator: "§5 / p. 14 / L519"
      - text: 'WFNs are used solely for product classes. They cannot identify product instances, which are unique, physically discernible entities in the world, such as a specific licensed and configured installation of a product on a particular computing device owned by XYZ Corp. and physically installed in a particular location in the world.'
        locator: "§5 / p. 14 / L524"
      - text: 'A WFN is an unordered set of attribute-value pairs that collectively (a) describe or identify a software application, operating system, or hardware device, and (b) satisfy the criteria specified in Section 5.2.'
        locator: "§5.1 / p. 14 / L539"
      - text: 'Unordered means that there is no prescribed order for the attribute-value pairs, and there is no specified relationship (hierarchical, set-theoretic, or otherwise) among attributes or attribute-value pairs.'
        locator: "§5.1 / p. 14 / L541"
      - text: 'The WFN is a logical construct only. The WFN is not intended to be a data format, encoding, or any other kind of machine-readable representation for machine interchange and processing. Rather, it is a conceptual data structure{U+2014}an abstract canonical form{U+2014}used to clearly and unambiguously specify desired implementations and behaviors. There is no requirement that CPE-conformant tools create or manipulate WFN-like data structures internally to their implementations.'
        locator: "§5.1 / p. 14 / L544"
      - text: 'This document uses the following notation to illustrate WFNs:'
        locator: "§5.1 / p. 15 / L570"
      - text: 'wfn:[a1=v1, a2=v2, …, an=vn]'
        locator: "§5.1 / p. 15 / L571"
      - text: 'This notation is used solely for the purposes of explaining and illustrating the concepts and procedures specified herein. There is no requirement that implementations represent WFNs explicitly or use this notation in any way.'
        locator: "§5.1 / p. 15 / L574"
      - text: 'WFNs MUST satisfy these criteria:'
        locator: "§5.2 / p. 15 / L580"
      - text: 'Only the following attributes SHALL be permitted in a WFN attribute-value pair:'
        locator: "§5.2 / p. 15 / L581"
      - text: 'Each permitted attribute MAY be used at most once in a WFN. If an attribute is not used in a WFN, it is said to be unspecified, and its value SHALL default to the logical value ANY (cf. 5.3.1).'
        locator: "§5.2 / p. 15 / L593"
      - text: 'Attribute values of WFNs MUST satisfy the requirements specified in Section 5.3.'
        locator: "§5.2 / p. 15 / L596"
      - text: 'The attributes sw_edition, target_sw, target_hw, and other are newly introduced in this specification and are referred to collectively as the extended attributes.'
        locator: "§5.2 / p. 15 / L598"
      - text: 'Attributes of WFNs SHALL be assigned one of the following values:'
        locator: "§5.3 / p. 15 / L603"
      - text: 'A logical value specified in Section 5.3.1'
        locator: "§5.3 / p. 15 / L604"
      - text: 'A character string satisfying both (a) the requirements on string values specified in Section 5.3.2, and (b) the per-attribute value restrictions specified in Section 5.5.3.'
        locator: "§5.3 / p. 15 / L605"
    out_of_scope:
      - text: 'Other aspects of product naming and description that are outside the scope of the CPE Naming specification are:'
        locator: "§5 / p. 14 / L527"
      - text: 'Representing relationships (e.g., part of, bundled with, released before/after, same as) between products'
        locator: "§5 / p. 14 / L529"
      - text: 'Representing user-defined configurations of installed products'
        locator: "§5 / p. 14 / L531"
      - text: 'Representing entitlement/licensing information about products'
        locator: "§5 / p. 14 / L532"
      - text: 'Defining procedures and guidelines for assigning “correct” or “valid” values to attributes of product descriptions or identifiers'
        locator: "§5 / p. 14 / L533"
      - text: 'Defining procedures and guidelines for creating or maintaining valid-values lists.'
        locator: "§5 / p. 14 / L535"
    operations:
      - name: new
        signature: 'new() returns a WFN'
        text: 'The new() function takes no arguments. It returns an empty WFN (a WFN containing no attribute-value pairs).'
        locator: "§5.4.1 / p. 19 / L829"
      - name: get
        signature: 'get(w,a) returns a value'
        text: 'The get(w,a) function takes two arguments, a WFN w and an attribute a, and returns the value of a. If the attribute a is unspecified in w, get(w,a) returns the default value ANY.'
        locator: "§5.4.2 / p. 20 / L844"
      - name: set
        signature: 'set(w,a,v) returns a WFN'
        text: 'The set(w,a,v) function takes three arguments, a WFN w, an attribute a, and a value v. If the attribute a is unspecified in w, set(w,a,v) adds the attribute-value pair a=v to w. If the attribute a is specified in w, set(w,a,v) replaces its value with v. If v is nil, set(w,a,v) deletes a from w if a is specified in w, otherwise has no effect. The function always returns the new value of w.'
        locator: "§5.4.3 / p. 20 / L855"
      - name: "(all)"
        text: 'Three functions are defined over WFNs: new, get, and set. These functions are used in defining binding and unbinding procedures in Section 6.'
        locator: "§5.4 / p. 19 / L824"
      - name: "(calling convention)"
        text: 'All pseudocode functions are pass by value, meaning that any changes applied to the supplied arguments within the scope of the function do not affect the values of the variables in the caller’s scope.'
        locator: "§1.3 / p. 8 / L278"
    inferred:
      - statement: 'The attribute set is closed: a pair whose attribute is not one of the eleven makes the WFN ill-formed, and so does a second pair for the same attribute.'
        basis: '"Only the following attributes SHALL be permitted" and "Each permitted attribute MAY be used at most once in a WFN" (§5.2); the permission is phrased with an upper limit, which we read as a prohibition of a second use.'
        kind: inferred
      - statement: 'An unspecified attribute and the same attribute set to ANY are indistinguishable: get() returns ANY for both and both bindings write them identically (probe P8). The document defines no equality of two WFNs; comparison is the subject of NIST IR 7696 (record nistir-7696).'
        basis: '§5.2 item 2, §5.4.2, the bind pseudocode of §6.1.2.3 and §6.2.2.2; set(w,a,ANY) keeps the pair (example wfn:[vendor="microsoft",update=ANY], §5.4.3).'
        kind: inferred
      - statement: 'A WFN with no pairs (new()) is well formed; every attribute then reads as ANY, so it describes every product class.'
        basis: '§5.4.1 returns an empty WFN, §5.2 sets no minimum number of pairs, and Figures 6-1 and 6-2 admit the empty component list.'
        kind: inferred
    flags:
      - 'Dangling reference: §5.3 item 2 sends the reader to "Section 5.5.3" for the per-attribute value restrictions; §5.5 (WFN Examples) has no subsections and the restrictions are in §5.3.3.'
      - 'Bound forms are lossy for this distinction: wfn:[part="a"] and wfn:[part="a",vendor=ANY] have one binding each way, and unbinding returns the explicit form for every attribute it reads: all eleven from a formatted string (the §6.2.3.3 examples list ANY for each), and from a URI the seven URI attributes, plus the four extended ones only when the edition is packed (the §6.1.3.3 examples).'
    fields:

      - name: part
        list_item: "§5.2 item 1.a"
        uri_position: 1
        fs_position: 2
        type: 'logical value (ANY or NA) or a value string limited to one of three one-character values'
        required: false
        required_source: '§5.2 item 2: an unused attribute is unspecified and defaults to ANY'
        default: ANY
        allowed_values: '"a" (a class of applications), "o" (a class of operating systems), "h" (a class of hardware devices); ANY; NA'
        permitted_characters: 'one of the lower-case letters a, o, h'
        case: 'not stated for WFN values; the three values are printed in lower case'
        binding_forms: 'URI (Figures 6-1, 6-2): part = "h" / "o" / "a" / empty, so ANY binds to the empty component and NA has no form; formatted string (Figure 6-3): part = "h" / "o" / "a" / logical'
        rules:
          - text: 'The part attribute SHALL have one of these three string values:'
            locator: "§5.3.3.1 / p. 18 / L729"
          - text: 'The value “a”, when the WFN is for a class of applications.'
            locator: "§5.3.3.1 / p. 18 / L730"
          - text: 'The value “o”, when the WFN is for a class of operating systems.'
            locator: "§5.3.3.1 / p. 18 / L731"
          - text: 'The value “h”, when the WFN is for a class of hardware devices.'
            locator: "§5.3.3.1 / p. 18 / L732"
        inferred:
          - statement: 'part may also be ANY or NA.'
            basis: '§5.3 lets every attribute take "A logical value specified in Section 5.3.1", and Figure 6-3 writes part = "h" / "o" / "a" / logical; §5.3.3.1 lists only the three strings and does not exclude the logical values.'
            kind: inferred
        flags:
          - 'NA has a formatted-string form ("-") but no URI form: Figures 6-1 and 6-2 give part only "h", "o", "a" or empty, yet bind_value_for_URI returns "-" for NA, so bind_to_URI writes cpe:/-:... (probe P4), which neither figure admits and which §4 item 3 forbids a producer to emit (MUST adhere to Figure 6-1).'
          - 'RFC 2234 §2.3 makes quoted ABNF strings case-insensitive, so Figure 6-3 also admits "A", "O" and "H"; unbind_fs keeps the case and yields a part value outside the three of §5.3.3.1, while unbind_URI lowercases (decode). The external XSD pattern cpe23Type admits lower case only.'
        locator: "§5.2; §5.3; §5.3.3.1; Figures 6-1, 6-2 and 6-3"
        kind: stated
        constrained_by:
