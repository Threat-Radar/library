    text: 'part = "h" / "o" / "a" / logical'
    requirements:
      - 'nistir-7695#R-0201'
  - id: 'fig-6-3-avstring'
    locator: '§6.2.1 Figure 6-3 / p. 32 (PDF p. 38) / L1851'
    text: 'avstring = *1spec_chrs 1*( unreserved / quoted ) *1spec_chrs / logical'
    requirements:
      - 'nistir-7695#R-0212'
  - id: 'fig-6-3-quoted'
    locator: '§6.2.1 Figure 6-3 / p. 32 (PDF p. 38) / L1858-1862'
    text: 'quoted = escape (escape / special / punc) escape = "\" punc = "!" / DQUOTE / "#" / "$" / "%" / "&" / "''" / "(" / ")" / "+" / "," / "/" / ":" / ";" / "<" / "=" / ">" / "@" / "[" / "]" / "^" / "`" / "{" / "|" / "}" / "~"'
    requirements:
