# NIST IR 7695, Common Platform Enumeration: Naming Specification Version 2.3
# (August 2011): every example the specification prints, the library's derived
# fixtures, and for each one the expected result (worked out by hand from the
# text) and the actual result of run-fixtures.derived.py, the library's
# reference implementation of the specification's pseudocode and grammars.
#
# NISTIR 7695 was published by NIST with no copyright or licence notice; two of
# its three authors were not NIST staff (Acknowledgments, p. iii).
#
# Reproduce every actual result from the repository root:
#   python3 -I records/nist/nistir-7695/distilled/examples/run-fixtures.derived.py
# (README.md in this directory gives the options.)
#
# Every scalar in this file is a quoted string or a block scalar, and there
# are no flow collections, so bin/_yaml.py and PyYAML read it identically.

