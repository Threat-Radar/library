    text: 'formstring = "cpe:2.3:" component-list'
    requirements:
      - 'nistir-7695#R-0199'
  - id: 'fig-6-3-component-list'
    locator: '§6.2.1 Figure 6-3 / p. 32 (PDF p. 38) / L1836-1838'
    text: 'component-list = part ":" vendor ":" product ":" version ":" update ":" edition ":" lang ":" sw_edition ":" target_sw ":" target_hw ":" other'
    requirements:
