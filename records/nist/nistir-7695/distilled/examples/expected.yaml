      - 'nistir-7695#R-0215'
    requirements_note: 'R-0057 (escape) holds this line in its also_at; its own locator is Figure 5-1.'
  - id: 'fig-6-3-langtag'
    locator: '§6.2.1 Figure 6-3 / p. 32 (PDF p. 38) / L1866'
    text: 'LANGTAG = language ["-" region] ; cf. [RFC5646]'
    requirements:
      - 'nistir-7695#R-0140'
    requirements_note: 'R-0140 holds this rule in its also_at; its own locator is Figure 6-2.'
  - id: 's6.2.2-shall'
    locator: '§6.2.2 / p. 32 (PDF p. 38) / L1874'
    text: 'This section specifies the procedure that SHALL be followed when binding a WFN to a formatted string.'
    requirements:
      - 'nistir-7695#R-0218'
  - id: 's6.2.2-same-result'
    locator: '§6.2.2 / p. 32 (PDF p. 38) / L1880-1882'
    text: 'However, the result of an implementation performing a formatted string binding MUST produce the same result as the suggested pseudocode, processes, etc. would produce.'
    requirements:
      - 'nistir-7695#R-0220'
  - id: 's6.2.3-shall'
    locator: '§6.2.3 / p. 36 (PDF p. 42) / L2063-2064'
    text: 'Given a formatted string binding, the procedure that SHALL be followed to unbind it to a WFN is specified in pseudocode below.'
    requirements:
      - 'nistir-7695#R-0223'
  - id: 's6.2.3-same-result'
    locator: '§6.2.3 / p. 36 (PDF p. 42) / L2071-2073'
    text: 'However, the result of an implementation performing a formatted string unbinding MUST produce the same result as the suggested pseudocode, processes, etc. would produce.'
    requirements:
      - 'nistir-7695#R-0225'
  - id: 's6.2.3.1-limited'
    locator: '§6.2.3.1 / p. 36 (PDF p. 42) / L2084-2085'
    text: 'The unbinding procedure performs limited error checking, only ensuring that unquoted special characters adhere to syntax requirements specified in Figure 5-1.'
    requirements:
      - 'nistir-7695#R-0231'
  - id: 's6.2.3.2-get-comp-fs'
    locator: '§6.2.3.2 function get_comp_fs / p. 37 (PDF p. 43) / L2125-2128'
