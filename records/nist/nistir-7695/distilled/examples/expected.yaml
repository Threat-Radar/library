  - id: 'RT-02'
    kind: 'round-trip-uri'
    source: 'derived'
    input_file: 'derived/RT-02.derived.txt'
    input: 'cpe:/A:Microsoft:Internet_Explorer'
    purpose: 'Upper-case letters are lower-cased by decode.'
    expected:
      to_fs: 'cpe:2.3:a:microsoft:internet_explorer:*:*:*:*:*:*:*:*'
      back: 'cpe:/a:microsoft:internet_explorer'
      round_trip: 'different'
    violates:
      - rule: 's7-round-trip'
        locator: '§7 / p. 41 (PDF p. 47) / L2307-2309'
        text: 'Both conversions are round-trip safe, meaning that taking one of the two bound forms, converting it to the other form, then converting that back to the original binding form, will result in the original binding.'
        breaks:
          - 'nistir-7695#R-0238'
    actual:
      to_fs: 'cpe:2.3:a:microsoft:internet_explorer:*:*:*:*:*:*:*:*'
      back: 'cpe:/a:microsoft:internet_explorer'
      round_trip: 'different'
    comparison:
      to_fs: 'agrees'
      back: 'agrees'
      round_trip: 'agrees'
    finding: 'F-26: a URI that Figure 6-1 allows (under RFC 2234 case-insensitivity) does not survive the round trip that section 7 says is safe.'
