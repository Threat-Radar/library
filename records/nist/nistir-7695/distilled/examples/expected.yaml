        wfn_checks:
          verdict: 'valid'
    comparison:
      grammar: 'agrees'
      unbind_URI: 'agrees'
    finding: 'F-06 and F-08: the figures accept "CPE:/" only because ABNF strings are case-insensitive; the XML schema pattern [c][pP][eE] rejects it but accepts "cPE:/".'
