findings:
  - id: 'F-01'
    title: 'Incremental alternatives written "/=" (Figures 6-1 and 6-2)'
    text: 'Seven alternatives of component-list in each figure are introduced with "/=". RFC 2234 section 3.3 and its ABNF of ABNF (defined-as = *c-wsp ("=" / "=/") *c-wsp) spell incremental alternatives "=/", so neither figure parses as ABNF as printed. The derived grammars write "=/".'
  - id: 'F-02'
    title: 'Continuation lines that begin with "=" (Figure 6-2, pct-encoded)'
    text: 'The four continuation lines of pct-encoded (lines 1010 to 1013 of the text rendering, printed page 17) begin with "="; the page image shows them. An ABNF element cannot begin with "=". The derived grammar drops the four "=" and keeps the alternatives.'
  - id: 'F-03'
    title: 'Rule names with underscores (Figures 5-1, 6-2 and 6-3)'
    text: 'spec_chrs, str_wo_special, str_w_special, sw_edition, target_sw and target_hw contain "_"; RFC 2234 section 2.1 allows letters, digits and hyphens only (rulename = ALPHA *(ALPHA / DIGIT / "-")). The derived grammars use hyphens.'
  - id: 'F-04'
    title: 'U+02DC SMALL TILDE in Figure 6-1'
    text: 'The last alternative of unreserved in Figure 6-1 is the character U+02DC (the text layer and the raised glyph on printed page 16 agree), where the ASCII tilde is meant: a char-val may hold only %x20-21 / %x23-7E; the CPE 2.2 grammar that 6.1.1 says the figure shows lists "~" among its punctuation; and 6.1.3.3.7 says "The original v2.2 URI syntax allows tildes to appear without encoding". A tool built from the printed figure rejects 6.1.3.3.7''s own URI. The derived grammar writes "~".'
    fixtures:
      - 'SRC-6.1.3.3.7'
      - 'CONV-04'
      - 'RT-03'
  - id: 'F-05'
    title: '"LANGTAG = cf. [RFC5646]" is prose (Figure 6-1)'
    text: 'The rule is a reference, not ABNF. The derived grammar writes it as a prose value; run-fixtures.derived.py implements it as the RFC 5646 section 2.1 Language-Tag production (well-formedness only).'
  - id: 'F-06'
    title: 'ABNF quoted strings are case-insensitive'
    text: 'RFC 2234 section 2.3: "ABNF strings are case-insensitive". Read that way, Figures 6-1, 6-2 and 6-3 accept "CPE:/", "CPE:2.3:", the part letters "A", "H", "O" and upper-case hexadecimal digits ("%2A"). The XML schema patterns are case-sensitive: cpe23Type rejects "CPE:2.3:" and part "A"; cpe22Type accepts part "A" but its scheme pattern [c][pP][eE] accepts "cPE:/" and rejects "CPE:/". unbind_URI lower-cases every component (decode calls to_lowercase), unbind_fs does not, so "cpe:2.3:A:..." yields part "A", which 5.3.3.1 does not allow.'
    fixtures:
      - 'URI-POS-05'
      - 'URI-POS-06'
      - 'URI-NEG-12'
      - 'FS-NEG-06'
      - 'FS-NEG-07'
      - 'RT-02'
      - 'RT-06'
      - 'RT-09'
  - id: 'F-07'
    title: 'Figure 6-1 is not a transcription of the CPE 2.2 grammar it says it shows'
    text: '6.1.1: "The syntax of legal CPE v2.2 URIs is specified in Appendix A of [CPE22]. For ease of reference it is shown in Figure 6-1, using ABNF notation [RFC2234]." The CPE 2.2 grammar (Appendix A of the archived CPE 2.2 specification) is a BNF whose string is ( ALPHA | DIGIT | PUNC ) + with "%" among PUNC, so a bare percent sign is legal there and not in Figure 6-1, and its component-list has no alternative with the part alone ("cpe:/a"), which Figure 6-1 adds. Details and the archive copy''s digest are in ../schema/README.md.'
  - id: 'F-08'
    title: 'The XML schema that section 6 calls authoritative differs from the figures'
    text: 'Section 6 says the XML schema at http://scap.nist.gov/schema/cpe/2.3/cpe-naming_2.3.xsd is "the authoritative XML binding definition". Its cpe23Type agrees with a case-sensitive reading of Figure 6-3 on every formatted string in this file (73 strings). Its cpe22Type differs from Figure 6-1 on 6 of the 53 URIs: it accepts a bare "%" and a hyphen in the language component, does not check the language tag, and treats case as F-06 says. The specification does not say which governs.'
    fixtures:
      - 'URI-NEG-02'
      - 'URI-NEG-08'
      - 'URI-NEG-12'
      - 'BIND-02'
  - id: 'F-10'
    title: 'Figure 5-1 accepts values made only of special characters that 5.3.2 forbids'
    text: 'Figure 5-1 accepts "*", "**", "?*" and "*?" (spec_chrs followed by zero body2 and an optional second spec_chrs). 5.3.2 item 4 says "A single asterisk MUST NOT be used by itself as an attribute value." and "The asterisk MUST NOT be used more than once in sequence.", and admits special characters only around "an otherwise non-empty value string" (a lone "?" or run of "?" excepted).'
    fixtures:
      - 'AV-DSP-01'
      - 'AV-DSP-02'
      - 'AV-DSP-03'
      - 'AV-DSP-04'
      - 'URI-NEG-10'
      - 'FS-NEG-11'
      - 'BIND-10'
  - id: 'F-11'
    title: 'Figure 5-1 rejects a quoted hyphen followed by special characters'
    text: 'Figure 5-1''s body excludes a single quoted hyphen ("\-") even when special characters follow, so "\-?" and "\-*" are rejected, while "?\-" is accepted. 5.3.2 item 6 forbids only "A quoted hyphen MUST NOT be used by itself as a value string." The bound forms "-%01" and "-?" are valid under Figures 6-2 and 6-3, and both unbinding procedures produce "\-?" from them.'
    fixtures:
      - 'AV-DSP-05'
      - 'FS-POS-06'
      - 'BIND-09'
  - id: 'F-12'
    title: 'Cross-reference to a section that does not exist (5.3 item 2)'
    text: '5.3 item 2 reads "(b) the per-attribute value restrictions specified in Section 5.5.3." There is no 5.5.3 (5.5 is WFN Examples); the restrictions are in 5.3.3.'
  - id: 'F-13'
    title: 'Logical values for part (reading)'
    text: '5.3.3.1 says "The part attribute SHALL have one of these three string values:". This file reads it as restricting the string values of part, so ANY and NA stay allowed: 5.2 item 2 defaults an unspecified part to ANY, Figure 6-1 allows an empty part and Figure 6-3 a logical part.'
    fixtures:
      - 'WFN-POS-04'
  - id: 'F-14'
    title: 'Language tags: the figures admit a subset of what 5.3.3.10 allows'
    text: '5.3.3.10: "Values for this attribute SHALL be valid language tags as defined by [RFC5646]" and "Although any valid language tag MAY be used, only tags containing language and region codes SHOULD be used." Figures 6-2 and 6-3 admit only language ["-" region] with a 2 or 3 letter language. A WFN with a valid tag such as zh-Hant-TW binds to a formatted string that Figure 6-3 rejects, against section 4 item 2 (a producer MUST produce syntactically correct formatted string bindings).'
    fixtures:
      - 'WFN-POS-06'
      - 'BIND-03'
      - 'FS-NEG-08'
  - id: 'F-15'
    title: 'Language NA cannot be written in a URI, yet bind_to_URI writes it'
    text: 'bind_value_for_URI binds NA to "-" for every attribute, the language included. Figures 6-1 and 6-2 define lang = LANGTAG / empty, which excludes "-". So for any WFN with language=NA the output of bind_to_URI breaks section 4 item 3 (a producer MUST produce URIs that adhere to Figure 6-1). The XML schema cpe22Type accepts it.'
    fixtures:
      - 'BIND-02'
      - 'URI-NEG-08'
      - 'RT-11'
  - id: 'F-16'
    title: 'A lone question mark cannot be written in the preferred URI or the formatted string'
    text: '5.3.2 item 4: "A single question mark MAY be used by itself as an attribute value." Figure 6-2 (str_w_special needs at least one character that is not special) and Figure 6-3 (avstring likewise) cannot express it, while bind_to_URI writes "%01" and bind_to_fs writes "?".'
    fixtures:
      - 'AV-POS-01'
      - 'BIND-04'
      - 'URI-EDGE-03'
      - 'FS-NEG-12'
  - id: 'F-17'
    title: 'Quoted underscore: handled by one procedure, forbidden by the grammar'
    text: 'process_quoted_chars has a case for "\_" ("the period, hyphen and underscore pass unharmed"), but Figure 5-1 does not allow an escaped underscore and pct_encode has no case for "_", so transform_for_uri cannot bind it.'
    fixtures:
      - 'AV-NEG-10'
      - 'BIND-NEG-02'
  - id: 'F-20'
    title: 'process_quoted_chars cannot run as printed'
    text: 'In 6.2.2.2 (printed page 34) the branch for ".", "-" and "_" ends with "idx = idx + 2." (a single "=", where the pseudocode elsewhere assigns with ":=") and has no "continue", so control falls through to "idx := idx + 1". Read as an assignment, the character after each quoted period, hyphen or underscore is skipped ("8\.0\.6001" gives "8..001"); read as a comparison, the quoted character is copied twice ("8..0..6001"). Neither reading reproduces the printed examples of section 1 and 6.2.2.3.1 to 6.2.2.3.4. With "idx := idx + 2. continue." every printed example is reproduced; the reference implementation uses that repair and records both literal readings.'
    fixtures:
      - 'SRC-1-BIND-FS'
      - 'SRC-6.2.2.3.1'
      - 'SRC-6.2.2.3.2'
      - 'SRC-6.2.2.3.2-VARIANT'
      - 'SRC-6.2.2.3.3'
      - 'SRC-6.2.2.3.4'
      - 'CONV-01'
      - 'CONV-02'
      - 'CONV-03'
      - 'BIND-03'
      - 'BIND-05'
      - 'BIND-08'
      - 'BIND-09'
      - 'BIND-NEG-02'
  - id: 'F-21'
    title: 'add_quoting accepts an embedded run of question marks; decode does not'
    text: 'add_quoting (6.2.3.2) sets embedded := false after each accepted "?", so the clause (!embedded and (substr(s,idx-1,idx-1) = "?")) accepts the second and later "?" of an embedded run: "a??b" passes. decode (6.1.3.2) does not reset embedded after %01 and rejects "a%01%01b". 6.2.3.1 says the procedure ensures "that unquoted special characters adhere to syntax requirements specified in Figure 5-1", which forbids the run.'
    fixtures:
      - 'AV-NEG-03'
      - 'FS-NEG-05'
      - 'URI-NEG-11'
  - id: 'F-22'
    title: 'unbind_URI rejects URIs that Figure 6-1 allows, including the specification''s own examples'
    text: 'decode accepts only the 29 forms of its case list plus %01 and %02, and unbind_URI treats any edition that begins with "~" as packed. Figure 6-1 allows any "%" HEXDIG HEXDIG and an unencoded tilde anywhere. So URIs that obey Figure 6-1 raise an error (%2d, %07, an embedded %01 or %02) or reach a state the pseudocode does not define (an edition "~a~b"), although 6.1.1 says conforming consumers "MUST accept as valid input any URI that obeys the full syntax shown in Figure 6-1" and that unbind_URI "is designed to accept as valid input URIs that obey the syntax shown in either Figure 6-1 or Figure 6-2". The examples 6.1.3.3.6 and 6.1.3.3.8 are Figure 6-1 URIs that the text itself says raise errors. The text does not say whether "accept as valid input" allows a later decoding error.'
    fixtures:
      - 'SRC-6.1.3.3.6'
      - 'SRC-6.1.3.3.8'
      - 'URI-NEG-01'
      - 'URI-NEG-05'
      - 'URI-NEG-06'
  - id: 'F-23'
    title: 'The asterisk rules are not enforced when unbinding; a lone "*" string collides with ANY'
    text: 'decode("%02") gives "*", decode("%02%02") gives "**" and add_quoting("**") gives "**", values that 5.3.2 item 4 forbids. A lone "*" field means ANY in a formatted string (6.2), so the string value "*" and the logical value ANY bind to the same formatted string, and "cpe:/a:%02" converts to a formatted string whose vendor reads back as ANY.'
    fixtures:
      - 'AV-DSP-01'
      - 'AV-DSP-02'
      - 'URI-NEG-10'
      - 'FS-NEG-11'
      - 'BIND-10'
      - 'RT-07'
  - id: 'F-24'
    title: 'Limited checking: the unbinding procedures return WFNs that break section 5'
    text: 'Neither procedure checks the prefix, the number of components or fields, the part value, a trailing escape or a quoted hyphen by itself. They return a part x, a language g, an other value that ends in a lone backslash and a vendor that is a quoted hyphen by itself, ignore extra components, and reach undefined states for missing fields. 6.1.3 and 6.2.3.1 say the checking is limited; test authors should not treat the pseudocode as a validator.'
    fixtures:
      - 'URI-NEG-03'
      - 'URI-NEG-04'
      - 'FS-NEG-01'
      - 'FS-NEG-02'
      - 'FS-NEG-09'
      - 'FS-NEG-10'
      - 'FS-NEG-15'
  - id: 'F-25'
    title: 'get_comp_fs is defined only by an ambiguous comment'
    text: 'Its comment says that for i=0 it returns "the string to the left of the first forward slash." A formatted string has no slash; the comment''s own example returns "cpe", the text before the first colon (get_comp_uri''s example returns "cpe:", with the colon). The comment also says the colon "is the field delimiter unless prefixed by a" backslash, which does not cover an escaped backslash before a colon: read literally, "foo\\:bar" is one field and the string has one field too few; read as escape pairs, as Figure 6-3 and add_quoting read it, the colon delimits.'
    fixtures:
      - 'SRC-6.2.3.2-GET-COMP-FS'
      - 'FS-POS-04'
  - id: 'F-26'
    title: 'The round trip that section 7 calls safe is not'
    text: 'Section 7: "Both conversions are round-trip safe, meaning that taking one of the two bound forms, converting it to the other form, then converting that back to the original binding form, will result in the original binding." 7.1 applies to "a URI u which conforms to the CPE v2.2 specification". URIs that Figure 6-1 allows come back different: upper case, an unencoded tilde, a trailing empty component, a packed edition with five empty fields, upper-case hexadecimal, and "%02" alone (whose meaning changes). A formatted string with upper-case letters, which Figure 6-3''s ALPHA allows, comes back lower-cased. Names already in the preferred forms survive.'
    fixtures:
      - 'RT-02'
      - 'RT-03'
      - 'RT-04'
      - 'RT-05'
      - 'RT-06'
      - 'RT-07'
      - 'RT-09'
  - id: 'F-27'
    title: 'The error example of 6.2.3.3.3 has ten fields'
    text: '"cpe:2.3:a:hp:insight_diagnostics:7.4.*.1570:*:*:*:*:*:*" has ten fields after the prefix. The stated error (the embedded asterisk) is right; the string is also invalid under "Note that all eleven (11) attribute values MUST appear in the formatted string binding."'
    fixtures:
      - 'SRC-6.2.3.3.3-VARIANT'
  - id: 'F-28'
    title: 'An attribute printed in upper case (6.1.3.3.5)'
    text: 'The WFN of 6.1.3.3.5 has "target_HW=ANY". 5.1 makes case irrelevant ("Lexical case SHALL NOT distinguish attributes from one another") but also says attributes "will be written in all lowercase letters". Compared here as target_hw.'
    fixtures:
      - 'SRC-6.1.3.3.5'
  - id: 'F-29'
    title: 'Function names in section 7'
    text: '7.1 and 7.2 call unbind_uri and bind_to_uri; 6.1 defines unbind_URI and bind_to_URI. Naming only.'
  - id: 'F-35'
    title: 'The same-result MUST against the robust-checking SHOULD'
    text: '6.1.3: "A fully robust implementation of the unbinding procedure SHOULD implement additional syntax checks, such as making sure that non-alphanumeric characters do not appear without percent-encoding." and "However, the result of an implementation performing a URI unbinding MUST produce the same result as the suggested pseudocode, processes, etc. would produce." The pseudocode returns a WFN for "cpe:/a:foo*bar" and quotes "foo!bar" in a formatted string; an implementation that adds the recommended checks and rejects them no longer produces the same result. 6.2.3''s same-result MUST meets 6.2''s "All other non-alphanumeric characters, if used, MUST be quoted" in the same way.'
    fixtures:
      - 'URI-NEG-09'
      - 'FS-NEG-03'
  - id: 'F-36'
    title: 'An empty formatted string field becomes an empty value'
    text: 'unbind_value_fs("") calls add_quoting(""), which returns the empty string, so the WFN gets an empty value, which 5.3.2 forbids ("non-empty"), with no error.'
    fixtures:
      - 'FS-NEG-14'
rules:
  - id: 's4-item2'
    locator: '§4 item 2 / p. 7 (PDF p. 13) / L472-474'
    text: 'If the implementation produces (i.e., generates as an output) CPE names, it MUST produce syntactically correct formatted string bindings as needed to describe or identify applications, operating systems, and hardware devices (cf. 6.2).'
    requirements:
      - 'nistir-7695#R-0006'
  - id: 's4-item3'
    locator: '§4 item 3 / p. 7 (PDF p. 13) / L476-478'
    text: 'If the implementation produces CPE names in URI form, it MUST produce URIs that adhere to the syntax rules specified in Figure 6-1, and it SHOULD produce URIs that adhere to the more constrained rules specified in Figure 6-2.'
    requirements:
      - 'nistir-7695#R-0007'
      - 'nistir-7695#R-0008'
  - id: 's4-item4'
    locator: '§4 item 4 / p. 7 (PDF p. 13) / L480-485'
    text: 'If the implementation consumes (i.e., accepts as valid input) CPE names, (a) it MUST consume syntactically correct formatted string bindings as needed to describe or identify applications, operating systems, and hardware devices (cf. 6.2); (b) it SHOULD be able to consume any CPE name that meets the syntax requirements specified in Figure 6-1 or Figure 6-2; and (c) it SHOULD be able to convert input CPE names in URI form to syntactically correct formatted string bindings (cf. 7.1).'
    requirements:
      - 'nistir-7695#R-0009'
      - 'nistir-7695#R-0010'
      - 'nistir-7695#R-0011'
  - id: 's5.1-logical-construct'
    locator: '§5.1 / p. 8 (PDF p. 14) / L544'
    text: 'The WFN is a logical construct only.'
    requirements_note: 'No entry: the sentence says what the WFN is (normative.md N-0041); the stated non-requirement of the paragraph is R-0015.'
  - id: 's5.1-case'
    locator: '§5.1 / p. 9 (PDF p. 15) / L560-561'
    text: 'Lexical case SHALL NOT distinguish attributes from one another, e.g., the attributes Foo, foo, FOO, etc., SHALL be considered equivalent.'
    requirements:
      - 'nistir-7695#R-0016'
  - id: 's5.1-notation'
    locator: '§5.1 / p. 9 (PDF p. 15) / L574-575'
    text: 'This notation is used solely for the purposes of explaining and illustrating the concepts and procedures specified herein.'
    requirements_note: 'No entry (normative.md N-0050); the stated non-requirement after it is R-0017.'
  - id: 's5.2-permitted'
    locator: '§5.2 item 1 / p. 9 (PDF p. 15) / L581'
    text: 'Only the following attributes SHALL be permitted in a WFN attribute-value pair:'
    requirements:
      - 'nistir-7695#R-0019'
  - id: 's5.2-once'
    locator: '§5.2 item 2 / p. 9 (PDF p. 15) / L593'
    text: 'Each permitted attribute MAY be used at most once in a WFN.'
    requirements:
      - 'nistir-7695#R-0020'
  - id: 's5.2-default-any'
    locator: '§5.2 item 2 / p. 9 (PDF p. 15) / L593-595'
    text: 'If an attribute is not used in a WFN, it is said to be unspecified, and its value SHALL default to the logical value ANY (cf. 5.3.1).'
    requirements:
      - 'nistir-7695#R-0021'
  - id: 's5.3-values'
    locator: '§5.3 / p. 9 (PDF p. 15) / L603'
    text: 'Attributes of WFNs SHALL be assigned one of the following values:'
    requirements:
      - 'nistir-7695#R-0023'
  - id: 's5.3-item2'
    locator: '§5.3 item 2 / p. 9 (PDF p. 15) / L605-606'
    text: 'A character string satisfying both (a) the requirements on string values specified in Section 5.3.2, and (b) the per-attribute value restrictions specified in Section 5.5.3.'
    requirements:
      - 'nistir-7695#R-0023'
    requirements_note: 'Enumeration item 2 of R-0023.'
  - id: 's5.3.1-uppercase'
    locator: '§5.3.1 / p. 10 (PDF p. 16) / L624-625'
    text: 'In WFNs, these logical values will be written in all uppercase characters, without surrounding quotation marks, on the right side of the equal sign, as in these examples:'
    requirements_note: 'No entry: a notation convention for the wfn:[...] examples (requirements.yaml excluded; normative.md N-0078). The notation is illustrative only (R-0017).'
  - id: 's5.3.2-nonempty'
    locator: '§5.3.2 / p. 10 (PDF p. 16) / L631-633'
    text: 'Value strings assigned to attributes of WFNs SHALL be non-empty contiguous strings of bytes encoded using printable Unicode Transformation Format-8 (UTF-8) characters with hexadecimal values between x00 and x7F [RFC3629].'
    requirements:
      - 'nistir-7695#R-0027'
  - id: 's5.3.2-item2'
    locator: '§5.3.2 item 2 / p. 10 (PDF p. 16) / L643-644'
    text: 'The underscore (x5f) MAY be used, and it SHOULD be used in place of whitespace characters (which SHALL NOT be used).'
    requirements:
      - 'nistir-7695#R-0030'
      - 'nistir-7695#R-0031'
      - 'nistir-7695#R-0032'
  - id: 's5.3.2-item3'
    locator: '§5.3.2 item 3 / p. 10 (PDF p. 16) / L645'
    text: 'The backslash (x5c) MAY be used, and is designated the escape character.'
    requirements:
      - 'nistir-7695#R-0033'
  - id: 's5.3.2-ends'
    locator: '§5.3.2 item 4 / p. 10 (PDF p. 16) / L652-653'
    text: 'A special character MAY be included at the beginning of an otherwise non-empty value string, and/or at the end of the string.'
    requirements:
      - 'nistir-7695#R-0038'
  - id: 's5.3.2-embedded'
    locator: '§5.3.2 item 4 / p. 10 (PDF p. 16) / L654'
    text: 'A special character MUST NOT be embedded within a value string.'
    requirements:
      - 'nistir-7695#R-0039'
  - id: 's5.3.2-lone-asterisk'
    locator: '§5.3.2 item 4 / p. 10 (PDF p. 16) / L654-655'
    text: 'A single asterisk MUST NOT be used by itself as an attribute value.'
    requirements:
      - 'nistir-7695#R-0040'
  - id: 's5.3.2-asterisk-run'
    locator: '§5.3.2 item 4 / p. 10 (PDF p. 16) / L655-656'
    text: 'The asterisk MUST NOT be used more than once in sequence.'
    requirements:
      - 'nistir-7695#R-0041'
  - id: 's5.3.2-lone-question'
    locator: '§5.3.2 item 4 / p. 10 (PDF p. 16) / L656'
    text: 'A single question mark MAY be used by itself as an attribute value.'
    requirements:
      - 'nistir-7695#R-0042'
  - id: 's5.3.2-question-run'
    locator: '§5.3.2 item 4 / p. 10 (PDF p. 16) / L656-657'
    text: 'The question mark MAY be used more than once in sequence.'
    requirements:
      - 'nistir-7695#R-0043'
  - id: 's5.3.2-item5'
    locator: '§5.3.2 item 5 / p. 10 (PDF p. 16) / L658-660'
    text: 'All other printable non-alphanumeric characters (i.e., all punctuation marks, brackets, delimiters and other special purpose symbols, except for the special characters defined above) MUST be quoted when embedded in value strings.'
    requirements:
      - 'nistir-7695#R-0044'
  - id: 's5.3.2-item6'
    locator: '§5.3.2 item 6 / p. 10 (PDF p. 16) / L661'
    text: 'A quoted hyphen MUST NOT be used by itself as a value string.'
    requirements:
      - 'nistir-7695#R-0045'
  - id: 'fig-5-1-avstring'
    locator: '§5.3.2 Figure 5-1 / p. 11 (PDF p. 17) / L675'
    text: 'avstring = ( body / ( spec_chrs *body2 )) *1spec_chrs'
    requirements:
      - 'nistir-7695#R-0047'
  - id: 'fig-5-1-body'
    locator: '§5.3.2 Figure 5-1 / p. 11 (PDF p. 17) / L679'
    text: 'body = ( body1 *body2 ) / 2*body2'
    requirements:
      - 'nistir-7695#R-0051'
  - id: 'fig-5-1-unreserved'
    locator: '§5.3.2 Figure 5-1 / p. 11 (PDF p. 17) / L682'
    text: 'unreserved = ALPHA / DIGIT / "_"'
    requirements:
      - 'nistir-7695#R-0054'
  - id: 'fig-5-1-quoted1'
    locator: '§5.3.2 Figure 5-1 / p. 11 (PDF p. 17) / L683-684'
    text: 'quoted1 = escape (escape / special / punc-no-dash) quoted2 = escape (escape / special / punc-w-dash)'
    requirements:
      - 'nistir-7695#R-0055'
      - 'nistir-7695#R-0056'
  - id: 's5.3.3.1-part'
    locator: '§5.3.3.1 / p. 12 (PDF p. 18) / L729'
    text: 'The part attribute SHALL have one of these three string values:'
    requirements:
      - 'nistir-7695#R-0065'
  - id: 's5.3.3.10-language'
    locator: '§5.3.3.10 / p. 13 (PDF p. 19) / L809-810'
    text: 'Values for this attribute SHALL be valid language tags as defined by [RFC5646], and SHOULD be used to define the language supported in the user interface of the product being described.'
    requirements:
      - 'nistir-7695#R-0092'
      - 'nistir-7695#R-0093'
  - id: 's5.3.3.10-any-tag'
    locator: '§5.3.3.10 / p. 13 (PDF p. 19) / L810-811'
    text: 'Although any valid language tag MAY be used, only tags containing language and region codes SHOULD be used.'
    requirements:
      - 'nistir-7695#R-0094'
      - 'nistir-7695#R-0095'
  - id: 's5.5-well-formed'
    locator: '§5.5 / p. 14 (PDF p. 20) / L870-871'
    text: 'The examples below are intended only to illustrate names that are well formed according to the rules defined above.'
    requirements_note: 'No entry: the sentence introduces the examples of 5.5 (requirements.yaml excluded).'
  - id: 'fig-6-1-cpe-name'
    locator: '§6.1.1 Figure 6-1 / p. 16 (PDF p. 22) / L934'
    text: 'cpe-name = "cpe:/" component-list'
    requirements:
      - 'nistir-7695#R-0105'
  - id: 'fig-6-1-component-list'
    locator: '§6.1.1 Figure 6-1 / p. 16 (PDF p. 22) / L936-937'
    text: 'component-list = part ":" vendor ":" product ":" version ":" update ":" edition ":" lang'
    requirements:
      - 'nistir-7695#R-0106'
    requirements_note: 'The first of the eight alternatives that R-0106 holds.'
  - id: 'fig-6-1-part'
    locator: '§6.1.1 Figure 6-1 / p. 16 (PDF p. 22) / L946'
    text: 'part = "h" / "o" / "a" / empty'
    requirements:
      - 'nistir-7695#R-0107'
  - id: 'fig-6-1-lang'
    locator: '§6.1.1 Figure 6-1 / p. 16 (PDF p. 22) / L952'
    text: 'lang = LANGTAG / empty'
    requirements:
      - 'nistir-7695#R-0113'
  - id: 'fig-6-1-unreserved'
    locator: '§6.1.1 Figure 6-1 / p. 16 (PDF p. 22) / L953-956'
    text: 'string = *( unreserved / pct-encoded ) empty = "" unreserved = ALPHA / DIGIT / "-" / "." / "_" / "˜" pct-encoded = "%" HEXDIG HEXDIG'
    requirements:
      - 'nistir-7695#R-0114'
      - 'nistir-7695#R-0115'
      - 'nistir-7695#R-0116'
      - 'nistir-7695#R-0117'
  - id: 's6.1.1-must-accept'
    locator: '§6.1.1 / p. 17 (PDF p. 23) / L976-978'
    text: 'To ensure full backward compatibility with [CPE22], any implementation that consumes URIs and claims to be conformant with this Naming specification MUST accept as valid input any URI that obeys the full syntax shown in Figure 6-1.'
    requirements:
      - 'nistir-7695#R-0121'
  - id: 'fig-6-2-str-w-special'
    locator: '§6.1.1 Figure 6-2 / p. 17 (PDF p. 23) / L1000-1001'
    text: 'str_wo_special = *( unreserved / pct-encoded ) str_w_special = *1spec_chrs 1*( unreserved / pct-encoded ) *1spec_chrs'
    requirements:
      - 'nistir-7695#R-0131'
      - 'nistir-7695#R-0132'
  - id: 'fig-6-2-packed'
    locator: '§6.1.1 Figure 6-2 / p. 17 (PDF p. 23) / L1003'
    text: 'packed = "~" string "~" string "~" string "~" string "~" string'
    requirements:
      - 'nistir-7695#R-0134'
  - id: 'fig-6-2-unreserved'
    locator: '§6.1.1 Figure 6-2 / p. 17 (PDF p. 23) / L1005'
    text: 'unreserved = ALPHA / DIGIT / "-" / "." / "_"'
    requirements:
      - 'nistir-7695#R-0135'
  - id: 'fig-6-2-pct-encoded'
    locator: '§6.1.1 Figure 6-2 / p. 17 (PDF p. 23) / L1009-1013'
    text: 'pct-encoded = "%21" / "%22" / "%23" / "%24" / "%25" / "%26" / "%27" / = "%28" / "%29" / "%2a" / "%2b" / "%2c" / "%2f" / "%3a" / = "%3b" / "%3c" / "%3d" / "%3e" / "%3f" / "%40" / "%5b" / = "%5c" / "%5d" / "%5e" / "%60" / "%7b" / "%7c" / "%7d" / = "%7e"'
    requirements:
      - 'nistir-7695#R-0139'
  - id: 'fig-6-2-langtag'
    locator: '§6.1.1 Figure 6-2 / p. 17 (PDF p. 23) / L1016-1018'
    text: 'LANGTAG = language ["-" region] ; cf. [RFC5646] language = 2*3ALPHA ; shortest ISO 639 code region = 2ALPHA / 3DIGIT ; ISO 3166-1 code or UN M.49 code'
    requirements:
      - 'nistir-7695#R-0140'
      - 'nistir-7695#R-0141'
      - 'nistir-7695#R-0142'
  - id: 's6.1.1-should-obey'
    locator: '§6.1.1 / p. 17 (PDF p. 23) / L1021-1022'
    text: 'Although the freer syntax is allowed as valid input, CPE URIs SHOULD obey the more restricted syntax shown in Figure 6-2.'
    requirements:
      - 'nistir-7695#R-0143'
  - id: 's6.1.1-designed'
    locator: '§6.1.1 / p. 18 (PDF p. 24) / L1035-1037'
    text: 'The bind_to_URI procedure (cf. 6.1.2) is designed to produce URIs that obey the syntax shown in Figure 6-2. The unbind_URI procedure (cf. 6.1.3) is designed to accept as valid input URIs that obey the syntax shown in either Figure 6-1 or Figure 6-2.'
    requirements:
      - 'nistir-7695#R-0144'
      - 'nistir-7695#R-0145'
  - id: 's6.1.2-undefined'
    locator: '§6.1.2 / p. 18 (PDF p. 24) / L1047-1048'
    text: 'The behavior of bind_to_URI is undefined if its input is not well formed.'
    requirements:
      - 'nistir-7695#R-0146'
    requirements_note: 'The second of the two sentences of R-0146.'
  - id: 's6.1.2-same-result'
    locator: '§6.1.2 / p. 18 (PDF p. 24) / L1051-1052'
    text: 'However, the result of an implementation performing a URI binding MUST produce the same result as the suggested pseudocode, processes, etc. would produce.'
    requirements:
      - 'nistir-7695#R-0148'
  - id: 's6.1.2.1.1'
    locator: '§6.1.2.1.1 / p. 18 (PDF p. 24) / L1063-1065'
    text: 'The logical value ANY SHALL bind to what [CPE22] calls a “blank” (i.e., an empty component, indicated by two sequential colons) in the URI. The logical value NA SHALL bind to a single hyphen.'
    requirements:
      - 'nistir-7695#R-0150'
      - 'nistir-7695#R-0151'
  - id: 's6.1.2.1.2-table'
    locator: '§6.1.2.1.2 / p. 18 (PDF p. 24) / L1076-1078'
    text: 'Following Table 6-1, the binding procedure SHALL replace quoted non-alphanumeric substrings shown under the columns labeled IN with the substitute character or percent-encoded string shown to its right under the columns labeled OUT.'
    requirements:
      - 'nistir-7695#R-0155'
  - id: 's6.1.2.1.2-special'
    locator: '§6.1.2.1.2 / p. 19 (PDF p. 25) / L1099-1100'
    text: 'When an unquoted special character is encountered in an attribute-value string, it SHALL be bound to the special percent-encoded form shown in Table 6-2.'
    requirements:
      - 'nistir-7695#R-0156'
  - id: 's6.1.2.1.3-pack'
    locator: '§6.1.2.1.3 / p. 19 (PDF p. 25) / L1111-1112'
    text: 'When these attributes have values other than ANY in the WFN, they are “packed” in a special format, and in a specified order, into the edition component of the URI.'
    requirements:
      - 'nistir-7695#R-0157'
    requirements_note: 'The first of the two sentences of R-0157.'
  - id: 's6.1.2.2-no-pack'
    locator: '§6.1.2.2 item 3 / pp. 19-20 (PDF pp. 25-26) / L1132-1143'
    text: 'In the special case in which the four extended attributes are not specified, or all are ANY, only the edition attribute is used and no packing is performed.'
    requirements:
      - 'nistir-7695#R-0162'
  - id: 's6.1.3-expects'
    locator: '§6.1.3 / p. 25 (PDF p. 31) / L1441-1442'
    text: 'The algorithm expects that the syntax of the input URI conforms to the ABNF in Figure 6-1 or Figure 6-2. (This is guaranteed if the URI is the result of binding a WFN.)'
    requirements:
      - 'nistir-7695#R-0173'
  - id: 's6.1.3-limited'
    locator: '§6.1.3 / p. 25 (PDF p. 31) / L1442-1444'
    text: 'The algorithm performs some limited error checking and handling: (1) if an illegal percent-encoded form is encountered, an error is raised; (2) if unquoted special characters are used in a way that violates the legal syntax, an error is raised.'
    requirements:
      - 'nistir-7695#R-0174'
      - 'nistir-7695#R-0175'
    requirements_note: 'One entry per error check; the lead-in is in their condition.'
  - id: 's6.1.3-robust'
    locator: '§6.1.3 / p. 25 (PDF p. 31) / L1445-1446'
    text: 'A fully robust implementation of the unbinding procedure SHOULD implement additional syntax checks, such as making sure that non-alphanumeric characters do not appear without percent-encoding.'
    requirements:
      - 'nistir-7695#R-0176'
  - id: 's6.1.3-same-result'
    locator: '§6.1.3 / p. 25 (PDF p. 31) / L1449-1451'
    text: 'However, the result of an implementation performing a URI unbinding MUST produce the same result as the suggested pseudocode, processes, etc. would produce.'
    requirements:
      - 'nistir-7695#R-0178'
  - id: 's6.1.3.3.6-error'
    locator: '§6.1.3.3.6 / p. 30 (PDF p. 36) / L1768'
    text: 'An error is raised when this URI is unbound, because it contains an illegal percent-encoded form, "%07".'
    requirements_note: 'No entry: an example sentence (the examples of 6.1.3.3 are fixtures, requirements.yaml excluded). It illustrates R-0174 and R-0185.'
  - id: 's6.1.3.3.7-tilde'
    locator: '§6.1.3.3.7 / p. 31 (PDF p. 37) / L1786-1787'
    text: 'The original v2.2 URI syntax allows tildes to appear without encoding, but the preferred URI syntax is for tildes to be encoded like any other printable non-alphanumeric character.'
    requirements_note: 'No entry: an example sentence. It describes Figure 6-1''s unreserved (R-0116) and the preferred encoding of the tilde (Table 6-1, R-0155; Figure 6-2, R-0135 and R-0139).'
  - id: 's6.1.3.3.8-error'
    locator: '§6.1.3.3.8 / p. 31 (PDF p. 37) / L1793-1794'
    text: 'An error is raised when this URI is unbound, because it contains a special character ("%02") embedded within a value string.'
    requirements_note: 'No entry: an example sentence. It illustrates R-0175 and R-0189 (and R-0039).'
  - id: 's6.2-logical'
    locator: '§6.2 / p. 31 (PDF p. 37) / L1815-1816'
    text: 'When used alone, the asterisk (“*”) represents the logical value ANY, and the hyphen (“-”) represents the logical value NA.'
    requirements:
      - 'nistir-7695#R-0195'
  - id: 's6.2-quoting'
    locator: '§6.2 / p. 31 (PDF p. 37) / L1816-1817'
    text: 'All other non-alphanumeric characters, if used, MUST be quoted (preceded by the backslash).'
    requirements:
      - 'nistir-7695#R-0196'
  - id: 's6.2-eleven'
    locator: '§6.2 / p. 31 (PDF p. 37) / L1818-1819'
    text: 'Note that all eleven (11) attribute values MUST appear in the formatted string binding.'
    requirements:
      - 'nistir-7695#R-0198'
  - id: 's6.2-prefix'
    locator: '§6.2 / p. 31 (PDF p. 37) / L1803'
    text: 'The formatted string binding is a colon-delimited list of fields prefixed with the string "cpe:2.3:".'
    requirements:
      - 'nistir-7695#R-0192'
