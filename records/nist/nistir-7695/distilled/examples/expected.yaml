          verdict: 'valid'
    expected_note: 'Breaks the cited rule only when its quoted string is read case-sensitively, as the XML schema reads it; RFC 2234 reads it case-insensitively. The pseudocode never inspects the scheme; this implementation reads it without regard to case (RFC 3986 schemes are case-insensitive).'
