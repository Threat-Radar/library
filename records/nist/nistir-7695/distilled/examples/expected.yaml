conventions:
  - 'source: verbatim marks an example the specification prints; its file under verbatim/ holds the printed characters plus one LF. A wrapped example keeps its printed lines; joined with nothing between them they give the string (every wrap falls after a comma or, in 6.2.3.3.3, after a hyphen). Labels such as "URI: " and "FS: ", list bullets, the pseudocode comment marker ";; " and the explanation in parentheses after 12 of the 13 value strings of 5.3.2 are not part of an example. The arrow of the 5.4 examples is a Symbol-font glyph (U+F0AE in the text layer) and is written U+2192. source: derived marks a fixture the library made; its input is in derived/<id>.derived.txt (one line plus one LF, taken as written) and, for reading, inline as input; the runner checks that the two are equal.'
  - 'Locators give the section, the printed page with the PDF page in parentheses (PDF page = printed page + 6), and the line numbers in the pdftotext -layout rendering.'
  - 'expected is what the specification says, worked out by hand: for printed examples the printed result; for derived fixtures the result of applying the cited rules and the pseudocode by hand. Where the specification''s authorities disagree (Figure 5-1 against the prose of 5.3.2, a figure against the pseudocode), expected gives each authority''s answer under its own key rather than choosing one, and a finding explains the disagreement.'
  - 'actual is computed by run-fixtures.derived.py and never edited by hand; comparison is computed from expected and actual. A comparison key is agrees when every key under expected is present in actual with an equal value (actual may hold more). pseudocode_as_printed: differs marks a fixture where the pseudocode read literally gives a different result from the reference (F-20); get_comp_fs_literal_reading: differs marks the same for the get_comp_fs comment (F-25).'
  - 'Grammar results use the derived (repaired) grammars of ../schema/. figure_6_1, figure_6_2 and figure_6_3 read quoted strings case-insensitively, as RFC 2234 section 2.3 requires; the *_case_sensitive keys read every quoted string as RFC 7405 %s"..." would. xsd_cpe22Type and xsd_cpe23Type are the pattern facets of ../schema/cpe-naming_2.3.xsd.'
  - 'Value checks: avstring.figure_5_1 is Figure 5-1, avstring.prose_5_3_2 is the library''s reading of the prose of 5.3.2 (rule avstring-prose, readings P1 to P4 in ../schema/figure-5-1-avstring.derived.abnf), and verdict is valid when both accept, invalid when both reject, disputed when they disagree. wfn_checks applies these to every string value plus 5.2 (permitted attributes, each at most once), 5.3.3.1 (part) and 5.3.3.10 (RFC 5646 well-formedness).'
  - 'WFNs are written in the notation of 5.1 with attribute names in lower case, in the order the pseudocode sets them; the printed examples use the same order. The value strings keep their backslash quoting, and ANY and NA without quotation marks are the logical values.'
  - 'Pseudocode outcomes: wfn, uri or fs for a result; error where the pseudocode''s own error statement is reached; undefined where it reaches a state it does not define (nil where a string is needed, a case with no branch). For a value that is not well formed the bindings are undefined by 6.1.2 ("The behavior of bind_to_URI is undefined if its input is not well formed."), so such fixtures carry no expectation for them; their actual results are recorded for information.'
  - 'violates lists, for each negative or disputed fixture, the statements it breaks: rule id, locator and verbatim text (also listed under rules).'
  - 'requirements (on each rule) and breaks (beside each rule a fixture violates) hold nistir-7695#R-NNNN ids from ../requirements.yaml; pass 3 (cross-check) added them. requirements names the entries whose text holds the rule. breaks names the entry whose constraint the fixture breaks; where a rule spans several entries, it is the entry that the fixture''s change reaches. A rule with no entry of its own (a descriptive sentence, a notation convention, a lead-in or an example sentence) has no requirements key and a requirements_note, and a violated rule with no entry has no breaks key and a breaks_note. breaks_note also marks a break that holds only under a stated reading (P1 to P4 of ../schema/figure-5-1-avstring.derived.abnf, the case-sensitive reading of F-06, the language-string reading) or that falls outside a permission (R-0020, R-0038).'
  - 'finding ids refer to findings below; README.md in this directory summarises them.'
