      unbind_URI:
        outcome: 'error'
    violates:
      - rule: 'fig-6-2-pct-encoded'
        locator: '§6.1.1 Figure 6-2 / p. 17 (PDF p. 23) / L1009-1013'
        text: 'pct-encoded = "%21" / "%22" / "%23" / "%24" / "%25" / "%26" / "%27" / = "%28" / "%29" / "%2a" / "%2b" / "%2c" / "%2f" / "%3a" / = "%3b" / "%3c" / "%3d" / "%3e" / "%3f" / "%40" / "%5b" / = "%5c" / "%5d" / "%5e" / "%60" / "%7b" / "%7c" / "%7d" / = "%7e"'
        breaks:
          - 'nistir-7695#R-0139'
      - rule: 's6.1.1-should-obey'
        locator: '§6.1.1 / p. 17 (PDF p. 23) / L1021-1022'
        text: 'Although the freer syntax is allowed as valid input, CPE URIs SHOULD obey the more restricted syntax shown in Figure 6-2.'
        breaks:
          - 'nistir-7695#R-0143'
    actual:
      grammar:
        figure_6_1: 'valid'
        figure_6_1_case_sensitive: 'valid'
        figure_6_2: 'invalid'
        figure_6_2_case_sensitive: 'invalid'
        xsd_cpe22Type: 'valid'
      unbind_URI:
        outcome: 'error'
        reason: 'decode: illegal percent-encoded form ''%2d'''
    comparison:
      grammar: 'agrees'
      unbind_URI: 'agrees'
    finding: 'F-22: 6.1.1 says a conforming consumer MUST accept as valid input any URI that obeys Figure 6-1, and that unbind_URI is designed to accept such URIs, but decode raises an error on %2d (also %2e, %5f, %41, %20 and every other form outside its list).'
  - id: 'URI-NEG-02'
