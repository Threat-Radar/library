  reason: "The reference secure-development practice catalogue (PO/PS/PW/RV). PW.1.1 is the canonical 'perform threat modeling' requirement that anchors tmodel; PW.4/PS.3.2 anchor SBOM/provenance; RV.1-3 anchor vuln response. Outcome-based and SDLC-agnostic, so it maps cleanly onto the SDL gate/requirement model (R-041/R-044) and the MAP-0001 crosswalk. No certification regime — conformance is self-attestation (federal procurement, outside the SP)."
