findings:
  - id: 'F-01'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/$defs/prefix/pattern'
    summary: >-
      The id pattern checks only the start of the id. ^(x_|(ASB-A|...|VCPKG)-) has no end anchor and
      no character class, so any characters may follow a known prefix. The prose requires the whole
      id to match ^[a-zA-Z0-9:_.-]+$ and names spaces, slashes, backslashes, parentheses and
      exclamation marks as not allowed; an id of only the x_ prefix is accepted too.
    rules:
      - 'id-charset'
      - 'id-charset-list'
      - 'id-format'
    fixtures:
      - 'GAP-01'
      - 'GAP-02'
      - 'GAP-03'
      - 'GAP-04'
      - 'GAP-05'
      - 'GAP-06'
      - 'GAP-07'
      - 'GAP-41'
  - id: 'F-02'
    cause: 'schema'
    direction: 'rejects what the prose allows'
    schema_pointer: '/$defs/prefix/pattern'
    summary: >-
      The prefix list is enforced as a hard rule, though the prose asks for a defined prefix with
      should. The lists also differ: the prose table prints CleanStart where the JSON Schema has
      CLEANSTART, and the JSON Schema accepts FreeBSD, which the table does not list (enumeration
      id-prefixes).
    rules:
      - 'id-scoped-prefix'
      - 'id-local-prefix'
      - 'prefix-table'
    fixtures:
      - 'OVER-02'
      - 'OVER-03'
      - 'SHOULD-08'
  - id: 'F-03'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/properties/aliases/items'
    summary: >-
      aliases, related and upstream items are typed as plain strings. The prose says they are ids,
      aliases in the form of the id field, and an id cannot be its own upstream.
    rules:
      - 'aliases-form'
      - 'related-list'
      - 'upstream-list'
      - 'upstream-asymmetric'
    fixtures:
      - 'GAP-09'
      - 'GAP-10'
      - 'GAP-11'
  - id: 'F-04'
    cause: 'schema and tool'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/$defs/timestamp'
    summary: >-
      The timestamp pattern has no anchors and format: date-time is only an annotation unless a
      format checker is passed, so jsonschema's default validation accepts text around a timestamp
      and impossible dates. A trailing line feed passes even with the format checker, because
      rfc3339-validator 0.1.4 matches with Python's $, which also matches before a final line feed.
      The prose requires an RFC 3339 timestamp in UTC ending in Z.
    rules:
      - 'modified-format'
      - 'published-format'
      - 'withdrawn-format'
    fixtures:
      - 'GAP-12'
      - 'GAP-13'
      - 'GAP-14'
  - id: 'F-05'
    cause: 'tool'
    direction: 'rejects what the prose allows'
    schema_pointer: '/$defs/timestamp/format'
    summary: >-
      With the format checker, jsonschema rejects the leap second 2016-12-31T23:59:60Z:
      rfc3339-validator 0.1.4 limits seconds to 59, while RFC 3339 allows 60 at a leap second. The
      JSON Schema itself (pattern and format) accepts it.
    rules:
      - 'published-format'
    fixtures:
      - 'TOOL-03'
  - id: 'F-06'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/properties/affected/items/properties/ranges/items'
    summary: >-
      Nothing checks SEMVER range values: a leading v and a two-part version are accepted. The prose
      requires SemVer 2.0.0 versions with no leading v.
    rules:
      - 'semver-type'
    fixtures:
      - 'GAP-15'
      - 'GAP-16'
  - id: 'F-07'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/properties/affected/items/properties/ranges/items/allOf/1/then/properties/events/items/oneOf/1/properties/fixed/pattern'
    summary: >-
      The GIT hash pattern ^(0|[a-f0-9]{40}|[a-f0-9]{64})$ allows 0 for every event type, so fixed 0
      passes. The prose gives the special value 0 to introduced only and requires full-length hashes
      for fixed.
    rules:
      - 'git-type'
      - 'introduced-zero'
    fixtures:
      - 'GAP-17'
  - id: 'F-08'
    cause: 'schema'
    direction: 'rejects what the prose allows'
    schema_pointer: '/properties/affected/items/properties/ranges/items/allOf/1/then/properties/events/items/oneOf/3/properties/limit/pattern'
    summary: >-
      The same GIT pattern rejects limit *, the infinity value the prose defines and the implicit
      event it says every range has. The source's own { "limit": "*" } is valid as an event item and
      in a SEMVER range, and invalid in a GIT range.
    rules:
      - 'limit-star'
    fixtures:
      - 'OVER-01'
      - 'SRC-L1154-1'
      - 'SHOULD-04'
  - id: 'F-09'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/$defs/ecosystemWithSuffix/pattern'
    summary: >-
      The ecosystem pattern allows any :suffix after every ecosystem and no suffix after every
      ecosystem. The prose requires a suffix for Alpine (with v), Mageia, Photon OS and Red Hat
      Lightwell (an existing ecosystem), requires :LTS for an LTS Ubuntu release, lists the only
      Echo values, forbids a trailing slash on a Maven repository URL, and describes no suffix for
      ecosystems such as npm.
    rules:
      - 'ecosystem-table'
      - 'alpine-suffix'
      - 'mageia-suffix'
      - 'photon-suffix'
      - 'lightwell-suffix'
      - 'echo-values'
      - 'ubuntu-lts'
      - 'maven-suffix'
      - 'npm-row'
    fixtures:
      - 'GAP-18'
      - 'GAP-19'
      - 'GAP-20'
      - 'GAP-21'
      - 'GAP-22'
      - 'GAP-23'
      - 'GAP-24'
      - 'GAP-25'
      - 'GAP-26'
      - 'GAP-27'
  - id: 'F-10'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/properties/affected/items/properties/package/properties/name'
    summary: >-
      Package names are plain strings. The prose allows only Kernel as a Linux name and only the
      listed SoC vendors after :linux_kernel: in Android.
    rules:
      - 'linux-name'
      - 'android-kernel-name'
      - 'android-vendors'
    fixtures:
      - 'GAP-28'
      - 'GAP-29'
  - id: 'F-11'
    cause: 'schema'
    direction: 'decides what the prose leaves open'
    schema_pointer: '/$defs/ecosystemWithSuffix/pattern'
    summary: >-
      The ecosystem pattern ends in |GIT, so GIT is accepted as a package ecosystem. The ecosystem
      table does not list it, the prose calls GIT a pseudo-ecosystem, and the unreferenced
      $defs/ecosystemName enum leaves it out (enumerations ecosystems and
      ecosystems-unreferenced-enum).
    rules:
      - 'ecosystem-table'
      - 'git-pseudo-ecosystem'
      - 'git-entry'
    fixtures:
      - 'EDGE-01'
  - id: 'F-12'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/properties/affected/items/properties/package/properties/purl'
    summary: 'purl is a plain string. The prose asks for a Package URL without its version.'
    rules:
      - 'purl-format'
    fixtures:
      - 'GAP-30'
      - 'GAP-31'
  - id: 'F-13'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/properties/references/items/properties/url/format'
    summary: >-
      url carries format: uri, which jsonschema checks only with a format checker, so by default any
      string passes. With the checker (rfc3987) both fixtures are rejected, as the prose's fully
      qualified URL requires.
    rules:
      - 'reference-url'
    fixtures:
      - 'GAP-32'
      - 'GAP-33'
  - id: 'F-14'
    cause: 'schema'
    direction: 'decides what the prose leaves open'
    schema_pointer: '/properties/references/items/properties/type/enum'
    summary: >-
      The reference type enum adds GIT, which is not among the prose's ten known values, and closes
      the list, which the prose does not do. Under either reading of the prose the JSON Schema
      disagrees with one of EDGE-07 and EDGE-08.
    rules:
      - 'reference-types'
    fixtures:
      - 'EDGE-07'
      - 'EDGE-08'
  - id: 'F-15'
    cause: 'schema'
    direction: 'decides what the prose leaves open'
    schema_pointer: '/$defs/severity/items/properties/source/enum'
    summary: >-
      severity source is a closed enum (NVD, CNA, SELF). The prose calls it an optional string and
      tables three values without saying the list is closed, unlike severity type and credit type,
      which must be one of their lists.
    rules:
      - 'severity-source'
      - 'severity-type'
      - 'credits-type'
    fixtures:
      - 'EDGE-06'
  - id: 'F-16'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/$defs/severity/items/allOf/0/then/properties/score/pattern'
    summary: >-
      The CVSS_V2 and CVSS_V3 patterns accept any sequence of known metrics, so an incomplete vector
      passes. The prose asks for a CVSS vector string of that version, and both CVSS specifications
      require every base metric (cited). The CVSS_V4 pattern does require every base metric.
    rules:
      - 'cvss-v2'
      - 'cvss-v3'
    fixtures:
      - 'GAP-34'
      - 'GAP-35'
  - id: 'F-17'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/properties/aliases/type'
    summary: >-
      aliases, affected, references and severity accept null (type [array, null]); related, upstream
      and credits do not. The prose describes all of them as arrays or lists.
    rules:
      - 'aliases-form'
      - 'affected-array'
      - 'references-list'
      - 'severity-array'
      - 'related-list'
    fixtures:
      - 'GAP-36'
      - 'GAP-37'
      - 'GAP-38'
      - 'GAP-39'
      - 'NEG-31'
  - id: 'F-18'
    cause: 'schema'
    direction: 'decides what the prose leaves open'
    schema_pointer: '/additionalProperties'
    summary: >-
      additionalProperties: false applies only at the top level: an unknown top-level field is
      rejected, while an unknown field in an affected entry or an event object is accepted. The
      prose says neither.
    rules:
      - 'customizations'
      - 'ignore-unexpected'
      - 'single-type-event'
    fixtures:
      - 'EDGE-02'
      - 'EDGE-03'
      - 'EDGE-04'
  - id: 'F-19'
    cause: 'schema'
    direction: 'decides what the prose leaves open'
    schema_pointer: '/allOf/0'
    summary: >-
      The rule against severity at both levels fires on the presence of the top-level member
      (required), so a null or empty top-level severity next to package-level severity is rejected.
      The prose says only that the top level must not be set.
    rules:
      - 'package-severity'
    fixtures:
      - 'EDGE-05'
      - 'EDGE-12'
  - id: 'F-20'
    cause: 'schema'
    direction: 'decides what the prose leaves open'
    schema_pointer: '/properties/affected/items/properties/ranges/items/allOf/1/then/properties/events/items/oneOf/1/properties/fixed/pattern'
    summary: >-
      GIT hashes must be lowercase hexadecimal ([a-f0-9]); the prose says full-length Git commit
      hashes and does not fix the letter case.
    rules:
      - 'git-type'
    fixtures:
      - 'EDGE-09'
  - id: 'F-21'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/properties/summary'
    summary: 'summary is any string, so a summary of two lines passes; the prose defines a one-line summary.'
    rules:
      - 'summary-one-line'
    fixtures:
      - 'GAP-40'
  - id: 'F-22'
    cause: 'schema'
    direction: 'accepts what the prose forbids'
    schema_pointer: '/$defs/prefix/pattern'
    summary: >-
      No check stops an id from describing the weakness, package or severity. The prose's must not
      applies when a database sets up a new identifier scheme, which a schema cannot see.
    rules:
      - 'id-neutral'
      - 'id-neutral-scope'
    fixtures:
      - 'GAP-08'
  - id: 'F-23'
    cause: 'schema'
    direction: 'decides what the prose leaves open'
    schema_pointer: '/properties/affected/items/properties/versions'
    summary: >-
      versions is optional in every case. The prose calls the list generally recommended in one
      place and a requirement that GIT ranges do not remove in another; the source's own OSV example
      has a GIT range and no versions.
    rules:
      - 'versions-recommended'
      - 'git-versions-requirement'
    fixtures:
      - 'EDGE-10'
      - 'SRC-L1635'
  - id: 'F-24'
    cause: 'tool'
    direction: 'accepts what the JSON Schema forbids'
    schema_pointer: '/$defs/ecosystemWithSuffix/pattern'
    summary: >-
      jsonschema evaluates pattern with Python re.search, where $ also matches just before a final
      line feed. A commit hash or an ecosystem followed by a line feed therefore passes jsonschema,
      while the same pattern read as ECMA-262 (what JSON Schema 2020-12 specifies; checked with
      Node) rejects it. Every pattern in the schema that ends in $ has the same gap.
    rules:
      - 'git-type'
      - 'ecosystem-table'
    fixtures:
      - 'TOOL-01'
      - 'TOOL-02'
