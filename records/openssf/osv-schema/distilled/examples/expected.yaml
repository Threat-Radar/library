  - id: 'S-01'
    summary: >-
      Seven printed examples are not valid JSON: each has a trailing comma before a closing bracket
      or brace (RFC 8259, cited). The Credits example and six of the seven range examples; the
      multiple range example is clean.
    rules: []
    fixtures:
      - 'SRC-L1298'
      - 'SRC-L1310'
