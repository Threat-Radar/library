conventions:
  - >-
    Every scalar in this file is a quoted string or a block scalar and there are no flow mappings,
    so bin/_yaml.py and PyYAML read it the same way.
  - >-
    source: verbatim marks an example copied from docs/schema.md. A file under verbatim/blocks/
    holds the bytes between a fenced block's fences, each line with its LF; a file under
    verbatim/inline/ holds one example written inside a sentence, plus one LF that is not part of
    it. source: derived marks a record the library made; its file name carries .derived.
  - >-
    Locators give the heading path in docs/schema.md and 1-based line numbers: of the quoted text,
    of an inline example, or of a block's content (fence gives the fence lines and info string). The
    section sign starts every locator.
  - >-
    rules quotes every statement a fixture cites, verbatim, with line breaks inside a paragraph
    collapsed to single spaces; the runner checks each quote and locator against the source.
    requirements on each rule holds the requirements.yaml ids (osv-schema#R-NNNN) whose text
    the rule quotes, filled in pass 3 (cross-check); requirements_note says why a rule has none.
  - >-
    expected is worked out by hand from the prose of docs/schema.md, never from the JSON Schema.
    result is valid, invalid or unspecified (the text does not decide; readings give the
    alternatives). Informal shape blocks, the id regular expression and the evaluation pseudocode
    have the results shape, rule and algorithm.
  - >-
    A cited statement carries a basis: must (a must, must not, required, 'only ... is allowed' or
    'is invalid' statement), definition (a statement that defines the field without a modal verb,
    such as 'is a JSON array'), or inference (a conclusion drawn from one or more statements; each
    is a judgement call for review). breaks_should lists should or recommended statements a record
    does not follow; satisfies lists what a fixture exercises; context lists statements that explain
    a verdict without being broken by the fixture.
  - >-
    Derived records differ from the fixture named in derived_from only at or below the JSON Pointers
    (RFC 6901) in mutations; embeds names a source example whose values sit at a pointer, after any
    trailing comma is removed. Made-up names keep them from being mistaken for real advisories: ids
    use the local x_ prefix, the package is osv-fixture, URLs use example.com, and commit hashes are
    runs of one digit.
  - >-
    actual is tool output and comparison is computed from it; run-fixtures.derived.py recomputes
    both and fails on any difference, so neither is edited by hand. jsonschema runs the Draft
    2020-12 validator twice: without a format checker (its default, where format is an annotation)
    and with Draft202012Validator.FORMAT_CHECKER (date-time through rfc3339-validator, uri through
    rfc3987). Schema paths are as jsonschema reports them: a $ref hop is not shown, so
    /properties/id/pattern is the pattern of /$defs/prefix.
  - >-
    Value examples (ids, ecosystem strings, names, versions, CVSS vectors, event objects) are
    validated against the subschema in validate_as; compose and severity_type say how the instance
    was built from the example. prose_id_regex applies the id regular expression from
    verbatim/blocks/L0156-character-set-constraints.txt with Python re.fullmatch.
  - >-
    evaluation probes are versions with the affected verdict the quoted meaning gives, ordered by
    SemVer 2.0.0 precedence; actual.evaluation comes from the runner's literal transcription of
    IncludedInRanges and BeforeLimits (verbatim/blocks/L1247-evaluation.txt).
  - >-
    ecma262_check runs one schema pattern on one instance value with Node's RegExp, without and with
    the u flag, because JSON Schema 2020-12 specifies ECMA-262 regular expressions while jsonschema
    uses Python re.search.
  - >-
    finding names entries in findings: places where the JSON Schema, or jsonschema and its format
    libraries, disagree with the prose. Every fixture on which a tool differs from expected names
    one. source_issues lists inconsistencies inside the source itself.
  - >-
    breaks (pass 3), beside each rule in violates, names the requirements.yaml ids whose
    constraint the fixture's one change breaks: the ids of that rule, and the entry taken from
    validation/schema.json that states the same constraint when the JSON Schema, read as JSON
    Schema 2020-12 specifies (ECMA-262 patterns, format an annotation), rejects the same change. A
    GAP fixture's breaks holds prose ids only, because the JSON Schema accepts it; breaks_note
    explains a list that needs it. readings and breaks_should carry no breaks.
  - >-
    The text recommends a purl in every package (rule purl-recommended, R-0079: "This field is
    optional but recommended."). The base record has none, so every derived record whose affected
    entries have a package breaks that recommendation, except POS-20, GAP-30 and GAP-31, which give
    a purl; breaks_should does not repeat it there. The nine complete source examples, none of which
    has a purl, list it.
rules:
  - id: 'utf8'
    locator: '§ Format Overview / L40-41'
    text: |-
      All strings contain UTF-8 text.
    requirements:
      - 'osv-schema#R-0002'
  - id: 'json-only'
    locator: '§ Format Overview / L105-107'
    text: |-
      For serving, only the JSON encoding format is allowed, not a transliteration into any other encoding.
    requirements:
      - 'osv-schema#R-0004'
  - id: 'customizations'
    locator: '§ Format Overview / L109-111'
    text: |-
      Overall, the approach of this schema is to define only the fields that absolutely must be shared between databases, leaving customizations to the "ecosystem_specific" and "database_specific" blocks (see below)
    requirements: []
    requirements_note: 'No requirement entry: design rationale. requirements.yaml excludes its must (keyword_accounting, L110) and quotes the sentence in the notes of R-0004 (normative.md N-0009).'
  - id: 'schema-version-format'
    locator: '§ Field Details > schema_version field / L126-128'
    text: |-
      The value should be a string matching the OSV Schema version, which follows the [SemVer 2.0.0](https://semver.org) format, with no leading "v" prefix.
    requirements:
      - 'osv-schema#R-0006'
  - id: 'schema-version-default'
    locator: '§ Field Details > schema_version field / L128-129'
    text: |-
      If no value is specified, it should be assumed to be `1.0.0`, matching version 1.0 of the OSV Schema.
    requirements:
      - 'osv-schema#R-0007'
  - id: 'ignore-unexpected'
    locator: '§ Field Details > schema_version field / L129-132'
    text: |-
      Clients can assume that new minor and patch versions of the schema only add new fields, without changing the meaning of old fields, so that a client that knows how to read version 1.2.0 can process data identifying as schema version 1.3.0 by ignoring any unexpected fields.
    requirements:
      - 'osv-schema#R-0008'
  - id: 'id-format'
    locator: '§ Field Details > id, modified fields / L143-145'
    text: |-
      It is a string of the format `<DB>-<ENTRYID>`, where `DB` names the database and `ENTRYID` is in the format used by the database.
    requirements:
      - 'osv-schema#R-0010'
  - id: 'id-local-prefix'
    locator: '§ Field Details > id, modified fields / L148-149'
    text: |-
      The `x_` prefix can be used to denote a local database that isn't aggregated by OSV.dev, allowing external records to be schema-compliant.
    requirements:
      - 'osv-schema#R-0011'
  - id: 'id-charset'
    locator: '§ Field Details > id, modified fields > Character set constraints / L154'
    text: |-
      To ensure maximum compatibility with CLI tools, shell scripts, URL routing, and filesystem storage, the `id` field must strictly use ASCII characters matching the regular expression:
    requirements:
      - 'osv-schema#R-0012'
  - id: 'id-charset-list'
    locator: '§ Field Details > id, modified fields > Character set constraints / L160'
    text: |-
      Only alphanumeric characters (`a-z`, `A-Z`, `0-9`) and `:`, `-`, `_`, and `.` are permitted. Characters outside this set (such as spaces, slashes `/`, backslashes `\`, parentheses, or exclamation marks) are not allowed.
    requirements:
      - 'osv-schema#R-0013'
      - 'osv-schema#R-0014'
  - id: 'id-neutral-scope'
    locator: '§ Field Details > id, modified fields > Semantically neutral ids / L166'
    text: |-
      When establishing new identifier schemes, new IDs **should be semantically neutral**:
    requirements:
      - 'osv-schema#R-0016'
  - id: 'id-neutral'
    locator: '§ Field Details > id, modified fields > Semantically neutral ids / L168'
    text: |-
      IDs must not describe the vulnerability type or weakness (e.g. `SQLI`, `RCE`), package or component name (e.g. `LOG4J`), or severity rating (e.g. `CRITICAL`, `HIGH`).
    requirements:
      - 'osv-schema#R-0017'
  - id: 'id-scoped-prefix'
    locator: '§ Field Details > id, modified fields > Semantically neutral ids / L169'
    text: |-
      IDs should always begin with the correctly scoped database prefix from the defined database prefixes below (or `x_` for local databases), followed (ideally) by a `-` separator (e.g., `OSV-2026-X7Y2`, `GHSA-vp9c-fpxx-744v`).
    requirements:
      - 'osv-schema#R-0018'
  - id: 'prefix-table'
    locator: '§ Field Details > id, modified fields > Defined database prefixes / L174'
    text: |-
      The defined database prefixes and their "home" databases are:
    requirements:
      - 'osv-schema#R-0019'
  - id: 'modified-format'
    locator: '§ Field Details > id, modified fields > modified field / L716-717'
    text: |-
      The `modified` field gives the time the entry was last modified, as an RFC3339-formatted timestamp in UTC (ending in "Z").
    requirements:
      - 'osv-schema#R-0022'
      - 'osv-schema#R-0023'
    requirements_note: 'R-0023 is the inferred entry built on the same sentence (a producer updates modified whenever it changes an entry); fixtures that break this rule break R-0022.'
  - id: 'modified-authority'
    locator: '§ Field Details > id, modified fields > modified field / L717-719'
    text: |-
      Given two different entries claiming to describe the same `id` field, the one with the later modification time is considered authoritative.
    requirements:
      - 'osv-schema#R-0024'
  - id: 'required-fields'
    locator: '§ Field Details > id, modified fields > modified field / L721'
    text: |-
      The `id` and `modified` fields are required.
    requirements:
      - 'osv-schema#R-0025'
  - id: 'schema-version-required'
    locator: '§ Field Details > id, modified fields > modified field / L721-722'
    text: |-
      For schema versions above 1.0.0, the `schema_version` field is also required.
    requirements:
      - 'osv-schema#R-0026'
  - id: 'optional-fields'
    locator: '§ Field Details > id, modified fields > modified field / L722-723'
    text: |-
      All other fields are optional, although of course an entry with no other metadata is not particularly useful.
    requirements:
      - 'osv-schema#R-0027'
  - id: 'published-format'
    locator: '§ Field Details > published field / L734-735'
    text: |-
      The `published` field gives the time the entry should be considered to have been published, as an RFC3339-formatted time stamp in UTC (ending in "Z").
    requirements:
      - 'osv-schema#R-0028'
  - id: 'withdrawn-format'
    locator: '§ Field Details > withdrawn field / L745-746'
    text: |-
      The `withdrawn` field gives the time the entry should be considered to have been withdrawn, as an RFC3339-formatted timestamp in UTC (ending in "Z").
    requirements:
      - 'osv-schema#R-0029'
  - id: 'aliases-form'
    locator: '§ Field Details > aliases field / L758-759'
    text: |-
      The `aliases` field gives a list of IDs of the same vulnerability in other databases, in the form of the `id` field.
    requirements:
      - 'osv-schema#R-0032'
  - id: 'upstream-list'
    locator: '§ Field Details > upstream field / L788-789'
    text: |-
      The `upstream` field gives a list of IDs of upstream vulnerabilities that are referred to by the vulnerability entry.
    requirements:
      - 'osv-schema#R-0038'
  - id: 'upstream-asymmetric'
    locator: '§ Field Details > upstream field / L797'
    text: |-
      At the same time, if B is an upstream vulnerability for A, then A cannot be an upstream vulnerability for B.
    requirements:
      - 'osv-schema#R-0040'
  - id: 'related-list'
    locator: '§ Field Details > related field / L807-808'
    text: |-
      The `related` field gives a list of IDs of closely related vulnerabilities, such as:
    requirements:
      - 'osv-schema#R-0041'
  - id: 'summary-one-line'
    locator: '§ Field Details > summary, details fields / L823-824'
    text: |-
      The `summary` field gives a one-line, English textual summary of the vulnerability.
    requirements:
      - 'osv-schema#R-0043'
  - id: 'summary-length'
    locator: '§ Field Details > summary, details fields / L824-825'
    text: |-
      It is recommended that this field be kept short, on the order of no more than 120 characters.
    requirements:
      - 'osv-schema#R-0044'
  - id: 'severity-array'
    locator: '§ Field Details > severity field / L851-852'
    text: |-
      The `severity` field is a JSON array that allows generating systems to describe the severity of a vulnerability using one or more quantitative scoring methods.
    requirements:
      - 'osv-schema#R-0050'
  - id: 'severity-item'
    locator: '§ Field Details > severity field / L853-854'
    text: |-
      Each `severity` item is a JSON object specifying a `type` and `score` property, as well as an optional `source` property, described below.
    requirements:
      - 'osv-schema#R-0051'
  - id: 'severity-type'
    locator: '§ Field Details > severity field > severity[].type field / L858-859'
    text: |-
      The `severity[].type` property must be one of the types defined below, which describes the quantitative method used to calculate the associated `score`.
    requirements:
      - 'osv-schema#R-0052'
  - id: 'cvss-v2'
    locator: '§ Field Details > severity field > severity[].type field / L863'
    text: |-
      A CVSS vector string representing the unique characteristics and severity of the vulnerability using a version of the [Common Vulnerability Scoring System notation](https://www.first.org/cvss/v2/guide#Metric-Groups) that is == 2.0
    requirements:
      - 'osv-schema#R-0053'
  - id: 'cvss-v3'
    locator: '§ Field Details > severity field > severity[].type field / L864'
    text: |-
      A CVSS vector string representing the unique characteristics and severity of the vulnerability using a version of the [Common Vulnerability Scoring System notation](https://www.first.org/cvss/v3.0/specification-document#Vector-String) that is >= 3.0 and < 4.0
    requirements:
      - 'osv-schema#R-0054'
  - id: 'ubuntu-severity'
    locator: '§ Field Details > severity field > severity[].type field / L866'
    text: |-
      A lowercased string representing the [Ubuntu priority](https://ubuntu.com/security/cves/about#priority).
    requirements:
      - 'osv-schema#R-0056'
  - id: 'severity-score'
    locator: '§ Field Details > severity field > severity[].score field / L871-872'
    text: |-
      The `severity[].score` property is a string representing the severity score based on the selected `severity[].type`, as described above.
    requirements:
      - 'osv-schema#R-0057'
  - id: 'severity-source'
    locator: '§ Field Details > severity field > severity[].source field / L876-877'
    text: |-
      The `severity[].source` property is an optional string indicating the origin of the severity assessment.
    requirements:
      - 'osv-schema#R-0058'
  - id: 'affected-array'
    locator: '§ Field Details > affected fields / L920-921'
    text: |-
      The `affected` field is a JSON array containing objects that describes the affected package versions, meaning those that contain the vulnerability.
    requirements:
      - 'osv-schema#R-0063'
  - id: 'one-entry-per-package'
    locator: '§ Field Details > affected fields / L924-926'
    text: |-
      In most cases, there should be exactly one entry in the `affected` array per affected `package` to describe all affected versions.
    requirements:
      - 'osv-schema#R-0065'
  - id: 'affected-or'
    locator: '§ Field Details > affected fields / L933-934'
    text: |-
      **A version is considered affected if it lies within any one of the ranges or is listed in the versions list.**
    requirements:
      - 'osv-schema#R-0068'
  - id: 'versions-recommended'
    locator: '§ Field Details > affected fields / L937-939'
    text: |-
      The `versions` list is generally recommended to always be present, to allow software to easily answer the question "is this specific version affected?" without having to contain code specific to every different ecosystem.
    requirements:
      - 'osv-schema#R-0069'
  - id: 'package-fields'
    locator: '§ Field Details > affected fields > affected[].package field / L951-952'
    text: |-
      The object itself has two required fields, `ecosystem` and `name`, and an optional `purl` field.
    requirements:
      - 'osv-schema#R-0073'
  - id: 'ecosystem-table'
    locator: '§ Field Details > affected fields > affected[].package field / L954-955'
    text: |-
      It must be one of the strings in the table below.
    requirements:
      - 'osv-schema#R-0074'
  - id: 'package-both'
    locator: '§ Field Details > affected fields > affected[].package field / L956-957'
    text: |-
      The two fields must both be present, because the `ecosystem` serves to define the interpretation of the `name`.
    requirements:
      - 'osv-schema#R-0076'
  - id: 'wildcard-name'
    locator: '§ Field Details > affected fields > affected[].package field / L959-960'
    text: |-
      Use the wildcard package name `*` to indicate that an advisory affects all packages within the specified `ecosystem`.
    requirements:
      - 'osv-schema#R-0077'
  - id: 'purl-format'
    locator: '§ Field Details > affected fields > affected[].package field / L964-966'
    text: |-
      The `purl` field is a string following the [Package URL specification](https://github.com/package-url/purl-spec) that identifies the package, without the `@version` component.
    requirements:
      - 'osv-schema#R-0078'
  - id: 'purl-recommended'
    locator: '§ Field Details > affected fields > affected[].package field / L967'
    text: |-
      This field is optional but recommended.
    requirements:
      - 'osv-schema#R-0079'
    requirements_note: 'Added in pass 3 (cross-check), for the breaks_should of the nine complete source examples; see conventions.'
  - id: 'alpine-suffix'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L992'
    text: |-
      The ecosystem string must have a `:v<RELEASE-NUMBER>` suffix to scope the package to a particular Alpine release branch (the `v` prefix is required).
    requirements:
      - 'osv-schema#R-0085'
  - id: 'android-kernel-name'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L993'
    text: |-
      One exception is when the project contains the Linux kernel source code, in which case `name` field will be `:linux_kernel:`, followed by an optional SoC vendor name e.g. `:linux_kernel:Qualcomm`.
    requirements:
      - 'osv-schema#R-0087'
  - id: 'echo-values'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1005'
    text: |-
      The supported values are `Echo:PyPI`, `Echo:Maven`, `Echo:npm` and `Echo:NuGet`.
    requirements:
      - 'osv-schema#R-0099'
  - id: 'freebsd-versions'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1006'
    text: |-
      The `ranges[].events` versions correspond to specific FreeBSD releases, such as 'FreeBSD:base:14.3'.
    requirements:
      - 'osv-schema#R-0102'
  - id: 'linux-name'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1015'
    text: |-
      The only supported `name` is `Kernel`.
    requirements:
      - 'osv-schema#R-0111'
  - id: 'mageia-suffix'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1016'
    text: |-
      The ecosystem string must have a `:<RELEASE-NUMBER>` suffix to scope the package to a particular Mageia release.
    requirements:
      - 'osv-schema#R-0113'
  - id: 'maven-name'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1017'
    text: |-
      The `name` field is a Maven package name in the format `groupId:artifactId`.
    requirements:
      - 'osv-schema#R-0114'
  - id: 'maven-suffix'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1017'
    text: |-
      The ecosystem string might optionally have a `:<REMOTE-REPO-URL>` suffix to denote the remote repository URL that best represents the source of truth for this package, without a trailing slash (e.g. `Maven:https://maven.google.com`).
    requirements:
      - 'osv-schema#R-0114'
  - id: 'npm-row'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1019'
    text: |-
      The NPM ecosystem; the `name` field is an NPM package name.
    requirements:
      - 'osv-schema#R-0116'
  - id: 'openeuler-suffix'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1022'
    text: |-
      The ecosystem string has a `<RELEASE>` suffix, specifying a particular openEuler LTS Release.
    requirements:
      - 'osv-schema#R-0119'
  - id: 'photon-suffix'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1026'
    text: |-
      The ecosystem string must have a `:<RELEASE-NUMBER>` suffix to scope the package to a particular Photon OS release.
    requirements:
      - 'osv-schema#R-0124'
  - id: 'redhat-cpe'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1029'
    text: |-
      `<CPE>` is a translation of a Red Hat [Common Platform Enumerations](https://cpe.mitre.org/) (CPE) with the `cpe/:[oa]:(redhat):` prefix removed (for example, `Red Hat:rhel_aus:8.4::appstream` translates to `cpe:/a:redhat:rhel_aus:8.4::appstream`).
    requirements:
      - 'osv-schema#R-0127'
  - id: 'lightwell-suffix'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1030'
    text: |-
      The ecosystem **must** have a suffix matching an existing OSV ecosystem (e.g. `Red Hat Lightwell:Maven`) to denote what ecosystem the advisory is describing.
    requirements:
      - 'osv-schema#R-0128'
  - id: 'lightwell-name'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1030'
    text: |-
      The `name` field uses the naming convention of the package's native ecosystem.
    requirements:
      - 'osv-schema#R-0129'
  - id: 'ubuntu-lts'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1037'
    text: |-
      `<RELEASE>` is a numeric ("YY.MM") version as specified in [Ubuntu Releases](https://wiki.ubuntu.com/Releases), with a mandatory `:LTS` suffix if the release is marked as LTS.
    requirements:
      - 'osv-schema#R-0137'
  - id: 'ubuntu-example'
    locator: '§ Field Details > affected fields > affected[].package field > Defined ecosystems / L1037'
    text: |-
      For example, the ecosystem string "Ubuntu:22.04:LTS" refers to Ubuntu 22.04 LTS (jammy), while "Ubuntu:Pro:18.04:LTS" refers to fixes that landed in Ubuntu 18.04 LTS (bionic) under Ubuntu Pro/ESM.
    requirements:
      - 'osv-schema#R-0138'
  - id: 'separate-entries'
    locator: '§ Field Details > affected fields > Depicting multiple ecosystems in the same record > Separating Git and Strict Ecosystems / L1056'
    text: |-
      When providing vulnerability information for both a strict packaging ecosystem (such as `npm`, `PyPI`, or `Go`) and Git-level details (such as commit hashes), it is recommended to use separate entries in the `affected` array.
    requirements:
      - 'osv-schema#R-0145'
  - id: 'git-entry'
    locator: '§ Field Details > affected fields > Depicting multiple ecosystems in the same record > Separating Git and Strict Ecosystems / L1059'
    text: |-
      **Git Entry**: This entry should use **no** `package` field. It should use the `GIT` range type in the `ranges` field to specify affected commit ranges.
    requirements:
      - 'osv-schema#R-0148'
      - 'osv-schema#R-0149'
  - id: 'git-ecosystem-versions'
    locator: '§ Field Details > affected fields > Depicting multiple ecosystems in the same record > Version Enumeration for Git Entries / L1065'
    text: |-
      For entries using `GIT` "ecosystem", the `versions` field is typically populated with enumerated versions (tags) derived from the Git repository specified in `ranges[].repo`.
    requirements:
      - 'osv-schema#R-0150'
    requirements_note: 'R-0150 is informative: it binds no one.'
  - id: 'package-severity'
    locator: '§ Field Details > affected fields > affected[].severity field / L1071-1073'
    text: |-
      If any package level `severity` fields are set, the top level [`severity`](#severity-field) must not be set.
    requirements:
      - 'osv-schema#R-0154'
  - id: 'versions-array'
    locator: '§ Field Details > affected fields > affected[].versions field / L1077'
    text: |-
      The `affected` object's `versions` field is a JSON array of strings.
    requirements:
      - 'osv-schema#R-0155'
  - id: 'git-pseudo-ecosystem'
    locator: '§ Field Details > affected fields > affected[].versions field / L1081'
    text: |-
      When using the `GIT` pseudo-ecosystem (either because there is no well-defined packaging ecosystem, or to provide supplementary Git-level details), versions specified in this array typically represent Git tags and cannot be relied upon to conform to any particular package manager's syntax.
    requirements:
      - 'osv-schema#R-0157'
  - id: 'range-type-required'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1092'
    text: |-
      In the `ranges` field, the `type` field is required.
    requirements:
      - 'osv-schema#R-0161'
  - id: 'range-types'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1096'
    text: |-
      The defined types and their additional fields are:
    requirements:
      - 'osv-schema#R-0163'
  - id: 'semver-type'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1098-1099'
    text: |-
      `SEMVER`: The versions `introduced` and `fixed` are semantic versions as defined by [SemVer 2.0.0](https://semver.org), with no leading "v" prefix.
    requirements:
      - 'osv-schema#R-0164'
  - id: 'semver-precedence'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1099-1100'
    text: |-
      The relation `u < v` denotes the precedence order defined in [section 11 of SemVer 2.0](https://semver.org/#spec-item-11).
    requirements:
      - 'osv-schema#R-0165'
  - id: 'semver-no-overlap'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1101-1102'
    text: |-
      Ranges listed with type `SEMVER` should not overlap: since SEMVER is a strict linear ordering, it is always possible to simplify to non-overlapping ranges.
    requirements:
      - 'osv-schema#R-0166'
  - id: 'semver-versions-optional'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1104-1105'
    text: |-
      Specifying one or more `SEMVER` ranges removes the requirement to specify an explicit enumerated `versions` list (see the discussion above).
    requirements:
      - 'osv-schema#R-0167'
  - id: 'ecosystem-type'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1110-1112'
    text: |-
      `ECOSYSTEM`: The versions `introduced` and `fixed` are arbitrary, uninterpreted strings specific to the package ecosystem, which does not conform to SemVer 2.0’s version ordering.
    requirements:
      - 'osv-schema#R-0169'
  - id: 'ecosystem-versions-recommended'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1114-1118'
    text: |-
      It is recommended that you provide an explicitly enumerated `versions` list when specifying one or more `ECOSYSTEM` ranges, because `ECOSYSTEM` range inclusion queries may not be able to be answered without reference to the package ecosystem’s own logic and therefore may not be able to be used by ecosystem-independent processors.
    requirements:
      - 'osv-schema#R-0170'
  - id: 'git-type'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1122-1123'
    text: |-
      `GIT`: The versions `introduced` and `fixed` are full-length Git commit hashes.
    requirements:
      - 'osv-schema#R-0171'
  - id: 'git-versions-requirement'
    locator: '§ Field Details > affected fields > affected[].ranges[].type field / L1127-1129'
    text: |-
      Specifying one or more `GIT` ranges does NOT remove the requirement to specify an explicitly enumerated `versions` list, because `GIT` range inclusion queries cannot be answered without access to a copy of the underlying Git repository.
    requirements:
      - 'osv-schema#R-0173'
  - id: 'events-array'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields / L1133'
    text: |-
      The `ranges` object's `events` field is a JSON array of objects.
    requirements:
      - 'osv-schema#R-0174'
  - id: 'event-single-version'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields / L1133-1134'
    text: |-
      Each object describes a single version that either:
    requirements:
      - 'osv-schema#R-0174'
  - id: 'event-values'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields / L1143-1144'
    text: |-
      The values of `introduced`, `fixed`, `last_affected` and `limit` are version strings as defined by the `affected[].ranges[].type` field.
    requirements:
      - 'osv-schema#R-0175'
  - id: 'introduced-zero'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields > Special values / L1151-1152'
    text: |-
      `introduced` allows a version of the value `"0"` to represent a version that sorts before any other version.
    requirements:
      - 'osv-schema#R-0177'
  - id: 'limit-star'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields > Special values / L1153-1155'
    text: |-
      `limit` allows versions containing the string `"*"` to represent "infinity". If no limit events are provided, an implicit `{ "limit": "*" }` is assumed to exist. Multiple `limit` events are allowed in the same range.
    requirements:
      - 'osv-schema#R-0178'
      - 'osv-schema#R-0179'
      - 'osv-schema#R-0180'
  - id: 'single-type-event'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields > Requirements / L1159-1161'
    text: |-
      Only **a single type** (either `introduced`, `fixed`, `last_affected`, `limit`) is allowed in each event object. For instance, `{"introduced": "1.0.0", "fixed": "1.0.2"}` is **invalid**.
    requirements:
      - 'osv-schema#R-0181'
  - id: 'fixed-xor-last-affected'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields > Requirements / L1163-1164'
    text: |-
      Entries in the `events` array may be "last_affected" or "fixed" events, but not both.
    requirements:
      - 'osv-schema#R-0182'
  - id: 'prefer-fixed'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields > Requirements / L1164-1166'
    text: |-
      It's **strongly recommended** to use `fixed` instead of `last_affected` where possible, as it precisely identifies the version which contains the fix.
    requirements:
      - 'osv-schema#R-0183'
  - id: 'introduced-required'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields > Requirements / L1182'
    text: |-
      There must be at least one `introduced` object in the `events` array.
    requirements:
      - 'osv-schema#R-0189'
  - id: 'events-sorted'
    locator: '§ Field Details > affected fields > affected[].ranges[].events fields > Requirements / L1182-1184'
    text: |-
      While not required, it's also recommended to keep the `events` array sorted according to the `affected[].ranges[].type` of the range.
    requirements:
      - 'osv-schema#R-0190'
  - id: 'repo-format'
    locator: '§ Field Details > affected fields > affected[].ranges[].repo field / L1191-1192'
    text: |-
      The value should be in a format that's directly usable as an argument for the version control system's clone command (e.g. `git clone`).
    requirements:
      - 'osv-schema#R-0192'
  - id: 'repo-required'
    locator: '§ Field Details > affected fields > affected[].ranges[].repo field / L1198'
    text: |-
      This field is required if `affected[].ranges[].type` is `GIT`.
    requirements:
      - 'osv-schema#R-0194'
  - id: 'ecosystem-specific-object'
    locator: '§ Field Details > affected fields > affected[].ecosystem_specific field / L1213-1215'
    text: |-
      The `affected` object's `ecosystem_specific` field is a JSON object holding additional information about the vulnerability as defined by the ecosystem for which the record applies.
    requirements:
      - 'osv-schema#R-0198'
  - id: 'evaluation-algorithm'
    locator: '§ Field Details > affected fields > Evaluation / L1244-1245'
    text: |-
      The algorithm to evaluate if a package `pkg` at version `v` is vulnerable is given by the `IsVulnerable` function in the pseudocode below:
    requirements:
      - 'osv-schema#R-0201'
  - id: 'meaning-unfixed'
    locator: '§ Field Details > affected fields > Examples > Unfixed vulnerability example / L1296'
    text: |-
      The following expresses that "every possible version is affected".
    requirements: []
    requirements_note: 'No requirement entry: narration of a ranges example, which requirements.yaml does not extract (its note, NOT EXTRACTED); the stated result follows from the evaluation pseudocode (R-0201) applied to the example.'
  - id: 'meaning-fixed'
    locator: '§ Field Details > affected fields > Examples > Fixed vulnerability example / L1308'
    text: |-
      The following expresses that "everything before `1.0.2`" is affected.
    requirements: []
    requirements_note: 'No requirement entry: narration of a ranges example, which requirements.yaml does not extract (its note, NOT EXTRACTED); the stated result follows from the evaluation pseudocode (R-0201) applied to the example.'
  - id: 'meaning-multiple'
    locator: '§ Field Details > affected fields > Examples > Multiple range example / L1321-1322'
    text: |-
      The following expresses that versions in the SemVer ranges `[1.0.0, 1.0.2)` or `[3.0.0, 3.2.5)` are affected. Everything else is unaffected.
    requirements: []
    requirements_note: 'No requirement entry: narration of a ranges example, which requirements.yaml does not extract (its note, NOT EXTRACTED); the stated result follows from the evaluation pseudocode (R-0201) applied to the example.'
  - id: 'limit-not-linear'
    locator: '§ Field Details > affected fields > Examples > Limit events / L1337-1338'
    text: |-
      `limit` events are typically not necessary for describing numbered (linear) version ranges and should not be used.
    requirements:
      - 'osv-schema#R-0202'
  - id: 'meaning-git-fixed'
    locator: '§ Field Details > affected fields > Examples > Limit events / L1355-1356'
    text: |-
      Without an explicit `limit`, the list of computed affected commits will be `X, A, B, C, D, E, F`.
    requirements: []
    requirements_note: 'No requirement entry: narration of a ranges example, which requirements.yaml does not extract (its note, NOT EXTRACTED); the stated result follows from the evaluation pseudocode (R-0201) applied to the example.'
  - id: 'meaning-git-limit'
    locator: '§ Field Details > affected fields > Examples > Limit events / L1369-1370'
    text: |-
      If `limit` is set to `Y`, the list of affected commits will be `X, A, B, C`. This is equivalent to `git rev-list X..Y` (but including `X` and excluding `Y`).
    requirements: []
    requirements_note: 'No requirement entry: narration of a ranges example, which requirements.yaml does not extract (its note, NOT EXTRACTED); the stated result follows from the evaluation pseudocode (R-0201) applied to the example.'
  - id: 'meaning-last-affected'
    locator: '§ Field Details > affected fields > Examples > `last_affected` vs `fixed` example / L1381-1384'
    text: |-
      The following example expresses that the vulnerability is present in all versions of the package, up to and including version `2.1.214`. Versions above `2.1.214` are assumed to be free from the vulnerability, but there is a potential for a false negative.
    requirements: []
    requirements_note: 'No requirement entry: narration of a ranges example, which requirements.yaml does not extract (its note, NOT EXTRACTED); the stated result follows from the evaluation pseudocode (R-0201) applied to the example.'
  - id: 'looks-similar'
    locator: '§ Field Details > affected fields > Examples > `last_affected` vs `fixed` example / L1397'
    text: |-
      The following example looks similar, but there are differences in how it is interpreted.
    requirements: []
    requirements_note: 'No requirement entry: narration that introduces the second last_affected vs fixed example, which requirements.yaml does not extract (source issue S-02).'
  - id: 'meaning-fixed-2'
    locator: '§ Field Details > affected fields > Examples > `last_affected` vs `fixed` example / L1398-1401'
    text: |-
      The vulnerability is present in all versions of the package up to version `2.1.214`. In this case `2.1.214` is not vulnerable. Versions `2.1.214` and above do not include the vulnerability and there isn't the possibility for false negatives that we see in the `last_affected` case.
    requirements: []
    requirements_note: 'No requirement entry: narration of a ranges example, which requirements.yaml does not extract (its note, NOT EXTRACTED); the stated result follows from the evaluation pseudocode (R-0201) applied to the example.'
  - id: 'references-list'
    locator: '§ Field Details > references field / L1427'
    text: |-
      The `references` field contains a list of JSON objects describing references.
    requirements:
      - 'osv-schema#R-0205'
  - id: 'references-fields'
    locator: '§ Field Details > references field / L1428-1429'
    text: |-
      Each object has a string field `type` specifying the type of reference, and a string field `url`.
    requirements:
      - 'osv-schema#R-0206'
  - id: 'reference-url'
    locator: '§ Field Details > references field / L1429-1431'
    text: |-
      The `url` is the fully-qualified URL (including the scheme, typically "https://") linking to additional information, advisories, issue tracker entries, and so on about the vulnerability itself.
    requirements:
      - 'osv-schema#R-0207'
  - id: 'reference-types'
    locator: '§ Field Details > references field / L1434'
    text: |-
      The known reference `type` values are:
    requirements:
      - 'osv-schema#R-0209'
  - id: 'credits-name'
    locator: '§ Field Details > credits fields / L1473-1475'
    text: |-
      Each of the objects in the `credits` array must contain at minimum a `name` field specifying the name of the individual or entity being credited, using whatever notation they prefer.
    requirements:
      - 'osv-schema#R-0213'
  - id: 'credits-contact'
    locator: '§ Field Details > credits fields > credits[].contact[] field / L1487-1488'
    text: |-
      Each `credits[].contact[]` entry should be a valid, fully qualified, plain-text URL at which the credited can be reached.
    requirements:
      - 'osv-schema#R-0217'
  - id: 'credits-type'
    locator: '§ Field Details > credits fields > credits[].type field / L1493-1494'
    text: |-
      It must be one of the following defined credit types:
    requirements:
      - 'osv-schema#R-0220'
  - id: 'database-specific-object'
    locator: '§ Field Details > database_specific field / L1529-1531'
    text: |-
      The top-level `database_specific` field is a JSON object holding additional information about the vulnerability as defined by the database from which the record was obtained.
    requirements:
      - 'osv-schema#R-0222'
  - id: 'android-vendors'
    locator: '§ Appendix > Android SoC Vendors / L2001'
    text: |-
      When a package in the `Android` ecosystem is the Linux kernel source code, its `name` will be `:linux_kernel:`, optionally appended with one of the following SoC vendor names indicating applicability of the vulnerability to kernels of that particular vendor:
    requirements:
      - 'osv-schema#R-0224'
