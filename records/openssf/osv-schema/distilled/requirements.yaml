    object: "affected[].package"
    field: "name, ecosystem suffix, ecosystem_specific"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `openEuler`, Description column / L1022"
    text: "The openEuler ecosystem; The `name` field is the name of the source RPM. The ecosystem string has a `<RELEASE>` suffix, specifying a particular openEuler LTS Release.`<RELEASE>` is numeric (YY.MM) version maintained in our [archive list](https://www.openeuler.org/en/download/?archive=true). Here, `LTS` stands for long term support and `SP` stands for service pack which offers extensions and enhancements of the major LTS version. Note innovation versions (those without `LTS`) are out of our security advisories' scope. The `ecosystem_specific` field contains all updated packages, including src rpm and binaries of different architectures. For more information, please refer to our [vulnerability disclosure policy](https://gitee.com/openeuler/security-committee/blob/master/docs/en/vulnerability-management-process/security-disclosure-en.md) and this [example](https://www.openeuler.org/en/security/security-bulletins/detail/?id=openEuler-SA-2025-1612) of a source security advisory."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The release form (YY.MM, LTS releases only) is partly testable; the cell does not show how the
      suffix is joined to 'openEuler' or how LTS and SP appear in it.
    status: "active"
    notes: >-
      Unlike other rows the suffix is written '`<RELEASE>` suffix' without a colon, and a space is
      missing in 'Release.`<RELEASE>`'. Innovation versions (without LTS) are out of scope.
      ecosystem_specific carries all updated packages, source RPMs and binaries. 'our' is openEuler's
      own voice.
