    text: "The `severity` field is an optional element [defined here](#severity-field)."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "The definition it points to is R-0050 to R-0062."
  - id: "osv-schema#R-0153"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "in cases where affected packages have differing severities for the same vulnerability"
    object: "affected[] item"
    field: "severity"
    locator: "§ affected fields > affected[].severity field / L1070-1071"
    text: "This `severity` field applies to a specific package, in cases where affected packages have differing severities for the same vulnerability."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The scope (this item's package only) binds consumers and is testable; 'in cases where ...
      differing severities' is a usage condition that one record cannot prove.
    status: "active"
    notes: "Declarative, verb none."
  - id: "osv-schema#R-0154"
    normativity: "prohibition"
    verb: "must not"
    actor: "record producer"
    condition: "if any affected[].severity is set"
    object: "OSV record"
    field: "severity, affected[].severity"
    locator: "§ affected fields > affected[].severity field / L1071-1073"
    also_at:
      - "validation/schema.json /allOf/0 (L373-392)"
    text: "If any package level `severity` fields are set, the top level [`severity`](#severity-field) must not be set."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      validation/schema.json states the contrapositive: if the top-level severity key is present, every
      affected[].severity is null or absent. Because its condition is the presence of the key, a
      top-level "severity": null also rules out package-level severities, a case the text ('set') leaves
      open.
  - id: "osv-schema#R-0155"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when versions is present"
    object: "affected[] item"
    field: "versions"
    locator: "§ affected fields > affected[].versions field / L1077"
    also_at:
      - "validation/schema.json /properties/affected/items/properties/versions (L279-284)"
    text: "The `affected` object's `versions` field is a JSON array of strings."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Declarative, verb none."
  - id: "osv-schema#R-0156"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when versions is present"
    object: "affected[] item"
    field: "versions"
    locator: "§ affected fields > affected[].versions field / L1077-1079"
    text: "Each string is a single affected version in whatever version syntax is used by the given package ecosystem."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
