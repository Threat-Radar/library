  - id: "osv-schema#R-0136"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when package.ecosystem is Ubuntu (with or without a suffix)"
    object: "affected[].package"
    field: "name, ecosystem suffix"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `Ubuntu`, Description column / L1037"
    text: "The Ubuntu package ecosystem; the `name` field is the name of the source package. The ecosystem string has a `:<RELEASE>` suffix to scope the package to a particular Ubuntu release."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The presence of the suffix is testable; the source package name needs Ubuntu data.
    status: "active"
  - id: "osv-schema#R-0137"
    normativity: "requirement"
    verb: "mandatory"
    actor: "record producer"
    condition: "when package.ecosystem is Ubuntu (with or without a suffix)"
    object: "affected[].package"
    field: "ecosystem suffix"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `Ubuntu`, Description column / L1037"
    text: '`<RELEASE>` is a numeric ("YY.MM") version as specified in [Ubuntu Releases](https://wiki.ubuntu.com/Releases), with a mandatory `:LTS` suffix if the release is marked as LTS.'
    text_kind: "table-cell"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Testable against the Ubuntu release list: YY.MM, and ':LTS' exactly when the release is LTS.
      'mandatory' is not one of the counted forms.
  - id: "osv-schema#R-0138"
    normativity: "permission"
    verb: "may"
    actor: "record producer"
    condition: "when package.ecosystem is Ubuntu (with or without a suffix)"
    object: "affected[].package"
    field: "ecosystem suffix"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `Ubuntu`, Description column / L1037"
    text: 'The release version may also be prefixed with `:Pro:` to denote Ubuntu Pro (aka Expanded Security Maintenance (ESM)) updates. For example, the ecosystem string "Ubuntu:22.04:LTS" refers to Ubuntu 22.04 LTS (jammy), while "Ubuntu:Pro:18.04:LTS" refers to fixes that landed in Ubuntu 18.04 LTS (bionic) under Ubuntu Pro/ESM.'
    text_kind: "table-cell"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Testable: 'Ubuntu:Pro:' followed by the release. The second sentence is the cell's example for
      both this entry and R-0137.
  - id: "osv-schema#R-0139"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when package.ecosystem is vcpkg (with or without a suffix)"
    object: "affected[].package"
    field: "name, ecosystem suffix, versions, purl"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `vcpkg`, Description column / L1038"
    text: "The vcpkg ecosystem for Microsoft's C/C++ package manager; the `name` is the vcpkg port name (e.g. `bzip2`, `ffmpeg`). The ecosystem string has no release suffix. A version is the upstream port version; the integer `port-version` (incremented when the port packaging changes) is carried in the purl `port_version` qualifier. The default registry is [`microsoft/vcpkg`](https://github.com/microsoft/vcpkg); non-default registries are denoted by the purl `repository_url` / `repository_revision` qualifiers."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The absence of a suffix is testable; port names, versions and the purl qualifiers need the
      registry.
    status: "active"
    notes: >-
      Also states: the version is the upstream port version, the integer port-version goes in the purl
      qualifier port_version, and non-default registries are named by the purl qualifiers repository_url
      and repository_revision.
  - id: "osv-schema#R-0140"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when package.ecosystem is VSCode (with or without a suffix)"
    object: "affected[].package"
    field: "name, ecosystem suffix"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `VSCode`, Description column / L1039"
    text: "The Visual Studio Code extensions ecosystem; the `name` is the `<publisher>.<name>` string which uniquely identifies a package. This identifier is composed from the `Publisher` and `Id` attributes of the `Identity` element in the package's `.vsixmanifest` file. It also corresponds to the `itemName` parameter of the package as found on the [Visual Studio Marketplace for VS Code](https://marketplace.visualstudio.com/vscode) extensions page, or the `namespace` and `name` fields of the [OpenVSX](https://open-vsx.org/) API response for the target package. The ecosystem string might optionally have a `:<REMOTE-REPO-URL>` suffix to denote the remote repository URL that best represents the source of truth for this package, without a trailing slash (e.g. `VSCode:https://open-vsx.org`). If this is omitted, this is assumed to be the Visual Studio Marketplace for VSCode (`https://marketplace.visualstudio.com/vscode`)."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The '<publisher>.<name>' form and a ':<REMOTE-REPO-URL>' suffix without a trailing slash are
      testable; existence on the marketplace is not.
    status: "active"
    notes: >-
      Without the suffix the repository is the Visual Studio Marketplace
      (https://marketplace.visualstudio.com/vscode).
  - id: "osv-schema#R-0141"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when package.ecosystem is Wolfi (with or without a suffix)"
    object: "affected[].package"
    field: "name"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `Wolfi`, Description column / L1040"
    text: "The Wolfi package ecosystem; the `name` is the name of the package."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
