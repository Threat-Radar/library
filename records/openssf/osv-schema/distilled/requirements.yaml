  - id: "osv-schema#R-0131"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when package.ecosystem is Root (with or without a suffix)"
    object: "affected[].package"
    field: "name, ecosystem suffix"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `Root`, Description column / L1032"
    text: "The Root container security ecosystem. Root provides patched container images across multiple base distributions. The ecosystem uses hierarchical variants: Root:{BaseDistro}:{Version} for OS packages (e.g., Root:Alpine:3.18, Root:Debian:12) and Root:{PackageManager} for application packages (e.g., Root:PyPI, Root:npm). Package names use Root-specific prefixes (root-{package} for most, @root/{package} for npm)."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The variant forms Root:{BaseDistro}:{Version} and Root:{PackageManager} and the name prefixes
      (root-{package}, @root/{package} for npm) are testable; the sets of distributions and package
      managers are given only by example.
    status: "active"
  - id: "osv-schema#R-0132"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when package.ecosystem is RubyGems (with or without a suffix)"
    object: "affected[].package"
    field: "name"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `RubyGems`, Description column / L1033"
    text: "The RubyGems ecosystem; the `name` field is a gem name."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The name rule needs the ecosystem's own package index or registry to check; the string type is all
      a schema can test.
    status: "active"
  - id: "osv-schema#R-0133"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when package.ecosystem is SUSE (with or without a suffix)"
    object: "affected[].package"
    field: "name, purl, ecosystem suffix, ecosystem_specific, version ordering, range events"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `SUSE`, Description column / L1034"
    text: "The SUSE ecosystem; The ecosystem string has a `:<RELEASE>` suffix representing the marketing name of the SUSE product. `<RELEASE>` matches the value in the /etc/os-release `PRETTY_NAME` field. The `name` field is the name of the source RPM and accompanied by a purl. There is a `ecosystem_specific` specific array `binaries` of the associated RPM binary packages in this specific SUSE product. The ECOSYSTEM version ordering is the RPM versioncompare ordering, and the database uses the `introduced` and `fixed` boundaries."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The ordering (RPM versioncompare) and the use of introduced and fixed only are testable; the
      suffix must match the product's PRETTY_NAME, which needs outside data.
    status: "active"
    notes: >-
      Parallel to the openSUSE row; ecosystem_specific carries an array 'binaries' of the binary RPMs.
  - id: "osv-schema#R-0134"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when package.ecosystem is SwiftURL (with or without a suffix)"
    object: "affected[].package"
    field: "name, versions"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `SwiftURL`, Description column / L1035"
    text: "The Swift Package Manager ecosystem. The `name` is a Git URL to the source of the package. Versions are Git tags that comform to [SemVer 2.0](https://docs.swift.org/package-manager/PackageDescription/PackageDescription.html#version)."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      That name is a Git URL and that versions are SemVer 2.0 tags is testable; that the tags exist
      needs the repository.
    status: "active"
    notes: "Source typo 'comform' (conform)."
  - id: "osv-schema#R-0135"
    normativity: "constraint"
