note: >-
  Ids are stable and never reused; cite as osv-schema#R-NNNN (a bare R-NNNN in notes means the same).
  Entries from docs/schema.md come first, in source order by primary locator; the entries with
  source_file validation/schema.json follow, in file order, and carry that file's own source_digest.
  VERBAL FORMS: the OSV Schema defines no verbal forms and cites neither RFC 2119 nor RFC 8174, and
  writes its rules in lowercase. This file reads them in the usual way: must and required (and
  mandatory) = requirement, must not = prohibition, should and recommended (and encouraged, preferable)
  = recommendation, should not = recommendation (negative), may, optional, allowed, permitted and can =
  permission. `verb` holds the source's own word in lowercase (for example 'must', 'recommended',
  'allowed', 'can'); `verb: none` marks a declarative statement, a table cell or a JSON Schema keyword,
  and `verb: imperative` the one entry whose rule is stated only as an imperative (R-0077); the
  imperative inside the Debian row is noted in R-0097, and the bold imperative lead-ins of R-0017 and
  R-0018 restate the verbal form that follows them. Normativity adds 'constraint' for a statement that
  fixes a testable property without a verbal form (a type, a format, a value set, a meaning that
  consumers apply), and 'informative' for a statement that informs consumers without binding anyone.
  Where the verb and the normativity differ (a 'should' inside a definition, a 'may ... but not both'),
  the entry's notes say why. TEXT: `text` is verbatim from the source, Markdown and HTML markup included
  (backticks, bold and italic markers, link syntax). The only normalization is joining text wrapped
  across lines: a line break and the indentation around it become one space; double spaces inside a line
  are the source's. A bullet's text omits the list marker and a table cell's text omits the pipes. Where
  a lead-in introduces a list, `text` is the lead-in and the items are copied into `enumeration`; a code
  block that a sentence introduces is copied into `code_block` with its line breaks. For a JSON Schema
  entry, `text` is the keyword and its value cut from validation/schema.json, joined by the same rule.
  SPLITTING: no sentence is split. Table cells and bullets that hold several sentences are split at
  sentence boundaries where the sentences carry different verbal forms or are tested separately (the
  ecosystem rows Alpine, Android, FreeBSD, Mageia, Photon OS, Red Hat Lightwell and Ubuntu; the Strict
  Ecosystem Entry and Git Entry bullets). Adjacent sentences are kept together where one only supplies
  the referent or the condition of the other. REPEATS: docs/schema.md repeats no sentence that carries a
  counted form; also_at lists the validation/schema.json keywords that state the same rule as the entry
  (and, for a JSON Schema entry, the same keyword repeated at other pointers). A JSON Schema constraint
  that is absent from the prose, or that differs from it, is an entry of its own (source_file
  validation/schema.json). text_kind: sentence; bullet; table-cell (a verbatim Description or Score
  Description cell); schema-keyword. LOCATORS: '§ heading path / Lnn' with docs/schema.md line numbers
  at v1.9.2 (headings verbatim, 'Field Details' omitted); for validation/schema.json, the JSON Pointer
  with its line range. ACTORS: 'record producer' is whoever writes an OSV record (a database or its
  tooling); validators check the same rules. 'database' marks rules the source puts on the database
  itself (serving, identifier schemes, publishing scope, use of database_specific). 'consumer' covers
  applications and databases that read records (the source's 'consumers', 'Display code' and
  'Programs'); the source's 'Clients' is kept as 'client' in R-0008. Exactly one entry is kind inferred
  (R-0023). Derived fields (normativity, actor, condition, object, field, testable) are judgement and
  need human review; `text`, `enumeration` and `code_block` are verbatim. NOT EXTRACTED: the Purpose
  section, pointers and rationale sentences, the whole-record Examples (L1541-1995) and the narration of
  the range examples, except three sentences there that state rules (R-0202, R-0203, R-0204); the 'How
  to contribute', 'Source URL' and 'OSV Formatted URL' items of the prefix table; and field types that
  the prose states only through the informal schema (messages.yaml carries them). Where an unextracted
  sentence bears on a rule, the entry's notes quote it. Statements in notes about what
  validation/schema.json accepts or rejects were checked with jsonschema 4.26.0 (Draft 2020-12
  validator, default settings, so "format" is not asserted).
