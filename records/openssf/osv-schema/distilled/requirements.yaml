  - id: "osv-schema#R-0201"
    normativity: "constraint"
    verb: "none"
    actor: "consumer"
    condition: "when deciding whether a package pkg at version v is affected by a record"
    object: "OSV record"
    field: "affected[]"
    locator: "§ affected fields > Evaluation / L1244-1292"
    text: "The algorithm to evaluate if a package `pkg` at version `v` is vulnerable is given by the `IsVulnerable` function in the pseudocode below:"
    text_kind: "sentence"
    code_block: |-
      func IsVulnerable(pkg, v, osv)
        for affected in osv.affected
          if affected.package == pkg
            if IncludedInVersions(v, affected.versions) ||
                 IncludedInRanges(v, affected.ranges)
              return true

        return false

      func IncludedInVersions(v, versions)
        for version in versions
          if v == version
            return true

        return false

      func IncludedInRanges(v, ranges)
        for range in ranges
          if BeforeLimits(v, range)
            vulnerable = false
            for evt in sorted(range.events)
              if evt.introduced is present && v >= evt.introduced
                 vulnerable = true
              else if evt.fixed is present && v >= evt.fixed
                 vulnerable = false
              else if evt.last_affected is present && v > evt.last_affected
                 vulnerable = false

            if vulnerable
              return true

        return false

      func BeforeLimits(v, range)
        if no limit events in range.events
          # implicit "*" entry is assumed
          return true

        for evt in range.events
          if evt.limit is present and v < evt.limit
            return true

        return false
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative, verb none; code_block holds the pseudocode verbatim (the fence is labelled python,
      but it is pseudocode). Points a test author needs: (1) packages are compared with
      'affected.package == pkg', so an affected item without package (R-0148) never matches, and the
      wildcard name '*' (R-0077) is not handled; (2) versions are compared by plain equality; (3)
      'sorted(range.events)' needs an order per range type, which for GIT is only partial (R-0172); (4)
      BeforeLimits treats each limit as a cap and returns true below any of them, so several limits
      widen the scope (R-0203); (5) withdrawn and database_specific play no part (R-0197). The range
      examples (L1294-1414) drive it.
