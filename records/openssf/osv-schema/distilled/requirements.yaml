      a schema can test.
    status: "active"
  - id: "osv-schema#R-0142"
    normativity: "permission"
    verb: "may"
    actor: "record producer"
    condition: "when package.ecosystem is WordPress (with or without a suffix)"
    object: "affected[].package"
    field: "name, ecosystem suffix"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `WordPress`, Description column / L1041"
    text: "The WordPress ecosystem. The ecosystem string may have a suffix to specify the component: `:Core` for WordPress Core (the `name` is `wordpress`), `:Plugin` for plugins (the `name` is the plugin slug), or `:Theme` for themes (the `name` is the theme slug). The slug is the unique identifier used in the WordPress.org repository."
    text_kind: "table-cell"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Testable: the suffix is one of ':Core', ':Plugin' or ':Theme', and with ':Core' the name is
      'wordpress'. The first sentence ('The WordPress ecosystem.') is descriptive. What name holds
      without a suffix is not stated.
  - id: "osv-schema#R-0143"
    normativity: "permission"
    verb: "permitted"
    actor: "database"
    condition: "provided the database and the ecosystem have the same owner"
    object: "OSV record"
    field: "id prefix, affected[].package.ecosystem"
    locator: "§ affected fields > affected[].package field > Defined ecosystems / L1046-1048"
    text: "It is permitted for a database name (the DB prefix in the `id` field) and an ecosystem name to be the same, provided they have the same owner who can make decisions about the meaning of the `ecosystem_specific` field (see below)."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "Ownership is not visible in records."
    status: "active"
  - id: "osv-schema#R-0144"
    normativity: "permission"
    verb: "can"
    actor: "record producer"
    condition: "when a vulnerability affects packages in several ecosystems"
    object: "affected[]"
    field: "package.ecosystem"
    locator: "§ affected fields > Depicting multiple ecosystems in the same record / L1052"
    text: "An OSV record can describe a vulnerability affecting multiple ecosystems. This is done by including multiple objects in the `affected` array, each specifying a different `package.ecosystem`."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Two adjacent sentences: the permission and how it is done. Testable: a record whose affected items
      name different ecosystems validates and is evaluated item by item.
  - id: "osv-schema#R-0145"
    normativity: "recommendation"
    verb: "recommended"
    actor: "record producer"
    condition: "when providing information for both a strict packaging ecosystem and Git-level details"
    object: "affected[]"
    field: "(entries)"
    locator: "§ affected fields > Depicting multiple ecosystems in the same record > Separating Git and Strict Ecosystems / L1056"
    text: "When providing vulnerability information for both a strict packaging ecosystem (such as `npm`, `PyPI`, or `Go`) and Git-level details (such as commit hashes), it is recommended to use separate entries in the `affected` array."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Testable: no affected item mixes a strict-ecosystem package with GIT ranges. Restated at L1083
      (R-0159). The closing sentence of the subsection ('This separation ensures that tools relying on
      strict version parsing ... do not get confused ...') is rationale and is not extracted.
  - id: "osv-schema#R-0146"
    normativity: "recommendation"
    verb: "should"
    actor: "record producer"
    condition: "for the strict-ecosystem entry when Git and strict information are separated"
    object: "affected[] item"
    field: "package.ecosystem"
    locator: "§ affected fields > Depicting multiple ecosystems in the same record > Separating Git and Strict Ecosystems / L1058"
    text: '**Strict Ecosystem Entry**: This entry should use the specific ecosystem name (e.g., `"ecosystem": "npm"`).'
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "First sentence of the bullet, with its bold lead-in."
  - id: "osv-schema#R-0147"
    normativity: "recommendation"
    verb: "should"
    actor: "record producer"
    condition: "for the strict-ecosystem entry when Git and strict information are separated"
    object: "affected[] item"
    field: "versions, ranges"
    locator: "§ affected fields > Depicting multiple ecosystems in the same record > Separating Git and Strict Ecosystems / L1058"
    text: "It should list affected versions in the `versions` field or use `ECOSYSTEM` or `SEMVER` range types in the `ranges` field."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Second sentence of the Strict Ecosystem Entry bullet; testable as no GIT range in that entry.
  - id: "osv-schema#R-0148"
    normativity: "recommendation"
    verb: "should"
    actor: "record producer"
    condition: "for the Git entry when Git and strict information are separated"
    object: "affected[] item"
    field: "package"
    locator: "§ affected fields > Depicting multiple ecosystems in the same record > Separating Git and Strict Ecosystems / L1059"
    text: "**Git Entry**: This entry should use **no** `package` field."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      First sentence of the bullet, with its bold lead-in. Tension with other parts of the source: the
      Evaluation pseudocode matches affected items by 'affected.package == pkg' (R-0201), so an item
      without package never matches a package query; L1065 speaks of entries 'using `GIT` "ecosystem"'
      (R-0150); validation/schema.json accepts GIT as an ecosystem value (R-0229). How a consumer finds
      a package-less Git entry (by repo URL) is not stated.
  - id: "osv-schema#R-0149"
    normativity: "recommendation"
    verb: "should"
    actor: "record producer"
    condition: "for the Git entry when Git and strict information are separated"
    object: "affected[] item"
    field: "ranges"
    locator: "§ affected fields > Depicting multiple ecosystems in the same record > Separating Git and Strict Ecosystems / L1059"
    text: "It should use the `GIT` range type in the `ranges` field to specify affected commit ranges."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Second sentence of the Git Entry bullet."
  - id: "osv-schema#R-0150"
    normativity: "informative"
    verb: "none"
    actor: "consumer"
    condition: "for entries that use the GIT pseudo-ecosystem"
    object: "affected[] item"
    field: "versions"
    locator: "§ affected fields > Depicting multiple ecosystems in the same record > Version Enumeration for Git Entries / L1065"
    text: 'For entries using `GIT` "ecosystem", the `versions` field is typically populated with enumerated versions (tags) derived from the Git repository specified in `ranges[].repo`.'
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "Describes typical content ('typically'); not a rule."
    status: "active"
    notes: >-
      Informative. 'entries using `GIT` "ecosystem"' implies package.ecosystem GIT, while R-0148 asks Git
      entries to leave package out; validation/schema.json accepts GIT as an ecosystem (R-0229). The
      next sentence (OSV infrastructure such as osv.dev can enumerate the tags during ingestion)
      describes osv.dev and is not extracted.
  - id: "osv-schema#R-0151"
    normativity: "informative"
    verb: "none"
    actor: "consumer"
    condition: "when Git-level and strict-ecosystem data share one affected item"
    object: "affected[] item"
    field: "versions"
    locator: "§ affected fields > Depicting multiple ecosystems in the same record > Version Enumeration for Git Entries / L1065"
    text: "If in the same affected field as a strict ecosystem, versions from both the Git repository and the strict ecosystem will appear in the `versions` array."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "Describes what consumers will meet; not a rule on a single actor."
    status: "active"
    notes: >-
      Informative: a consumer has to expect mixed version syntaxes in one versions array when a producer
      does not follow R-0145.
  - id: "osv-schema#R-0152"
    normativity: "permission"
    verb: "optional"
    actor: "record producer"
    condition: "unconditional"
    object: "affected[] item"
    field: "severity"
    locator: "§ affected fields > affected[].severity field / L1069"
    also_at:
