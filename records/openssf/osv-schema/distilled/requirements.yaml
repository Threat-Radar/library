      The example 'Debian:7' (wheezy) is part of the cell. The last sentence is an imperative ('use the
      the string in the `series` column ...'): for a release without a numeric version the suffix is the
      series name, for example 'Debian:sid'. It is kept in this constraint rather than split, because it
