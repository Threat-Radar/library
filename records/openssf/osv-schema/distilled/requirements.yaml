reconciliation: >-
  bin/bcp14-count finds 0 BCP 14 keywords in docs/schema.md (v1.9.2, sha256 96d82f03...ebff) and the
  extraction carries 0, so the two header counts agree. The OSV Schema is not a BCP 14 document: it
  cites neither RFC 2119 nor RFC 8174, defines no verbal forms and writes its rules in lowercase. Its
  own normative baseline is therefore counted on the lowercase forms must not, must, should not, should,
  may, required and shall, as described in source_normative_counts.method: 74 occurrences (must 14, must
  not 3, should 29, should not 3, may 17, required 8, shall 0). A plain word count of the same file
  gives must 17, should 32, may 17 and required 8, the same occurrences before the two-word forms are
  counted on their own. Of the 74, 68 sit in the text of an extracted entry (must 13, must not 3, should
  29, should not 3, may 12, required 8); none is a verbatim repeat, because docs/schema.md never repeats
  a sentence that carries one of the forms (also_at therefore holds only validation/schema.json pointers
  that state the same rule); 6 are non-normative uses and are excluded (must 1, may 5): may at L29
  (Purpose, the format's change policy), must at L110 (Format Overview, the design approach), may at
  L791 and L1146 (example sentences), and may at L1371 and L1379 (explanations in the range examples).
  68 + 0 + 6 = 74; keyword_accounting lists every occurrence by line. Several in-text forms do not carry
  their usual force, and their entries say so: 'should' inside the definitions of published and
  withdrawn (R-0028, R-0029, recorded as constraints); 'may' stating a possibility inside a condition or
  a reason (R-0168, R-0170, R-0187, R-0196); 'may ... but not both' recorded as a prohibition (R-0182);
  the 'must not' of an example sentence, stronger than the 'should not' it illustrates (R-0036); and
  'required' negated in 'While not required' (R-0190). Normative wordings outside the counted forms are
  extracted wherever they state a rule: recommended, optional, allowed, permitted, mandatory,
  encouraged, preferable, allows, can, cannot, might, the imperative 'Use', and declaratives that fix a
  testable property (verb none). supplementary_wordings accounts for every occurrence of recommended,
  optional, optionally, allowed, permitted, mandatory, encouraged, invalid, preferable, preferred and
  cannot. The 13 entries with source_file validation/schema.json are outside this baseline: their texts
  are JSON keywords, and the lowercase forms in that file (the subschema titles 'events must contain an
  introduced object and may contain fixed, last_affected or limit objects' and 'GIT ranges must use
  full-length commit hashes', and the "required" keywords) are not counted here. The one inferred entry
  (R-0023) quotes a stated sentence that carries no counted form.
