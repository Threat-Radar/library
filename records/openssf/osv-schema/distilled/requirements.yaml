      spells CLEANSTART where the cell says CleanStart (the row's own OSV Formatted URL uses
      'CLEANSTART-'); see R-0230.
  - id: "osv-schema#R-0020"
    normativity: "recommendation"
    verb: "should"
    actor: "database (publisher)"
    condition: "unconditional"
    object: "published OSV records"
    field: "(record content scope)"
    locator: "§ id, modified fields > Defined database prefixes / L712"
    text: "Publishers should publish information within their reasonable scope or ecosystem."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "'reasonable scope' has no criterion."
    status: "active"
  - id: "osv-schema#R-0021"
    normativity: "permission"
    verb: "none"
    actor: "database"
    condition: "when a database derives its id from a CVE record"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields > Defined database prefixes / L712"
    text: "If one wants to derive their ID from a CVE record, adding the home database prefix is sufficient to communicate this."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      An id of the form '<PREFIX>-CVE-YYYY-NNNN' is recognisable; whether an id is derived from a CVE
      record is not visible otherwise.
    status: "active"
    notes: >-
      No verbal form: 'is sufficient' permits the form <home prefix>-<CVE id>. The example on the same
      line ('e.g. `DEBIAN-CVE-2000-0001`.') is not extracted. Such an id still has to meet R-0012 and
      R-0018.
  - id: "osv-schema#R-0022"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "modified"
    locator: "§ id, modified fields > modified field / L716-717"
    also_at:
      - "validation/schema.json /properties/modified/$ref (L15) to /$defs/timestamp (L577-581)"
    text: 'The `modified` field gives the time the entry was last modified, as an RFC3339-formatted timestamp in UTC (ending in "Z").'
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The format is testable (RFC 3339 date-time in UTC with a final 'Z'); that the value is the time of
      the last modification cannot be seen in the record. validation/schema.json checks the format only
      with an unanchored pattern (R-0236).
    status: "active"
    notes: "Declarative, verb none."
  - id: "osv-schema#R-0023"
    normativity: "requirement"
    verb: "none"
    actor: "record producer"
    condition: "whenever the producer changes an entry it has already published"
    object: "OSV record"
    field: "modified"
    locator: "§ id, modified fields > modified field / L716-717"
    text: 'The `modified` field gives the time the entry was last modified, as an RFC3339-formatted timestamp in UTC (ending in "Z").'
    text_kind: "sentence"
    kind: "inferred"
    testable: "partial"
    testable_reason: >-
      Testable across two published versions of one entry: if the content changed, modified is later.
      Needs access to successive versions.
    status: "active"
    notes: >-
      Inferred, not stated. R-0022 defines modified as the time of the last modification and R-0024 lets
      the later value win; together they imply that a producer sets modified to a later time on every
      change, or consumers keep the stale copy. No sentence says so directly. The quoted text is the
      stated basis, the same sentence as R-0022; it carries no verbal form, and the keyword accounting
      counts each source occurrence once, against stated entries only.
  - id: "osv-schema#R-0024"
    normativity: "constraint"
    verb: "none"
    actor: "consumer"
    condition: "when two different entries carry the same id"
    object: "OSV record"
    field: "modified"
    locator: "§ id, modified fields > modified field / L717-719"
    text: "Given two different entries claiming to describe the same `id` field, the one with the later modification time is considered authoritative."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative, verb none ('is considered authoritative'); it binds consumers and aggregators that
      merge records: give a consumer two records with the same id and it keeps the later one. The text
      does not say what happens when the two modified values are equal.
  - id: "osv-schema#R-0025"
    normativity: "requirement"
    verb: "required"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "id, modified"
    locator: "§ id, modified fields > modified field / L721"
    also_at:
      - "validation/schema.json /required (L368-371)"
    text: "The `id` and `modified` fields are required."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      proto/vulnerability.proto (not extracted) puts no 'Required.' marker on Vulnerability.id or
      Vulnerability.modified (L198-L206), while it marks other fields 'Required.'; proto3 itself has no
      required fields.
  - id: "osv-schema#R-0026"
    normativity: "requirement"
    verb: "required"
    actor: "record producer"
    condition: "for schema versions above 1.0.0"
    object: "OSV record"
    field: "schema_version"
    locator: "§ id, modified fields > modified field / L721-722"
    text: "For schema versions above 1.0.0, the `schema_version` field is also required."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Circular for a single record: without schema_version a record is read as 1.0.0 (R-0007), so a
      record can only be shown to break this rule when it uses a field added after 1.0.0, and the
      document does not say which fields were added when. validation/schema.json does not require
      schema_version (its /required lists only id and modified).
    status: "active"
    notes: >-
      The condition is the version a record conforms to, which the record states only through
      schema_version itself.
  - id: "osv-schema#R-0027"
    normativity: "permission"
    verb: "optional"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "every top-level field except id, modified and (above 1.0.0) schema_version"
    locator: "§ id, modified fields > modified field / L722-723"
    text: "All other fields are optional, although of course an entry with no other metadata is not particularly useful."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      A record with only id, modified and schema_version validates. The next sentence ('(It could
      potentially stand for a reserved ID with no other public information.)') is explanation and is not
      extracted. Sub-objects still have required members when present (R-0073, R-0161, R-0189, R-0051,
      R-0206, R-0213). proto/vulnerability.proto (not extracted) marks summary, details and affected
      'Required.' (L217-223), which contradicts this sentence; the proto calls itself not stable and
      only used for implementing the JSON based API (L193-194).
  - id: "osv-schema#R-0028"
    normativity: "constraint"
    verb: "should"
    actor: "record producer"
    condition: "when published is present"
    object: "OSV record"
    field: "published"
    locator: "§ published field / L734-735"
    also_at:
      - "validation/schema.json /properties/published/$ref (L18) to /$defs/timestamp (L577-581)"
    text: 'The `published` field gives the time the entry should be considered to have been published, as an RFC3339-formatted time stamp in UTC (ending in "Z").'
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The format is testable as for modified (R-0022, R-0236); the publication time itself cannot be
      checked.
    status: "active"
    notes: >-
      The 'should' sits inside the field's definition (the time from which the entry is to be regarded
      as published); it says how the value is read and puts no separate recommendation on an actor, so
      the entry is recorded as a constraint. Nothing excludes a future value, and no rule relates
      published to modified.
  - id: "osv-schema#R-0029"
    normativity: "constraint"
    verb: "should"
    actor: "record producer"
    condition: "when withdrawn is present"
    object: "OSV record"
    field: "withdrawn"
    locator: "§ withdrawn field / L745-746"
    also_at:
      - "validation/schema.json /properties/withdrawn/$ref (L21) to /$defs/timestamp (L577-581)"
    text: 'The `withdrawn` field gives the time the entry should be considered to have been withdrawn, as an RFC3339-formatted timestamp in UTC (ending in "Z").'
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The format is testable as for modified (R-0022, R-0236); the withdrawal time itself cannot be
      checked.
    status: "active"
    notes: >-
      As in R-0028, the 'should' is part of the definition, so the entry is recorded as a constraint.
      Consumers read the entry as withdrawn from that time; the document does not say how a withdrawn
      entry is treated in evaluation (the Evaluation pseudocode, R-0201, ignores withdrawn).
  - id: "osv-schema#R-0030"
    normativity: "constraint"
    verb: "none"
    actor: "consumer"
    condition: "when withdrawn is absent"
    object: "OSV record"
    field: "withdrawn"
    locator: "§ withdrawn field / L746-747"
    text: "If the field is missing, then the entry has not been withdrawn."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Declarative, verb none."
  - id: "osv-schema#R-0031"
    normativity: "recommendation"
    verb: "should"
    actor: "record producer"
    condition: "when the entry is withdrawn and a rationale exists"
    object: "OSV record"
    field: "summary"
    locator: "§ withdrawn field / L747-748"
    text: "Any rationale for why the vulnerability has been withdrawn should go into the summary text."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      A test can require a non-empty summary on a withdrawn record; whether it gives the rationale is a
      judgement.
    status: "active"
    notes: >-
      'summary text' is read as the summary field (one line, R-0043); it could also mean the summary and
      details text together.
  - id: "osv-schema#R-0032"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when aliases is present"
    object: "OSV record"
    field: "aliases"
    locator: "§ aliases field / L758-759"
    also_at:
      - "validation/schema.json /properties/aliases/items/type (L29)"
    text: "The `aliases` field gives a list of IDs of the same vulnerability in other databases, in the form of the `id` field."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The form of each entry is testable as for id (R-0010, R-0012); 'the same vulnerability' is the
      criterion of R-0033 and needs knowledge outside the record. validation/schema.json checks only
      that the items are strings, and lets aliases be null (R-0225).
    status: "active"
    notes: >-
      Declarative, verb none. The next sentence ('This allows one database to claim that its own entry
      describes the same vulnerability as one or more entries in other databases.') explains the purpose
      and is not extracted.
  - id: "osv-schema#R-0033"
    normativity: "constraint"
    verb: "can"
    actor: "record producer"
    condition: "before listing another vulnerability's id in aliases"
    object: "OSV record"
    field: "aliases"
    locator: "§ aliases field / L763-766"
    text: "Two vulnerabilities can be described as aliases if they affect any given software component the same way: either both vulnerabilities affect the software component or neither do. A subsequent patch addresses both of the vulnerabilities (and no others), and vice versa."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "Needs knowledge of every affected component and patch, outside any record."
    status: "active"
    notes: >-
      The criterion for aliasing, two adjacent sentences. 'can be described as aliases if' is read as
      the condition under which listing an alias is correct; the text does not say 'only if', though
      R-0035 and R-0036 rule out upstream and downstream ids.
  - id: "osv-schema#R-0034"
    normativity: "recommendation"
    verb: "should"
    actor: "consumer"
    condition: "unconditional"
    object: "aliases relation across records"
    field: "aliases"
    locator: "§ aliases field / L768-769"
    text: "Aliases should be considered symmetric (if A is an alias of B, then B is an alias of A) and transitive (If A aliases B and B aliases C, then A aliases C)."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Testable on a consumer: its alias groups are the symmetric and transitive closure of the aliases
      lists. It binds how aliases are read; producers are not required to list reverse or transitive
      aliases in their own records.
  - id: "osv-schema#R-0035"
    normativity: "recommendation"
    verb: "should not"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "aliases"
    locator: "§ aliases field / L771-773"
    text: "Aliases should **not** be used to refer to vulnerabilities in packages upstream or downstream in a software supply chain from the given OSV record's affected package(s)."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      Whether an id belongs to an upstream or downstream package needs supply-chain knowledge outside
      the record.
    status: "active"
    notes: "A negative recommendation; the source sets 'not' in bold."
  - id: "osv-schema#R-0036"
    normativity: "prohibition"
    verb: "must not"
    actor: "record producer (distribution)"
    condition: "when a distribution's advisory covers a CVE in a library that its package contains"
    object: "OSV record"
    field: "aliases"
    locator: "§ aliases field / L773-776"
    text: "For example, if a CVE describes a vulnerability in a language library, and a Linux distribution package contains that library and therefore publishes an advisory, the distribution's OSV record must not list the CVE ID as an alias."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Testable when the record's affected package is a distribution package and an alias is a CVE for a
      library it bundles; knowing that needs data outside the record.
    status: "active"
    notes: >-
      Opens with 'For example' but states its own prohibition with 'must not', stronger than the 'should
      not' it illustrates (R-0035); kept as an entry rather than excluded as an example, and the
      difference in strength is a source inconsistency. Such ids belong in upstream (R-0037).
  - id: "osv-schema#R-0037"
    normativity: "recommendation"
    verb: "should"
    actor: "record producer (distribution)"
    condition: >-
      when a record refers to upstream vulnerabilities, for example several bundled into one record
    object: "OSV record"
    field: "upstream"
    locator: "§ aliases field / L777-778"
    text: "To refer to these upstream vulnerabilities, `upstream` should be used."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "Needs to know which of the referenced ids are upstream vulnerabilities."
    status: "active"
    notes: >-
      'these' comes from the descriptive sentence before it ('Similarly, distributions often bundle
      multiple upstream vulnerabilities into a single record.'), which is not extracted.
  - id: "osv-schema#R-0038"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when upstream is present"
    object: "OSV record"
    field: "upstream"
    locator: "§ upstream field / L788-789"
    also_at:
      - "validation/schema.json /properties/upstream (L38-43)"
    text: "The `upstream` field gives a list of IDs of upstream vulnerabilities that are referred to by the vulnerability entry."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      An array of strings is testable; that each string is the id of an upstream vulnerability is not.
      Unlike aliases (R-0032), the text does not say the IDs have the form of the id field.
    status: "active"
    notes: >-
      Declarative, verb none. The example that follows (L791-793, 'a downstream package ecosystem ...
      may issue its own advisories') is not extracted; its 'may' states a possibility and is excluded in
      keyword_accounting.
  - id: "osv-schema#R-0039"
    normativity: "recommendation"
    verb: "should"
    actor: "consumer"
    condition: "unconditional"
    object: "upstream relation across records"
    field: "upstream"
    locator: "§ upstream field / L795"
    text: "`upstream` should be considered transitive but not symmetric."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Testable on a consumer: it computes the transitive closure and adds no reverse links. The example
      that follows (B upstream of A and C upstream of B, so C upstream of A) is not extracted.
  - id: "osv-schema#R-0040"
    normativity: "constraint"
    verb: "cannot"
    actor: "record producer"
    condition: "for any two records A and B"
    object: "upstream relation across records"
    field: "upstream"
