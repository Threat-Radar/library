    condition: "when package.ecosystem is Homebrew (with or without a suffix)"
    object: "affected[].package"
    field: "name, ecosystem suffix, versions, version ordering, range events"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `Homebrew`, Description column / L1012"
    text: "The Homebrew package manager for macOS and Linux; the `name` is the formula name (e.g. `openssl@3`). Casks are not currently in scope. Without a `:<tap>` suffix the formula is assumed to come from the default `homebrew/core` tap. A version is the formula version as reported by `brew info` with an `_N` suffix when the formula revision is nonzero (e.g. `1.81.6_6`), matching the version component of a `pkg:brew` purl. The ECOSYSTEM version ordering is Homebrew's [`PkgVersion`](https://github.com/Homebrew/brew/blob/HEAD/Library/Homebrew/pkg_version.rb) comparison: the version segment compared by Homebrew's [`Version`](https://github.com/Homebrew/brew/blob/HEAD/Library/Homebrew/version.rb) class, then the numeric revision suffix. The database uses `introduced` and `fixed` boundaries."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The version form ('_N' suffix when the formula revision is nonzero) and the ordering (Homebrew's
      PkgVersion comparison) are testable with Homebrew's code; formula names need the tap.
    status: "active"
    notes: >-
      Also states: casks are out of scope; without a ':<tap>' suffix the formula comes from
      homebrew/core; the version matches the version component of a pkg:brew purl; the database uses
      introduced and fixed boundaries.
