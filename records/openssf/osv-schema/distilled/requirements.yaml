    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Testable on a consumer given a commit hash: it evaluates the GIT ranges, not the versions list.
  - id: "osv-schema#R-0159"
    normativity: "recommendation"
    verb: "recommended"
    actor: "record producer"
    condition: "when providing both strict ecosystem versions and Git-level details"
    object: "affected[]"
    field: "(entries)"
    locator: "§ affected fields > affected[].versions field / L1083"
    text: "If you are providing both strict ecosystem versions and Git-level details, it is recommended to separate them into different entries."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Restates R-0145 (not verbatim). The pointer that follows ('See [Separating Git and Strict
      Ecosystems](...) for more details.') is not extracted.
  - id: "osv-schema#R-0160"
    normativity: "constraint"
