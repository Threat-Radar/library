    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `Debian`, Description column / L1003"
    text: 'The Debian package ecosystem; the `name` is the name of the source package. The ecosystem string might optionally have a `:<RELEASE>` suffix to scope the package to a particular Debian release. `<RELEASE>` is a numeric version specified in the [Debian distro-info-data](https://debian.pages.debian.net/distro-info-data/debian.csv). For example, the ecosystem string "Debian:7" refers to the Debian 7 (wheezy) release. For versions without a numeric version, use the the string in the `series` column of the  `distro-info-data` CSV, e.g. "Debian:sid".'
