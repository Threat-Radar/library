    condition: "when package.ecosystem is Echo (with or without a suffix)"
    object: "affected[].package"
    field: "name, ecosystem suffix, version ordering"
    locator: "§ affected fields > affected[].package field > Defined ecosystems, table row `Echo`, Description column / L1005"
    text: "The Echo package ecosystem; the `name` is the name of the source package. The ecosystem string might optionally have a `:<ECOSYSTEM>` suffix to denote an Echo secured build of a package from another ecosystem, in which case the `name` is the name of the package within that ecosystem and its versions are ordered by that ecosystem's rules. The supported values are `Echo:PyPI`, `Echo:Maven`, `Echo:npm` and `Echo:NuGet`. Without a suffix the package is an Echo OS package, whose versions are ordered by the Debian version ordering. Echo's secured builds carry a `+echo.<N>` build suffix, e.g. `1.2.3+echo.1`."
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The suffix values are a closed list (Echo:PyPI, Echo:Maven, Echo:npm, Echo:NuGet) and the
      '+echo.<N>' build suffix has a fixed form, both testable; names need Echo's package index.
    status: "active"
    notes: >-
      Also fixes version ordering: a suffixed package orders by the named ecosystem's rules, an
      unsuffixed Echo OS package by Debian version ordering.
