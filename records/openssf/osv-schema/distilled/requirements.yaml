requirements:
  - id: "osv-schema#R-0001"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "(whole record)"
    locator: "§ Format Overview / L39"
    also_at:
      - "validation/schema.json /type (L6)"
    text: "The format is a JSON-based encoding format, using the following informal schema."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      That a record is a JSON object is testable (validation/schema.json /type). The informal schema
      that follows (L46-99) is not machine-readable (it is not valid JSON: 'string', 'see description'),
      so conformance to it is checked through validation/schema.json, which differs from it in places
      (see the entries with source_file validation/schema.json).
    status: "active"
    notes: >-
      Declarative, verb none. The informal schema at L46-99 is a tab-indented code block listing the
      top-level fields schema_version, id, modified, published, withdrawn, aliases, upstream, related,
      summary, details, severity, affected, references, credits and database_specific with their
      nesting; messages.yaml carries it field by field. Not extracted: 'The exact details of each field
      are elaborated in the next section.' and the pointer to the JSON Schema (L43-44), whose link
      targets the main branch, not tag v1.9.2.
  - id: "osv-schema#R-0002"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "every string value"
    locator: "§ Format Overview / L40-41"
    text: "All strings contain UTF-8 text."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Declarative, verb none. Testable by decoding the served bytes as UTF-8."
  - id: "osv-schema#R-0003"
    normativity: "permission"
    verb: "might"
    actor: "database"
    condition: "for the database's own storage, as opposed to what it serves"
    object: "database storage"
    field: "storage format"
    locator: "§ Format Overview / L102-105"
    text: "Again, this document is only about the JSON encoding the database serves to consumers, which could be applications or other databases. A database might store its entries in an entirely different format, or it might store them using this schema but in a more human-editable encoding, such as TOML or YAML."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      A permission about internal storage, which the document places outside its scope; nothing
      observable to test.
    status: "active"
    notes: >-
      Two adjacent sentences: the first bounds the document to the JSON a database serves (consumers
      'could be applications or other databases'), the second permits any storage format. The serving
      rule follows in R-0004.
  - id: "osv-schema#R-0004"
    normativity: "requirement"
    verb: "allowed"
    actor: "database"
    condition: "when serving records"
    object: "served OSV record"
    field: "encoding"
    locator: "§ Format Overview / L105-107"
    text: "For serving, only the JSON encoding format is allowed, not a transliteration into any other encoding."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      'only ... is allowed, not ...' restricts serving to the JSON encoding, so it is recorded as a
      requirement on the serving database (the exclusion of other encodings is the same rule). Testable
      on a served record: it parses as JSON. The document does not define 'serving' further (no media
      type, no transport). The following paragraph ('the approach of this schema is to define only the
      fields that absolutely must be shared between databases', L109-111) explains the design and is not
      extracted; its 'must' is excluded in keyword_accounting.
  - id: "osv-schema#R-0005"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "when schema_version is present"
    object: "OSV record"
    field: "schema_version"
    locator: "§ schema_version field / L123-124"
    text: "The `schema_version` field is used to indicate which version of the OSV schema a particular vulnerability was exported with."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Whether the value names the version the record was actually exported with cannot be seen in the
      record. A test can only check that the record uses no field introduced after the version it names,
      which needs a field-by-version table that this document does not give.
    status: "active"
    notes: >-
      Declarative, verb none. The next sentence ('This can help consumer applications decide how to
      import the data for their own systems and offer some protection against future breaking changes.')
      is rationale and is not extracted.
  - id: "osv-schema#R-0006"
    normativity: "recommendation"
    verb: "should"
    actor: "record producer"
    condition: "when schema_version is present"
    object: "OSV record"
    field: "schema_version"
    locator: "§ schema_version field / L126-128"
    also_at:
      - "validation/schema.json /properties/schema_version/type (L9) (the string type only)"
    text: 'The value should be a string matching the OSV Schema version, which follows the [SemVer 2.0.0](https://semver.org) format, with no leading "v" prefix.'
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Testable with the SemVer 2.0.0 grammar plus 'no leading "v" prefix'. validation/schema.json checks only the
      string type (no pattern), so 'v1.9.2' passes it. 'matching the OSV Schema version' is read as
      equal to a published OSV Schema version number; this document is version 1.9.2 (L11) and does not
      list the others.
  - id: "osv-schema#R-0007"
    normativity: "recommendation"
    verb: "should"
    actor: "consumer"
    condition: "when a record has no schema_version"
    object: "OSV record"
    field: "schema_version"
    locator: "§ schema_version field / L128-129"
    text: "If no value is specified, it should be assumed to be `1.0.0`, matching version 1.0 of the OSV Schema."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      A consumer given a record without schema_version treats it as 1.0.0. With R-0026 (a record of a
      schema version above 1.0.0 carries schema_version), a record without it is either a 1.0.0 record
      or non-conforming; this default gives consumers one rule for both.
  - id: "osv-schema#R-0008"
    normativity: "permission"
    verb: "can"
    actor: "client"
    condition: "when a record identifies a newer minor or patch schema version than the client knows"
    object: "OSV record"
    field: "fields unknown to the client"
    locator: "§ schema_version field / L129-132"
    text: "Clients can assume that new minor and patch versions of the schema only add new fields, without changing the meaning of old fields, so that a client that knows how to read version 1.2.0 can process data identifying as schema version 1.3.0 by ignoring any unexpected fields."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The client side is testable: give a client a newer-minor record with an unknown field and check
      that it is processed with the field ignored. The promise about how the schema evolves binds the
      schema's maintainers and cannot be tested on a record.
    status: "active"
    notes: >-
      Also a promise by the specification that minor and patch versions only add fields (compare the
      Purpose section, L29, 'further backwards compatible changes may still be made', not extracted).
      Conflict with validation/schema.json: its root has "additionalProperties": false (R-0237), so a
      newer record with a new top-level field fails the older schema; a client that validates with the
      JSON Schema of the version it knows cannot also ignore unexpected top-level fields.
  - id: "osv-schema#R-0009"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields / L143"
    text: "The `id` field is a unique identifier for the vulnerability entry."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Uniqueness can be checked across the records of one database; a single record cannot show it, and
      the text does not say whether uniqueness is per database or global (the database prefix makes it
      global in practice).
    status: "active"
    notes: "Declarative, verb none. R-0025 makes id required."
  - id: "osv-schema#R-0010"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields / L143-145"
    text: "It is a string of the format `<DB>-<ENTRYID>`, where `DB` names the database and `ENTRYID` is in the format used by the database."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The '<DB>-' part is testable against the defined prefixes (R-0019); ENTRYID is database-defined
      and has no common grammar.
    status: "active"
    notes: >-
      Declarative, verb none; 'It' is the id field. The examples that follow ('OSV-2020-111',
      'CVE-2021-3114', 'GHSA-vp9c-fpxx-744v') are not extracted. Softened at L169, where the '-' after
      the prefix is only 'ideally' present (R-0018). In the x_ form (R-0011, example 'x_CUSTOM-0001') DB
      is 'x_' plus a local name. validation/schema.json requires a listed prefix followed by '-', or
      'x_' (R-0230).
  - id: "osv-schema#R-0011"
    normativity: "permission"
    verb: "can"
    actor: "database"
    condition: "for a local database that is not aggregated by OSV.dev"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields / L148-149"
    text: "The `x_` prefix can be used to denote a local database that isn't aggregated by OSV.dev, allowing external records to be schema-compliant."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      validation/schema.json accepts any id that begins 'x_' (R-0230); for a database without a row in
      the prefix table this is the only way to produce an id that passes it. The example 'x_CUSTOM-0001'
      (L149-150) is not extracted.
  - id: "osv-schema#R-0012"
    normativity: "requirement"
    verb: "must"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields > Character set constraints / L154-158"
    text: "To ensure maximum compatibility with CLI tools, shell scripts, URL routing, and filesystem storage, the `id` field must strictly use ASCII characters matching the regular expression:"
    text_kind: "sentence"
    code_block: "^[a-zA-Z0-9:_.-]+$"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The expression is the code block at L156-158, copied into code_block. validation/schema.json does
      not carry it: its id check (/$defs/prefix/pattern, R-0230) is anchored only at the start, so an id
      such as 'GHSA-a b/c' passes the JSON Schema and breaks this rule. The text does not say whether
      the rule also binds the ids listed in aliases, upstream and related; aliases are 'in the form of
      the `id` field' (R-0032).
  - id: "osv-schema#R-0013"
    normativity: "requirement"
    verb: "permitted"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields > Character set constraints / L160"
    text: "Only alphanumeric characters (`a-z`, `A-Z`, `0-9`) and `:`, `-`, `_`, and `.` are permitted."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Restates R-0012 in words ('Only ... are permitted' restricts the set, so it is recorded as a
      requirement); not a verbatim repeat, so it is its own entry. The explicit ranges limit
      'alphanumeric' to ASCII.
  - id: "osv-schema#R-0014"
    normativity: "prohibition"
    verb: "not allowed"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields > Character set constraints / L160"
    text: 'Characters outside this set (such as spaces, slashes `/`, backslashes `\`, parentheses, or exclamation marks) are not allowed.'
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The negative form of R-0013; the listed characters are examples, the forbidden set is everything
      outside [a-zA-Z0-9:_.-].
  - id: "osv-schema#R-0015"
    normativity: "recommendation"
    verb: "should"
    actor: "database"
    condition: "unconditional"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields > Semantically neutral ids / L164"
    text: "Identifiers should function solely as unique, permanent pointers to a vulnerability record rather than human-readable summaries."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      'human-readable summaries' has no criterion, and permanence is a property over time, not of one
      record.
    status: "active"
    notes: >-
      The document gives no rule for retiring or reusing an id; withdrawal is expressed with the
      withdrawn field (R-0029).
  - id: "osv-schema#R-0016"
    normativity: "recommendation"
    verb: "should"
    actor: "database"
    condition: "when establishing new identifier schemes"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields > Semantically neutral ids / L166"
    text: "When establishing new identifier schemes, new IDs **should be semantically neutral**:"
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Testable only through the two bullets (R-0017, R-0018); 'semantically neutral' is not defined
      beyond them.
    status: "active"
    notes: >-
      Lead-in to two bullets, each its own entry. It covers new identifier schemes only, so existing
      schemes that encode metadata are not affected.
  - id: "osv-schema#R-0017"
    normativity: "prohibition"
    verb: "must not"
    actor: "database"
    condition: "when establishing new identifier schemes (lead-in, L166)"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields > Semantically neutral ids / L168"
    text: "**Do not encode mutable vulnerability metadata:** IDs must not describe the vulnerability type or weakness (e.g. `SQLI`, `RCE`), package or component name (e.g. `LOG4J`), or severity rating (e.g. `CRITICAL`, `HIGH`)."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      A denylist check for weakness, package and severity words is possible, but 'describe' has no
      complete criterion and the listed words are examples.
    status: "active"
    notes: >-
      Bullet under the lead-in R-0016. Strength mismatch in the source: the lead-in says 'should be
      semantically neutral', the bullet says 'must not'; recorded with the bullet's own verb. The bold
      lead-in 'Do not encode mutable vulnerability metadata:' is an imperative that states the same
      rule.
  - id: "osv-schema#R-0018"
    normativity: "recommendation"
    verb: "should"
    actor: "database"
    condition: "when establishing new identifier schemes (lead-in, L166)"
    object: "OSV record"
    field: "id"
    locator: "§ id, modified fields > Semantically neutral ids / L169"
    text: "**Use scoped prefixes:** IDs should always begin with the correctly scoped database prefix from the defined database prefixes below (or `x_` for local databases), followed (ideally) by a `-` separator (e.g., `OSV-2026-X7Y2`, `GHSA-vp9c-fpxx-744v`)."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      That the id begins with a defined prefix (R-0019) or 'x_', and whether a '-' follows, is testable
      on the record. Whether the prefix is the 'correctly scoped' one, that of the database that
      publishes the record, needs to know the publisher, which the record shows only through the prefix.
    status: "active"
    notes: >-
      Bullet under R-0016. Two parts of different strength in one sentence: the prefix 'should always'
      begin the id, the '-' separator follows only '(ideally)'. Not split, because the second part has
      no verb of its own. validation/schema.json is stricter: /$defs/prefix/pattern makes a listed
      prefix followed by '-', or 'x_', mandatory for every record (R-0230). Compare R-0010, which states
      '<DB>-<ENTRYID>' without qualification.
  - id: "osv-schema#R-0019"
    normativity: "constraint"
    verb: "none"
    actor: "record producer"
    condition: "unconditional"
    object: "OSV record"
    field: "id (database prefix)"
    locator: "§ id, modified fields > Defined database prefixes / L174-704"
    text: 'The defined database prefixes and their "home" databases are:'
    text_kind: "sentence"
    enumeration:
      - "<code>ASB-A</code>/<code>PUB-A</code>"
      - "<code>ALSA</code>/<code>ALBA</code>/<code>ALEA</code>"
      - "<code>ALPINE</code>"
      - "<code>AZL</code>"
      - "<code>BELL</code>"
      - "<code>BIT</code>"
      - "<code>BREW</code>"
      - "<code>CGA</code>"
      - "<code>CleanStart</code>"
      - "<code>CURL</code>"
      - "<code>CVE</code>"
      - "<code>DEBIAN</code>"
      - "<code>DHI</code>"
      - "<code>DRUPAL</code>"
      - "<code>DSA</code>/<code>DLA</code>/<code>DTSA</code>"
      - "<code>ECHO</code>"
      - "<code>EEF</code>"
      - "<code>ELA</code>"
      - "<code>GHSA</code>"
      - "<code>GO</code>"
      - "<code>GSD</code>"
      - "<code>HSEC</code>"
      - "<code>JLSEC</code>"
      - "<code>KUBE</code>"
      - "<code>LBSEC</code>"
      - "<code>LSN</code>"
      - "<code>MGASA</code>"
      - "<code>MAL</code>"
      - "<code>MINI</code>"
      - "<code>OESA</code>"
      - "<code>OSEC</code>"
      - "<code>OSV</code>"
      - "<code>PHSA</code>"
      - "<code>PSF</code>"
      - "<code>PYSEC</code>"
      - "<code>RHSA</code>/<code>RHBA</code>/<code>RHEA</code>"
      - "<code>RHLW</code>"
      - "<code>RLSA</code>/<code>RXSA</code>"
      - "<code>RSEC</code>"
      - "<code>ROOT</code>"
      - "<code>RUSTSEC</code>"
      - "<code>SUSE-SU</code>/<code>SUSE-RU</code>/<code>SUSE-FU</code>/<code>SUSE-OU</code>/<code>openSUSE-SU</code>"
      - "<code>UBUNTU</code>"
      - "<code>USN</code>"
      - "<code>V8</code>"
      - "<code>VCPKG</code>"
      - "<code>CLSA</code>"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Lead-in to the HTML table at L179-710 (columns Prefix, Database, Description; the Description cell
