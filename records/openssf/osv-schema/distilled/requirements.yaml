    status: "active"
    notes: >-
      Declarative, verb none. Consumers compare these strings by plain equality in the Evaluation
      pseudocode (R-0201).
  - id: "osv-schema#R-0157"
    normativity: "constraint"
    verb: "cannot"
    actor: "consumer"
    condition: "when the GIT pseudo-ecosystem is used"
    object: "affected[] item"
    field: "versions"
    locator: "§ affected fields > affected[].versions field / L1081"
    text: "When using the `GIT` pseudo-ecosystem (either because there is no well-defined packaging ecosystem, or to provide supplementary Git-level details), versions specified in this array typically represent Git tags and cannot be relied upon to conform to any particular package manager's syntax."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      A consumer must not reject or misparse tag-style versions, which is testable; the text does not
      say how GIT is 'used' (as package.ecosystem, or only as a range type).
    status: "active"
    notes: "Recorded as a constraint on consumers ('cannot be relied upon')."
  - id: "osv-schema#R-0158"
    normativity: "recommendation"
    verb: "should"
    actor: "consumer"
    condition: "when the GIT pseudo-ecosystem is used"
    object: "affected[] item"
    field: "ranges"
    locator: "§ affected fields > affected[].versions field / L1081"
