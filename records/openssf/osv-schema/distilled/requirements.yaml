    text: "TuxCare package ecosystem; the `name` is the name of the source package. The ecosystem string might optionally have a `:<RELEASE>` suffix to scope the package to a particular TuxCare release. `<RELEASE>` is a numeric version."
    text_kind: "table-cell"
    kind: "stated"
