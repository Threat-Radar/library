        source_phrase: 'The `id` field is a unique identifier for the vulnerability entry. It is a string of the format `<DB>-<ENTRYID>`, where `DB` names the database and `ENTRYID` is in the format used by the database. For example: "OSV-2020-111", "CVE-2021-3114", or "GHSA-vp9c-fpxx-744v".'
        source_phrase_locator: '§ id, modified fields / L143-L146'
        proto_comment: 'The `id` field is a unique identifier for the vulnerability entry. It is a string of the format `<DB>-<ENTRYID>`, where `DB` names the database and `ENTRYID` is in the format used by the database. For example: “OSV-2020-111”, “CVE-2021-3114”, or “GHSA-vp9c-fpxx-744v”.'
        rules:
          - text: 'The `x_` prefix can be used to denote a local database that isn''t aggregated by OSV.dev, allowing external records to be schema-compliant. For example: "x_CUSTOM-0001".'
            locator: '§ id, modified fields / L148-L150'
          - text: 'To ensure maximum compatibility with CLI tools, shell scripts, URL routing, and filesystem storage, the `id` field must strictly use ASCII characters matching the regular expression:'
            locator: '§ Character set constraints / L154'
          - text: '^[a-zA-Z0-9:_.-]+$'
            locator: '§ Character set constraints / L157'
          - text: 'Only alphanumeric characters (`a-z`, `A-Z`, `0-9`) and `:`, `-`, `_`, and `.` are permitted. Characters outside this set (such as spaces, slashes `/`, backslashes `\`, parentheses, or exclamation marks) are not allowed.'
            locator: '§ Character set constraints / L160'
          - text: 'Identifiers should function solely as unique, permanent pointers to a vulnerability record rather than human-readable summaries.'
            locator: '§ Semantically neutral ids / L164'
          - text: 'When establishing new identifier schemes, new IDs **should be semantically neutral**:'
            locator: '§ Semantically neutral ids / L166'
          - text: '**Do not encode mutable vulnerability metadata:** IDs must not describe the vulnerability type or weakness (e.g. `SQLI`, `RCE`), package or component name (e.g. `LOG4J`), or severity rating (e.g. `CRITICAL`, `HIGH`).'
            locator: '§ Semantically neutral ids / L168'
          - text: '**Use scoped prefixes:** IDs should always begin with the correctly scoped database prefix from the defined database prefixes below (or `x_` for local databases), followed (ideally) by a `-` separator (e.g., `OSV-2026-X7Y2`, `GHSA-vp9c-fpxx-744v`).'
            locator: '§ Semantically neutral ids / L169'
          - text: 'Publishers should publish information within their reasonable scope or ecosystem. If one wants to derive their ID from a CVE record, adding the home database prefix is sufficient to communicate this. e.g. `DEBIAN-CVE-2000-0001`.'
            locator: '§ Defined database prefixes / L712'
          - text: 'The `id` and `modified` fields are required.'
            locator: '§ modified field / L721'
