      proto: 'comments: Required. type, Required if type is GIT. repo, Required. events'
    rules:
      - text: 'The `affected` object''s `ranges` field is a JSON array of objects describing the affected ranges of versions.'
        locator: '§ affected[].ranges[] field / L1087-L1088'
      - text: 'The `affected` object''s `ranges` field is a JSON array of objects, each describing a single range.  The range object defines the fields `type`, `events`, `repo`.  `introduced`, `fixed`, and additional type-specific fields as needed.'
        locator: '§ affected[].ranges[].repo field / L1194-L1196'
    proto_comment: 'Affected ranges.'
    notes: 'The sentence at L1194-L1196 places introduced and fixed on the range object; every other passage, both schemas and all examples place them on event objects. The JSON Schema conditions of L162-L271 test properties without requiring them, so a range with no type also gets the GIT errors and a range with no events gets the last_affected error; verdicts do not change because type and events are required anyway.'
    derived_rules: 'P03, P04 (osv-prose.derived.schema.json); S08, S09 (osv-recommended.derived.schema.json)'
