            suffix: 'required (has): :[Pro:]YY.MM, with :LTS mandatory for an LTS release'
            name_form: 'source package'
            derived_rules: 'P08h'
            description: 'The Ubuntu package ecosystem; the `name` field is the name of the source package. The ecosystem string has a `:<RELEASE>` suffix to scope the package to a particular Ubuntu release. `<RELEASE>` is a numeric ("YY.MM") version as specified in [Ubuntu Releases](https://wiki.ubuntu.com/Releases), with a mandatory `:LTS` suffix if the release is marked as LTS. The release version may also be prefixed with `:Pro:` to denote Ubuntu Pro (aka Expanded Security Maintenance (ESM)) updates. For example, the ecosystem string "Ubuntu:22.04:LTS" refers to Ubuntu 22.04 LTS (jammy), while "Ubuntu:Pro:18.04:LTS" refers to fixes that landed in Ubuntu 18.04 LTS (bionic) under Ubuntu Pro/ESM.'
          - value: 'vcpkg'
            prose: '§ Defined ecosystems / L1038'
            json_schema: 'listed in /$defs/ecosystemWithSuffix (L462) and /$defs/ecosystemName (L399-L452)'
            suffix: 'none (has no release suffix)'
            name_form: 'vcpkg port name'
            derived_rules: 'P09f'
            description: 'The vcpkg ecosystem for Microsoft''s C/C++ package manager; the `name` is the vcpkg port name (e.g. `bzip2`, `ffmpeg`). The ecosystem string has no release suffix. A version is the upstream port version; the integer `port-version` (incremented when the port packaging changes) is carried in the purl `port_version` qualifier. The default registry is [`microsoft/vcpkg`](https://github.com/microsoft/vcpkg); non-default registries are denoted by the purl `repository_url` / `repository_revision` qualifiers.'
          - value: 'VSCode'
            prose: '§ Defined ecosystems / L1039'
            json_schema: 'listed in /$defs/ecosystemWithSuffix (L462) and /$defs/ecosystemName (L399-L452)'
            suffix: 'optional :<REMOTE-REPO-URL> without a trailing slash; without it the Visual Studio Marketplace'
            name_form: '<publisher>.<name>'
            derived_rules: 'P09i, P10d'
            description: 'The Visual Studio Code extensions ecosystem; the `name` is the `<publisher>.<name>` string which uniquely identifies a package. This identifier is composed from the `Publisher` and `Id` attributes of the `Identity` element in the package''s `.vsixmanifest` file. It also corresponds to the `itemName` parameter of the package as found on the [Visual Studio Marketplace for VS Code](https://marketplace.visualstudio.com/vscode) extensions page, or the `namespace` and `name` fields of the [OpenVSX](https://open-vsx.org/) API response for the target package. The ecosystem string might optionally have a `:<REMOTE-REPO-URL>` suffix to denote the remote repository URL that best represents the source of truth for this package, without a trailing slash (e.g. `VSCode:https://open-vsx.org`). If this is omitted, this is assumed to be the Visual Studio Marketplace for VSCode (`https://marketplace.visualstudio.com/vscode`).'
