        rules:
          - text: 'Two vulnerabilities can be described as aliases if they affect any given software component the same way: either both vulnerabilities affect the software component or neither do. A subsequent patch addresses both of the vulnerabilities (and no others), and vice versa.'
            locator: '§ aliases field / L763-L766'
          - text: 'Aliases should be considered symmetric (if A is an alias of B, then B is an alias of A) and transitive (If A aliases B and B aliases C, then A aliases C).'
            locator: '§ aliases field / L768-L769'
          - text: 'Aliases should **not** be used to refer to vulnerabilities in packages upstream or downstream in a software supply chain from the given OSV record''s affected package(s).'
            locator: '§ aliases field / L771-L773'
          - text: 'For example, if a CVE describes a vulnerability in a language library, and a Linux distribution package contains that library and therefore publishes an advisory, the distribution''s OSV record must not list the CVE ID as an alias.'
            locator: '§ aliases field / L773-L776'
          - text: 'Similarly, distributions often bundle multiple upstream vulnerabilities into a single record. To refer to these upstream vulnerabilities, `upstream` should be used.'
