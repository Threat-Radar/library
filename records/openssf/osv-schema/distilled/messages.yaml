extracted_by: 'claude (FX-1 pass 1, schema and messages agent C, effort max)'
note: 'OSV defines one JSON document, the vulnerability record, and no wire protocol. This file decomposes it into 13 structures and 47 fields: vulnerability (the record), severity, affected, package, range, event, reference, credit, the four open objects (database_specific at three levels and ecosystem_specific), and the deprecated proto-only Commit. 40 of the fields are JSON fields the format defines; 4 are the any-member entries of the open objects and 3 belong to Commit. Conventions. Values of the keys text, source_phrase and description are verbatim from docs/schema.md: one passage, with its soft line breaks joined by one space and the indentation of continuation lines removed; nothing else changes. proto_comment values are verbatim from vulnerability.proto without the // markers, lines joined by one space. The keys prose, json_schema and proto (under *_sources, locators and disagreements) give each source''s own value; type, required, allowed_values and format give the prose value, because the prose is the definition (L19), the JSON Schema is offered for validation (L43-L44) and the .proto calls itself not stable (L193-L194). required is true, false, conditional, should or one of (exactly one of the event members). Short values under keys such as meaning, suffix, name_form, layout, format, items, special_values, constraints and default_meaning are our structured restatement of the verbatim rules beside them, never a substitute for them; anything implied but not stated is under inferred with kind inferred. Locators: prose as section heading and docs/schema.md line numbers at v1.9.2; JSON Schema as a JSON Pointer into schema/osv.schema.json with its line span; proto as message and declaration in schema/vulnerability.proto with its line span. Each disagreements item carries the id of schema/README.md (D1 to D36) and all three values. derived_rules names the rules of the derived schemas (P01 to P12 errors, S01 to S10 warnings) that check what neither source file checks. constrained_by (pass 3, cross-check) lists the requirements.yaml ids that constrain each structure and field. Field level: the requirements whose object and field labels name the field, whose text one of its rules items quotes, or that are the description of one of its allowed values, kept only where the text reaches the field; a requirement that makes one field depend on another is wired on both; R-0002 (UTF-8 strings) is on every string-valued field and R-0027 on the twelve optional top-level fields. Structure level: the requirements that bind a structure as a whole (its definition, member set, one-of rule or entry shape) and R-0008 (unknown members). constrained_by_locators is the pass-1 list, kept unchanged; constrained_by_note explains links that cross structures and candidates left out. R-0003, R-0020 and the four informative entries (R-0150, R-0151, R-0176, R-0221) constrain nothing here; distilled/verification.md, pass 3, gives the reasons. The proto-only Commit message has no requirement.'

structures:

  # =========================================================================
  # vulnerability
  # =========================================================================
  - name: 'vulnerability'
    aka: 'the OSV record or entry: one JSON document per vulnerability entry'
    json_pointer: '/'
    locators:
      prose: '§ Format Overview / L37-L100; § modified field / L721-L724'
      json_schema: '/ (L1-L584)'
      proto: 'message Vulnerability (L192-L234)'
    encoding: 'JSON; all strings UTF-8 (L39-L41); served only as JSON (L105-L107)'
    structure: 'map'
    kind: 'stated'
    constraints_sources:
      prose: 'id and modified required; schema_version required above 1.0.0; all other fields optional (L721-L722)'
      json_schema: 'type object (L6); required [id, modified] (L368-L371); allOf: severity exclusivity (L372-L393); additionalProperties false (L583)'
      proto: 'proto3 message; no required fields, no closure'
    rules:
      - text: 'The format is a JSON-based encoding format, using the following informal schema. The exact details of each field are elaborated in the next section. All strings contain UTF-8 text.'
        locator: '§ Format Overview / L39-L41'
      - text: 'Again, this document is only about the JSON encoding the database serves to consumers, which could be applications or other databases.'
        locator: '§ Format Overview / L102-L103'
      - text: 'For serving, only the JSON encoding format is allowed, not a transliteration into any other encoding.'
        locator: '§ Format Overview / L105-L107'
      - text: 'Overall, the approach of this schema is to define only the fields that absolutely must be shared between databases, leaving customizations to the "ecosystem_specific" and "database_specific" blocks (see below)'
        locator: '§ Format Overview / L109-L111'
      - text: 'Clients can assume that new minor and patch versions of the schema only add new fields, without changing the meaning of old fields, so that a client that knows how to read version 1.2.0 can process data identifying as schema version 1.3.0 by ignoring any unexpected fields.'
        locator: '§ schema_version field / L129-L132'
      - text: 'The `id` and `modified` fields are required. For schema versions above 1.0.0, the `schema_version` field is also required. All other fields are optional, although of course an entry with no other metadata is not particularly useful. (It could potentially stand for a reserved ID with no other public information.)'
        locator: '§ modified field / L721-L724'
    proto_comment: 'A vulnerability entry. The protobuf representation is *NOT* stable and only used for implementing the JSON based API.'
    disagreements:
      - id: 'D1'
        aspect: 'closure of the record object'
        prose: 'clients read newer minor versions by ignoring unexpected fields (L129-L132); nothing says unknown fields are invalid'
        json_schema: 'the root has "additionalProperties": false (L583): an unknown top-level field makes the record invalid; every nested object stays open'
        proto: 'not expressed in the .proto (unknown-field handling belongs to the protobuf runtime, not to this file)'
      - id: 'D36'
        aspect: 'required fields in the .proto'
        prose: 'id and modified required (L721); package ecosystem and name required (L952, L956); range type required (L1092), events implied (L1182); reference type and url (L1428-L1429); credit name (L1473, L1483); severity type and score (L853)'
        json_schema: 'the same, as required lists (L74-L77, L273-L276, L323-L326, L359-L361, L368-L371, L571-L574)'
        proto: 'proto3 cannot require a field; the comments say Required. for Package.name, Package.ecosystem, Range.type, Range.events, Reference.type and Reference.url, and nothing for Vulnerability.id, Vulnerability.modified, Severity.type, Severity.score and Credit.name'
    notes: 'The prose calls itself the definition (L19); it offers the JSON Schema for validation (L43-L44) and the .proto says its representation is not stable (L193-L194). None of the three says which wins when they disagree; type, required, allowed_values and format below give the prose value and list each disagreement.'
    constrained_by:
      - 'osv-schema#R-0001'
      - 'osv-schema#R-0002'
      - 'osv-schema#R-0004'
      - 'osv-schema#R-0008'
      - 'osv-schema#R-0025'
      - 'osv-schema#R-0026'
      - 'osv-schema#R-0027'
      - 'osv-schema#R-0237'
    constrained_by_note: 'Structure-level: the requirements that bind the record as a whole: its JSON encoding (R-0001, R-0004), UTF-8 strings (R-0002, also wired on every string-valued field), the required and optional top-level members (R-0025, R-0026, R-0027, also wired on the fields), unknown members (R-0008, wired on every structure with defined members) and the closed top level of the JSON Schema (R-0237). R-0003 (a database''s internal storage) and R-0020 (which vulnerabilities a publisher publishes), at L102-L105 and L712, constrain nothing a record carries and are not wired.'
    constrained_by_locators:
      - '§ Format Overview / L37-L111'
      - '§ schema_version field / L129-L132'
      - '§ modified field / L721-L724'
    fields:
      - name: 'schema_version'
        json_pointer: '/schema_version'
        type: 'string'
        type_sources:
          prose: 'string (§ Format Overview / L48; § schema_version field / L119)'
          json_schema: '"type": "string" (/properties/schema_version, L8-L10)'
          proto: 'string schema_version = 18 [json_name="schema_version"]; (L197)'
        required: 'conditional'
        required_sources:
          prose: 'required for schema versions above 1.0.0 (L721-L722)'
          json_schema: 'not in /required (L368-L371)'
          proto: 'no label (L196)'
        format: 'the OSV Schema version, SemVer 2.0.0 form, no leading v (should)'
        default: '1.0.0'
        default_sources:
          prose: 'assumed 1.0.0 when absent (L128-L129)'
          json_schema: 'none'
          proto: 'none (proto3: empty string when unset)'
        locators:
          prose: '§ schema_version field / L115-L132'
          json_schema: '/properties/schema_version (L8-L10)'
          proto: 'message Vulnerability / string schema_version = 18 [json_name="schema_version"]; (L196-L197)'
        source_phrase: 'The `schema_version` field is used to indicate which version of the OSV schema a particular vulnerability was exported with.'
        source_phrase_locator: '§ schema_version field / L123-L124'
        proto_comment: 'The OSV schema version.'
        rules:
          - text: 'This can help consumer applications decide how to import the data for their own systems and offer some protection against future breaking changes.'
            locator: '§ schema_version field / L124-L126'
          - text: 'The value should be a string matching the OSV Schema version, which follows the [SemVer 2.0.0](https://semver.org) format, with no leading "v" prefix.'
            locator: '§ schema_version field / L126-L128'
          - text: 'If no value is specified, it should be assumed to be `1.0.0`, matching version 1.0 of the OSV Schema.'
            locator: '§ schema_version field / L128-L129'
          - text: 'For schema versions above 1.0.0, the `schema_version` field is also required.'
            locator: '§ modified field / L721-L722'
        inferred:
          - statement: 'The conditional requirement cannot be checked on a record alone: a record without schema_version is read as 1.0.0, for which the field is not required.'
            basis: 'L128-L129 together with L721-L722'
            kind: 'inferred'
        disagreements:
          - id: 'D2'
            aspect: 'required-ness of schema_version'
            prose: 'required for schema versions above 1.0.0 (L721-L722)'
            json_schema: 'optional: not in /required (L368-L371)'
            proto: 'no Required or Optional label (L196); proto3 has no required fields'
          - id: 'D3'
            aspect: 'default of schema_version'
            prose: 'assumed to be 1.0.0 when absent (L128-L129)'
