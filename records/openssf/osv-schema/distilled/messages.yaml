      - text: 'The `versions` field can enumerate a specific set of affected versions, and the `ranges` field can list ranges of affected versions, under a given defined ordering. **A version is considered affected if it lies within any one of the ranges or is listed in the versions list.**'
        locator: '§ affected fields / L931-L934'
      - text: 'When providing vulnerability information for both a strict packaging ecosystem (such as `npm`, `PyPI`, or `Go`) and Git-level details (such as commit hashes), it is recommended to use separate entries in the `affected` array.'
        locator: '§ Separating Git and Strict Ecosystems / L1056'
      - text: '**Strict Ecosystem Entry**: This entry should use the specific ecosystem name (e.g., `"ecosystem": "npm"`). It should list affected versions in the `versions` field or use `ECOSYSTEM` or `SEMVER` range types in the `ranges` field.'
        locator: '§ Separating Git and Strict Ecosystems / L1058'
      - text: '**Git Entry**: This entry should use **no** `package` field. It should use the `GIT` range type in the `ranges` field to specify affected commit ranges.'
        locator: '§ Separating Git and Strict Ecosystems / L1059'
      - text: 'This separation ensures that tools relying on strict version parsing for a specific ecosystem do not get confused by Git commit hashes, and vice versa.'
        locator: '§ Separating Git and Strict Ecosystems / L1061'
