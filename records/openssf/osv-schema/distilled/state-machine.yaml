extracted_by: 'claude (FX-1 pass 1, schema and messages agent C, effort max)'
note: 'OSV is a data format, but it defines two things with states. (1) range-evaluation: the events of a range are a timeline of status changes (L1140-L1141), and the Evaluation pseudocode (L1242-L1292) walks them with a status variable, vulnerable, that starts false and is switched by introduced, fixed and last_affected events, after a limit check. The machine is that algorithm. (2) record-lifecycle: an entry keeps its id while copies of it are modified (the later modified copy is authoritative, L717-L719) and may be withdrawn (L745-L748); the states are the source''s own (withdrawn, not withdrawn, a possibly reserved bare entry), the transitions are assembled and each is marked stated or inferred. Every source_text is verbatim from docs/schema.md (soft line breaks joined by one space); meaning, trigger, guard and effect are our restatement. Triggers are events, not messages: OSV defines no exchange (see protocol, not applicable). Pass 3 (cross-check) added the events list: each transition''s event names one entry of it, which gives the messages.yaml structure or field the event involves and the requirements that define it; each transition''s constrained_by lists the requirements its guard and effect rest on.'

# Event catalogue (pass 3, cross-check): every transition trigger names one of these events,
# and each event names the messages.yaml structure or field it involves.
events:
  - id: 'evaluate-range'
    definition: 'IncludedInRanges takes the next range of the affected entry and tests the version v against it: the loop body begins.'
    structure: 'range'
    locator: '§ Evaluation / L1264-L1266'
    kind: 'stated'
    constrained_by:
      - 'osv-schema#R-0068'
      - 'osv-schema#R-0201'
  - id: 'next-event-introduced'
    definition: 'The walk over sorted(range.events) reaches an introduced event.'
    structure: 'event.introduced'
    locator: '§ Evaluation / L1268-L1270'
    kind: 'stated'
    constrained_by:
      - 'osv-schema#R-0175'
      - 'osv-schema#R-0177'
      - 'osv-schema#R-0201'
  - id: 'next-event-fixed'
    definition: 'The walk over sorted(range.events) reaches a fixed event.'
    structure: 'event.fixed'
    locator: '§ Evaluation / L1268; § Evaluation / L1271-L1272'
    kind: 'stated'
    constrained_by:
      - 'osv-schema#R-0175'
      - 'osv-schema#R-0201'
  - id: 'next-event-last_affected'
    definition: 'The walk over sorted(range.events) reaches a last_affected event.'
    structure: 'event.last_affected'
    locator: '§ Evaluation / L1268; § Evaluation / L1273-L1274'
    kind: 'stated'
    constrained_by:
      - 'osv-schema#R-0175'
      - 'osv-schema#R-0185'
      - 'osv-schema#R-0201'
  - id: 'next-event-no-branch'
    definition: 'The walk reaches an event for which no branch of the if chain applies: introduced above v, fixed above v, last_affected at or above v, or a limit event.'
    structure: 'event'
    locator: '§ Evaluation / L1268-L1274'
    kind: 'stated'
    constrained_by:
      - 'osv-schema#R-0201'
  - id: 'events-exhausted'
    definition: 'The walk over sorted(range.events) has visited every event of the range.'
    structure: 'range.events'
    locator: '§ Evaluation / L1268; § Evaluation / L1276'
    kind: 'stated'
    constrained_by:
      - 'osv-schema#R-0201'
  - id: 'receive-copy'
    definition: 'A consumer receives a copy of an OSV record (one JSON document) whose id is the entry''s id; the guards compare its modified time with that of the copy held.'
    structure: 'vulnerability'
    locator: '§ modified field / L717-L719'
    kind: 'inferred'
    constrained_by:
      - 'osv-schema#R-0009'
      - 'osv-schema#R-0022'
      - 'osv-schema#R-0024'
  - id: 'withdrawn-time-reached'
    definition: 'The clock reaches the withdrawn time of the copy held; a time event, not a message.'
    structure: 'vulnerability.withdrawn'
    locator: '§ withdrawn field / L745-L746'
    kind: 'inferred'
    constrained_by:
      - 'osv-schema#R-0029'

machines:

  - name: 'range-evaluation'
    subject: 'one version v of a package tested against one range (affected[].ranges[]): the IncludedInRanges and BeforeLimits steps of the Evaluation pseudocode'
    locator: '§ affected[].ranges[].events fields / L1131-L1186; § Evaluation / L1242-L1292'
    kind: 'stated'
    source_text:
      - text: 'These `events` objects represent a "timeline" of status changes for the affected package.'
        locator: '§ affected[].ranges[].events fields / L1140-L1141'
      - text: 'The algorithm to evaluate if a package `pkg` at version `v` is vulnerable is given by the `IsVulnerable` function in the pseudocode below:'
        locator: '§ Evaluation / L1244-L1245'
    initial: 'start'
    states:
      - id: 'start'
        meaning: 'a valid range and a version v to test; the loop body of IncludedInRanges begins'
        kind: 'stated'
        locator: '§ Evaluation / L1264-L1266'
      - id: 'not-affected'
        meaning: 'vulnerable is false at this point of the walk over sorted(range.events); the initial value'
        kind: 'stated'
        locator: '§ Evaluation / L1267'
        source_text:
          - text: 'vulnerable = false'
            locator: '§ Evaluation / L1267'
      - id: 'affected'
        meaning: 'vulnerable is true at this point of the walk'
        kind: 'stated'
        locator: '§ Evaluation / L1270'
        source_text:
          - text: 'vulnerable = true'
            locator: '§ Evaluation / L1270'
      - id: 'range-includes-v'
        meaning: 'all events walked and vulnerable is true: the range includes v, IncludedInRanges returns true'
        kind: 'stated'
        terminal: true
        locator: '§ Evaluation / L1276-L1277'
      - id: 'range-excludes-v'
        meaning: 'all events walked and vulnerable is false, or v is not before any limit: this range does not include v'
        kind: 'stated'
        terminal: true
        locator: '§ Evaluation / L1264-L1279; § Evaluation / L1286-L1290'
      - id: 'invalid-range'
        meaning: 'the range breaks a validity rule of the events array; the source calls such input invalid and defines no evaluation for it'
        kind: 'inferred'
        terminal: true
        locator: '§ Requirements / L1159-L1161; § Requirements / L1163-L1164; § Requirements / L1182'
    transitions:
      - from: 'start'
        to: 'invalid-range'
        trigger: 'evaluate the range for v'
        event: 'evaluate-range'
        constrained_by:
          - 'osv-schema#R-0181'
          - 'osv-schema#R-0182'
          - 'osv-schema#R-0189'
        guard: 'an event object has more than one of introduced, fixed, last_affected, limit; or the events hold both fixed and last_affected; or no event is introduced'
        kind: 'inferred'
        locator: '§ Requirements / L1159-L1161; § Requirements / L1163-L1164; § Requirements / L1182'
        source_text:
          - text: 'Only **a single type** (either `introduced`, `fixed`, `last_affected`, `limit`) is allowed in each event object. For instance, `{"introduced": "1.0.0", "fixed": "1.0.2"}` is **invalid**.'
            locator: '§ Requirements / L1159-L1161'
          - text: 'Entries in the `events` array may be "last_affected" or "fixed" events, but not both.'
            locator: '§ Requirements / L1163-L1164'
          - text: 'There must be at least one `introduced` object in the `events` array.'
            locator: '§ Requirements / L1182'
      - from: 'start'
        to: 'not-affected'
        trigger: 'evaluate the range for v'
        event: 'evaluate-range'
        constrained_by:
          - 'osv-schema#R-0178'
          - 'osv-schema#R-0179'
          - 'osv-schema#R-0180'
          - 'osv-schema#R-0201'
        guard: 'BeforeLimits(v, range): the range has no limit event (an implicit limit * is assumed), or v < limit for at least one limit event'
        effect: 'vulnerable = false; walk the events in sorted order'
        kind: 'stated'
        locator: '§ Evaluation / L1265-L1268; § Evaluation / L1281-L1290; § Special values / L1154-L1155'
        source_text:
          - text: 'If no limit events are provided, an implicit `{ "limit": "*" }` is assumed to exist. Multiple `limit` events are allowed in the same range.'
            locator: '§ Special values / L1154-L1155'
      - from: 'start'
        to: 'range-excludes-v'
        trigger: 'evaluate the range for v'
        event: 'evaluate-range'
        constrained_by:
          - 'osv-schema#R-0180'
          - 'osv-schema#R-0201'
        guard: 'the range has limit events and v < limit holds for none of them (BeforeLimits returns false)'
        kind: 'stated'
        locator: '§ Evaluation / L1286-L1290'
      - from: 'not-affected|affected'
        to: 'affected'
        trigger: 'the next event in sorted order is introduced'
        event: 'next-event-introduced'
        constrained_by:
          - 'osv-schema#R-0177'
          - 'osv-schema#R-0201'
        guard: 'v >= introduced; the value 0 sorts before every version'
        effect: 'vulnerable = true'
        kind: 'stated'
        locator: '§ Evaluation / L1269-L1270; § Special values / L1151-L1152'
        source_text:
          - text: '`introduced` allows a version of the value `"0"` to represent a version that sorts before any other version.'
            locator: '§ Special values / L1151-L1152'
      - from: 'not-affected|affected'
        to: 'not-affected'
        trigger: 'the next event in sorted order is fixed'
        event: 'next-event-fixed'
        constrained_by:
          - 'osv-schema#R-0201'
        guard: 'v >= fixed'
        effect: 'vulnerable = false'
        kind: 'stated'
        locator: '§ Evaluation / L1271-L1272'
      - from: 'not-affected|affected'
        to: 'not-affected'
        trigger: 'the next event in sorted order is last_affected'
        event: 'next-event-last_affected'
        constrained_by:
          - 'osv-schema#R-0185'
          - 'osv-schema#R-0201'
        guard: 'v > last_affected'
        effect: 'vulnerable = false'
        kind: 'stated'
        locator: '§ Evaluation / L1273-L1274'
        source_text:
          - text: 'Versions above `last_affected` should be considered unaffected.'
            locator: '§ Requirements / L1168'
      - from: 'not-affected'
        to: 'not-affected'
        trigger: 'the next event is introduced with v < introduced, fixed with v < fixed, last_affected with v <= last_affected, or limit'
        event: 'next-event-no-branch'
        constrained_by:
          - 'osv-schema#R-0201'
        guard: 'none'
        effect: 'none: no branch of the if chain applies'
        kind: 'stated'
        locator: '§ Evaluation / L1268-L1274'
      - from: 'affected'
        to: 'affected'
        trigger: 'the next event is introduced with v < introduced, fixed with v < fixed, last_affected with v <= last_affected, or limit'
        event: 'next-event-no-branch'
        constrained_by:
          - 'osv-schema#R-0201'
        guard: 'none'
        effect: 'none: no branch of the if chain applies'
        kind: 'stated'
        locator: '§ Evaluation / L1268-L1274'
      - from: 'affected'
        to: 'range-includes-v'
        trigger: 'no event left'
        event: 'events-exhausted'
        constrained_by:
          - 'osv-schema#R-0068'
          - 'osv-schema#R-0201'
        guard: 'vulnerable is true'
        effect: 'IncludedInRanges returns true'
        kind: 'stated'
        locator: '§ Evaluation / L1276-L1277'
      - from: 'not-affected'
        to: 'range-excludes-v'
        trigger: 'no event left'
        event: 'events-exhausted'
        constrained_by:
          - 'osv-schema#R-0201'
        guard: 'vulnerable is false'
        effect: 'go on with the next range; after the last range IncludedInRanges returns false'
        kind: 'stated'
        locator: '§ Evaluation / L1265-L1279'
    error_states:
      - 'invalid-range'
    notes:
      - 'Record level (IsVulnerable, L1248-L1255): v is affected for pkg when some affected entry whose package equals pkg lists v in versions (IncludedInVersions, L1257-L1262) or has a range that ends in range-includes-v. The ranges and the versions list combine by OR (L933-L934).'
      - 'The walk needs a total order of versions: SemVer precedence for SEMVER (L1100), the ecosystem''s own order for ECOSYSTEM (L1110-L1112). For GIT, u < v means u is an ancestor commit of v (L1124-L1125), a partial order, so sorted(range.events) is not fully defined; the limit example (L1336-L1375) computes the affected commits by reachability in the commit graph instead (git rev-list X..Y, L1369-L1370).'
      - 'An affected entry with no package (the Git entry of L1059) never matches the test affected.package == pkg (L1250).'
      - 'Range database_specific values have no effect on this evaluation (L1208-L1209).'
      - 'The machine is the source''s own algorithm; ranges that break a validity rule (invalid-range) are rejected by osv.schema.json before evaluation, so an evaluator that validates first never reaches that state.'

  - name: 'record-lifecycle'
    subject: 'one OSV entry, identified by its id, as a consumer receives copies of it over time'
    locator: '§ modified field / L714-L724; § published field / L726-L735; § withdrawn field / L737-L748'
    kind: 'inferred'
    source_text:
      - text: 'Given two different entries claiming to describe the same `id` field, the one with the later modification time is considered authoritative.'
        locator: '§ modified field / L717-L719'
      - text: 'The `withdrawn` field gives the time the entry should be considered to have been withdrawn, as an RFC3339-formatted timestamp in UTC (ending in "Z"). If the field is missing, then the entry has not been withdrawn.'
        locator: '§ withdrawn field / L745-L747'
      - text: 'All other fields are optional, although of course an entry with no other metadata is not particularly useful. (It could potentially stand for a reserved ID with no other public information.)'
        locator: '§ modified field / L722-L724'
      - text: 'The `published` field gives the time the entry should be considered to have been published, as an RFC3339-formatted time stamp in UTC (ending in "Z").'
        locator: '§ published field / L734-L735'
    initial: 'not-held'
    states:
      - id: 'not-held'
        meaning: 'the consumer holds no copy with this id'
        kind: 'inferred'
        locator: '§ modified field / L717-L719'
      - id: 'reserved'
        meaning: 'the authoritative copy has no field beyond id, modified and schema_version, and no withdrawn time that has been reached'
        kind: 'stated'
        locator: '§ modified field / L721-L724'
      - id: 'not-withdrawn'
        meaning: 'the authoritative copy has other metadata and either no withdrawn field or a withdrawn time still ahead'
        kind: 'stated'
        locator: '§ withdrawn field / L746-L747'
      - id: 'withdrawn'
        meaning: 'the authoritative copy has a withdrawn time that has been reached; the rationale is in summary'
        kind: 'stated'
        locator: '§ withdrawn field / L745-L748'
    transitions:
      - from: 'not-held'
        to: 'reserved'
        trigger: 'receive a first copy that has only id, modified (and schema_version)'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0025'
          - 'osv-schema#R-0027'
        kind: 'inferred'
        locator: '§ modified field / L721-L724'
      - from: 'not-held'
        to: 'not-withdrawn'
        trigger: 'receive a first copy with other metadata'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0030'
        guard: 'no withdrawn field, or its time not yet reached'
        kind: 'inferred'
        locator: '§ withdrawn field / L746-L747'
      - from: 'not-held'
        to: 'withdrawn'
        trigger: 'receive a first copy'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0029'
        guard: 'withdrawn present and its time reached'
        kind: 'inferred'
        locator: '§ withdrawn field / L745-L747'
      - from: 'reserved'
        to: 'reserved'
        trigger: 'receive a modified copy with the same id that still has no other metadata'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
        guard: 'its modified time is later than the held copy''s'
        effect: 'the new copy becomes authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719; § modified field / L721-L724'
      - from: 'reserved'
        to: 'not-withdrawn'
        trigger: 'receive a copy with the same id that adds metadata'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
          - 'osv-schema#R-0030'
        guard: 'its modified time is later than the held copy''s'
        effect: 'the new copy becomes authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719; § modified field / L721-L724'
      - from: 'reserved'
        to: 'withdrawn'
        trigger: 'receive a copy with the same id and a withdrawn time already reached'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
          - 'osv-schema#R-0029'
        guard: 'its modified time is later than the held copy''s'
        effect: 'the new copy becomes authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719; § withdrawn field / L745-L747'
      - from: 'not-withdrawn'
        to: 'not-withdrawn'
        trigger: 'receive a modified copy with the same id and no reached withdrawn time'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
        guard: 'its modified time is later than the held copy''s'
        effect: 'the new copy becomes authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719'
      - from: 'not-withdrawn'
        to: 'withdrawn'
        trigger: 'receive a copy with the same id and a withdrawn time already reached'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
          - 'osv-schema#R-0029'
        guard: 'its modified time is later than the held copy''s'
        effect: 'the new copy becomes authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719; § withdrawn field / L745-L747'
      - from: 'not-withdrawn'
        to: 'withdrawn'
        trigger: 'the clock reaches the withdrawn time of the authoritative copy'
        event: 'withdrawn-time-reached'
        constrained_by:
          - 'osv-schema#R-0029'
        kind: 'inferred'
        locator: '§ withdrawn field / L745-L746'
      - from: 'withdrawn'
        to: 'withdrawn'
        trigger: 'receive a modified copy with the same id that is still withdrawn'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
        guard: 'its modified time is later than the held copy''s'
        effect: 'the new copy becomes authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719'
      - from: 'withdrawn'
        to: 'not-withdrawn'
        trigger: 'receive a copy with the same id and no withdrawn field'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
          - 'osv-schema#R-0030'
        guard: 'its modified time is later than the held copy''s'
        effect: 'the new copy becomes authoritative: reinstatement'
        kind: 'inferred'
        locator: '§ modified field / L717-L719; § withdrawn field / L746-L747'
      - from: 'reserved'
        to: 'reserved'
        trigger: 'receive a copy with the same id'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
        guard: 'its modified time is not later than the held copy''s'
        effect: 'ignored: the held copy stays authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719'
      - from: 'not-withdrawn'
        to: 'not-withdrawn'
        trigger: 'receive a copy with the same id'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
        guard: 'its modified time is not later than the held copy''s'
        effect: 'ignored: the held copy stays authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719'
      - from: 'withdrawn'
        to: 'withdrawn'
        trigger: 'receive a copy with the same id'
        event: 'receive-copy'
        constrained_by:
          - 'osv-schema#R-0024'
        guard: 'its modified time is not later than the held copy''s'
        effect: 'ignored: the held copy stays authoritative'
        kind: 'stated'
        locator: '§ modified field / L717-L719'
    error_states: []
    notes:
      - 'Assembled from three field definitions and one authority rule; the source draws no lifecycle diagram. kind stated marks a transition that follows from L717-L719 and the state definitions; kind inferred marks one the source implies but does not describe. In general any later-modified copy replaces the held one and the new state is the class of the new copy; the list gives the cases with a plausible trigger (a later copy that drops all metadata would also move an entry back to reserved).'
      - 'Not defined by the source: what to do with two copies that have the same id and the same modified time but different content; whether a withdrawn entry may be reinstated (withdrawn to not-withdrawn above only follows from the authority rule); any order among published, modified and withdrawn; and a published time still in the future.'
      - 'published is a timestamp, not a state here: L734-L735 say when the entry should be considered published, and nothing more.'
      - 'Reserved IDs: L723-L724 say only that a bare entry could potentially stand for one; there is no status field.'
      - 'The guards compare RFC 3339 UTC timestamps (L716-L717, L745-L746) as instants: compared as strings they order correctly only when both have the same number of fractional digits (2021-01-01T00:00:00Z sorts after 2021-01-01T00:00:00.5Z as a string).'
