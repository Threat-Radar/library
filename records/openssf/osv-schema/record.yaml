      reviewed_by: ""
    - kind: verification
      path: distilled/verification.md
      coverage: "pass 2 (independent verify) and pass 3 (cross-check) evidence: recount table, defects found and fixed, the constrained_by wiring rule and counts, the statement-to-requirement mapping, example and design-note traceability, state-machine events, every inconsistency and its fix, and what was not checked"
      reviewed_by: ""
  not_applicable:
    - kind: protocol
      reason: "OSV Schema 1.9.2 defines one JSON document, the vulnerability record, and no exchange between parties. It names producers (databases), consumers, clients and display code and says what each does with a record: serve it only as JSON (L105-L107), read a newer minor version by ignoring unexpected fields (L129-L132), sanitize details (L833-L834). These are single-party rules, carried by R-0004, R-0008 and R-0048. The document defines no messages, sequences or error paths between parties; the OSV.dev API it links to is outside it; state-machine.yaml models the evaluation of a range and the lifecycle of a record."
