      coverage: "2 machines: range-evaluation (the IncludedInRanges and BeforeLimits pseudocode: 6 states, 10 transitions, error state invalid-range) and record-lifecycle (authority of the later-modified copy and withdrawal: 4 states, 14 transitions, each stated or inferred); 8 named events, each tied to a messages.yaml structure or field; every transition carries its event and constrained_by (pass 3)"
