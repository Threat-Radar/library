# SLSA v1.0 Build track. Locator = Requirements section name. Names PARAPHRASED (WebFetch
# summary) — verify against the live /requirements page before normative use (T-029).
schema: "library-requirements/v1"
record: slsa-v1-0
roles: [producer, build-platform, consumer]
requirements:
  - {id: choose-build-platform, actor: producer, applies_at_level: "L1+", statement: "Select a build platform capable of the desired SLSA level."}
  - {id: consistent-build-process, actor: producer, applies_at_level: "L1+", statement: "Build the artifact consistently so verifiers can form expectations."}
  - {id: distribute-provenance, actor: producer, applies_at_level: "L1+", statement: "Distribute provenance to artifact consumers."}
  - {id: provenance-exists, actor: build-platform, applies_at_level: "L1", statement: "Generate provenance covering platform, process and inputs (best effort; no authenticity/accuracy req at L1)."}
  - {id: provenance-authentic, actor: build-platform, applies_at_level: "L2+", statement: "Provenance MUST be authenticatable (signed) so consumers can validate it."}
  - {id: provenance-from-control-plane, actor: build-platform, applies_at_level: "L2+", statement: "Provenance generated by the platform control plane, not the tenant."}
  - {id: hosted, actor: build-platform, applies_at_level: "L2+", statement: "All build steps run on a hosted platform, not a developer workstation. [Hosted-at-L2 UNVERIFIED]"}
  - {id: signing-secret-isolated, actor: build-platform, applies_at_level: "L3", statement: "Signing secret material stored securely and NOT accessible to the build environment."}
  - {id: isolated-builds, actor: build-platform, applies_at_level: "L3", statement: "Overlapping builds cannot influence each other; ephemeral environment; cache-poisoning prevented."}
  - {id: external-params-enumerated, actor: build-platform, applies_at_level: "L3", statement: "External parameters fully enumerated; every provenance field generated/verified by the platform."}
  - {id: consumer-verify-provenance, actor: consumer, applies_at_level: "L2+", statement: "Validate provenance authenticity (signature) and compare to expectations. [actor assignment uncertain]"}
flags:
  - "Requirement names paraphrased from a WebFetch summary; verify section headings on the live page."
  - "Hosted introduced at L2 (name 'Hosted Build Platform') — the summary mis-tagged L1; verify."
  - "Hermetic build NOT required at any level (future directions). in-toto predicate URI not captured."
