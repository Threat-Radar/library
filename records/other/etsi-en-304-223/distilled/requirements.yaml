note: >
  One entry per provision of clause 5 (72), keyed by ETSI's own designator, e.g. #5.1.2-3,
  plus one clause 4 statement keyed C4-1 (not an ETSI designator; assigned by this library).
  Sub-provisions (5.1.2-1.1) carry `parent`. normativity follows the strongest modal verb
  (shall -> requirement, should -> recommendation); `verbs` lists every modal in order.
  `text` is verbatim. DERIVED fields need human review: actor (stakeholders named before
  each modal verb; '(implied)' = taken from the principle's 'Primarily applies to'),
  short_title, nature, expects_deliverables, verification, testable. EN 304 223 names no work
  products, so expects_deliverables are descriptions, not designators. The standard says
  nothing about tailoring, so no `tailorable` field. bears_on names the tmodel decisions a
  provision bears on (design-notes.md explains each; ADR-0006 accepts DEC-003, ADR-0007
  accepts DEC-002, ADR-0010 accepts DEC-001a, tmodel#130 is a proposal, not a decision).
  maps_to is the threat mapping: the
  attack class each provision defends against, as NIST AI 100-2 E2025 index ids and MITRE
  ATLAS technique ids (checked against ATLAS 2026.09 as served by atlas.mitre.org). Every
  mapping is ours (provenance: ours, with a rationale); kind: stated means the provision's
  own words name the attack (source_text), kind: inferred means it does not. The source
  prints neither NIST nor ATLAS ids.
counts: { requirement: 49, recommendation: 24, permission: 0, entries: 73, provisions: 72, clause_4_statements: 1 }
verb_baseline: { shall: 59, should: 28, can: 5, will: 6, cannot: 2, shall_not: 0, should_not: 0, may: 0 }   # clause 5 body; all present in `text`

