note: >
  The threats and weaknesses the source DESCRIBES, each quoted verbatim (description) with
  its locator. kind: stated = the source describes it; inferred = our reading (a weakness
  read as the negation of a requirement or recommendation, or the attack behind an effect
  the source names; each inferred item says which in its note). external_id holds our mapping as opaque
  strings: NIST AI 100-2 E2025 index ids (NISTAML.*) and MITRE ATLAS 2026.09 technique ids
  (AML.T*), the latter checked against the ATLAS data served by atlas.mitre.org. The source
  prints neither. Weaknesses carry candidate CWE 4.20 ids the same way (inferred; see
  each note for the CWE mapping-usage value). attack_class uses the NIST AI 100-2 E2025
  classes plus five labels of ours: non-adversarial (not an attack), conventional (an attack
  outside the AML taxonomy), general (attacks named without a class), unclear (named, not
  defined) and out-of-scope (attacks that use AI). addressed_by lists the requirements whose maps_to
  shares an id with the threat (derived; threats with no id list none). Nothing here is
  instantiated against a product: no risk vector, no mitigation state (artifact.schema.yaml).
