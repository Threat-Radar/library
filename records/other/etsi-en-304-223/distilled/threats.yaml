weaknesses:
  - id: "W-01"
    name: "superfluous functionality"
    description: "Developers shall manage the security risks associated with AI models that provide superfluous functionalities, where increased functionality leads to increased risk. For example, where a multi-modal model is being used but only single modality is used for system function."
    locator: "5.1.3-1.2, p. 11"
    kind: "stated"
    external_id: ["CWE-1125"]
    note: "Nearest CWE 4.20 entry is CWE-1125 Excessive Attack Surface, whose mapping usage is Prohibited; given for orientation only (inferred)."
  - id: "W-02"
    name: "models or components that are not well-documented or secured"
    description: "System Operators that choose to use or adapt any models, or components, which are not well-documented or secured shall be able to justify their decision"
    locator: "5.2.3-2, p. 13"
    kind: "stated"
    external_id: ["CWE-1357"]
    note: "CWE-1357 Reliance on Insufficiently Trustworthy Component (mapping usage Allowed-with-Review); inferred."
  - id: "W-03"
    name: "excess permissions granted to the AI system on other systems"
    description: "Developers and System Operators shall ensure that the permissions granted to the AI system on other systems are only provided as required for functionality and are risk assessed."
    locator: "5.1.2-6, p. 11"
    kind: "inferred"
    external_id: ["CWE-250"]
