distillation:
  profile: full
  standard: FX-1
  artifacts:
    - kind: normative
      path: distilled/normative.md
      coverage: "Verbatim, cut from the source by script: modal verbs clause, transposition dates, History, Introduction phase statement and ISO/IEC 22989 NOTE, §1 scope, §2.1, all 19 clause 3.1 terms, all of clause 4 incl. Table 4-1, all 72 clause 5 provisions with every principle heading, 'Primarily applies to' and References line, and the 5.3.1 NOTE; each with clause and page. Excludes front-matter notices, IPR, trademarks, the §2.2 reference list (in cites) and §3.3 abbreviations. A reading-aid table at the end is ours."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.yaml
      coverage: "73 entries: all 72 clause 5 provisions keyed by ETSI designator (49 shall, 23 should) + C4-1, the clause 4 'should note' sentence the 2026-10-01 pass missed. BCP 14 0/0; own-form baseline over the whole source reconciled form by form (shall 61->59, should 32->29, can 22->6, will 7->6, cannot 5->2, may 9->0, must 2->0, shall not 4->0, should not, will not, need not 1->0), every exclusion itemised. Every entry: page locator, kind, testable with reason, bears_on (tmodel decisions), maps_to (NIST AI 100-2 E2025 and MITRE ATLAS 2026.09 threat mapping, stated or inferred, with rationale). Derived fields need review."
      reviewed_by: ""
    - kind: requirements
      path: distilled/requirements.md
      coverage: "Human view, one table per principle plus clause 4: all 73 entries with testable."
      generated_from: distilled/requirements.yaml
      reviewed_by: ""
    - kind: threats
      path: distilled/threats.yaml
      coverage: "13 threats and 4 weaknesses the EN describes, each quoted verbatim with locator, kind (stated/inferred), NIST AI 100-2 E2025 and ATLAS ids, and the provisions that address it (derived from maps_to). No vulnerabilities: the EN names no product or CVE."
      reviewed_by: ""
    - kind: design-notes
      path: distilled/design-notes.md
      coverage: "Per provision: tmodel decisions (ADR-0006, ADR-0007, ADR-0010 + tmodel#130, DEC-001b, DEC-008, DEC-009, R-018) and the AI attack class it defends against (NIST AI 100-2 E2025 ids, ATLAS ids, stated/inferred), generated from requirements.yaml; adopt/adapt/gap per decision; class summary; 5 open questions incl. source defects."
      reviewed_by: ""
    - kind: verification
      path: distilled/verification.md
      coverage: "Pass 1 self-checks and the stop point. Passes 2 (verify) and 3 (cross-check) started 2026-10-21 and were stopped by the account usage limit before reporting; to be finished."
      reviewed_by: ""
  not_applicable:
    - kind: schema
      reason: "The EN defines no data format, schema or field-level structure. The nearest is the documentation list in 5.2.4-1.1 and 5.2.4-2.1 (training-data sources incl. URL and date/time, scope and limitations, guardrails, retention time, review frequency, failure modes): topics, not typed fields. A schema from it would be invention; design-notes.md records it as a candidate LinkML extension."
    - kind: messages
      reason: "No message, envelope or structured exchange is defined. The EN requires communications (unresolved threats Developer -> System Operator -> End-user, 5.1.3-2; data use, 5.3.1-1; security updates, 5.3.1-2.2 and 5.4.1-1; model updates, 5.2.3-4; component hashes, 5.2.4-1.2) but gives only their subject, never fields or encoding."
    - kind: protocol
      reason: "No roles exchanging messages in a defined sequence. The communications above have a direction but no steps, ordering, responses or error paths; a protocol would invent them. The direction is DEC-009 input in design-notes.md."
    - kind: state-machine
      reason: "No lifecycle with states and transitions. The five phases (secure design to secure end of life) order the principles and map to ISO/IEC 22989 stages (Introduction NOTE) with no triggers or guards. The EN gives triggers without states (re-threat-model on a configuration change, 5.1.3-1.1; a major update is a new version, 5.4.1-2; dispose on transfer, 5.5.1-1); these are DEC-001b input in design-notes.md."
    - kind: examples
      reason: "No worked examples or test vectors. The clause 4 EXAMPLE (data protection roles) and the 'For example' clauses inside provisions (5.1.3-1.2 multimodal model, 5.2.2-2 rate limits, 5.2.3-2 sole supplier, 5.3.1-1 retraining) are prose illustrations with no expected result; they stay verbatim in normative.md and requirements.yaml."
  passes:
    - pass: extract
      by: "claude (main session, single agent; library#8 lane did the 2026-10-01 partial pass)"
      effort: max
      date: "2026-10-21"
      note: "Source re-read in full from .cache/etsi-en-304-223.txt (PyMuPDF, page-marked; PDF sha256 matches content.sha256). Script etsi_audit.py: all 72 existing provision texts equal the full source provision exactly; whole-document modal counts. Fixes: C4-1 added; 5.1.2-1.1 actor (was the Data Custodian, who is included, not obliged); locators gain pages; header counts and reconciliation. normative.md rewritten as verbatim text cut by anchors (the old one was a paraphrase; its tables kept as a labelled reading aid). Added threats.yaml, design-notes.md. ATLAS ids checked against ATLAS-2026.09.yaml from atlas.mitre.org; NIST ids against the E2025 index."
