structures:
  - name: 'stix-common-properties'
    kind: 'stated'
    structure: 'map-properties'
    encoding: 'JSON object properties'
    locator: 'docs/language.rst §STIX Common Properties L58-L114'
    applies_to:
      - 'attack-flow'
      - 'attack-action'
      - 'attack-asset'
      - 'attack-condition'
      - 'attack-operator'
      - 'x-detection'
      - 'x-mitigation'
    fields:
      - name: 'type'
        type: 'string'
        required: true
        cardinality: '1'
        encoding: 'JSON string'
        kind: 'stated'
        locator: 'docs/language.rst §STIX Common Properties L73-L76'
        description: 'Identifies the type of STIX object. It must be a valid object type as defined in the STIX 2.1 standard or in an extension (such as Attack Flow).'
        constraints:
          - description: 'A valid STIX 2.1 or extension-defined object type.'
            locator: 'docs/language.rst L73-L76'
            authority: 'external-stix-restated-by-language'
            kind: 'stated'
        external_schema_locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/type'
        external_schema_constraints:
          title: 'type'
          type: 'string'
          pattern: '^([a-z][a-z0-9]*)+(-[a-z0-9]+)*\-?$'
          minLength: 3
          maxLength: 250
          not:
            enum:
              - 'action'
        external_schema_required: true
        constrained_by:
          - 'mitre-attack-flow#R-0021'
      - name: 'spec_version'
        type: 'string'
        required: true
        cardinality: '1'
        encoding: 'JSON string'
        kind: 'stated'
        locator: 'docs/language.rst §STIX Common Properties L77-L80'
        description: 'The version of the STIX specification used to represent this object. The value must be ``2.1`` for all Attack Flow objects.'
        constraints:
          - description: 'All Attack Flow objects use STIX 2.1.'
            locator: 'docs/language.rst L77-L80'
            authority: 'attack-flow-local'
            kind: 'stated'
        value: '2.1'
        external_schema_locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/spec_version'
        external_schema_constraints:
          type: 'string'
          enum:
            - '2.0'
            - '2.1'
        external_schema_required: true
        constrained_by:
          - 'mitre-attack-flow#R-0022'
      - name: 'id'
        type: 'identifier'
        required: true
        cardinality: '1'
        encoding: 'JSON string carrying a STIX identifier'
        kind: 'stated'
        locator: 'docs/language.rst §STIX Common Properties L81-L83'
        description: 'Uniquely identifies each object.'
        constraints:
          - description: 'Identifies an object uniquely; exact identifier syntax is imported from STIX, not defined by an Attack Flow-local pattern.'
            locator: 'docs/language.rst L81-L83; stix/attack-flow-schema-2.0.0.json /allOf/0/$ref'
            authority: 'external-stix-restated-by-language'
            kind: 'stated'
        external_schema_locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/id'
        external_schema_constraints:
          $ref: '../common/identifier.json'
        external_schema_required: true
        value_structure: 'stix-identifier'
        constrained_by:
          - 'mitre-attack-flow#R-0023'
      - name: 'created_by_ref'
        type: 'identifier'
        required: false
        cardinality: '0..1'
        encoding: 'JSON string carrying a STIX identifier'
        kind: 'stated'
        locator: 'docs/language.rst §STIX Common Properties L84-L87'
        description: 'Specifies the ``id`` property of the ``identity`` object that describes the entity that created this object.'
        constraints:
          - description: 'References the identity object for the object creator.'
            locator: 'docs/language.rst L84-L87'
            authority: 'external-stix-restated-by-language'
            kind: 'stated'
        reference_targets:
          - 'identity'
        external_schema_locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/created_by_ref'
        external_schema_constraints:
          $ref: '../common/identifier.json'
        external_schema_required: false
        notes: 'Identity is the language-table semantic target. The imported core schema validates only identifier syntax and does not impose an identity-- prefix.'
        value_structure: 'stix-identifier'
        constrained_by:
          - 'mitre-attack-flow#R-0024'
      - name: 'created'
        type: 'timestamp'
        required: true
        cardinality: '1'
        encoding: 'JSON string carrying a STIX timestamp'
        kind: 'stated'
        locator: 'docs/language.rst §STIX Common Properties L88-L93'
        description: 'Represents the time at which the object was originally created. The object creator can use the time it deems most appropriate as the time the object was created. The minimum precision MUST be milliseconds (three digits after the decimal place in seconds), but MAY be more precise.'
        constraints:
          - description: 'Timestamp precision is at least three fractional digits in seconds; greater precision is permitted.'
            locator: 'docs/language.rst L88-L100'
            authority: 'external-stix-restated-by-language'
            kind: 'stated'
          - description: 'The imported timestamp pattern requires uppercase T and UTC Z, while this core field additionally requires at least three fractional digits.'
            locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/created; stix-dependencies/stix2.1/schemas/common/timestamp.json/pattern'
            authority: 'external-stix-schema-snapshot'
            kind: 'stated'
        example_encoding: '2022-08-02T19:34:35.143Z'
        external_schema_locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/created'
        external_schema_constraints:
          allOf:
            - $ref: '../common/timestamp.json'
            - title: 'timestamp_millis'
              pattern: 'T\d{2}:\d{2}:\d{2}\.\d{3,}Z$'
        external_schema_required: true
        value_structure: 'stix-timestamp'
        constrained_by:
          - 'mitre-attack-flow#R-0001'
          - 'mitre-attack-flow#R-0025'
      - name: 'modified'
        type: 'timestamp'
        required: true
        cardinality: '1'
        encoding: 'JSON string carrying a STIX timestamp'
        kind: 'stated'
        locator: 'docs/language.rst §STIX Common Properties L94-L100'
        description: 'The modified property is only used by STIX Objects that support versioning and represents the time that this particular version of the object was last modified. The object creator can use the time it deems most appropriate as the time this version of the object was modified. The minimum precision MUST be milliseconds (three digits after the decimal place in seconds), but MAY be more precise.'
        constraints:
          - description: 'Timestamp precision is at least three fractional digits in seconds; greater precision is permitted.'
            locator: 'docs/language.rst L88-L100'
            authority: 'external-stix-restated-by-language'
            kind: 'stated'
          - description: 'The imported timestamp pattern requires uppercase T and UTC Z, while this core field additionally requires at least three fractional digits.'
            locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/modified; stix-dependencies/stix2.1/schemas/common/timestamp.json/pattern'
            authority: 'external-stix-schema-snapshot'
            kind: 'stated'
        example_encoding: '2022-08-02T19:34:35.143Z'
        notes: 'The table marks modified required and describes it as used only for STIX objects that support versioning; these language objects are presented with created and modified in their examples.'
        external_schema_locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/modified'
        external_schema_constraints:
          allOf:
            - $ref: '../common/timestamp.json'
            - title: 'timestamp_millis'
              pattern: 'T\d{2}:\d{2}:\d{2}\.\d{3,}Z$'
        external_schema_required: true
        value_structure: 'stix-timestamp'
        constrained_by:
          - 'mitre-attack-flow#R-0002'
          - 'mitre-attack-flow#R-0026'
      - name: 'confidence'
        type: 'integer'
        required: false
        cardinality: '0..1'
        encoding: 'JSON integer'
        kind: 'stated'
        locator: 'docs/language.rst §STIX Common Properties L101-L106'
        description: 'The confidence property identifies the confidence that the creator has in the correctness of their data. The confidence value MUST be a number in the range of 0-100. Attack Flow uses a :ref:`confidence scale <confidence>` to convert from numerical confidence to human terms.'
        constraints:
          - description: 'Integer from 0 through 100 inclusive.'
            locator: 'docs/language.rst L101-L106, L622-L625'
            authority: 'external-stix-restated-by-language'
            kind: 'stated'
        minimum: 0
        maximum: 100
        mapping: 'confidence-scale'
        external_schema_locator: 'stix-dependencies/stix2.1/schemas/common/core.json/properties/confidence'
        external_schema_constraints:
          type: 'integer'
          minimum: 0
          maximum: 100
        external_schema_required: false
        constrained_by:
