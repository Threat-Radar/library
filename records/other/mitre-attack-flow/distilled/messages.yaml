      - 'mitre-attack-flow#R-0098'
  - description: 'The type dispatch covers exactly attack-flow, attack-action, attack-condition, attack-operator and attack-asset. Its final else is true, so unknown/custom types do not receive any Attack Flow object-specific schema.'
    locator: 'stix/attack-flow-schema-2.0.0.json /allOf/2'
    authority: 'attack-flow-local'
    kind: 'stated'
