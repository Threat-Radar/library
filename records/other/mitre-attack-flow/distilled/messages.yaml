          - 'mitre-attack-flow#R-0091'
          - 'mitre-attack-flow#R-0092'
          - 'mitre-attack-flow#R-0093'
          - 'mitre-attack-flow#R-0094'
          - 'mitre-attack-flow#R-0095'
      - name: 'external_references'
        type: 'array<external-reference>'
        required: false
        cardinality: '0..1'
        encoding: 'JSON array; elements encoded as JSON objects'
        kind: 'stated'
        locator: 'docs/language.rst §STIX Common Properties L107-L114'
        description: 'Citing the intelligence sources consulted for creating an Attack Flow is an important part of producing informative and trustworthy flows. You can include this property on the ``attack-flow`` object to cite the sources used for creating the flow, or you can include references on ``attack-action`` objects for fine-grained sourcing. For the STIX standard, see `STIX Chap. 2.5. <https://docs.oasis-open.org/cti/stix/v2.1/cs02/stix-v2.1-cs02.html#_72bcfr3t79jx>`__'
