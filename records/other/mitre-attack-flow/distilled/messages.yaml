note: 'Independent source-based extraction of all seven language-defined object types and all 48 rows in their property tables, the eight common-property rows described by the language, all 14 properties in the imported STIX core snapshot, the Attack Flow extension marker, and every member of the published extension bundle. External STIX datatypes and property rules are captured with their own provenance and exact schema facets. required and cardinality describe language/source-schema rules; published-instance presence is not converted into requiredness. Requirement cross-links were added only after independently checking the 109 requirement texts as contiguous source substrings and matching each object/field label to this artifact. Shared-field links and source-difference links preserve the distinction between language and schema constraints; no external-STIX rules are given invented record-local requirement ids.'
format:
  encoding: 'JSON, extending STIX 2.1'
  locator: 'docs/language.rst §Overview L7-L24'
  byte_layout: 'The cited Attack Flow sources define named JSON properties and arrays, without fixed byte offsets, binary fields, a byte-order rule, a canonical serialization, a character-encoding mandate, message framing or transport.'
  validation_unit: 'The Attack Flow JSON Schema validates one object. The prose exactly-one-attack-flow rule applies across a document and is not enforced by this object schema.'
  source_authority: 'docs/language.rst L22-L24 calls the JSON schema the formal specification; stix/attack-flow-schema-2.0.0.json /description calls it the normative definition. Language/schema differences are retained below rather than silently reconciled.'
