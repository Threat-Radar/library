  - id: 'mitre-attack-flow#R-0086'
    verb: 'none'
    actor: 'Attack Flow evaluator'
    condition: 'while evaluating an executing or chained action'
    object: 'attack-action'
    field: 'effect availability and chained action dependencies'
    locator: 'Effects; docs/language.rst:L600-L604'
    source_file: 'docs/language.rst'
    source_line_start: 600
    source_line_end: 604
    source_form: 'semantic-rule'
    normativity: 'definition'
    text: |-
      While an *action* is being executed, it's effect is an *indeterminate* state, i.e. we
      cannot make any statement about the outcome or result. Once the action concludes, then
      we can evaluate its effects, whether it succeeded or failed, etc. When one action is
      chained to another, the latter depends on the effects of the former, i.e. the second one
      can only execute when the first one completes successfully.
    kind: 'stated'
    testable: 'yes'
    notes: 'The source defines an indeterminate effect during execution and successful completion before a chained action can execute. Test a model or evaluator against these stated semantics; this is not a requirement that a consumer execute the adversary behavior.'
    non_bcp14: 'yes'
  - id: 'mitre-attack-flow#R-0087'
    verb: 'none'
    actor: 'Attack Flow evaluator'
    condition: 'when evaluating a condition'
    object: 'attack-condition'
    field: 'selection of one outgoing branch'
    locator: 'Effects; docs/language.rst:L606-L610'
    source_file: 'docs/language.rst'
    source_line_start: 606
    source_line_end: 610
    source_form: 'semantic-rule'
    normativity: 'definition'
    text: |-
      A *condition* splits a flow into multiple paths based on evaluating an effect, e.g. if
      the action is a privilege escalation exploit, then the condition can test whether the
      attacker has obtained elevated privileges (i.e. the exploit succeeded) or still has
      regular privileges (i.e. the exploit failed.) A condition always selects one path to
      follow, either the ``on_true_refs`` or the ``on_false_refs``.
    kind: 'stated'
    testable: 'yes'
    notes: 'The source states that a condition selects one path, either on_true_refs or on_false_refs. A path can reference several objects; this does not mean selecting one object from the chosen reference list.'
    non_bcp14: 'yes'
  - id: 'mitre-attack-flow#R-0088'
