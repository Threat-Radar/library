graph_evaluation:
  classification: represented_behavior_semantics
  note: >-
    These graph relationships are data-model semantics. They do not specify
    transport participants, an execution service, or an exchange protocol.
  rules:
    - id: graph-start
      subject: attack-flow.start_refs
      meaning: Identifies the attack-action or attack-condition objects that start the graph.
      locators:
        - "docs/language.rst, Attack Flow / start_refs, lines 162-165"
        - "stix/attack-flow-schema-2.0.0.json, /$defs/attack-flow/properties/start_refs"
    - id: action-dependency
      subject: attack-action.effect_refs
      meaning: >-
        Effects are indeterminate while an action is executing and may be
        evaluated after it concludes. A directly chained action depends on
        the preceding action completing successfully.
      locators:
        - "docs/language.rst, Attack Action / effect_refs, lines 263-266"
        - "docs/language.rst, Effects, lines 600-604"
        - "stix/attack-flow-schema-2.0.0.json, /$defs/attack-action/properties/effect_refs"
    - id: condition-branch
      subject: attack-condition.on_true_refs / attack-condition.on_false_refs
      meaning: >-
        A condition selects either its true branch or its false branch.
        When the condition is false and there are no false-branch objects,
        the graph halts at that node.
      locators:
        - "docs/language.rst, Attack Condition / on_true_refs and on_false_refs, lines 395-401"
        - "docs/language.rst, Effects, lines 606-610"
        - "stix/attack-flow-schema-2.0.0.json, /$defs/attack-condition/properties/on_true_refs"
        - "stix/attack-flow-schema-2.0.0.json, /$defs/attack-condition/properties/on_false_refs"
    - id: operator-join
      subject: attack-operator.operator / attack-operator.effect_refs
      meaning: >-
        An AND or OR operator combines input effects from attack paths.
        A true result leads to its referenced effects; a false result halts
        the graph at that operator.
      locators:
        - "docs/language.rst, Attack Operator, lines 429-454"
        - "docs/language.rst, Effects, lines 612-615"
        - "stix/attack-flow-schema-2.0.0.json, /$defs/attack-operator/properties/operator"
        - "stix/attack-flow-schema-2.0.0.json, /$defs/attack-operator/properties/effect_refs"
