schema: "library-examples/v1"
record: "cwe"
reviewed_by: ""
note: >-
  Expected results for every fixture in this directory. Validation results are actual xmllint runs (libxml2
  2.9.13) against schema/cwe_schema_v7.3.xsd with the W3C XHTML schemas resolved offline through an XML catalog
  (see README.md); exit 0 = valid, 3 = invalid. Semantic expectations were computed from each fixture and
  asserted equal to the same entry parsed from the full cwec_v4.20.xml, so they are what an importer must
  produce. Values are XML-decoded text (entities resolved); ids are integers. m2_mapping_decision is the state
  reached in state-machine.yaml M2 for a mapper that applies Mapping_Notes/Usage.
validation:
  command: "XML_CATALOG_FILES=$PWD/.cache/w3c-xhtml/catalog.xml xmllint --nonet --noout --schema records/other/cwe/distilled/schema/cwe_schema_v7.3.xsd records/other/cwe/distilled/examples/<fixture>"
  tool: "xmllint, libxml2 2.9.13 (libxml version 20913)"
  run_on: "2026-10-08"
  exit_codes:
    valid: 0
    invalid: 3
  wrapper: >-
    Each fixture = the 4.20 file's first bytes up to and including the Weakness_Catalog start tag (XML
    declaration, Name="CWE" Version="4.20" Date="2026-04-30", all namespace declarations and xsi:schemaLocation,
    verbatim), then for each container used: LF, TAB, container start tag, LF, each entry preceded by its original
    indentation and followed by LF, TAB, container end tag; then LF, </Weakness_Catalog>, LF. Only the entry bytes
    (catalog_bytes) are claimed verbatim; entry_sha256 is the SHA-256 of exactly those bytes in cwec_v4.20.xml.
