derivation:
  parser: "any namespace-aware XML parser; elements are in http://cwe.mitre.org/cwe-7, XHTML in http://www.w3.org/1999/xhtml"
  steps:
    - "entries = the children of Weakness_Catalog/Weaknesses, /Categories, /Views and /External_References; kind = the element name"
    - "Status, Abstraction, Structure, Type, ID, Name = the entry's attributes; Usage = text of Mapping_Notes/Usage; reasons = Mapping_Notes/Reasons/Reason/@Type in document order; suggestions = Mapping_Notes/Suggestions/Suggestion/@CWE_ID"
    - "distributions are plain counts over entries (or over relationship / mapping elements where stated); 'A / B' keys are cross-tabulations"
    - "Related_Weakness = Weakness/Related_Weaknesses/Related_Weakness; resolution looks the CWE_ID / View_ID / Chain_ID up among Weakness, Category and View IDs"
    - "membership = Category/Relationships/* and View/Members/* (Member_Of or Has_Member)"
    - "references = every Reference element carrying @External_Reference_ID anywhere inside an entry (entry References and Demonstrative_Example/References)"
    - "prose CWE ids = regular expression CWE-(\\d+) over the decoded text (including XHTML descendants) of Description / Summary / Objective, Extended_Description, Mapping_Notes/Rationale and Mapping_Notes/Comments"
    - "dates compare as ISO strings (all are xs:date YYYY-MM-DD); version strings are compared only for equality"
    - "invariant counts: holds = entries (or elements) satisfying the statement, of = the population it quantifies over"
  implementation: "agent scratchpad scripts (stdlib xml.parsers.expat; not committed)"
  cross_check: >-
    These figures were asserted equal to an earlier, separately written first pass over the same file:
    abstraction, abstraction_x_structure, abstraction_x_usage, counts, deprecated children,
    history.contribution_type, history.events, history.importance, mapping_fit, mapping_usage, membership,
    previous names aligned, reasons_by_usage, references, related_weakness.nature, related_weakness.ordinal,
    related_weakness.target_kind, related_weakness.view_id, status, status_x_usage, structure, suggestions,
    taxonomy entry_id/entry_name absent, taxonomy_name, view_type, xhtml. The invariants were computed once.
