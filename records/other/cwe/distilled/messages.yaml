    content: "sequence"
    documentation_lines: [18]
    instances_4_20: 1
    notes: >-
      The only global element declaration in the schema, so the root of every valid instance. The four containers
      are each optional but, when present, hold at least one entry, in the fixed order Weaknesses, Categories,
      Views, External_References. Five xs:unique constraints hang off this element (identity_constraints below);
      there is no xs:key / xs:keyref, so no cross-reference (CWE_ID, View_ID, Chain_ID, External_Reference_ID) is
      checked by the schema. The 4.20 root also carries xsi:schemaLocation, which XSD allows on any element without
      a declaration.
