  - name: "DetectionEffectivenessEnumeration"
    line: 681
    base: "xs:string"
    value_count: 6
    has_other_value: false
    closed_external_list: false
    used_by:
      - {declaration: "DetectionMethodsType/Detection_Method/Effectiveness", line: 391, observed_4_20: 737}
    values_used_in_4_20: 5
    documentation_lines: [683]
    documentation:
      - "The DetectionEffectivenessEnumeration simple type defines the different levels of effectiveness that a detection method may have in detecting an associated weakness. The value \"High\" is used to describe a method that succeeds frequently and does not result in many false reports. The value \"Moderate\" is used to describe a method that is applicable to multiple circumstances, but it may not have complete coverage of the weakness, or it may result in a number of incorrect reports. The \"SOAR Partial\" value means that according to SOAR this method can be cost-effective for partial coverage of the objective. The value \"Opportunistic\" is used to describe a method that does not directly target the weakness but may still succeed by chance, rather than in a reliable manner. The value \"Limited\" is used to describe a method that may be useful in limited circumstances, only applicable to a subset of potential instances of a given weakness type, requires training/customization, or gives limited visibility. Even in its limited capacity, this may be part of a good defense in depth strategy. The value \"None\" is used to describe a method that is highly unlikely to work. However, it may be included in an entry to emphasize common, yet incorrect, methods that developers might introduce."
    values:
      - {value: "High", line: 686, observed_4_20: 475}
      - {value: "Moderate", line: 687, observed_4_20: 93}
      - {value: "SOAR Partial", line: 688, observed_4_20: 150, doc: "Used to indicate that according to the IATAC State Of the Art Report (SOAR), the detection method is partially effective."}
      - {value: "Opportunistic", line: 693, observed_4_20: 8}
      - {value: "Limited", line: 694, observed_4_20: 11}
      - {value: "None", line: 695, observed_4_20: 0}
  - name: "EffectivenessEnumeration"
    line: 698
    base: "xs:string"
    value_count: 7
    has_other_value: false
    closed_external_list: false
    used_by:
      - {declaration: "PotentialMitigationsType/Mitigation/Effectiveness", line: 493, observed_4_20: 236}
    values_used_in_4_20: 7
    documentation_lines: [700]
    documentation:
      - "The EffectivenessEnumeration simple type defines the different values related to how effective a mitigation may be in preventing the weakness. A value of \"High\" means the mitigation is frequently successful in eliminating the weakness entirely. A value of \"Moderate\" means the mitigation will prevent the weakness in multiple forms, but it does not have complete coverage of the weakness. A value of \"Limited\" means the mitigation may be useful in limited circumstances, or it is only applicable to a subset of potential errors of this weakness type. A value of \"Incidental\" means the mitigation is generally not effective and will only provide protection by chance, rather than in a reliable manner. A value of \"Defense in Depth\" means the mitigation may not necessarily prevent the weakness, but it may help to minimize the potential impact of an attacker exploiting the weakness. A value of \"Discouraged Common Practice\" is used to indicate mitigations that are commonly attempted but known to be ineffective or highly risky."
    values:
      - {value: "High", line: 703, observed_4_20: 82}
      - {value: "Moderate", line: 704, observed_4_20: 51}
      - {value: "Limited", line: 705, observed_4_20: 38}
      - {value: "Incidental", line: 706, observed_4_20: 4}
      - {value: "Discouraged Common Practice", line: 707, observed_4_20: 10}
      - {value: "Defense in Depth", line: 708, observed_4_20: 50}
      - {value: "None", line: 709, observed_4_20: 1}
