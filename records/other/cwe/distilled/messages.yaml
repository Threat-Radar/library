note: >-
  The CWE XML Schema defines one data format and no exchange, so every structure it declares is a 'message': the
  root element, its four containers, all 31 named complexTypes and all 24 element-local anonymous complexTypes
  (60 entries, in file order of their declaration). Each field is one XSD declaration (element, attribute,
  wildcard, or simpleContent value) with its own line number. Element and attribute names are exactly as in the
  XSD; all elements are namespace-qualified, attributes unqualified. No default or fixed value is declared
  anywhere in the schema. Enumerations are listed by name under enumerations (34 named simpleTypes with 342
  values, plus the one anonymous simpleType on Contribution/@Type with 2 values: 344 xs:enumeration facets in
  all).
conventions:
  locator: "cwe_schema_v7.3.xsd L<line> › <path>; <line> is the xs:complexType line for a named type and the xs:element line for an element-local structure (its xs:complexType line is complex_type_line)"
  cardinality: "declared minOccurs..maxOccurs, an omitted minOccurs or maxOccurs being 1; attributes are 1..1 when use=\"required\", else 0..1 (use defaults to optional)"
  effective: "present only where a choice or repeating group changes the declared cardinality; derived from the content model"
  required: "true iff the effective minimum is at least 1 (elements) or use=\"required\" (attributes)"
  group: "the xs:choice a declaration sits in, with its branch"
  documented_at: "derived: lines of xs:documentation in the structure's own annotation or its owning named type's (or root element's) annotation whose text names the field as a whole word, case-sensitive; a pointer for the cross-check, not a claim of completeness"
  documentation_lines: "every xs:documentation line that describes the structure (own annotation, plus the owning named type's for element-local structures)"
  observed_4_20: "kind: observed — number of occurrences of that declaration in cwec_v4.20.xml, counted by a type-directed walk of the whole catalog (0 anomalies: every element and attribute resolved to exactly one declaration)"
  constrained_by: "filled by pass 3 (cross-check, agent C, 2026-10-08). An xsd requirement links to the field whose line is its locator line (cwe#R-0194 also to the xs:any that NotesType/Note inherits). A prose requirement links to the field(s) its object and field name. A required xs:choice (cwe#R-0096, cwe#R-0169) links to every field of its branches; an xs:unique to the ID, Name or Reference_ID fields it constrains; a rule on an enumeration value to every field typed by that enumeration. 191 of 198 requirements are linked (215 links on 128 of the 203 fields); the other 75 fields are optional declarations no requirement names. The 7 requirements that constrain no single field are listed under constrained_by_unlinked."
