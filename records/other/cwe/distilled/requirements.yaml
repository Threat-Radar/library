note: >
  SOURCE. CWE XML Schema 7.3 (cwe_schema_v7.3.xsd, 1345 lines, namespace http://cwe.mitre.org/cwe-7), the schema
  of the CWE List 4.20 XML. A pure data-format schema: its normative content is the prescriptive prose of its
  111 xs:documentation elements and the xs:appinfo terms_of_use, plus its structural constraints. IDS.
  cwe#R-NNNN, numbered in file order (line, then column) across both forms; stable, never reused. cwe#R-0198
  (L616) was appended by the verify pass, so it is the one id out of file order. LOCATOR.
  'cwe_schema_v7.3.xsd L<line> › <component path>': the line on which the quoted text starts, then the top-level
  component and, below it, element names, @attributes, xs:choice, xs:unique, xs:any or a quoted enumeration
  value. FORMS. prose = a sentence, or a contiguous part of one, from xs:documentation or the xs:appinfo
  terms_of_use; a sentence is split only where the parts are separately testable or constrain different fields
  (L83, L124, L146, L169, L409, L540, L556, L1050). xsd = a structural constraint; its text is the verbatim XSD
  start tag (the whole tag when self-closing), or for L2 the verbatim attribute substring of xs:schema. TEXT.
  Verbatim contiguous substrings of the source, compared with whitespace runs normalised to one space. Every
  text is in fact byte-exact: no extracted prose text spans the double spaces of L293, L616, L1017 or L1337 or
  the line breaks of L1144-L1149, and the xsd start tags keep the source's own double spaces (L420, L421). XML
  character references are kept as written (&lt; and &gt; in L540), not decoded. Spelling is the source's own.
  KIND. stated = the text states the rule. inferred = a rule derived from a descriptive sentence: the text is
  that verbatim sentence and inferred_rule states the rule in our words. 9 entries are inferred, all flagged
  (cwe#R-0198 added by the verify pass). ACTORS (fixed vocabulary).
  catalog-producer = whoever writes a CWE catalog instance (the MITRE CWE team for the official List); consumer
  = a tool or person importing or interpreting a catalog; mapper = anyone mapping a vulnerability, such as a CVE
  record, to a CWE ID (the source's external sources); licensee = anyone using or distributing the schema file.
  Xsd constraints bind the catalog-producer and are checked by schema validation. VERBS (fixed vocabulary).
  Prose: must, must not, should, should not, should-only ('should only', 'should be only one'), may (a
  permission), could (conditional permission, L1309), may-only ('can only have the value'), only (exclusive use
  stated in the indicative), will not, static ('considered static', 'meant to be static'), unique ('unique
  identifier', 'uniquely identify'), required ('is required'), closed ('limited vocabulary'), indicative (a rule
  stated in the indicative mood without a modal: a style rule, a structural co-constraint or a
  one-element-per-item rule; a sentence that only describes what an element contains is not a requirement),
  defines (a value definition that carries must, L1050, or that the source calls a quality requirement, L1017).
  Inferred: references (the value is the ID of an existing entry; the schema has no xs:key or xs:keyref, so this
  is prose-only), only, indicative. Xsd: namespace, root, required (use="required", or an element particle whose
  effective minOccurs is at least 1), required-in-branch (minOccurs at least 1 inside one branch of an
  xs:choice), required-one-of (an xs:choice whose effective minOccurs is 1), unique (xs:unique; selector and
  xpath_field give its XPaths), bounded, any-restricted (xs:any limited to the XHTML namespace, processContents
  strict). EFFECTIVE MINOCCURS. An omitted minOccurs or maxOccurs is 1. A particle is required when its own
  minOccurs is at least 1 and no compositor between it and its enclosing element or type has minOccurs 0. A
  required child of an optional element is required whenever that parent is present (the field path and note
  show the parent). BOUNDED RULE. A maxOccurs="1" bound gets its own entry only on an optional leaf where a list
  would otherwise be plausible: (a) an element of the same name is repeatable elsewhere (Note at L284 and L443
  against NotesType/Note at L454), or (b) the leaf is itself enumeration-typed and an enumeration-typed sibling
  in the same structure repeats (Consequence/Likelihood L283 beside Scope and Impact; Mitigation/Strategy L491
  and Mitigation/Effectiveness L493 beside Phase; Mitigation/Effectiveness_Notes L494 is StructuredText, not an
  enumeration, so it gets no entry). For required particles the bound is in cardinality, and where rule (a) or
  (b) applies it is also noted (Introduction/Phase, L442; Observed_Example/Reference, L473). Wrapper containers
  (Weaknesses, Related_Weaknesses and the like) and single-valued scalars are not recorded. NOT ENUMERATED HERE (normative.md and the schema and messages
  artifacts carry them): xs:sequence order, datatypes, and the 344 closed enumeration values. An enumeration
  appears here only where the prose states a rule about it (L417, L540, L813, L845, L859, L1294-L1309). EXCLUDED
  PROSE. Definitions of terms and values (other than L1017 Draft and Usable, L1050, and the L616 Compound
  co-constraint, cwe#R-0198), descriptions of what an element contains, purpose statements, examples, pointers ('Please refer to ...'), structural labels, and
  permissions that only restate optionality (L169 'Not all of the elements need to be used', L214 'an optional
  Common Platform Enumeration (CPE) identifier can be used'); all of it is quoted in normative.md. EXTRA FIELDS.
  cardinality (xsd element particles and choices), selector and xpath_field (xs:unique), inferred_rule (inferred
  entries), related (requirements that restate or enforce this one), note (extractor's remark, not source text).
  PASS. Pass-1 extraction by agent A, 2026-10-08. Pass 2 (verify) and pass 3 (cross-check) by agent C,
  2026-10-08: checks, defects and fixes are in verification.md.
