source_defects:
  - id: "D-01"
    kind: "label-contradiction"
    lines: "L123 L133"
    finding: 'CategoryType documentation calls Content_History optional (L123); the declaration has minOccurs="1" (L133). The declaration governs validation.'
  - id: "D-02"
    kind: "label-contradiction"
    lines: "L145 L156"
    finding: 'ViewType documentation calls Content_History optional (L145); the declaration has minOccurs="1" (L156).'
  - id: "D-03"
    kind: "label-contradiction"
    lines: "L199 L206"
    finding: 'AlternateTermsType documentation calls Description required (L199); the declaration has minOccurs="0" (L206).'
  - id: "D-04"
    kind: "label-contradiction"
    lines: "L251 L258"
    finding: 'AudienceType documentation calls Description required (L251); the declaration has minOccurs="0" (L258).'
  - id: "D-05"
    kind: "label-contradiction"
    lines: "L274 L282"
    finding: 'CommonConsequencesType documentation calls Impact optional (L274); the declaration has minOccurs="1" (L282).'
  - id: "D-06"
    kind: "wrong-value-name"
    lines: "L714 L734"
    finding: 'FunctionalAreaEnumeration documentation names the value "Functional-Area-Independent" (L714); no such value exists, the declared value is "Not Functional-Area-Specific" (L734).'
  - id: "D-07"
    kind: "wrong-type-name"
    lines: "L434 L436"
    finding: 'The documentation names "ModeOfIntroductionType" (L436); the type is declared ModesOfIntroductionType (L434).'
  - id: "D-08"
    kind: "value-case"
    lines: "L1337 L1064 L1065"
    finding: 'StructuredCodeType documentation refers to Nature "good" or "bad" (L1337); the enumeration values are Good and Bad (L1064, L1065), and enumeration matching is case-sensitive.'
  - id: "D-09"
    kind: "example-markup"
    lines: "L1329 L1332"
    finding: 'StructuredTextType documentation shows XHTML examples in upper case (BR, UL, LI, OL, DIV; L1329). XHTML 1.0 Strict element names are lower case, and xs:any with processContents="strict" (L1332) validates against that schema, so the examples taken literally would not validate.'
  - id: "D-10"
    kind: "ambiguous-rule"
    lines: "L540"
    finding: "In 'For each unique triple of &lt;Nature, CWE_ID, View_ID&gt;' (L540) CWE_ID may be Related_Weakness/@CWE_ID (the target), which makes the rule vacuous, or the owning entry's ID, which means at most one Primary per Nature and View_ID within an entry."
  - id: "D-11"
    kind: "ambiguous-semantics"
    lines: "L145 L556 L558"
    finding: 'ViewType documentation says Members defines "Member_Of relationships with categories" (L145); RelationshipsType documentation says Member_Of denotes categories included in the target view and Has_Member what a category groups (L556). The xs:choice (L558) allows either, so which element a View''s Members carries is not stated consistently.'
  - id: "D-12"
    kind: "imprecise-description"
    lines: "L540 L973"
    finding: 'RelatedWeaknessesType is described as referring to weaknesses "that differ only in their level of abstraction" (L540), but RelatedNatureEnumeration (L973) includes natures that are not abstraction relations (StartsWith, CanFollow, CanPrecede, RequiredBy, Requires, CanAlsoBe, PeerOf).'
  - id: "D-13"
    kind: "scope-wider-than-name"
    lines: "L59 L60 L61"
    finding: "The identity constraint named uniqueWeaknessName selects ./cwe:*/cwe:* (L60): every child of every top-level container. External_Reference has no @Name, so @Name is unique across all Weaknesses, Categories and Views together, not only among weaknesses."
  - id: "D-14"
    kind: "integrity-not-enforced"
    lines: "L55 L63 L67"
    finding: "IDs are unique only within each kind (uniqueWeaknessID L55, uniqueCategoryID L63, uniqueViewID L67); nothing makes Weakness, Category and View IDs disjoint, although MemberType/@CWE_ID and Related_Weakness/@CWE_ID name entries by a single CWE_ID. The schema declares no xs:key or xs:keyref, so no reference (External_Reference_ID, CWE_ID, View_ID, Chain_ID) is checked by validation."
  - id: "D-15"
    kind: "inconsistent-definition"
    lines: "L683 L690"
    finding: '"SOAR Partial" is described as "can be cost-effective for partial coverage of the objective" in the type documentation (L683) and as "the detection method is partially effective" in the value documentation (L690).'
  - id: "D-16"
    kind: "typos"
    lines: "L123 L214 L409 L540 L867 L1060 L1085 L1146 L1175"
    finding: 'Spelling and grammar slips kept verbatim, not corrected: "taxomomies" (L123, L1085), "to a identify" (L214), "functional_area elements" for Functional_Area (L409), "the valid value and meanings" (L540), "used to indicates" (L867), "sinple type" and "eample" (L1060), "artifacts understand" missing "to" (L1146), "Techology" (L1175).'

