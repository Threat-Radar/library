  extracted texts contain 0 (bin/_bcp14.py count over all text values), so 0 = 0. (2) The document's own
  normative baseline, extracted here, is 198 entries = 85 prose (76 stated + 9 inferred) + 113 xsd. Stated prose
  by verb: should 38, indicative 6, unique 5, defines 4, must 4, should not 4, static 3, may 2, may-only 2,
  should-only 2, closed 1, could 1, must not 1, only 1, required 1, will not 1. Inferred by verb: references 5,
  indicative 3, only 1 (cwe#R-0198, indicative, was added by the verify pass and holds no keyword, so the
  keyword figures below are unchanged). Xsd by verb: required 92, bounded 5, unique 5, required-in-branch 4,
  any-restricted 2, namespace 2, required-one-of 2, root 1. The xsd set is complete against the structure: 35 use="required"
  attributes; 57 element particles with explicit minOccurs="1" (53 required + 4 required-in-branch); 4 element
  particles that omit minOccurs and are therefore required (Submission L296, Submission_Date L306,
  Submission_Version L307, Submission_ReleaseDate L308); 2 xs:choice with effective minOccurs 1 (L299, L558); 5
  xs:unique; 2 restricted xs:any; 5 bounded maxOccurs; 2 schema-level namespace attributes; 1 document element.
  Not recorded: Body_Text and Example_Code (L370, L371), whose default minOccurs 1 sits inside the optional
  xs:choice at L369. (3) Lower-case keywords, counted longest match first (a 'must not' or 'should not' is one
  occurrence and not also a must or should; this reproduces the measured counts must 6, must not 1, should 42,
  should not 5, may 32, required 72, optional 39). Of 197 occurrences, 35 are markup (use="required"), each the
  text of an xsd requirement. The other 162 are prose: 161 in xs:documentation and 1 (must, L10) in the
  xs:appinfo terms_of_use. Extracted as the operative word of a requirement / total: must 6/6; must not 1/1;
  should 40/42; should not 4/5; may 2/32; required 1/37; optional 0/39; 54 extracted, 108 excluded. Excluded: 75
  structural labels ('The required X attribute', 'The optional Y element': required 36, optional 39), each
  checked against its declaration, 70 consistent and 5 contradicting it (source_defects); 16 may of possibility,
  9 may inside value definitions, 4 may in examples, 1 may of purpose; 3 should / should not embedded in a
  clause that says what an element records (L360, L417, L503). Rules: a keyword is extracted when it is the
  operative modal of a sentence that directs an actor or constrains a value; may only when it grants a
  permission (L683, L1304); a definition of a term or value is not a requirement unless it carries must or
  should (L1050), the source calls it a requirement (Draft and Usable, L1017), or it ties two attributes together
  (the Compound co-constraint, L616, cwe#R-0198, added by the verify pass); a 'the required / the optional
  X' label restates the declaration and is cross-checked, not extracted. Occurrence by occurrence:
  keyword_accounting.
