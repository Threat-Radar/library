schema: "library-state-machine/v1"
record: "cwe"
reviewed_by: ""
note: >-
  The CWE XML Schema is a data format: it defines no protocol and no message exchange. Three things in it have a
  lifecycle or act as a guard, and are modelled here: an entry's Status (M1), the Mapping_Notes/Usage guard a
  mapper applies (M2), and an entry's Content_History, which is an event log (M3). State names are the schema's
  enumeration values where it has them and ours otherwise. kind: stated = the XSD documentation says it (quoted
  verbatim, with the line of schema/cwe_schema_v7.3.xsd); inferred = derived from stated definitions, with the
  evidence; observed = holds in CWE 4.20, with counts and the invariant ids of examples/catalog-stats.yaml. A
  catalog-release is the only clock. The XML carries no status history, so no status transition is directly
  observable in one release; what the data shows is the current states and the invariants that hold in them.
events:
  - name: "catalog-release"
    kind: "stated"
    definition: "a new version of the catalog is published: a Weakness_Catalog document identified by its Name, Version and Date"
    quote: "The required Name and Version attributes are used to uniquely identify the catalog. The required Date attribute identifies the date when this catalog was created or last updated."
    locator: "cwe_schema_v7.3.xsd L18"
    carried_by: "Weakness_Catalog/@Name, @Version, @Date (L51-53); every Content_History event repeats the release in *_Version / *_ReleaseDate"
    observed_4_20: "Version 4.20, Date 2026-04-30; 63 distinct version strings occur in Content_History, from 'Draft 3' to '4.20'"
  - name: "release-diff:status-changed"
    kind: "inferred"
    definition: "an entry's @Status differs between two catalog-releases. Not recorded in the XML: Content_History has no status field and no 4.20 Modification_Comment names the Status field (0 of 16,575); a consumer detects it only by comparing releases"
  - name: "content-history:submission"
    kind: "stated"
    element: "Content_History/Submission (L296)"
    cardinality: "exactly 1 per entry (no minOccurs / maxOccurs, so 1..1)"
    required_fields: ["Submission_Name or Submission_Organization (choice L299)", "Submission_Date (xs:date)", "Submission_Version", "Submission_ReleaseDate (xs:date)"]
    optional_fields: ["Submission_Organization after Submission_Name", "Submission_Comment"]
    quote: "The required Submission element is used to identify the submitter and/or their organization, the date on which the submission was made, the CWE version and release date in which the new CWE entry was added, and any optional comments related to an entry."
    locator: "cwe_schema_v7.3.xsd L293"
  - name: "content-history:modification"
    kind: "stated"
    element: "Content_History/Modification (L313)"
    cardinality: "0..unbounded"
    required_fields: ["Modification_Date (xs:date)"]
    optional_fields: ["Modification_Name", "Modification_Organization", "Modification_Version", "Modification_ReleaseDate", "Modification_Importance (Normal | Critical)", "Modification_Comment"]
    quote: "The optional Modification element is used to identify a modifier's name, organization, the date on which the Modification was made or suggested, the CWE version and release date in which the modification first appeared, and any related comments. A new Modification element should exist for each change made to the content."
    locator: "cwe_schema_v7.3.xsd L293"
    observed_4_20: "16,575 modifications; Modification_Version and Modification_ReleaseDate present on all of them"
  - name: "content-history:modification[critical]"
    kind: "stated"
    element: "Content_History/Modification with Modification_Importance = Critical (L321; ImportanceEnumeration L743-751)"
    quote: "Modifications that change the meaning of the entry, or how it might be interpreted, should be marked with an importance of critical to bring it to the attention of anyone previously dependent on the weakness."
    locator: "cwe_schema_v7.3.xsd L293"
    observed_4_20: "23 (21 Weakness, 2 View); listed in catalog-stats.yaml content_history.critical_modifications"
  - name: "content-history:contribution"
    kind: "stated"
    element: "Content_History/Contribution (L326)"
    cardinality: "0..unbounded"
    required_fields: ["@Type (Content | Feedback)", "Contribution_Date (xs:date)"]
    optional_fields: ["Contribution_Name", "Contribution_Organization", "Contribution_Version", "Contribution_ReleaseDate", "Contribution_Comment"]
    quote: "The optional Contribution element is used to identify a contributor's name, organization, the date, the CWE version and release date in which the contribution first appeared, and any related comments. This element has a single Type attribute, which indicates whether the contribution was part of general feedback given or actual content that was donated."
    locator: "cwe_schema_v7.3.xsd L293"
    observed_4_20: "283 (Content 235, Feedback 48)"
  - name: "content-history:previous-entry-name"
    kind: "stated"
    element: "Content_History/Previous_Entry_Name (L346)"
    cardinality: "0..unbounded"
    required_fields: ["element value: the former name (xs:string)", "@Date (xs:date)"]
    optional_fields: ["@Version"]
    quote: "The optional Previous_Entry_Name element is used to describe a previous name that was used for the entry. This should be filled out whenever a substantive name change occurs. The required Date attribute lists the date on which this name was no longer used, typically the date of the first CWE release that changed the previous name.  A Previous_Entry_Name element should align with a corresponding Modification element."
    locator: "cwe_schema_v7.3.xsd L293"
    observed_4_20: "925 (Version attribute on 4)"
  - name: "mapping-request"
    kind: "inferred"
    definition: "a mapper proposes CWE-<n> as the weakness underlying a real-world vulnerability (root cause analysis)"
    quote: "The Usage element describes whether the CWE should be used for mapping vulnerabilities to their underlying weaknesses as part of root cause analysis."
    locator: "cwe_schema_v7.3.xsd L417"
  - name: "review-completed"
    kind: "inferred"
    definition: "the careful review that Allowed-with-Review calls for has been done, with an accept or reject outcome"
    quote: "this CWE ID could be used to map to real-world vulnerabilities in limited situations requiring careful review"
    locator: "cwe_schema_v7.3.xsd L1309"
  - name: "suggestion-followed"
    kind: "stated"
    definition: "the mapper replaces the candidate with a Mapping_Notes/Suggestions/Suggestion/@CWE_ID of the current candidate"
    quote: "The Suggestions element includes suggestions for additional CWEs that might be more appropriate for the mapping task."
    locator: "cwe_schema_v7.3.xsd L417"
  - name: "prose-successor-followed"
    kind: "inferred"
    definition: "the mapper replaces a Deprecated candidate with a CWE named in its prose (Description / Summary / Objective, Mapping_Notes Rationale or Comments) because no Suggestion exists — the case for 22 of the 25 Deprecated weaknesses (catalog-stats.yaml deprecated_successors)"
  - name: "consumer-sync"
    kind: "inferred"
    definition: "a consumer (e.g. an importer) ingests a newer catalog-release than the one it holds"
  - name: "consumer-review"
    kind: "inferred"
    definition: "a consumer that depends on an entry has re-read it after a change"
machines:
  - id: "M1"
    name: "entry-status"
    entity: "a Weakness, Category or View entry, identified by its ID; the state is its @Status (cwe:StatusEnumeration)"
    locator: "cwe_schema_v7.3.xsd L1015-1027 (StatusEnumeration; documentation L1017); @Status at L114 (WeaknessType), L137 (CategoryType), L161 (ViewType); ID permanence at L83, L124, L146"
    initial: "(not in catalog)"
    states:
      - name: "(not in catalog)"
        kind: "inferred"
        definition: "pseudo-state: the ID has not been published in any catalog-release"
      - name: "Incomplete"
        kind: "stated"
        quote: "A value of Incomplete means that the entity does not have all important elements filled, and there is no guarantee of quality."
        locator: "cwe_schema_v7.3.xsd L1017"
        observed_4_20: {Weakness: 486, Category: 185, View: 18}
      - name: "Draft"
        kind: "stated"
        quote: "A value of Draft refers to an entity that has all important elements filled, and critical elements such as Name and Description are reasonably well-written; the entity may still have important problems or gaps."
        locator: "cwe_schema_v7.3.xsd L1017"
        observed_4_20: {Weakness: 432, Category: 70, View: 18}
      - name: "Usable"
        kind: "stated"
        quote: "A value of Usable refers to an entity that has received close, extensive review, with critical elements verified."
        locator: "cwe_schema_v7.3.xsd L1017"
        observed_4_20: {Weakness: 0, Category: 0, View: 0}
      - name: "Stable"
        kind: "stated"
        quote: "A value of Stable indicates that all important elements have been verified, and the entry is unlikely to change significantly in the future."
        locator: "cwe_schema_v7.3.xsd L1017"
        observed_4_20: {Weakness: 26, Category: 46, View: 8}
      - name: "Deprecated"
        kind: "stated"
        quote: "A value of Deprecated refers to an entity that has been removed from CWE, likely because it was a duplicate or was created in error."
        locator: "cwe_schema_v7.3.xsd L1017"
        terminal: true
        observed_4_20: {Weakness: 25, Category: 35, View: 4}
      - name: "Obsolete"
        kind: "stated"
        quote: "A value of Obsolete is used when an entity is still valid but no longer is relevant, likely because it has been superseded by a more recent entity."
        locator: "cwe_schema_v7.3.xsd L1017"
        terminal: false
        terminal_note: "no exit back to an active state; its one modelled exit is the inferred Obsolete -> Deprecated transition"
        observed_4_20: {Weakness: 0, Category: 86, View: 11}
    caveat:
      quote: "Note that the quality requirements for Draft and Usable status are very resource-intensive to accomplish, while some Incomplete and Draft entries are actively used by the general public; so, this status enumeration might change in the future."
      locator: "cwe_schema_v7.3.xsd L1017"
    transitions:
      - from: "(not in catalog)"
        to: "Incomplete | Draft | Stable | Obsolete"
        trigger: "catalog-release"
        accompanied_by: ["content-history:submission"]
        guard: "the release adds the entry; the XSD defines no initial Status"
        kind: "observed"
        locator: "cwe_schema_v7.3.xsd L1015-1027 (no initial value defined); cwec_v4.20.xml (observed)"
        evidence: "entries never modified since their Submission hold Incomplete (14), Draft (View 1424), Stable (View 1432) or Obsolete (Category 1433, submitted in 4.18). Status can therefore be set at submission, or change without any Modification being recorded."
      - from: "Incomplete"
        to: "Draft"
        trigger: "catalog-release"
        accompanied_by: ["release-diff:status-changed", "content-history:modification"]
        guard: "all important elements filled; Name and Description reasonably well-written (the Draft definition)"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L1017"
        evidence: "the definitions are ordered by how much of the entry is filled and verified: Incomplete lacks what Draft has"
      - from: "Draft"
        to: "Usable"
        trigger: "catalog-release"
        accompanied_by: ["release-diff:status-changed"]
        guard: "close, extensive review done; critical elements verified (the Usable definition)"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L1017"
        evidence: "definition ordering"
      - from: "Usable"
        to: "Stable"
        trigger: "catalog-release"
        accompanied_by: ["release-diff:status-changed"]
        guard: "all important elements verified; entry unlikely to change significantly (the Stable definition)"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L1017"
        evidence: "definition ordering"
      - from: "Incomplete | Draft"
        to: "Stable"
        trigger: "catalog-release"
        accompanied_by: ["release-diff:status-changed"]
        guard: "as for Usable -> Stable"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L1017; cwec_v4.20.xml (observed)"
        evidence: "Usable is used by no entry in 4.20 (0 of 1,450) while 80 entries are Stable, so Usable is not a required intermediate in practice; the caveat says the enumeration 'might change in the future'"
      - from: "Obsolete"
        to: "Deprecated"
        trigger: "catalog-release"
        accompanied_by: ["release-diff:status-changed", "content-history:modification", "content-history:previous-entry-name"]
        guard: "as for the active states"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L83, L124, L146"
        evidence: "the 'becomes deprecated' statements do not depend on the prior Status, but no Obsolete-to-Deprecated case is documented, and none can be seen in one release"
      - from: "Incomplete | Draft | Usable | Stable"
        to: "Deprecated"
        trigger: "catalog-release"
        accompanied_by: ["release-diff:status-changed", "content-history:modification", "content-history:previous-entry-name"]
        guard: "removed from CWE, 'likely because it was a duplicate or was created in error' (L1017)"
        kind: "stated"
        locator: "cwe_schema_v7.3.xsd L83, L124, L146, L1017"
        statements:
          - quote: "If this entry becomes deprecated, the identifier will not be reused."
            locator: "cwe_schema_v7.3.xsd L83"
          - quote: "If the category becomes deprecated, the ID should not be reused, and a placeholder for the deprecated category should be left in the catalog."
            locator: "cwe_schema_v7.3.xsd L124"
          - quote: "If the view becomes deprecated, the ID should not be reused, and a placeholder for the deprecated view should be left in the catalog."
            locator: "cwe_schema_v7.3.xsd L146"
        observed: "the rename to 'DEPRECATED: <name>' is recorded as a Previous_Entry_Name (every Deprecated entry has one: I06). 4 of the 25 Deprecated weaknesses carry a Critical modification tied to their deprecation (CWE-247 and CWE-292: 'CWE-247 and CWE-292 deprecated and merged into CWE-350 to address duplicates.'; CWE-373: 'Deprecated entry'; CWE-249: already 'slated for deprecation'), and the same merge put a Critical modification on the successor, CWE-350 (quotes from Modification_Comment in cwec_v4.20.xml)"
      - from: "Incomplete | Draft | Usable | Stable"
        to: "Obsolete"
        trigger: "catalog-release"
        accompanied_by: ["release-diff:status-changed"]
        guard: "still valid but no longer relevant, 'likely because it has been superseded by a more recent entity' (L1017)"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L1017; cwec_v4.20.xml (observed)"
        evidence: "the XSD defines the value but never says an entity 'becomes' obsolete; in 4.20 only Category (86, e.g. the OWASP Top Ten 2010/2013 categories) and View (11) entries are Obsolete"
    terminal_states: ["Deprecated"]
    terminal_basis:
      - state: "Deprecated"
        kind: "stated"
        basis: "'removed from CWE' (L1017) and the identifier is never reused (L83, L124, L146)"
      - state: "Obsolete"
        kind: "inferred"
        basis: "not terminal: the 'becomes deprecated' statements (L83, L124, L146) do not depend on the prior Status, so Obsolete -> Deprecated is modelled (inferred). No exit back to an active state is documented, and nothing in 4.20 contradicts that (a single release cannot show an exit)"
    not_modelled: "regressions (e.g. Stable -> Draft), any exit from Deprecated, and any exit from Obsolete other than Obsolete -> Deprecated: neither documented nor observable in one release"
    error_states: []
    error_note: "no lifecycle error state; a Status outside StatusEnumeration is a schema-validation failure (examples/neg-status-out-of-enumeration.xml)"
    deprecated_entry_keeps:
      - what: "its ID, permanently"
        kind: "stated"
        basis: "L83 (Weakness), L124 (Category), L146 (View)"
      - what: "a placeholder entry in the catalog"
        kind: "stated (Category L124, View L146); observed for Weakness"
        basis: "all 64 Deprecated entries are present in 4.20 (Weakness 25, Category 35, View 4)"
      - what: "Name prefixed 'DEPRECATED: '"
        kind: "observed"
        invariants: ["catalog-stats.yaml#I05 (1450/1450)"]
      - what: "its former name, as a Previous_Entry_Name"
        kind: "observed"
        invariants: ["catalog-stats.yaml#I06 (64/64)", "catalog-stats.yaml#I07 (56/64)"]
      - what: "Mapping_Notes with Usage Prohibited and Reason Deprecated"
        kind: "observed"
        invariants: ["catalog-stats.yaml#I01 (64/64)", "catalog-stats.yaml#I02 (64/64)"]
      - what: "only Description (Weakness) / Summary (Category) / Objective (View), Mapping_Notes, Content_History, and occasionally Extended_Description or Filter"
        kind: "observed"
        invariants: ["catalog-stats.yaml#I08 (64/64)"]
      - what: "no inbound edges: never the target of a Related_Weakness or Has_Member"
        kind: "observed"
        invariants: ["catalog-stats.yaml#I10 (1602/1602)", "catalog-stats.yaml#I11 (5024/5024)"]
      - what: "a successor pointer only sometimes: Mapping_Notes/Suggestions on 2 of 25 Deprecated weaknesses (534 -> 532, 769 -> 774), prose only on 22, none named on 1 (CWE-216); Category 0 / 7 / 28; View 0 / 0 / 4"
        kind: "observed"
        basis: "catalog-stats.yaml deprecated_successors; fixtures weakness-1187-deprecated.xml (prose), weakness-769-deprecated-suggestion.xml (Suggestion)"
      - what: "deprecated implicit views keep a Filter that selects nothing: /Weakness_Catalog[false()] (679, 999)"
        kind: "observed"
        invariants: ["catalog-stats.yaml#I31 (17/17)"]
    obsolete_entry_keeps:
      - what: "its full content and name"
        kind: "observed"
        invariants: ["catalog-stats.yaml#I09 (97/97)"]
  - id: "M2"
    name: "mapping-usage-guard"
    entity: "one mapping decision: a real-world vulnerability x a candidate CWE entry (Weakness, Category or View)"
    role: "the guard a consumer or mapper applies before recording CWE-<n> as the weakness underlying a vulnerability"
    locator: "cwe_schema_v7.3.xsd L415-426 (MappingNotesType; documentation L417), L1287-1313 (UsageEnumeration), L501-512 (ReasonsType), L952-970 (ReasonEnumeration), L566-578 (SuggestionsType)"
    guard_input: "Mapping_Notes/Usage (required on every Weakness L106, Category L131 and View L154)"
    guard_values:
      - value: "Allowed"
        quote: "this CWE ID may be used to map to real-world vulnerabilities"
        locator: "cwe_schema_v7.3.xsd L1304"
        observed_4_20: {Weakness: 749}
      - value: "Allowed-with-Review"
        quote: "this CWE ID could be used to map to real-world vulnerabilities in limited situations requiring careful review"
        locator: "cwe_schema_v7.3.xsd L1309"
        observed_4_20: {Weakness: 93}
      - value: "Discouraged"
        quote: "this CWE ID should not be used to map to real-world vulnerabilities"
        locator: "cwe_schema_v7.3.xsd L1294"
        observed_4_20: {Weakness: 44}
      - value: "Prohibited"
        quote: "this CWE ID must not be used to map to real-world vulnerabilities"
        locator: "cwe_schema_v7.3.xsd L1299"
        observed_4_20: {Weakness: 83, Category: 422, View: 59}
    initial: "candidate"
    states:
      - name: "candidate"
        kind: "inferred"
        definition: "a CWE ID proposed for the vulnerability; Usage not yet applied"
      - name: "under-review"
        kind: "inferred"
        definition: "candidate's Usage is Allowed-with-Review; the careful review is pending"
      - name: "mapped"
        kind: "inferred"
        definition: "the mapping is recorded"
      - name: "rejected-discouraged"
        kind: "inferred"
        definition: "Usage Discouraged: 'should not be used' (L1294)"
      - name: "rejected-prohibited"
        kind: "inferred"
        definition: "Usage Prohibited: 'must not be used' (L1299)"
      - name: "stale"
        kind: "inferred"
        definition: "a recorded mapping whose target, in a later catalog-release, no longer has Usage Allowed or Allowed-with-Review — e.g. it was deprecated (Deprecated => Prohibited, I01)"
    transitions:
      - from: "candidate"
        to: "mapped"
        trigger: "mapping-request"
        guard: "Usage = Allowed"
        kind: "stated"
        quote: "this CWE ID may be used to map to real-world vulnerabilities"
        locator: "cwe_schema_v7.3.xsd L1304"
      - from: "candidate"
        to: "under-review"
        trigger: "mapping-request"
        guard: "Usage = Allowed-with-Review"
        kind: "stated"
        quote: "in limited situations requiring careful review"
        locator: "cwe_schema_v7.3.xsd L1309"
      - from: "under-review"
        to: "mapped"
        trigger: "review-completed"
        guard: "the reviewer accepts: the vulnerability is one of the limited situations (Mapping_Notes Rationale / Comments describe them)"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L1309, L417"
      - from: "under-review"
        to: "candidate"
        trigger: "suggestion-followed"
        guard: "the reviewer rejects and the entry has Mapping_Notes/Suggestions; the new candidate is a Suggestion/@CWE_ID"
        kind: "stated"
        quote: "The Suggestions element includes suggestions for additional CWEs that might be more appropriate for the mapping task."
        locator: "cwe_schema_v7.3.xsd L417"
      - from: "candidate"
        to: "rejected-discouraged"
        trigger: "mapping-request"
        guard: "Usage = Discouraged"
        kind: "stated"
        quote: "this CWE ID should not be used to map to real-world vulnerabilities"
        locator: "cwe_schema_v7.3.xsd L1294"
      - from: "candidate"
        to: "rejected-prohibited"
        trigger: "mapping-request"
        guard: "Usage = Prohibited"
        kind: "stated"
        quote: "this CWE ID must not be used to map to real-world vulnerabilities"
        locator: "cwe_schema_v7.3.xsd L1299"
      - from: "rejected-discouraged | rejected-prohibited"
        to: "candidate"
        trigger: "suggestion-followed"
        guard: "the rejected entry has Mapping_Notes/Suggestions/Suggestion; the new candidate is its CWE_ID and the guard is applied again"
        kind: "stated"
        quote: "The Suggestions element includes suggestions for additional CWEs that might be more appropriate for the mapping task."
        locator: "cwe_schema_v7.3.xsd L417"
        observed: "63 Suggestions in 4.20, all on Weakness entries (source Usage: Discouraged 48, Allowed-with-Review 8, Prohibited 5, Allowed 2); every target is a non-Deprecated Weakness (I23) but 3 targets are themselves Discouraged — so re-applying the guard after a suggestion is not optional"
      - from: "rejected-prohibited"
        to: "candidate"
        trigger: "prose-successor-followed"
        guard: "the rejected entry is Deprecated and has no Suggestion; the new candidate is a CWE named in its prose"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L1017 (Deprecated), L424 (Suggestions optional); cwec_v4.20.xml (observed)"
        observed: "22 of 25 Deprecated weaknesses name their successor only in prose (fixture weakness-1187-deprecated.xml: 'This entry has been deprecated because it was a duplicate of CWE-908. All content has been transferred to CWE-908.'); CWE-216 names none"
      - from: "mapped"
        to: "stale"
        trigger: "catalog-release"
        accompanied_by: ["release-diff:status-changed"]
        guard: "the mapped entry's Usage in the new release is Discouraged or Prohibited"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L420 (Usage), L1287-1313"
      - from: "stale"
        to: "candidate"
        trigger: "mapping-request"
        guard: "re-map, starting from the stale entry's Suggestions or prose successor"
        kind: "inferred"
        locator: "cwe_schema_v7.3.xsd L417"
    terminal_states: []
    outcome_states: ["mapped", "rejected-discouraged", "rejected-prohibited"]
    terminal_note: "no state is absorbing: the outcome states end one mapping decision, but mapped -> stale (catalog-release) and rejected-* -> candidate (suggestion-followed, prose-successor-followed) leave them"
    error_states: ["stale"]
    error_note: "stale is the error state for a store of mappings: a recorded mapping that the current release's guard would refuse"
    relation_to_status:
      - kind: "observed"
        statement: "Status Deprecated => Usage Prohibited, with no exception (Weakness 25, Category 35, View 4)"
        invariants: ["catalog-stats.yaml#I01 (64/64)", "catalog-stats.yaml#I02 (64/64)"]
      - kind: "observed"
        statement: "every Category and every View is Prohibited (Reason Category / View; Deprecated views carry Reason Deprecated instead), so Usage alone is a sufficient guard — a mapper needs no separate status or entry-kind check"
        invariants: ["catalog-stats.yaml#I03 (422/422)", "catalog-stats.yaml#I04 (59/59)"]
      - kind: "observed"
        statement: "Prohibited does not imply Deprecated: 58 non-deprecated weaknesses are Prohibited, all Incomplete. 57 (IDs between 1041 and 1125) have Reason Other and the Rationale 'This entry is primarily a quality issue with no direct security implications.'; CWE-391 has Reasons Potential Deprecation, Frequent Misuse, Frequent Misinterpretation and a Rationale beginning 'This entry is slated for deprecation;' (quotes from cwec_v4.20.xml)"
      - kind: "observed"
        statement: "Weakness Status x Usage"
        table: {"Draft / Allowed": 365, "Incomplete / Allowed": 363, "Incomplete / Prohibited": 58, "Incomplete / Allowed-with-Review": 51, "Draft / Allowed-with-Review": 40, "Draft / Discouraged": 27, "Deprecated / Prohibited": 25, "Stable / Allowed": 21, "Incomplete / Discouraged": 14, "Stable / Discouraged": 3, "Stable / Allowed-with-Review": 2}
      - kind: "observed"
        statement: "by abstraction: Pillar => Discouraged (10/10); named chains => Discouraged (3/3); composites => Allowed (4/4); Class mostly Allowed-with-Review (82 of 114)"
        table: {"Base / Allowed": 452, "Variant / Allowed": 290, "Class / Allowed-with-Review": 82, "Base / Prohibited": 70, "Class / Discouraged": 24, "Base / Allowed-with-Review": 11, "Pillar / Discouraged": 10, "Variant / Prohibited": 8, "Base / Discouraged": 6, "Class / Prohibited": 5, "Compound / Allowed": 4, "Class / Allowed": 3, "Compound / Discouraged": 3, "Variant / Discouraged": 1}
