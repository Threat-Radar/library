  not_applicable:
    - kind: protocol
      reason: "ECMA-427 defines an identifier syntax (Clause 5) and a JSON document format for type definitions (Clause 6, Annex A). It names implementation roles (PURL parsers, 5.6.1; tools, 6.5.7; a conforming implementation, Clause 2) but no parties that exchange messages and no sequence of steps between them; Clause 1 lists where purls are used (SBOMs, vulnerability databases, advisories) without defining any exchange. Its procedural statements are all single-party string rules (for example a parser removing the slashes after 'pkg:', 5.6.1, the percent-encoding steps of 5.4, and the rejection duty of Clause 2), which requirements.yaml and schema/purl.derived.abnf carry."
    - kind: state-machine
      reason: "No lifecycle, persistent state or transitions: a purl is a string and a type definition is a static document. The 1st edition defines no parsing or building algorithm whose steps could be modelled as states (the P1 to P9 order in examples/expected.yaml is the library's own), and registered versus unregistered types arrive only with the 2nd edition."
