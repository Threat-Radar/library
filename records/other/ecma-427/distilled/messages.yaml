note: 'ECMA-427 defines no wire protocol. It defines two things, and this file decomposes both: (1) the PURL string of Clause 5, as structure purl-string (the seven components) and purl-qualifier (one key=value pair); (2) the PURL type definition document of Clause 6 and Annex A, a JSON document validated by the Annex A JSON Schema (JSON Schema draft-07), as one structure per object or property group (typedef-root, typedef-repository, typedef-namespace_definition, typedef-name_definition, typedef-version_definition, typedef-qualifiers_definition-item, typedef-subpath_definition, typedef-purl_component_definition, typedef-examples, typedef-note, typedef-reference_urls). Conventions. Every value of a key named text or source_phrase is verbatim from the PDF (a sentence the PDF wrapped is joined; nothing else changes), with its locator. Short values under keys such as permitted_characters, case, encoding, canonical_form, separator_before and separator_after are our structured restatement of the verbatim rules beside them, never a substitute for them. Anything implied but not stated is under an inferred key or carries kind: inferred with its basis. For type definition fields, json_type_sources, required_sources and default_sources give the value from the property table (Tables 2 to 8), from the subclause (the Type, Property and Default Value lines) and from the Annex A schema; where they disagree the field carries flags. Annex A locators are JSON Pointers into the schema (schema/purl-type-definition.schema-1.0.json). constrained_by (pass 3, cross-check) lists the requirements.yaml ids that constrain each field: the entries at the clauses in constrained_by_locators, kept only where the entry object, field and text reach the field, plus the whole-string rules of Clause 5 and §5.1 to §5.6 that a component attribute cites (position, url_mapping, permitted_characters, encoding, case). constrained_by_locators is the pass-1 list, kept unchanged; constrained_by_note explains a locator whose requirements bind another structure. A structure-level constrained_by holds the requirements that bind a structure as a whole (a closed set of components or members). No requirement entry states a property type, so json_type is not reflected in constrained_by. The Clause 2 implementation duties (R-0001 to R-0003, R-0006 to R-0013), R-0014 and the two informative entries (R-0024, R-0063) constrain no field; distilled/verification.md, pass 3, gives the reasons.'

structures:

  # =========================================================================
  # PART 1. THE PURL STRING (Clause 5)
  # =========================================================================

  - name: purl-string
    locator: "Clause 5 (Table 1, Examples 1 to 3); §5.1 to §5.6.7"
    encoding: 'ASCII text (§5.6); namespace segments, name, version, qualifier values and subpath segments are percent-encoded strings of UTF-8 octets (§5.4); the scheme is a constant, and the type and qualifier keys are never percent-encoded (§5.6.2, §5.6.6)'
    structure: sequence
    layout: 'scheme:type/namespace/name@version?qualifiers#subpath'
    grammar: "schema/purl.derived.abnf (DERIVED, not verbatim): rule purl; canonical-shape for the canonical shape; purl-parser-input for the strings §5.6.1 obliges a parser to accept"
    kind: stated
    constrained_by:
      - ecma-427#R-0023
      - ecma-427#R-0027
    constrained_by_note: 'Structure-level: a PURL has no URL Authority component (R-0023, restated in §5.1 as R-0027), so the seven components are a closed set. After §5.6.1 removes the slashes after pkg: (R-0046, R-0047) an authority cannot be told from a type or a namespace (examples PURL-EDGE-01; design-notes.md, open question 13).'
    rules:
      - text: 'A PURL is a URL composed of seven components:'
        locator: "Clause 5"
      - text: 'Components are separated by a specific character for unambiguous parsing.'
        locator: "Clause 5"
      - text: 'Components are designed such that they form a hierarchy from the most significant on the left to the least significant components on the right.'
        locator: "Clause 5"
      - text: 'A PURL shall not contain a URL Authority, i.e. there is no support for username, password, host and port components. A namespace segment may sometimes look like a host, but its interpretation is specific to a type.'
        locator: "Clause 5"
      - text: 'A PURL is a valid URL and URI that conforms to the URL definitions or specifications at:'
        locator: "§5.1"
      - text: 'A PURL is a valid URL because it is a locator even though it has no Authority URL component: each type has a default repository location when defined.'
        locator: "§5.1"
      - text: 'A canonical PURL is composed of these permitted ASCII characters:'
        locator: "§5.2"
      - text: 'A PURL string is an ASCII URL string composed of seven components. Except as expressly stated otherwise in this Clause, each component:'
        locator: "§5.6"
      - text: 'may be composed of any of the characters defined in the Permitted characters clause'
        locator: "§5.6"
      - text: 'shall be encoded as defined in the Character encoding clause'
        locator: "§5.6"
      - text: 'The "lowercase" rules are defined in the Case folding clause.'
        locator: "§5.6"
      - text: 'All required components of a PURL, such as the scheme, type, and name, shall be present and validated according to the rules defined in this Standard. Additionally, optional components, including qualifiers and subpaths, shall be handled appropriately if provided, in full compliance with their specified behaviours.'
        locator: "Clause 2"
      - text: 'Implementations shall ensure that equivalent PURLs are consistently resolved to the same canonical representation. This includes strict adherence to normalisation and equivalence rules. Furthermore, implementations shall process URI encoding and decoding for PURL components according to the standards outlined in RFC 3986.'
        locator: "Clause 2"
      - text: 'Invalid PURLs that fail to conform to the specification shall be identified and rejected by any conforming implementation.'
        locator: "Clause 2"
    character_classes:
      - name: Alphanumeric Characters
        text: 'the Alphanumeric Characters: A to Z, a to z, 0 to 9'
        locator: "§5.2"
      - name: Punctuation Characters
        text: "the Punctuation Characters: .-_~ (period '.', dash '-', underscore '_' and tilde '~')"
        locator: "§5.2"
      - name: Percent Character
        text: "the Percent Character: % (percent sign '%')"
        locator: "§5.2"
      - name: Separator Characters
        text: "the Separator Characters :/@?=&# (colon ':', slash '/', at sign '@', question mark '?', equal sign '=', ampersand '&' and hash sign '#')"
        locator: "§5.2"
    percent_encoding:
      - text: 'In the Rules for each PURL component clause, each component defines when and how to apply percent-encoding and decoding to its content.'
        locator: "§5.4"
      - text: 'When percent-encoding is required by a component definition, the component string shall first be encoded as UTF-8.'
        locator: "§5.4"
      - text: 'In the component string, each "data octet" shall be replaced by the percent-encoded "character triplet" applying the percent-encoding mechanism defined in RFC 3986 section 2.1, including the RFC definition of "data octet" and "character triplet", and using these definitions for RFC''s "allowed set" and "delimiters":'
        locator: "§5.4"
      - text: '"allowed set" is composed of the Alphanumeric Characters and the Punctuation Characters'
        locator: "§5.4"
      - text: '"delimiters" is composed of the Separator Characters'
        locator: "§5.4"
      - text: 'The following characters shall not be percent-encoded:'
        locator: "§5.4"
      - text: 'the Alphanumeric Characters'
        locator: "§5.4"
      - text: 'the Punctuation Characters'
        locator: "§5.4"
      - text: 'the Separator Characters when being used as PURL separators'
        locator: "§5.4"
      - text: "the colon ':', whether used as a Separator Character or otherwise"
        locator: "§5.4"
      - text: "the percent sign '%' when used to represent a percent-encoded character"
        locator: "§5.4"
      - text: "Where the space ' ' is permitted, it shall be percent-encoded as '%20'."
        locator: "§5.4"
      - text: 'With the exception of the percent-encoding mechanism, the rules regarding percent-encoding are defined by this Standard alone.'
        locator: "§5.4"
    percent_encoding_reading:
      statement: 'Inside a component, only the allowed set (A to Z, a to z, 0 to 9, period, dash, underscore, tilde) and the colon are written as themselves; every other character of component data, including the six other Separator Characters, the space and every non-ASCII character, is written as one triplet per UTF-8 octet. A triplet for an Alphanumeric or Punctuation Character or for the colon (for example %41, %2E, %3A) is not a product of the §5.4 encoding and is treated as invalid (schema/purl.derived.abnf, reading R1).'
      kind: inferred
      basis: 'The §5.4 statements above read with §5.6 "shall be encoded as defined in the Character encoding clause". A reader who takes §5.4 as a canonical-form rule only would accept any triplet.'
    case_folding:
      - text: 'References to "lowercase" in this Standard refer to the culture-invariant full case mapping defined in Section 3.13.2 of the Unicode Standard.'
        locator: "§5.5"
      - text: 'When applied to the ASCII character set, this operation converts uppercase Latin letters (A to Z) to their corresponding lowercase forms (a to z). All other ASCII characters remain unchanged.'
        locator: "§5.5"
    canonical_form_not_stated:
      statement: 'The 1st edition defines no order for the key=value pairs of the qualifiers component and no case for the hexadecimal digits of a triplet, although Clause 2 requires that equivalent PURLs resolve to the same canonical representation. A search of the whole text for sort, order and lexicograph finds no qualifier ordering rule.'
      kind: inferred
      basis: 'Absence established by searching the cached text of the PDF; RFC 3986 section 2.1, which §5.4 invokes for the mechanism, only recommends upper-case hex digits to producers.'
    worked_examples:
      - purl: 'pkg:deb/debian/curl@7.50.3-1?arch=i386&distro=jessie'
        locator: "Clause 5, Example 1 (Informative): Debian"
        components: 'scheme pkg; type deb; namespace debian; name curl; version 7.50.3-1; qualifiers arch=i386 and distro=jessie; no subpath'
        kind: inferred
      - purl: 'pkg:maven/org.apache.xmlgraphics/batik-anim@1.9.1?packaging=sources'
        locator: "Clause 5, Example 2 (Informative): Maven"
        components: 'scheme pkg; type maven; namespace org.apache.xmlgraphics (one segment); name batik-anim; version 1.9.1; qualifiers packaging=sources; no subpath'
        kind: inferred
      - purl: 'pkg:npm/foobar@12.3.1'
        locator: "Clause 5, Example 3 (Informative): Node Package Manager (NPM)"
        components: 'scheme pkg; type npm; no namespace; name foobar; version 12.3.1; no qualifiers; no subpath'
        kind: inferred
    notes: 'The three decompositions are our parse with schema/purl.derived.abnf (rule purl), not text from the standard; all three examples also match canonical-shape.'
