        grammar_rule: "scheme"
        source_phrase: 'The URL scheme with the constant value of "pkg". One of the primary reasons for this single scheme is to facilitate the future official registration of the "pkg" scheme for Package-URLs.'
        rules:
          - text: 'The scheme is a constant with the value "pkg".'
            locator: "§5.6.1"
          - text: "The scheme shall be followed by an unencoded colon ':'."
            locator: "§5.6.1"
          - text: "PURL parsers shall accept URLs where the scheme and colon ':' are followed by one or more slash '/' characters, such as 'pkg://', and shall ignore and remove all such '/' characters."
            locator: "§5.6.1"
          - text: "':' (colon) is the separator between scheme and type"
            locator: "§5.3"
          - text: 'Special URL schemes as defined in https://url.spec.whatwg.org/ such as file://, https://, http:// and ftp:// are not valid PURL types. They are valid URL or URI schemes but they are not a valid PURL scheme.'
