        locator: "§6.10"
    fields:

      - name: "(array)"
        json_pointer: "/examples"
        json_type: array
        required: true
        constraints:
          uniqueItems: true
          minItems: 1
        constraints_sources:
          table: 'Array, Required (Table 2)'
          subclause: 'Type: array (of String); "All items shall be unique." (§6.10); no minimum stated'
          annex_a: '"uniqueItems": true, "minItems": 1'
        flags:
          - 'minItems 1 is stated only in Annex A; Clause 6 requires the property but sets no minimum.'
        locator: "§6.10; Annex A, /properties/examples"
        kind: stated
        constrained_by:
          - ecma-427#R-0109
          - ecma-427#R-0157
          - ecma-427#R-0168
        constrained_by_locators:
          - "§6.10"
          - "Table 2"
          - "Annex A, /properties/examples"

      - name: "(item)"
        json_pointer: "/examples/[]"
        json_type: string
        required: true
        constraints:
          pattern: '^pkg:[a-z][a-z0-9-\.]+/.*$'
        constraints_sources:
          subclause: 'Pattern Constraint: ^pkg:[a-z][a-z0-9-\.]+/.*$ (§6.10, printed against the property)'
          annex_a: '"items": {"type": "string", "pattern": "^pkg:[a-z][a-z0-9-\\.]+/.*$"}'
        inferred:
          - statement: 'Each item should be a valid canonical PURL string; the pattern checks only the scheme, a lower-case type of two or more characters and a following slash.'
            basis: 'The description says "valid, canonical PURLs" (§6.10, Table 2); everything after the first slash matches .* in the pattern. schema/purl.derived.abnf rule canonical-shape checks more.'
            kind: inferred
        flags:
          - 'The pattern refuses a one-letter type that §5.6.2 allows. Source defect D4.'
        locator: "§6.10; Annex A, /properties/examples/items"
        kind: stated
        constrained_by:
          - ecma-427#R-0154
          - ecma-427#R-0155
          - ecma-427#R-0156
        constrained_by_note: 'Each item is a PURL string (structure purl-string): R-0155 brings in every requirement wired there, which are not repeated here. The R-0154 pattern checks only the scheme and a type of two or more characters (schema/README.md D4). Clause 5 and §5.6.2, in constrained_by_locators, are reached that way.'
        constrained_by_locators:
          - "§6.10"
          - "Annex A, /properties/examples/items"
          - "Clause 5"
          - "§5.6.2"

