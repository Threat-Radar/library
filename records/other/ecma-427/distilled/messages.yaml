  - name: typedef-examples
    json_pointer: "/examples"
    annex_a_pointer: "/properties/examples"
    locator: "§6.10; Table 2; Annex A, /properties/examples"
    encoding: 'JSON array of strings, each a PURL string (structure purl-string)'
    structure: array
