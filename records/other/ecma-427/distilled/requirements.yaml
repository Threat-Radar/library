      - "Annex A, /definitions/purl_component_definition/properties/permitted_characters/description (p. 19)"
    text: "A regular expression (ECMA-262 dialect) defining the 'Permitted characters' for this component of this Package-URL type. If provided, this shall be a subset of the 'Permitted characters' defined in the PURL specification."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Whether a regular expression matches only a subset of a character set is decidable for simple
      character-class expressions but is not checkable by schema validation in general. The referent is
      also unclear: 'Permitted characters' in §5.2 is the ASCII set of a canonical, encoded PURL (R-0032),
      while decoded namespace, name, version and subpath text may contain any Unicode character, and the
      source does not say whether the expression applies to the encoded or the decoded component.
    status: "active"
    notes: >-
      Two sentences: the first defines the property, the second carries the requirement. The PDF breaks
      'Package-URL' after its hyphen; it is joined without a space.
