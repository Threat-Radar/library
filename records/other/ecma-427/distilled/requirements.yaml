    text: "The key for the qualifier."
    text_kind: "sentence"
    kind: "inferred"
    testable: "yes"
    status: "active"
    notes: >-
      Inferred, not stated. The key a type definition declares is the key that appears in PURLs of that
      type, so it is usable only if it meets the §5.6.6 key rules (R-0083 to R-0085: lowercase ASCII
      letters, digits, '.', '-' and '_', starting with a letter, never percent-encoded). Neither §6.8.1.1
      nor Annex A ("type": "string", no pattern) states this, so a schema-valid type definition can
      declare a key that no conforming PURL can carry. Likewise "uniqueItems" (R-0150) compares whole
      qualifier definition objects, so two items with the same key and different descriptions pass the
      schema although keys must be unique within a PURL (R-0086). The quoted text is the property
      description the inference rests on; it carries no verbal form.
