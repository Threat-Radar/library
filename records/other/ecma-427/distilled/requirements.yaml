note: >-
  Ids are stable and never reused; cite as ecma-427#R-NNNN (a bare R-NNNN in notes means the same).
  Entries are in source order by primary locator. VERBAL FORMS: ECMA-427 neither defines its verbal
  forms nor cites RFC 2119 or RFC 8174; this file reads them per ISO/IEC Directives Part 2, which Ecma
  drafting follows: shall = requirement, shall not = prohibition, should = recommendation, may =
  permission. `verb` holds the verbatim form in lowercase (the sentence-initial 'Shall' of 'Shall be
  one of:' is recorded as 'shall'); `verb: none` marks a table cell, a Clause 6 property line, an
  Annex A schema keyword, a declarative constraint, an imperative or an 'are expected to' sentence,
  and each such entry says so in a note. Normativity adds 'constraint' for a statement without a
  verbal form that still fixes a testable property, and 'informative' for a 'may' that states a
  possibility rather than a permission (R-0024, R-0063); table cells are constraints (Required: the
  property or component must be present; Optional: its absence is valid). TEXT: `text` is verbatim
  from the PDF. The only normalization is joining a sentence wrapped across lines or pages (line break
  and indentation collapsed to one space, page footers dropped), except that a break directly after a
  hyphen inside a hyphenated token (percent-encoding, Package-URL, purl-type-definition, the Annex A
  $id pattern) is joined with no space, because the hyphen is the source's and the token contains no
  space. A bullet's text omits the bullet glyph; a bullet under a lead-in carries the lead-in verbatim
  in `condition`. Where a lead-in introduces a list ('Shall be one of:', 'The following characters
  shall not be percent-encoded:' and similar), `text` is the lead-in and each list item is copied
  verbatim into `enumeration`. A compound sentence or bullet is split only where each part is
  separately testable (R-0046/R-0047, R-0051/R-0052, R-0081/R-0082, R-0087/R-0088). REPEATS: the
  Clause 6 tables, the Clause 6 subclauses and the Annex A description strings repeat many sentences
  verbatim. Each is extracted once, at the subclause that defines the property, and every other
  locator is listed in `also_at`, including Annex A JSON pointers and the Clause 6 property lines and
  Annex A keywords that state the same rule. Rows that are identical in Tables 4, 5, 6 and 8
  (permitted_characters, case_sensitive, normalization_rules, native_name, note: all Optional) are
  extracted once, from Table 4, because Annex A defines them once in
  /definitions/purl_component_definition. text_kind: sentence; bullet; table-cell (a verbatim
  Requirement column cell); schema-keyword (a Clause 6 property line such as Pattern Constraint,
  Constant, Format or Default Value, or an Annex A JSON Schema keyword). Locators are clause, table,
  row and Annex A JSON pointer, with the printed page in parentheses. ACTORS: 'PURL string' is a rule
  on the string itself, enforced by PURL producers (who must not emit a violating string) and by
  parsers and validators (Clause 2 requires invalid PURLs to be identified and rejected); 'PURL type
  definition' is the JSON document that defines a type, enforced by validating it against Annex A. The
  1st edition contains no PURL type definition (Clause 1), so every rule that defers to a type
  definition is testable only against one supplied from elsewhere. Exactly one entry is kind inferred
  (R-0148). Derived fields (normativity, actor, condition, object, field, testable) are judgement and
  need human review; `text` and `enumeration` are verbatim. Not extracted: the informative examples,
  rationale and pointer sentences, and property descriptions that only name a property ('The type
  string for this Package-URL type.'); where one of them bears on a rule, it is quoted in that entry's
  notes. Property types are not extracted as entries either: the Type column of Tables 2 to 8, the
  'Type:' lines of the Clause 6 property blocks and the 39 Annex A "type" keywords; messages.yaml
  carries them field by field (json_type, json_type_sources), and the nine table cells that contradict
  the subclauses are noted in the table-cell entries (pass 3 finding; distilled/verification.md).
