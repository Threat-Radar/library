requirements:
  - id: "ecma-427#R-0001"
    normativity: "requirement"
    verb: "shall"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "implementation behaviour"
    field: "support for all elements of the Standard (syntax, components, semantic requirements)"
    locator: "Clause 2, para 1 (p. 1)"
    text: "A conforming implementation of Package-URL (PURL) shall fully implement and support all elements defined within this Standard, including the syntax, components, and semantic requirements for constructing and interpreting valid PURLs."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      An umbrella obligation: it can be tested only through the individual rules of Clauses 5 and 6 and
      Annex A (R-0015 to R-0168). The 1st edition ships no conformance test suite and no PURL type
      definitions (Clause 1), so the type-dependent semantics cannot be exercised from this document
      alone.
    status: "active"
  - id: "ecma-427#R-0002"
    normativity: "requirement"
    verb: "shall"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "implementation behaviour"
    field: "parsing, construction and validation of PURLs"
    locator: "Clause 2, para 2 (p. 1)"
    text: "A conforming implementation of PURL shall adhere to the syntax defined in this Standard, ensuring that all PURLs are parsed, constructed, and validated according to the prescribed rules."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: "An umbrella obligation, testable only through the syntax rules of Clause 5 (R-0015 to R-0098)."
    status: "active"
  - id: "ecma-427#R-0003"
    normativity: "requirement"
    verb: "shall"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "implementation behaviour"
    field: "ecosystem-agnostic behaviour"
    locator: "Clause 2, para 2 (p. 1)"
    text: "The implementation shall provide full support for ecosystem-agnostic behaviour, enabling PURLs to function consistently and reliably across diverse environments."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      'ecosystem-agnostic behaviour' and 'function consistently and reliably across diverse environments'
      are not defined and give no criterion a test can apply.
    status: "active"
  - id: "ecma-427#R-0004"
    normativity: "requirement"
    verb: "shall"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "PURL"
    field: "required components (scheme, type, name)"
    locator: "Clause 2, para 3 (p. 1)"
    text: "All required components of a PURL, such as the scheme, type, and name, shall be present and validated according to the rules defined in this Standard."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Presence of scheme, type and name is testable; Table 1 marks exactly these three Required (R-0016,
      R-0017, R-0019). 'such as' leaves the list open: a type definition can also require the namespace
      (R-0053, R-0117) or qualifier keys (R-0141), and the 1st edition contains no type definition to test
      those against.
    status: "active"
  - id: "ecma-427#R-0005"
    normativity: "requirement"
    verb: "shall"
    actor: "conforming implementation"
    condition: "if an optional component is provided"
    object: "PURL"
    field: "optional components (qualifiers, subpaths)"
    locator: "Clause 2, para 3 (p. 1)"
    text: "Additionally, optional components, including qualifiers and subpaths, shall be handled appropriately if provided, in full compliance with their specified behaviours."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      'handled appropriately' has no criterion of its own; it is testable only through the component rules
      of §5.6.6 and §5.6.7. The sentence names qualifiers and subpaths but not namespace and version,
      which Table 1 also marks Optional.
    status: "active"
  - id: "ecma-427#R-0006"
    normativity: "requirement"
    verb: "shall"
    actor: "conforming implementation (canonicalizer)"
    condition: "unconditional"
    object: "PURL"
    field: "canonical representation of equivalent PURLs"
    locator: "Clause 2, para 4 (p. 1)"
    text: "Implementations shall ensure that equivalent PURLs are consistently resolved to the same canonical representation. This includes strict adherence to normalisation and equivalence rules."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Only partly testable, because the 1st edition defines neither a complete canonical form nor an
      equivalence relation. Missing: (1) 'equivalent PURLs' and 'equivalence rules' are never defined; the
      only stated equivalences are the case of the type (R-0051), leading and trailing slashes (R-0055,
      R-0065, R-0092), slashes after 'pkg:' (R-0047), an empty qualifier value (R-0082) and lowercasing
      where a type definition sets case_sensitive to false (R-0131); (2) no rule fixes the order of
      qualifiers in the canonical form: §5.6.6 says only that keys are unique and that pairs are separated
      by '&', and the text never mentions sorting or order, so 'a=1&b=2' and 'b=2&a=1' have no defined
      canonical order; (3) stripping leading and trailing slashes in the canonical form is a 'should', not
      a 'shall'; (4) no rule fixes the case of the hexadecimal digits in a percent-encoded triplet, since
      §5.4 borrows only the mechanism of RFC 3986 section 2.1 (R-0035, R-0038); a triplet for a character
      that 'shall not be percent-encoded' (for example %41 for 'A') is not a second spelling but breaks
      R-0036, and an uppercase qualifier key breaks R-0083, so both are invalid under Clause 2 (R-0008)
      rather than non-canonical; (5) nothing says whether a qualifier given with its default_value
      (Table 7) equals the same PURL without that qualifier; (6) nothing says whether the scheme may
      appear in another case ('PKG:'); (7) type-specific normalization (case_sensitive,
      normalization_rules) needs type definitions, the 1st edition contains none (Clause 1), and
      normalization_rules are free text (R-0132).
    status: "active"
    notes: >-
      Two adjacent sentences of one paragraph; the second ('This includes ...') has no verbal form of its
      own and only qualifies the first.
  - id: "ecma-427#R-0007"
    normativity: "requirement"
    verb: "shall"
    actor: "conforming implementation (encoder and decoder)"
    condition: "unconditional"
    object: "PURL components"
    field: "URI encoding and decoding"
    locator: "Clause 2, para 4 (p. 1)"
    text: "Furthermore, implementations shall process URI encoding and decoding for PURL components according to the standards outlined in RFC 3986."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Testable for the percent-encoding mechanism, but the source points two ways: this sentence defers to
      RFC 3986, while §5.4 says that, apart from the mechanism, the rules regarding percent-encoding are
      defined by this Standard alone (R-0038). Which RFC 3986 rules beyond section 2.1 apply (for example
      its normalization and comparison rules in section 6) is not stated.
    status: "active"
  - id: "ecma-427#R-0008"
    normativity: "requirement"
    verb: "shall"
    actor: "conforming implementation (validator)"
    condition: "when a PURL fails to conform to the specification"
    object: "PURL"
    field: "identification and rejection of invalid PURLs"
    locator: "Clause 2, para 5 (p. 1)"
    text: "Invalid PURLs that fail to conform to the specification shall be identified and rejected by any conforming implementation."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Rejection is testable for any string that breaks a stated syntax rule of Clause 5. It is partial
      because validity also depends on type definitions (none in this edition) and because the source
      leaves some edges to the reader: an empty qualifier value is forbidden to producers (R-0081) but
      given a meaning, the same as an absent pair (R-0082), so a reader drops the pair and the text does
      not say whether a strict validator may also flag it; 'pkg://' forms must be accepted (R-0046); and
      leading or trailing slashes are 'not significant' (R-0055) rather than invalid.
    status: "active"
    notes: >-
      The next sentence ('This guarantees the integrity and reliability of PURLs in all supported
      contexts.') is rationale and is not extracted.
  - id: "ecma-427#R-0009"
    normativity: "permission"
    verb: "may"
    actor: "conforming implementation"
    condition: "as long as these extensions do not violate the core specification"
    object: "implementation behaviour"
    field: "ecosystem-specific validation, processing or metadata handling"
    locator: "Clause 2, para 6 (p. 1)"
    text: "A conforming implementation of PURL may extend its functionality by providing ecosystem-specific validation, processing, or metadata handling, as long as these extensions do not violate the core specification."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      A permission; its proviso is testable only through the core rules, and the 'core specification' is
      not delimited.
    status: "active"
  - id: "ecma-427#R-0010"
    normativity: "permission"
    verb: "may"
    actor: "conforming implementation"
    condition: "provided they align with the standard's requirements"
    object: "implementation behaviour"
    field: "auxiliary tools or features"
    locator: "Clause 2, para 6 (p. 1)"
    text: "Additionally, implementations may offer auxiliary tools or features, such as utilities for constructing or validating PURLs, provided they align with the standard's requirements."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      A permission whose proviso ('align with the standard's requirements') adds no criterion beyond the
      rest of the Standard.
    status: "active"
  - id: "ecma-427#R-0011"
    normativity: "prohibition"
    verb: "shall not"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "implementation behaviour"
    field: "core syntax, components and semantics"
    locator: "Clause 2, para 7 (p. 1)"
    text: "A conforming implementation shall not redefine or alter the core syntax, components, or semantics defined by this Standard."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      An alteration of the syntax is detectable by conformance tests on the Clause 5 rules; 'semantics'
      and 'core' are not delimited, so a redefinition of meaning has no test.
    status: "active"
  - id: "ecma-427#R-0012"
    normativity: "prohibition"
    verb: "shall not"
    actor: "conforming implementation"
    condition: "for any extension the specification explicitly identifies as prohibited"
    object: "implementation behaviour"
    field: "prohibited extensions"
    locator: "Clause 2, para 7 (p. 1)"
    text: "Any prohibited extensions explicitly identified in the specification shall not be implemented."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      The 1st edition explicitly identifies no prohibited extension: apart from this sentence, the word
      'prohibited' names only the 'prohibited' value of a namespace requirement in a type definition
      (R-0127). The prohibition is empty until a later edition identifies one.
    status: "active"
  - id: "ecma-427#R-0013"
    normativity: "prohibition"
    verb: "none"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "implementation behaviour"
    field: "interoperability across tools, platforms and ecosystems"
    locator: "Clause 2, para 7 (p. 1)"
    text: "Furthermore, behaviours that compromise the interoperability of PURLs across tools, platforms, or ecosystems are strictly disallowed."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: "'behaviours that compromise the interoperability of PURLs' are not defined."
    status: "active"
    notes: "No verbal form: the prohibition is carried by 'are strictly disallowed', recorded with verb none."
  - id: "ecma-427#R-0014"
    normativity: "constraint"
    verb: "none"
    actor: "conforming implementation"
    condition: "for each undated normative reference"
    object: "normative references"
    field: "edition that applies"
    locator: "Clause 3, para 1 (p. 2)"
    text: "For undated references, the latest edition of the referenced document (including any amendments) applies."
    text_kind: "sentence"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      All three normative references (ECMA-262, RFC 3986, the Unicode Standard) are listed without a date,
      so the governing edition moves over time: the Unicode case mapping of §5.5 and the ECMA-262 regular
      expression dialect of §6.5.5 follow the latest editions, not those current in December 2025. A test
      has to pin an edition the Standard does not pin.
    status: "active"
    notes: >-
      Declarative, verb none. The paragraph opens 'The following documents are referred to in the text in
      such a way that some or all of their content constitutes requirements of this document.' and says
      'For dated references, only the edition cited applies.', which has nothing to apply to here. The
      informative Bibliography cites ECMA-262 16th Edition, Annex A.8, for the regular expression grammar;
      the normative reference itself is undated.
  - id: "ecma-427#R-0015"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "component order and separators"
    locator: "Clause 5 (p. 2)"
    text: "A PURL is a URL composed of seven components:"
    text_kind: "sentence"
    enumeration:
      - "scheme:type/namespace/name@version?qualifiers#subpath"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative, verb none. The displayed syntax line (in enumeration) fixes the order of the seven
      components and their separators; §5.3 lists the separators (R-0033). The next sentence, 'Components
      are separated by a specific character for unambiguous parsing.', is descriptive and is not
      extracted, as is the sentence after Table 1, 'Components are designed such that they form a
      hierarchy from the most significant on the left to the least significant components on the right.'
      Clause 1 (Scope) states the same model: 'A PURL is a valid URL and URI composed of seven components
      to identify a software package.'
  - id: "ecma-427#R-0016"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "scheme"
    locator: "Table 1, row scheme, Requirement column (p. 3)"
    text: "Required"
    text_kind: "table-cell"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Table cell, verb none: a Requirement column cell carries no verbal form. Required: present in every
      PURL. Description cell: 'The URL scheme with the constant value of "pkg".', followed by a rationale
      about registering the "pkg" scheme. Clause 2 names scheme, type and name as required components
      (R-0004).
  - id: "ecma-427#R-0017"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "type"
    locator: "Table 1, row type, Requirement column (p. 3)"
    text: "Required"
    text_kind: "table-cell"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Table cell, verb none: a Requirement column cell carries no verbal form. Description cell: 'The
      package "type" or package "protocol" such as maven, npm, nuget, gem, pypi, etc.' The 1st edition
      defines none of these types (Clause 1).
  - id: "ecma-427#R-0018"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional (unless a type definition says otherwise)"
    object: "PURL string"
    field: "namespace"
    locator: "Table 1, row namespace, Requirement column (p. 3)"
    text: "Optional"
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Absence is valid only by default: a type definition may require the namespace (R-0053) or prohibit
      it (R-0117), and the 1st edition contains no type definition.
    status: "active"
    notes: >-
      Table cell, verb none: a Requirement column cell carries no verbal form. Optional: a PURL without
      this component is valid. Description cell: 'A name prefix such as a Maven groupid, a Docker image
      owner, a GitHub user or organization. Namespace is type-specific.'
  - id: "ecma-427#R-0019"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "name"
    locator: "Table 1, row name, Requirement column (p. 3)"
    text: "Required"
    text_kind: "table-cell"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Table cell, verb none: a Requirement column cell carries no verbal form. Description cell: 'The name
      of the package.'
  - id: "ecma-427#R-0020"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "version"
    locator: "Table 1, row version, Requirement column (p. 3)"
    text: "Optional"
    text_kind: "table-cell"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Table cell, verb none: a Requirement column cell carries no verbal form. A type definition cannot
      make the version required: its version_definition requirement may only be 'optional' (R-0140).
  - id: "ecma-427#R-0021"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional (unless a type definition requires a qualifier key)"
    object: "PURL string"
    field: "qualifiers"
    locator: "Table 1, row qualifiers, Requirement column (p. 3)"
    text: "Optional"
    text_kind: "table-cell"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Absence is valid only by default: a type definition may require qualifier keys (R-0141), which makes
      the component non-empty for that type, and the 1st edition contains no type definition.
    status: "active"
    notes: >-
      Table cell, verb none: a Requirement column cell carries no verbal form. Description cell:
      'Qualifier data for a package such as OS, architecture, repository, etc. Qualifiers are
      type-specific.'
  - id: "ecma-427#R-0022"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "subpath"
    locator: "Table 1, row subpath, Requirement column (p. 3)"
    text: "Optional"
    text_kind: "table-cell"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Table cell, verb none: a Requirement column cell carries no verbal form. A type definition cannot
      make the subpath required: its subpath_definition requirement may only be 'optional' (R-0153).
  - id: "ecma-427#R-0023"
    normativity: "prohibition"
    verb: "shall not"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "URL Authority"
    locator: "Clause 5, paragraph after Table 1 (p. 3)"
    text: "A PURL shall not contain a URL Authority, i.e. there is no support for username, password, host and port components."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Restated in §5.1 (R-0027). §5.6.1 requires parsers to accept 'pkg://' and drop the slashes (R-0046,
      R-0047), so a string that a generic URL parser reads as having an authority is still accepted and
      read without one.
  - id: "ecma-427#R-0024"
    normativity: "informative"
    verb: "may"
    actor: "PURL string (honoured by validators)"
    condition: "unconditional"
    object: "PURL string"
    field: "namespace segment that looks like a host"
    locator: "Clause 5, paragraph after Table 1 (p. 3)"
    text: "A namespace segment may sometimes look like a host, but its interpretation is specific to a type."
    text_kind: "sentence"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      A statement of possibility: it grants nothing and requires nothing, so there is no behaviour to
      test. Read with the prohibition before it (R-0023) and with R-0061 it only warns that a segment
      that looks like a host is not by that fact a URL host; whether it is one is type-specific, and
      the 1st edition defines no type.
    status: "active"
    notes: >-
      'may' here expresses possibility (Ecma and ISO drafting would write 'can'), so the entry is
      recorded as informative, not as a permission (pass 2 reclassification; normative.md U-14 reads
      it the same way). The occurrence of 'may' stays accounted for in keyword_accounting. Same point
      in §5.6.3 (R-0063).
  - id: "ecma-427#R-0025"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "URL and URI validity"
    locator: "§5.1, bullet 1 (p. 3)"
    text: "A PURL is a valid URL and URI that conforms to the URL definitions or specifications at:"
    text_kind: "bullet"
    enumeration:
      - "https://tools.ietf.org/html/rfc3986"
      - "https://en.wikipedia.org/wiki/URL#Syntax"
      - "https://en.wikipedia.org/wiki/Uniform_Resource_Identifier#Syntax"
      - "https://url.spec.whatwg.org/"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The four references are not one definition: RFC 3986 and the WHATWG URL Standard parse differently,
      and two of the four are Wikipedia articles. RFC 3986 URI syntax can be tested, but conformance to
      all four has no single outcome.
    status: "active"
    notes: >-
      Declarative, verb none; the four URLs are copied into enumeration. The next bullet ('A PURL is a
      valid URL because it is a locator even though it has no Authority URL component: each type has a
      default repository location when defined.') is rationale and is not extracted; its claim that each
      type has a default repository location conflicts with Table 3, where default_repository_url is
      Optional (R-0114).
  - id: "ecma-427#R-0026"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "mapping of PURL components to URL components"
    locator: "§5.1, bullet 3 (p. 3)"
    text: "The PURL components are mapped to these URL components:"
    text_kind: "bullet"
    enumeration:
      - "PURL scheme: this is a URL scheme with a constant value: pkg"
      - "PURL type, namespace, name and version components: these are collectively mapped to a URL path"
      - "PURL qualifiers: this maps to a URL query"
      - "PURL subpath: this is a URL fragment"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative, verb none; the four sub-bullets are copied into enumeration. The scheme item restates
      §5.6.1 (R-0044).
  - id: "ecma-427#R-0027"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "URL Authority"
    locator: "§5.1, bullet 3 (closing sentence) (p. 3)"
    text: "In a PURL, there is no support for a URL Authority (e.g. no username, password, host and port components)."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Declarative restatement of the 'shall not' after Table 1 (R-0023); verb none."
  - id: "ecma-427#R-0028"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "type and scheme versus special URL schemes"
    locator: "§5.1, bullet 4 (p. 3)"
    text: "Special URL schemes as defined in https://url.spec.whatwg.org/ such as file://, https://, http:// and ftp:// are not valid PURL types. They are valid URL or URI schemes but they are not a valid PURL scheme."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      It is unclear whether the first sentence forbids a PURL type string such as 'http' or 'file' (which
      §5.6.2 would otherwise allow) or only says that URLs in these schemes are not PURLs; the second
      sentence restates that the only PURL scheme is pkg (R-0044).
    status: "active"
    notes: "Two adjacent sentences of one bullet, declarative, verb none."
  - id: "ecma-427#R-0029"
    normativity: "permission"
    verb: "may"
    actor: "PURL producer"
    condition: "for URLs in the special URL schemes (file, https, http, ftp)"
    object: "PURL string"
    field: "special-scheme URLs in a PURL qualifier"
    locator: "§5.1, bullet 4 (p. 3)"
    text: "They may be used to reference URLs in separate attributes outside of a PURL or in a PURL qualifier."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      A qualifier value holding such a URL is testable once it is percent-encoded per §5.4 (among the
      Separator Characters only the colon stays unencoded, R-0036), but the 1st edition names no qualifier
      key for it.
    status: "active"
    notes: "The sentence runs across the page break between p. 3 and p. 4; the page footer is dropped."
  - id: "ecma-427#R-0030"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "type and scheme versus VCS URLs"
    locator: "§5.1, bullet 5 (p. 4)"
    text: "Version control system (VCS) URLs such git://, svn://, hg:// or as defined in Python pip or SPDX download locations are not valid PURL types. They are valid URL or URI schemes but they are not a valid PURL scheme."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      As for R-0028: unclear whether a type string such as 'git' is forbidden or only VCS URLs are not
      PURLs; 'as defined in Python pip or SPDX download locations' points to external formats that are not
      normative references.
    status: "active"
    notes: >-
      Verbatim, including the source's missing 'as' in 'such git://'. The following sentence, 'They are a
      closely related, compact and uniform way to reference VCS URLs.', is descriptive and is not
      extracted.
  - id: "ecma-427#R-0031"
    normativity: "permission"
    verb: "may"
    actor: "PURL producer"
    condition: "for VCS URLs"
    object: "PURL string"
    field: "VCS URLs in a PURL qualifier"
    locator: "§5.1, bullet 5 (p. 4)"
    text: "They may be used as references in separate attributes outside of a PURL or in a PURL qualifier."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      As for R-0029: testable as a percent-encoded qualifier value, but the 1st edition names no qualifier
      key for a VCS URL.
    status: "active"
  - id: "ecma-427#R-0032"
    normativity: "constraint"
    verb: "none"
    actor: "PURL producer (canonical form)"
    condition: "for a canonical PURL"
    object: "canonical PURL string"
    field: "permitted characters"
    locator: "§5.2 (p. 4)"
    text: "A canonical PURL is composed of these permitted ASCII characters:"
    text_kind: "sentence"
    enumeration:
      - "the Alphanumeric Characters: A to Z, a to z, 0 to 9"
      - "the Punctuation Characters: .-_~ (period '.', dash '-', underscore '_' and tilde '~')"
      - "the Percent Character: % (percent sign '%')"
      - "the Separator Characters :/@?=&# (colon ':', slash '/', at sign '@', question mark '?', equal sign '=', ampersand '&' and hash sign '#')"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative, verb none; the four bullets are copied into enumeration. It applies to the canonical
      form; whether a parser must reject a non-canonical string carrying other characters is not stated
      here, though §5.6 calls every PURL string an ASCII URL string (R-0041).
  - id: "ecma-427#R-0033"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "use of each Separator Character"
    locator: "§5.3 (p. 4)"
    text: "This is how each of the Separator Characters is used:"
    text_kind: "sentence"
    enumeration:
      - "':' (colon) is the separator between scheme and type"
      - "'/' (slash) is the separator between type, namespace and name"
      - "'/' (slash) is the separator between subpath segments"
      - "'@' (at sign) is the separator between name and version"
      - "'?' (question mark) is the separator before qualifiers"
      - "'=' (equals) is the separator between a key and a value of a qualifier"
      - "'&' (ampersand) is the separator between qualifiers (each being a key=value pair)"
      - "'#' (hash sign) is the separator before subpath"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative, verb none; the eight bullets are copied into enumeration. The Separator Characters are
      listed in §5.2 (R-0032).
  - id: "ecma-427#R-0034"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL producer"
    condition: "When percent-encoding is required by a component definition"
    object: "component string"
    field: "character encoding before percent-encoding"
    locator: "§5.4, bullet 2 (p. 4)"
    text: "When percent-encoding is required by a component definition, the component string shall first be encoded as UTF-8."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The first bullet of §5.4 ('In the Rules for each PURL component clause, each component defines when
      and how to apply percent-encoding and decoding to its content.') is a pointer to §5.6 and is not
      extracted.
  - id: "ecma-427#R-0035"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL producer"
    condition: "when a component string is percent-encoded"
    object: "component string"
    field: "data octets and character triplets"
    locator: "§5.4, bullet 3 (p. 4)"
    text: 'In the component string, each "data octet" shall be replaced by the percent-encoded "character triplet" applying the percent-encoding mechanism defined in RFC 3986 section 2.1, including the RFC definition of "data octet" and "character triplet", and using these definitions for RFC''s "allowed set" and "delimiters":'
    text_kind: "bullet"
    enumeration:
      - '"allowed set" is composed of the Alphanumeric Characters and the Punctuation Characters'
      - '"delimiters" is composed of the Separator Characters'
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The mechanism is fixed, but neither §5.4 nor RFC 3986 section 2.1 makes the case of the hexadecimal
      digits in a triplet mandatory (RFC 3986 only recommends uppercase), so two producers can emit
      different strings for the same input. Read literally, 'each "data octet" shall be replaced' would
      encode every octet; it is the imported RFC notion of the allowed set that leaves the Alphanumeric
      and Punctuation Characters unencoded.
    status: "active"
    notes: "Lead-in with two sub-bullets, copied into enumeration."
  - id: "ecma-427#R-0036"
    normativity: "prohibition"
    verb: "shall not"
    actor: "PURL producer"
    condition: "unconditional"
    object: "component string"
    field: "characters that are never percent-encoded"
    locator: "§5.4, bullet 4 (p. 4)"
    text: "The following characters shall not be percent-encoded:"
    text_kind: "bullet"
    enumeration:
      - "the Alphanumeric Characters"
      - "the Punctuation Characters"
      - "the Separator Characters when being used as PURL separators"
      - "the colon ':', whether used as a Separator Character or otherwise"
      - "the percent sign '%' when used to represent a percent-encoded character"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The five sub-bullets are copied into enumeration. A Separator Character that is not used as a
      separator is data and is encoded under R-0035 (for example '@' inside a namespace segment), except
      the colon, which is never encoded; '%' stays unencoded only as the start of a triplet.
  - id: "ecma-427#R-0037"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL producer"
    condition: "Where the space ' ' is permitted"
    object: "component string"
    field: "space character"
    locator: "§5.4, bullet 5 (p. 4)"
    text: "Where the space ' ' is permitted, it shall be percent-encoded as '%20'."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Rules out '+' as an encoding of the space."
  - id: "ecma-427#R-0038"
    normativity: "constraint"
    verb: "none"
    actor: "conforming implementation"
    condition: "unconditional"
    object: "percent-encoding rules"
    field: "which document defines them"
    locator: "§5.4, bullet 6 (p. 4)"
    text: "With the exception of the percent-encoding mechanism, the rules regarding percent-encoding are defined by this Standard alone."
    text_kind: "bullet"
    kind: "stated"
    testable: "no"
    testable_reason: "It says which document governs; there is no behaviour to test."
    status: "active"
    notes: >-
      Declarative, verb none. It pulls against Clause 2, which asks implementations to process URI
      encoding and decoding 'according to the standards outlined in RFC 3986' (R-0007).
  - id: "ecma-427#R-0039"
    normativity: "constraint"
    verb: "none"
    actor: "conforming implementation"
    condition: "wherever this Standard says 'lowercase'"
    object: "case folding"
    field: "meaning of 'lowercase'"
    locator: "§5.5, para 1 (p. 4)"
    text: 'References to "lowercase" in this Standard refer to the culture-invariant full case mapping defined in Section 3.13.2 of the Unicode Standard.'
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative definition, verb none. The Unicode Standard is an undated normative reference, so its
      latest version applies (R-0014). A full case mapping can change string length (U+0130 lowercases to
      two code points), which matters wherever case_sensitive is false (R-0131).
  - id: "ecma-427#R-0040"
    normativity: "constraint"
    verb: "none"
    actor: "conforming implementation"
    condition: "when lowercasing ASCII characters"
    object: "case folding"
    field: "effect on ASCII"
    locator: "§5.5, para 2 (p. 4)"
    text: "When applied to the ASCII character set, this operation converts uppercase Latin letters (A to Z) to their corresponding lowercase forms (a to z). All other ASCII characters remain unchanged."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Declarative, verb none; two adjacent sentences of one paragraph."
  - id: "ecma-427#R-0041"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "character repertoire"
    locator: "§5.6, para 1 (p. 5)"
    text: "A PURL string is an ASCII URL string composed of seven components."
    text_kind: "sentence"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative, verb none. Every non-ASCII character in a component therefore appears percent-encoded
      (UTF-8, then triplets, §5.4). Two pointer sentences of §5.6 ('The "lowercase" rules are defined in
      the Case folding clause.' and 'The rules for each component are:') are not extracted.
  - id: "ecma-427#R-0042"
    normativity: "permission"
    verb: "may"
    actor: "PURL string"
    condition: "Except as expressly stated otherwise in this Clause, each component:"
    object: "PURL string"
    field: "every component"
    locator: "§5.6, bullet 1 (p. 5)"
    text: "may be composed of any of the characters defined in the Permitted characters clause"
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "ecma-427#R-0043"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL producer"
    condition: "Except as expressly stated otherwise in this Clause, each component:"
    object: "PURL string"
    field: "every component"
    locator: "§5.6, bullet 2 (p. 5)"
    text: "shall be encoded as defined in the Character encoding clause"
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "ecma-427#R-0044"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "scheme"
    locator: "§5.6.1, bullet 1 (p. 5)"
    text: 'The scheme is a constant with the value "pkg".'
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The constant is testable; whether a parser accepts or rejects another casing such as 'PKG:' is not
      stated (RFC 3986 treats URL schemes as case-insensitive).
    status: "active"
    notes: >-
      Declarative, verb none. Also in Table 1 ('The URL scheme with the constant value of "pkg".') and
      §5.1 ('PURL scheme: this is a URL scheme with a constant value: pkg', R-0026).
  - id: "ecma-427#R-0045"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "separator after the scheme"
    locator: "§5.6.1, bullet 2 (p. 5)"
    text: "The scheme shall be followed by an unencoded colon ':'."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "ecma-427#R-0046"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL parser"
    condition: "when the scheme and colon are followed by one or more '/' characters"
    object: "PURL string"
    field: "slashes after 'pkg:'"
    locator: "§5.6.1, bullet 3 (p. 5)"
    text: "PURL parsers shall accept URLs where the scheme and colon ':' are followed by one or more slash '/' characters, such as 'pkg://',"
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Split from one sentence: acceptance (here) and removal of the slashes (R-0047) are tested
      separately. A generic URL parser reads 'pkg://npm/foo' as having the authority 'npm', which a PURL
      may not contain (R-0023); this rule overrides that reading.
  - id: "ecma-427#R-0047"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL parser"
    condition: "when the scheme and colon are followed by one or more '/' characters"
    object: "PURL string"
    field: "slashes after 'pkg:'"
    locator: "§5.6.1, bullet 3 (p. 5)"
    text: "and shall ignore and remove all such '/' characters."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Second part of the split sentence (R-0046). The canonical form therefore has no slash after 'pkg:'."
  - id: "ecma-427#R-0048"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "type"
    locator: "§5.6.2, bullet 1 (p. 5)"
    text: "The package type shall be composed only of ASCII letters and numbers, period '.', and dash '-'."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Allows uppercase letters (the type is case insensitive, R-0051) and a one-character type, while the
      type definition pattern requires lowercase and at least two characters (R-0112).
  - id: "ecma-427#R-0049"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "type"
    locator: "§5.6.2, bullet 2 (p. 5)"
    text: "The type shall start with an ASCII letter."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "ecma-427#R-0050"
    normativity: "prohibition"
    verb: "shall not"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "type"
    locator: "§5.6.2, bullet 3 (p. 5)"
    text: "The type shall not be percent-encoded."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "ecma-427#R-0051"
    normativity: "constraint"
    verb: "none"
    actor: "PURL parser (comparison)"
    condition: "unconditional"
    object: "PURL string"
    field: "type"
    locator: "§5.6.2, bullet 4 (p. 5)"
    text: "The type is case insensitive."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Declarative, verb none. Split from the bullet 'The type is case insensitive. The canonical form is
      lowercase.': comparison (here) and canonical output (R-0052) are tested separately.
  - id: "ecma-427#R-0052"
    normativity: "constraint"
    verb: "none"
    actor: "PURL producer (canonical form)"
    condition: "in the canonical form"
    object: "PURL string"
    field: "type"
    locator: "§5.6.2, bullet 4 (p. 5)"
    text: "The canonical form is lowercase."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Declarative, verb none; second sentence of the bullet. 'lowercase' as defined in §5.5 (R-0039)."
  - id: "ecma-427#R-0053"
    normativity: "constraint"
    verb: "none"
    actor: "PURL string"
    condition: "unless required by the package's type definition"
    object: "PURL string"
    field: "namespace"
    locator: "§5.6.3, bullet 1 (p. 5)"
    text: "The namespace is optional, unless required by the package's type definition."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Needs the type definition, and the 1st edition contains none. The sentence also omits the third
      option a type definition has, 'prohibited' (R-0117).
    status: "active"
    notes: "Declarative, verb none."
  - id: "ecma-427#R-0054"
    normativity: "permission"
    verb: "may"
    actor: "PURL string"
    condition: "if the namespace is present"
    object: "PURL string"
    field: "namespace segments"
    locator: "§5.6.3, bullet 2 (p. 5)"
    text: "If present, the namespace may contain one or more segments, separated by a single unencoded slash '/' character."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      The permission carries a constraint: segments are separated by a single unencoded '/'; an empty
      segment is excluded by R-0059.
  - id: "ecma-427#R-0055"
    normativity: "recommendation"
    verb: "should"
    actor: "PURL producer (canonical form)"
    condition: "in the canonical form"
    object: "PURL string"
    field: "leading and trailing slashes of the namespace"
    locator: "§5.6.3, bullet 3 (p. 5)"
    text: "All leading and trailing slashes '/' are not significant and should be stripped in the canonical form."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Observable, but a producer that keeps the slashes still conforms because the verb is 'should'; a
      'should' inside a canonical-form rule leaves the canonical form underdetermined (R-0006).
    status: "active"
    notes: "The same sentence appears in §5.6.4 for the name (R-0065), where it governs a different component."
  - id: "ecma-427#R-0056"
    normativity: "constraint"
    verb: "none"
    actor: "PURL parser"
    condition: "unconditional"
    object: "PURL string"
    field: "leading and trailing slashes of the namespace"
    locator: "§5.6.3, bullet 3 (p. 5)"
    text: "They are not part of the namespace."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "Declarative, verb none: the parsed namespace excludes leading and trailing slashes."
  - id: "ecma-427#R-0057"
    normativity: "requirement"
    verb: "shall"
    actor: "PURL string"
    condition: "unconditional"
    object: "PURL string"
    field: "namespace segment"
    locator: "§5.6.3, bullet 4 (p. 5)"
    text: "Each namespace segment shall be a percent-encoded string."
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "ecma-427#R-0058"
    normativity: "prohibition"
    verb: "shall not"
    actor: "PURL string"
    condition: "When percent-decoded, a segment:"
    object: "PURL string"
    field: "namespace segment (percent-decoded)"
    locator: "§5.6.3, bullet 5, item 1 (p. 5)"
    text: "shall not contain any slash '/' characters"
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: "So an encoded '%2F' inside a namespace segment makes the PURL invalid."
  - id: "ecma-427#R-0059"
    normativity: "prohibition"
    verb: "shall not"
    actor: "PURL string"
    condition: "When percent-decoded, a segment:"
    object: "PURL string"
    field: "namespace segment (percent-decoded)"
    locator: "§5.6.3, bullet 5, item 2 (p. 5)"
    text: "shall not be empty"
    text_kind: "bullet"
    kind: "stated"
    testable: "yes"
    status: "active"
  - id: "ecma-427#R-0060"
    normativity: "permission"
    verb: "may"
    actor: "PURL string"
    condition: "When percent-decoded, a segment:"
    object: "PURL string"
    field: "namespace segment (percent-decoded)"
    locator: "§5.6.3, bullet 5, item 3 (p. 5)"
    text: "may contain any Unicode character other than '/' unless the package's type definition provides otherwise"
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      The default (any Unicode character except '/') is testable; restrictions come from type definitions,
      none of which is in this edition.
    status: "active"
  - id: "ecma-427#R-0061"
    normativity: "prohibition"
    verb: "shall not"
    actor: "PURL producer"
    condition: "unconditional"
    object: "PURL string"
    field: "namespace"
    locator: "§5.6.3, bullet 6 (p. 5)"
    text: "A URL host or Authority shall not be used as a namespace."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      No criterion separates a host from a namespace that 'may look like a host' (R-0063, R-0024); only
      the producer's intent distinguishes them.
    status: "active"
  - id: "ecma-427#R-0062"
    normativity: "requirement"
    verb: "none"
    actor: "PURL producer"
    condition: "when a URL host or Authority would otherwise be used as a namespace"
    object: "PURL string"
    field: "repository_url qualifier"
    locator: "§5.6.3, bullet 6 (p. 5)"
    text: "Use instead a repository_url qualifier."
    text_kind: "bullet"
    kind: "stated"
    testable: "partial"
    testable_reason: >-
      Only the presence of the key can be checked: the 1st edition never defines the repository_url
      qualifier (no value format, no semantics; Table 1 says qualifiers are type-specific).
    status: "active"
    notes: >-
      Imperative mood, no modal verb, so verb none. Read as a requirement because ISO/IEC drafting uses
      the imperative for a direct instruction; a reviewer may prefer recommendation.
  - id: "ecma-427#R-0063"
    normativity: "informative"
    verb: "may"
    actor: "PURL string (honoured by validators)"
    condition: "for some types"
    object: "PURL string"
    field: "namespace that looks like a host"
    locator: "§5.6.3, bullet 6 (p. 5)"
    text: "Note however, that for some types, the namespace may look like a host."
    text_kind: "bullet"
    kind: "stated"
    testable: "no"
    testable_reason: >-
      As for R-0024: a statement of possibility with nothing to test; it qualifies the prohibition just
      before it (R-0061), and which types have host-like namespaces is type-specific.
    status: "active"
    notes: >-
      An inline 'Note however' sentence inside a normative bullet, not a formal NOTE; 'may' expresses
      possibility, so the entry is recorded as informative, not as a permission (pass 2
      reclassification). Same point after Table 1 (R-0024).
  - id: "ecma-427#R-0064"
    normativity: "constraint"
