      change after publication; this file follows the printed Annex A.
  - id: "ecma-427#R-0162"
    normativity: "constraint"
    verb: "none"
    actor: "PURL type definition"
    condition: "unconditional"
    object: "PURL type definition (root object)"
    field: "top-level properties"
    locator: "Annex A, /additionalProperties (p. 19)"
    text: '"additionalProperties": false'
    text_kind: "schema-keyword"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Annex A only, verb none: Clause 6 never says that a type definition may not carry other top-level
      properties. With the root properties list, the permitted top-level keys are $schema, $id, type,
      type_name, description, repository, namespace_definition, name_definition, version_definition,
      qualifiers_definition, subpath_definition, examples, note and reference_urls. The component
      definitions (namespace_definition and the others) carry no such keyword, so they accept unknown
      properties.
  - id: "ecma-427#R-0163"
    normativity: "constraint"
    verb: "none"
    actor: "PURL type definition"
    condition: "unconditional"
    object: "PURL type definition (root object)"
    field: "$id"
    locator: "Annex A, /required (p. 20)"
    text: '"$id"'
    text_kind: "schema-keyword"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Annex A only, verb none. One item of the root "required" array, whose items are "$id", "type",
      "type_name", "description", "repository", "namespace_definition", "name_definition" and "examples";
      the other seven repeat Table 2 and are listed in those entries' also_at. Clause 6 and Table 2 never
      mention "$id" (Annex A: title 'PURL type definition id', description 'The unique identifier URI for
      this PURL type definition.', "type": "string"), so a type definition built from Clause 6 alone fails
      Annex A.
  - id: "ecma-427#R-0164"
    normativity: "constraint"
    verb: "none"
    actor: "PURL type definition"
    condition: 'when the type definition carries the optional "$schema" property'
    object: "PURL type definition (root object)"
    field: "$schema"
    locator: "Annex A, /properties/$schema/const (p. 20)"
    text: '"const": "https://packageurl.org/schemas/purl-type-definition.schema-1.0.json"'
    text_kind: "schema-keyword"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Annex A only, verb none; Table 2 does not list "$schema" (Annex A also gives "format": "uri"). The
      value equals the schema's own "$id". The PDF breaks the URL after 'purl-type-'; it is joined without
      a space, as a JSON string cannot hold a line break. The hyphen is printed on the rendered page;
      pdftotext without -layout drops it ('purl-typedefinition'), which is wrong.
  - id: "ecma-427#R-0165"
    normativity: "constraint"
    verb: "none"
    actor: "PURL type definition"
    condition: "unconditional"
    object: "PURL type definition (root object)"
    field: "$id"
    locator: "Annex A, /properties/$id/pattern (p. 20)"
    text: '"pattern": "^https:\\/\\/packageurl\\.org/types/[a-z0-9-]+-definition\\.json$"'
    text_kind: "schema-keyword"
    kind: "stated"
    testable: "yes"
    status: "active"
    notes: >-
      Annex A only, verb none. The PDF breaks the pattern after '+-'; it is joined without a space. The
      hyphen is printed on the rendered page; pdftotext without -layout drops it ('+definition'), which is
      wrong. Potential mismatch: the segment [a-z0-9-]+ excludes '.', which the type pattern (R-0112) and
      §5.6.2 allow, so a type such as 'foo.bar' cannot have an "$id" that embeds its type string. Nothing
      in Annex A or Clause 6 ties the name in "$id" to the "type" value, so such a type can still carry a
      conforming "$id" (for example one ending 'foo-bar-definition.json'); this is an observation, not a
      rule the schema breaks (normative.md U-11).
  - id: "ecma-427#R-0166"
