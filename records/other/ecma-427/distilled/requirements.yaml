    status: "active"
    notes: "Uppercase is not allowed, so a key with an uppercase letter breaks this rule and Clause 2 requires the PURL to be rejected (R-0008); the 1st edition grants no case leniency for keys. packageurl-python 0.17.6 lowercases the key instead (examples PURL-NEG-04)."
