      key' (R-0082): the text itself gives such a pair a meaning, so it does not conflict with the
      rejection duty of Clause 2 (R-0008), and a reader drops the pair (examples PURL-NEG-06). What the
      text does not say is whether a strict validator may also flag 'k=' as non-conforming input.
    status: "active"
    notes: >-
      Split from one sentence at its colon: the prohibition (here) binds producers, the equivalence
      (R-0082) binds parsers.
