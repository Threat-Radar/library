      - 's5.6.2-case'
      - 's5.6.3-slashes'
      - 's5.6.4-slashes'
      - 's5.6.7-slashes'
      - 's5.4-data-octet'
      - 's5.4-allowed-set'
      - 's5.4-delimiters'
      - 's5.4-not-encoded-separators'
      - 's5.4-not-encoded-colon'
      - 's5.4-standard-alone'
      - 'c2-canonical'
      - 'c2-equivalence'
