  - id: 'PURL-EDGE-01'
    kind: 'purl'
    source: 'derived'
    string: 'pkg://example.com/npm/foobar@12.3.1'
    derived_from: 'SRC-C5-EX3 behind a URL authority that is a bare host name.'
    purpose: 'Tests the authority prohibition against the pkg:// leniency.'
    expected:
      result: 'accept'
      result_note: >-
        Judgement call: the stated rules accept the string, with example.com as the type.
      components:
        scheme: 'pkg'
        type: 'example.com'
        namespace: 'npm'
        name: 'foobar'
        version: '12.3.1'
        qualifiers: {}
        subpath: ''
      canonical: 'pkg:example.com/npm/foobar@12.3.1'
      canonical_status: 'defined'
      canonical_note: 'The slashes after pkg: are removed (5.6.1); nothing else changes.'
      canonical_rules:
        - 's5.6.1-slashes'
        - 'c2-canonical'
      context:
        - rule: |-
            A PURL shall not contain a URL Authority, i.e. there is no support for username, password, host and port components.
          locator: 'Clause 5, after Table 1 (p. 3)'
        - rule: |-
            In a PURL, there is no support for a URL Authority (e.g. no username, password, host and port components).
          locator: '5.1, third bullet (p. 3)'
        - rule: |-
            A URL host or Authority shall not be used as a namespace.
          locator: '5.6.3, sixth bullet (p. 5)'
        - rule: |-
            A namespace segment may sometimes look like a host, but its interpretation is specific to a type.
          locator: 'Clause 5, after Table 1 (p. 3)'
      context_note: >-
        Read as an RFC 3986 URI, this string has the authority example.com, which Clause 5
        and 5.1 prohibit. But 5.6.1 has the parser remove the slashes first, after which no
        authority is left and example.com sits in the type position. Nothing in Clause 5
        lets a generic parser tell this from a type named example.com, and this edition
        defines no types to check against, so the prohibition cannot be enforced on this
        string. The 5.6.3 rule against a host as namespace does not reach it either: the
        host lands in the type, and Clause 5 allows that a namespace segment may look like a
        host.
      derivation:
        - step: 'P1'
          outcome: >-
            pkg, an unencoded colon, two slashes. The slashes are ignored and removed,
            leaving pkg:example.com/npm/foobar@12.3.1.
          rules:
            - 's5.6.1-slashes'
        - step: 'P2, P3'
          outcome: 'No hash sign and no question mark.'
          rules:
            - 's5.6.7-prefix'
            - 's5.6.6-prefix'
        - step: 'P4'
          outcome: 'After the at sign: 12.3.1.'
          rules:
            - 's5.6.5-prefix'
        - step: 'P5'
          outcome: >-
            example.com/npm/foobar remains. The type is example.com: letters and a period,
            starting with a letter, so a valid type.
          rules:
            - 's5.6.2-characters'
            - 's5.6.2-start'
        - step: 'P6'
          outcome: 'The name is foobar.'
          rules:
            - 's5.6.4-prefix'
        - step: 'P7'
          outcome: 'The namespace is npm.'
          rules:
            - 's5.6.3-segments'
            - 's5.6.3-not-empty'
        - step: 'P8'
          outcome: 'Scheme, type and name are present.'
          rules:
            - 'c2-required-components'
    actual:
      jsonschema:
        subschema: '/properties/examples/items'
        result: 'invalid'
        errors:
          - instance_path: ''
            schema_path: '/pattern'
            keyword: 'pattern'
            message: |-
              'pkg://example.com/npm/foobar@12.3.1' does not match '^pkg:[a-z][a-z0-9-\\.]+/.*$'
      packageurl_python:
        from_string: 'ok'
        components:
          type: 'example.com'
          namespace: 'npm'
          name: 'foobar'
          version: '12.3.1'
          qualifiers: {}
          subpath: ''
        to_string: 'pkg:example.com/npm/foobar@12.3.1'
    comparison:
      packageurl_python: 'agrees'
