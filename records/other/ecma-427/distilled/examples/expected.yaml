conventions:
  - >-
    source: verbatim marks an example printed in the standard; file holds its bytes plus one
    LF. source: derived marks a fixture the library made.
  - >-
    expected is what the 1st edition requires, derived by hand with the procedure P1 to P9
    below, because the standard gives no parsing algorithm. Every rule id cited resolves in
    rules.
  - >-
    Purl results: accept, reject, or unspecified (the text does not decide). Clause 2 is the
    reason a non-conforming string is rejected (reject_rule).
  - >-
    components: an empty string means absent. The 1st edition writes a component's separator
    only when the component is not empty (5.6.4 to 5.6.7), so an empty and an absent
    namespace, version, qualifiers or subpath give the same string. qualifiers is a mapping
    of percent-decoded values. type is given in canonical (lowercase) form.
  - >-
    canonical is the canonical string where the text fixes it, or empty where it does not;
    canonical_status says which.
  - >-
    Type-definition results: valid or invalid under Annex A, read with ECMA-262 regular
    expressions and with format asserted, which is what the prose describes. annex_a quotes
    Annex A as published electronically (purl-spec tag v1.0.0); the printed Annex A has the
    same lines apart from display wraps of long strings.
  - >-
    actual is tool output and comparison is computed from it; run-fixtures.derived.py
    recomputes both and fails on any difference. Never edit them by hand.
  - >-
    finding explains every case where a tool differs from expected, and some where it agrees
    for a reason worth knowing.
  - >-
    JSON Pointers follow RFC 6901, so the empty pointer is the whole document. Locators give
    the clause, subclause, table or pointer, with the printed page in parentheses.
  - >-
    requirements (on each rule and on reject_rule) and breaks (beside a rule that a fixture
    breaks: in violates, also_breaks or prose) hold ids from requirements.yaml; pass 3
    (cross-check) added them. breaks names the requirement whose constraint the fixture's
    one change breaks; a gap fixture carries breaks beside the prose rule that Annex A does
    not enforce. Where the cited constraint has no requirement entry of its own (a property
    type), breaks names the requirement the same change breaks instead, and breaks_note
    says so.
