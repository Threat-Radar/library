procedure_note: >-
  The 1st edition defines the seven components and their separators but gives no parsing
  algorithm and no procedure for building the canonical string. The steps below are the
  library's own ordering of the stated rules. The order is safe because 5.4 requires a
  separator character used as data to be percent-encoded, so every unencoded separator is a
  real separator. The one exception is the colon, which 5.4 never encodes; only the colon
  after the scheme is a separator, and a type may not contain a colon (5.6.2). Where a
  string carries more than one unencoded at sign (only non-conforming strings do), P4 takes
  the last one; taking the first instead changes no expected result in this file.
procedure:
  - step: 'P1'
    what: >-
      Scheme. The string must start with pkg followed by an unencoded colon. Every slash
      directly after that colon is ignored and removed.
    rules:
      - 's5.6.1-constant'
      - 's5.6.1-colon'
      - 's5.3-colon'
      - 's5.6.1-slashes'
  - step: 'P2'
    what: >-
      Subpath. If an unencoded hash sign is present, the text after it is the subpath. Split
      it on slashes, drop leading and trailing slashes, percent-decode each segment, and
      check that no decoded segment is empty, contains a slash, or is . or ..
    rules:
      - 's5.3-hash'
      - 's5.6.7-prefix'
      - 's5.6.7-not-part'
      - 's5.3-slash-subpath'
      - 's5.6.7-segments'
      - 's5.6.7-slashes'
      - 's5.6.7-encoded'
      - 's5.6.7-no-slash'
      - 's5.6.7-not-empty'
      - 's5.6.7-no-dots'
  - step: 'P3'
    what: >-
      Qualifiers. If an unencoded question mark is present, the text after it (up to any
      hash sign) is the qualifiers component. Split it on ampersands into key=value pairs
      and each pair on its equal sign. A pair with an empty value is the same as no pair.
      Each key must be lowercase ASCII letters, digits, period, dash or underscore, start
      with a letter, not be percent-encoded, and be unique. Each value is percent-decoded.
    rules:
      - 's5.3-question'
      - 's5.6.6-prefix'
      - 's5.3-ampersand'
      - 's5.6.6-ampersand'
      - 's5.3-equals'
      - 's5.6.6-equals'
      - 's5.6.6-empty-value'
      - 's5.6.6-key-characters'
      - 's5.6.6-key-start'
      - 's5.6.6-key-not-encoded'
      - 's5.6.6-key-unique'
      - 's5.6.6-value-encoding'
  - step: 'P4'
    what: >-
      Version. If an unencoded at sign remains, the text after it is the version,
      percent-decoded.
    rules:
      - 's5.3-at'
      - 's5.6.5-prefix'
      - 's5.6.5-not-part'
      - 's5.6.5-encoded'
      - 's5.6.5-opaque'
  - step: 'P5'
    what: >-
      Type. What remains is type, namespace and name separated by slashes. The type is the
      text before the first slash: ASCII letters, digits, period and dash only, starting
      with a letter, never percent-encoded, compared without regard to case, canonical in
      lowercase.
    rules:
      - 'c5-separators'
      - 's5.3-slash'
      - 's5.6.2-characters'
      - 's5.6.2-start'
      - 's5.6.2-not-encoded'
      - 's5.6.2-case'
  - step: 'P6'
    what: >-
      Name. Drop trailing slashes from the rest; the name is the text after the last slash
      that remains (or all of it when there is none), percent-decoded.
    rules:
      - 's5.6.4-prefix'
      - 's5.6.4-slashes'
      - 's5.6.4-encoded'
      - 's5.6.4-any-character'
  - step: 'P7'
    what: >-
      Namespace. Whatever lies between the type and the name, with leading and trailing
      slashes dropped, is the namespace. Split it on slashes and percent-decode each
      segment; no decoded segment may be empty or contain a slash.
    rules:
      - 's5.6.3-optional'
      - 's5.6.3-segments'
      - 's5.6.3-slashes'
      - 's5.6.3-encoded'
      - 's5.6.3-no-slash'
      - 's5.6.3-not-empty'
  - step: 'P8'
    what: >-
      Required components and rejection. Scheme, type and name must be present. A string
      that fails any step is rejected.
    rules:
      - 'c2-required-components'
      - 'c2-reject'
  - step: 'P9'
    what: >-
      Canonical form. Write the components back with the type in lowercase, no leading or
      trailing slashes, and each component encoded as 5.4 says: separators used as
      separators and every colon stay unencoded, alphanumerics and punctuation stay
      unencoded, and every other character is percent-encoded. The 1st edition states no
      qualifier order and no equivalence rules, so it does not fix the canonical string of a
      PURL with two or more qualifiers.
