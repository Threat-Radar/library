    source: 'derived'
    file: 'type-definitions/type-trailing-newline.derived.json'
    derived_from: 'TD-POS-01 (minimal-valid) with one change.'
    mutation: '/type'
    change: 'type set to fixture followed by a newline'
    ecma262_check:
      pattern_from: 'schema:/properties/type/pattern'
      test_value_from: 'instance:/type'
    expected:
      result: 'invalid'
      violates:
        annex_a: |-
          "pattern": "^[a-z][a-z0-9-\\.]+$",
        annex_a_pointer: '/properties/type/pattern'
        locator: 'Annex A (normative), /properties/type (p. 21)'
        breaks:
          - 'ecma-427#R-0112'
      prose:
        - rule: |-
            Pattern Constraint: ^[a-z][a-z0-9-\.]+$
          locator: '6.1 (p. 7)'
        - rule: |-
            The package type shall be composed only of ASCII letters and numbers, period '.', and dash '-'.
          locator: '5.6.2, first bullet (p. 5)'
      prose_agrees: 'yes'
      prose_note: >-
        JSON Schema Draft-07 evaluates pattern in the ECMA-262 dialect (the validation
        specification in the Bibliography; not quoted here), where $ without the m flag
        matches only at the end of the input; Node reports no match. A newline is also not a
        type character under 5.6.2.
    actual:
      jsonschema:
        without_format_checker:
          result: 'valid'
        with_format_checker:
          result: 'valid'
      packageurl_python: 'n/a (not a purl)'
      ecma262_node:
        pattern_from: 'schema:/properties/type/pattern'
        test_value_from: 'instance:/type'
        no_flags: 'does not match'
        u_flag: 'does not match'
    comparison:
      without_format_checker: 'differs'
      with_format_checker: 'differs'
    finding: >-
      jsonschema evaluates pattern with Python re.search, where $ also matches just before a
      final newline, so it accepts fixture followed by a newline as a type, with or without
      a format checker. The same gap affects every pattern in the schema.
  - id: 'TD-GAP-01'
    kind: 'type-definition'
    source: 'derived'
    file: 'type-definitions/qualifier-key-uppercase.derived.json'
    derived_from: 'TD-POS-01 (minimal-valid) with one change.'
    mutation: '/qualifiers_definition'
    change: 'a qualifiers_definition with the key Arch added'
    expected:
      result: 'valid'
      constraint:
        annex_a: |-
          "key": {
            "title": "Qualifier key",
            "description": "The key for the qualifier.",
            "type": "string"
          },
        annex_a_pointer: '/properties/qualifiers_definition/items/properties/key/type'
        locator: 'Annex A (normative), /properties/qualifiers_definition/items/properties/key (p. 23)'
      prose:
        - prose_lead: |-
            For each key=value pair:
          prose_item: |-
            The key shall be composed only of lowercase ASCII letters and numbers, period '.', dash '-' and underscore '_'.
          locator: '5.6.6, fifth bullet, first sub-bullet (p. 6)'
          breaks:
            - 'ecma-427#R-0148'
      prose_agrees: 'no (inference)'
      prose_note: >-
        Annex A accepts any string as a qualifier key. 5.6.6 limits keys in a PURL to
        lowercase letters, digits, period, dash and underscore, so this definition declares
        a key that no conforming PURL can carry. That the definition is therefore defective
        is our inference; Clause 6 does not say so.
    actual:
      jsonschema:
        without_format_checker:
          result: 'valid'
        with_format_checker:
          result: 'valid'
      packageurl_python: 'n/a (not a purl)'
    comparison:
      without_format_checker: 'agrees'
      with_format_checker: 'agrees'
  - id: 'TD-GAP-02'
    kind: 'type-definition'
    source: 'derived'
    file: 'type-definitions/qualifier-key-repeated.derived.json'
    derived_from: 'TD-POS-01 (minimal-valid) with one change.'
    mutation: '/qualifiers_definition'
    change: >-
      a qualifiers_definition defining the key arch twice, with different descriptions
    expected:
      result: 'valid'
      constraint:
        annex_a: |-
          "type": "array",
          "additionalItems": false,
          "uniqueItems": true,
        annex_a_pointer: '/properties/qualifiers_definition/uniqueItems'
        locator: 'Annex A (normative), /properties/qualifiers_definition (p. 23)'
      prose:
        - prose_lead: |-
            For each key=value pair:
          prose_item: |-
            Each key shall be unique among all the keys of the qualifiers component.
          locator: '5.6.6, fifth bullet, fourth sub-bullet (p. 6)'
          breaks:
            - 'ecma-427#R-0148'
      prose_agrees: 'unclear (inference)'
      prose_note: >-
        uniqueItems compares whole items; these two differ in their description, so they are
        unique as items while defining one key twice. The 5.6.6 rule governs a PURL, not a
        definition, and Clause 6 has no rule against this; calling it a defect is our
        inference.
    actual:
      jsonschema:
        without_format_checker:
          result: 'valid'
        with_format_checker:
          result: 'valid'
      packageurl_python: 'n/a (not a purl)'
    comparison:
      without_format_checker: 'agrees'
      with_format_checker: 'agrees'
  - id: 'TD-GAP-03'
    kind: 'type-definition'
    source: 'derived'
    file: 'type-definitions/examples-without-name.derived.json'
    derived_from: 'TD-POS-01 (minimal-valid) with one change.'
    mutation: '/examples'
    change: 'examples set to pkg:fixture/ (no name)'
    expected:
      result: 'valid'
      constraint:
        annex_a: |-
          "items": {
            "type": "string",
            "pattern": "^pkg:[a-z][a-z0-9-\\.]+/.*$"
          }
        annex_a_pointer: '/properties/examples/items/pattern'
        locator: 'Annex A (normative), /properties/examples/items (p. 24)'
      prose:
        - rule: |-
            Example of valid, canonical PURLs for this package type. Each item of this array shall be a string.
          locator: '6.10 (p. 18)'
          breaks:
            - 'ecma-427#R-0155'
        - rule: |-
            All required components of a PURL, such as the scheme, type, and name, shall be present and validated according to the rules defined in this Standard.
          locator: 'Clause 2, third paragraph (p. 1)'
          breaks:
            - 'ecma-427#R-0004'
      prose_agrees: 'no'
      prose_note: >-
        The items pattern checks only the scheme and the type, so pkg:fixture/ passes though
        it has no name. 6.10 asks for valid, canonical PURLs, which the schema cannot check.
    actual:
      jsonschema:
        without_format_checker:
          result: 'valid'
        with_format_checker:
          result: 'valid'
      packageurl_python: 'n/a (not a purl)'
    comparison:
      without_format_checker: 'agrees'
      with_format_checker: 'agrees'
  - id: 'TD-GAP-04'
