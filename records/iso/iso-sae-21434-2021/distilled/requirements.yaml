licensed_text: >
  ISO/SAE 21434:2021 is a purchased, all-rights-reserved standard. Under the sponsor's
  licensed-text decision (tmodel#38 Q3, 2026-10-19; tmodel#154) this catalog holds no
  verbatim text from it: every `text` and `short_title` is our own paraphrase, written to
  keep the actor, condition, action, objects and force of the provision. Designator,
  normativity, verb and locator are kept beside the paraphrase so a shall cannot drift into a
  should; the verb field is authoritative for force. source_digest identifies the purchased
  PDF bytes the original extraction read. A paraphrase is not the standard; read the
  standard before relying on any entry. 16 entries whose extract was cut off or held annex
  text carry audit_status text-defect-needs-licensed-copy and a notes field.
reviewed_by: ""
note: >
  Audit-oriented typing. normativity=requirement/recommendation/permission; actor=who must
  comply; nature=process (activity) vs deliverable-producing (yields a work product);
  expects_deliverables=the required work product(s) that evidence conformance; verification=how
  an audit checks it. All 21434 requirements are tailorable at project level (Clause 6.4.3).
  DERIVED fields (actor, nature, verification, short_title) need human review; text is our
  paraphrase (see licensed_text), not the standard's wording.
  from_subclauses=the subclauses a work product results from, for the 10 work products the
  standard ties to subclauses instead of provisions; their provisions can be found by locator.
counts: { requirement: 101, recommendation: 13, permission: 4, required_deliverables: 42 }

