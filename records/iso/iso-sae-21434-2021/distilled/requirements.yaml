requirements:
  - id: iso-sae-21434-2021#RQ-05-01
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall define a cybersecurity policy that includes: a) acknowledgement of road vehicle cybersecurity risks; and b) the executive management’s commitment to manage the corresponding cybersecurity risks."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-02
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall establish and maintain rules and processes to: a) enable the implementation of the requirements of this document; and b) support the execution of the corresponding activities."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-03
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall assign and communicate the responsibilities and corresponding organizational authority to achieve and maintain cybersecurity."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-04
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall provide the resources to address cybersecurity."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-05
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall identify disciplines related to, or interacting with, cybersecurity and establish and maintain communication channels between those disciplines in order to: a) determine if and how cybersecurity will be integrated into existing processes; and b) coordinate the exchange of relevant information."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-06
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall foster and maintain a strong cybersecurity culture."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-07
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall ensure that persons to which cybersecurity roles and responsibilities are assigned have the competences and awareness to fulfil these."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-08
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall institute and maintain a continuous improvement process."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-09
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall define the circumstances under which information sharing related to cybersecurity is required, permitted, or prohibited, internal or external to the organization."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-05-10
    type: RC
    verb: SHOULD
    clause: "05"
    locator: "§05"
    text: "The organization should align its information security management of the shared data with other parties in accordance with [RQ-05-09]."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-11
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The organization shall institute and maintain a quality management system in accordance with International Standards, or equivalent, to support cybersecurity engineering, addressing:"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-12
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "The configuration information required for maintaining cybersecurity of a product in the field shall remain available until the end of cybersecurity support for the product, in order to enable remedial actions."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-05-13
    type: RC
    verb: SHOULD
    clause: "05"
    locator: "§05"
    text: "A cybersecurity management system for the production processes should be established in order to support the activities of Clause 12."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-14
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "Tools that can influence the cybersecurity of an item or component shall be managed."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-05-15
    type: RC
    verb: SHOULD
    clause: "05"
    locator: "§05"
    text: "An appropriate environment to support remedial actions for cybersecurity incidents (see 13.3) should be reproducible until the end of cybersecurity support for the product."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-05-16
    type: RC
    verb: SHOULD
    clause: "05"
    locator: "§05"
    text: "Work products should be managed in accordance with an information security management system."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-05-17
    type: RQ
    verb: SHALL
    clause: "05"
    locator: "§05"
    text: "A cybersecurity audit shall be performed independently to judge whether the organizational processes achieve the objectives of this document."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-01
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The responsibilities regarding the project’s cybersecurity activities shall be assigned and communicated in accordance with [RQ-05-03]."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-02
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "In order to decide cybersecurity activities needed for the item or component, the item or component shall be analysed to determine: a) whether the item or component is cybersecurity relevant;"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-03
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The cybersecurity plan shall include the: a) objective of an activity; b) dependencies on other activities or information; c) personnel responsible for performing an activity; d) required resources for performing an activity; e) starting point or end point, and the expected duration of an activity; and f) identificatio"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-04
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The responsibilities for developing and maintaining the cybersecurity plan, and for tracking the progress of the cybersecurity activities against the cybersecurity plan shall be assigned in accordance with [RQ-05-03] and [RQ-05-04]."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-05
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The cybersecurity plan shall either be: a) referenced in the project plan for the development; or b) included in the project plan, such that the cybersecurity activities are distinguishable."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-06
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The cybersecurity plan shall specify the activities that are required for cybersecurity during the concept and product development phases in accordance with the relevant requirements of Clauses 9, 10, 11 and 15."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-07
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The cybersecurity plan shall be updated when a change or a refinement of the activities to be performed is identified."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#PM-06-08
    type: PM
    verb: MAY
    clause: "06"
    locator: "§06"
    text: "For threat scenarios of risk value 1 that are determined from an analysis in accordance with 15.8, conformity with 9.5, Clause 10 and Clause 11 may be omitted."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-09
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The work products identified in the cybersecurity plan shall be updated and maintained for accuracy until and at the release for post-development."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-10
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "If cybersecurity activities are distributed, customer and supplier shall each define a cybersecurity plan regarding their respective cybersecurity activities and interfaces in accordance with Clause 7."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-11
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The cybersecurity plan shall be subject to configuration management and documentation management, in accordance with 5.4.4."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-12
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The work products identified in the cybersecurity plan shall be subject to configuration management, change management, requirements management, and documentation management, in accordance with 5.4.4."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#PM-06-13
    type: PM
    verb: MAY
    clause: "06"
    locator: "§06"
    text: "A cybersecurity activity may be tailored."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-14
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "If a cybersecurity activity is tailored, then a rationale why the tailoring is adequate and sufficient to achieve the relevant objectives of this document shall be provided and reviewed."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-15
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "A reuse analysis shall be carried out if an item or component has been developed and: a) modifications are planned; b) is planned to be reused in another operational environment; or"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-16
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "A reuse analysis of an item or component shall: a) identify the modifications to the item or component and the modifications of its operational environment; b) analyse the cybersecurity implications of the modifications, including the effects on the validity of cybersecurity claims and previously made assumptions;"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-17
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "A reuse analysis of a component shall evaluate whether: a) the component is able to fulfil the allocated cybersecurity requirements from the item or component, in which it is to be integrated; and b) the existing documentation is sufficient to support the integration into an item, or into another component."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-18
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "Assumptions on the intended use and context, including the external interfaces, for a component developed out-of-context shall be documented in the corresponding work products."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-19
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "For the development of a component out-of-context, the cybersecurity requirements shall be based on the assumptions of [RQ-06-18]."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-20
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "For the integration of a component developed out-of-context, the cybersecurity claims and assumptions of [RQ-06-18] shall be validated."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-21
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "When integrating an off-the-shelf component, the cybersecurity-relevant documentation shall be gathered and analysed to determine whether: a) allocated cybersecurity requirements can be fulfilled; b) the component is suitable for the specific application context of the intended use; and c) existing documentation is suf"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-22
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "If the existing documentation is insufficient to support the integration of the off-the-shelf component, then the cybersecurity activities to conform with this document shall be identified and performed."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-23
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "A cybersecurity case shall be created to provide the argument for the cybersecurity of the item or component, supported by work products."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-24
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "A decision whether to perform a cybersecurity assessment for an item or component shall be made supported by a rationale applying a risk-based approach."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-25
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The rationale of [RQ-06-24] shall be reviewed independently."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-26
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The cybersecurity assessment shall judge the cybersecurity of the item or component."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-27
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "A person responsible to plan and perform independently a cybersecurity assessment shall be appointed in accordance with [RQ-06-01]."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-28
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "A person who carries out a cybersecurity assessment shall have: a) access to the relevant information and tools; and b) the cooperation of the personnel performing the cybersecurity activities."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#PM-06-29
    type: PM
    verb: MAY
    clause: "06"
    locator: "§06"
    text: "A cybersecurity assessment may be based on a judgement of whether the objectives of this document are achieved."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-30
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The scope of a cybersecurity assessment shall include: a) the cybersecurity plan and all work products identified in the cybersecurity plan;"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-31
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "A cybersecurity assessment report shall include a recommendation for acceptance, conditional acceptance, or rejection of the cybersecurity of the item or component."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-32
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "If a recommendation for conditional acceptance in accordance with [RQ-06-31] is made, then the cybersecurity assessment report shall include the conditions for acceptance."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-33
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The following work products shall be available prior to the release for post-development: a) the cybersecurity case [WP-06-02]; b) if applicable, the cybersecurity assessment report [WP-06-03]; and c) the cybersecurity requirements for post-development [WP-10-02]."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-06-34
    type: RQ
    verb: SHALL
    clause: "06"
    locator: "§06"
    text: "The following conditions shall be fulfilled for the release for post-development of the item or component: a) the argument for cybersecurity provided by the cybersecurity case is convincing; b) the cybersecurity case is confirmed by the cybersecurity assessment, if applicable; and c) the cybersecurity requirements for "
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-07-01
    type: RQ
    verb: SHALL
    clause: "07"
    locator: "§07"
    text: "The capability of a candidate supplier to develop and, if applicable, perform post- development activities in accordance with this document shall be evaluated."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-07-02
    type: RC
    verb: SHOULD
    clause: "07"
    locator: "§07"
    text: "To support a customer’s evaluation of supplier capability, a supplier should provide a record of cybersecurity capability."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-07-03
    type: RQ
    verb: SHALL
    clause: "07"
    locator: "§07"
    text: "A request for quotation from a customer to a candidate supplier shall include: a) a formal request to conform to this document; b) the expectation that cybersecurity responsibilities will be taken on by the supplier in accordance with 7.4.3; and c) the cybersecurity goals and/or set of cybersecurity requirements releva"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-07-04
    type: RQ
    verb: SHALL
    clause: "07"
    locator: "§07"
    text: "A customer and a supplier shall specify the distributed cybersecurity activities in a cybersecurity interface agreement including: a) appointment of customer’s and supplier’s points of contact regarding cybersecurity; b) identification of cybersecurity activities that are to be performed by customer and supplier, respe"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-07-05
    type: RC
    verb: SHOULD
    clause: "07"
    locator: "§07"
    text: "The cybersecurity interface agreement should be mutually agreed upon between customer and supplier prior to the start of the distributed cybersecurity activities."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-07-06
    type: RQ
    verb: SHALL
    clause: "07"
    locator: "§07"
    text: "If there is an identified vulnerability to be managed in accordance with [RQ-08-07], the customer and supplier shall agree on actions and responsibility for those actions."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-07-07
    type: RQ
    verb: SHALL
    clause: "07"
    locator: "§07"
    text: "If requirements are unclear, not feasible, or conflict with other cybersecurity requirements or requirements from other disciplines, then customer and supplier shall each notify the other so that appropriate decisions and actions can be taken."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-07-08
    type: RC
    verb: SHOULD
    clause: "07"
    locator: "§07"
    text: "Responsibilities should be specified in a responsibility assignment matrix."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-08-01
    type: RQ
    verb: SHALL
    clause: "08"
    locator: "§08"
    text: "Sources shall be selected for collection of cybersecurity information."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-08-02
    type: RQ
    verb: SHALL
    clause: "08"
    locator: "§08"
    text: "Triggers shall be defined and maintained for the triage of cybersecurity information."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-08-03
    type: RQ
    verb: SHALL
    clause: "08"
    locator: "§08"
    text: "Cybersecurity information shall be collected and triaged to determine if the cybersecurity information becomes one or more cybersecurity events."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-08-04
    type: RQ
    verb: SHALL
    clause: "08"
    locator: "§08"
    text: "A cybersecurity event shall be evaluated to identify weaknesses in an item and/or component."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-08-05
    type: RQ
    verb: SHALL
    clause: "08"
    locator: "§08"
    text: "Weaknesses shall be analysed to identify vulnerabilities."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-08-06
    type: RQ
    verb: SHALL
    clause: "08"
    locator: "§08"
    text: "A rationale shall be provided for a weakness that is not identified as a vulnerability."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-08-07
    type: RQ
    verb: SHALL
    clause: "08"
    locator: "§08"
    text: "Vulnerabilities shall be managed such that for each vulnerability: a) the corresponding cybersecurity risks are assessed and treated in accordance with 15.9 such that no unreasonable risks remain; or b) the vulnerability is eliminated by applying an available remediation independent of a TARA."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-08-08
    type: RQ
    verb: SHALL
    clause: "08"
    locator: "§08"
    text: "If a risk treatment decision in accordance with 15.9 necessitates cybersecurity incident response, then 13.3 shall be applied."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-01
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "The following information on the item shall be identified: a) item boundary;"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-02
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "Information about the operational environment of the item relevant to cybersecurity shall be described."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-03
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "An analysis based on the item definition shall be performed that involves: a) asset identification in accordance with 15.3; b) threat scenario identification in accordance with 15.4; c) impact rating in accordance with 15.5; d) attack path analysis in accordance with 15.6; e) attack feasibility rating in accordance wit"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-04
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "Based on the results of [RQ-09-03], risk treatment options shall be determined for each threat scenario in accordance with 15.9."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-05
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "If the risk treatment decision for a threat scenario includes reducing the risk, then one or more corresponding cybersecurity goals shall be specified."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-06
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "If the risk treatment decision for a threat scenario includes: a) sharing the risk; or b) retaining the risk due to one or more assumptions used during the analysis of [RQ-09-03], then one or more corresponding cybersecurity claims shall be specified."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-07
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "A verification shall be performed to confirm: a) correctness and completeness of the result of [RQ-09-03] with respect to the item definition; b) completeness, correctness and consistency of the risk treatment decisions of [RQ-09-04] with respect to the results of [RQ-09-03]; c) completeness, correctness and consistenc"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-08
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "Technical and/or operational cybersecurity controls and their interactions to achieve the cybersecurity goals shall be described, taking into account: a) dependencies between the functions of the item; and/or b) cybersecurity claims."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-09
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "Cybersecurity requirements of the item and requirements on the operational environment shall be defined for the cybersecurity goals in accordance with the description of [RQ-09-08]."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-10
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "The cybersecurity requirements shall be allocated to the item, and if applicable to one or more of its components."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-09-11
    type: RQ
    verb: SHALL
    clause: "09"
    locator: "§09"
    text: "The results of [RQ-09-08], [RQ-09-09] and [RQ-09-10] shall be verified to confirm: a) completeness, correctness, and consistency with respect to cybersecurity goals; and b) consistency with respect to cybersecurity claims."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-01
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.1"
    text: "Cybersecurity specifications shall be defined based on: a) cybersecurity specifications from higher levels of architectural abstraction; b) cybersecurity controls selected for implementation, if applicable; and"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-02
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.1"
    text: "The defined cybersecurity requirements shall be allocated to components of the architectural design."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-03
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.1"
    text: "Procedures to ensure cybersecurity after the development of the component shall be specified, if applicable."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-04
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.1"
    text: "If design, modelling or programming notations or languages are used for the cybersecurity specifications or their implementation, the following shall be considered when selecting such a notation or language: a) an unambiguous and comprehensible definition in both syntax and semantics; b) support for achievement of modu"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-05
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.1"
    text: "Criteria (see [RQ-10-04]) for suitable design, modelling or programming languages for cybersecurity that are not addressed by the language itself shall be covered by design, modelling and coding guidelines, or by the development environment."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-10-06
    type: RC
    verb: SHOULD
    clause: "10"
    locator: "§10.4.1"
    text: "Established and trusted design and implementation principles should be applied to avoid or minimize the introduction of weaknesses."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-07
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.1"
    text: "The architectural design defined in [RQ-10-01] shall be analysed to identify weaknesses."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-08
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.1"
    text: "The defined cybersecurity specifications shall be verified to ensure completeness, correctness, and consistency with the cybersecurity specifications from higher levels of architectural abstraction."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-09
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.2"
    text: "Integration and verification activities shall verify that the implementation and integration of components fulfil the defined cybersecurity specifications."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-10
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.2"
    text: "The integration and verification activities of [RQ-10-09] shall be specified considering: a) the defined cybersecurity specifications; b) configurations intended for series production, if applicable; c) sufficient capability to support the functionality specified in the defined cybersecurity specifications; and d) conf"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-11
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.2"
    text: "If verification by testing is adopted, test coverage shall be evaluated using defined test coverage metrics to determine sufficiency of the test activities."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-10-12
    type: RC
    verb: SHOULD
    clause: "10"
    locator: "§10.4.2"
    text: "Testing should be performed in order to confirm that unidentified weaknesses and vulnerabilities remaining in the component are minimized."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-10-13
    type: RQ
    verb: SHALL
    clause: "10"
    locator: "§10.4.2"
    text: "If testing in accordance with [RC-10-12] is not performed, then a rationale shall be provided."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-11-01
    type: RQ
    verb: SHALL
    clause: "11"
    locator: "§11.4"
    text: "Validation activities at the vehicle level for the item considering the configurations for series production shall confirm: a) adequacy of the cybersecurity goals with respect to the threat scenarios and corresponding risk;"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-11-02
    type: RQ
    verb: SHALL
    clause: "11"
    locator: "§11.4"
    text: "A rationale for the selection of validation activities shall be provided."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-12-01
    type: RQ
    verb: SHALL
    clause: "12"
    locator: "§12.4"
    text: "A production control plan shall be created that applies the cybersecurity requirements for post-development."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-12-02
    type: RQ
    verb: SHALL
    clause: "12"
    locator: "§12.4"
    text: "The production control plan shall include: a) sequence of steps that apply the cybersecurity requirements for post-development; b) production tools and equipment; c) cybersecurity controls to prevent unauthorized alteration during production; and"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-12-03
    type: RQ
    verb: SHALL
    clause: "12"
    locator: "§12.4"
    text: "The production control plan shall be implemented."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-13-01
    type: RQ
    verb: SHALL
    clause: "13"
    locator: "§13.3.2"
    text: "For each cybersecurity incident, a cybersecurity incident response plan shall be created that includes: a) remedial actions;"
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-13-02
    type: RQ
    verb: SHALL
    clause: "13"
    locator: "§13.3.2"
    text: "The cybersecurity incident response plan shall be implemented."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-13-03
    type: RQ
    verb: SHALL
    clause: "13"
    locator: "§13.4.2"
    text: "Updates and update-related capabilities within the vehicle shall be developed in accordance with this document."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-14-01
    type: RQ
    verb: SHALL
    clause: "14"
    locator: "§14.3.2"
    text: "A procedure shall be created to communicate to customers when an organization decides to end cybersecurity support for an item or component."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-14-02
    type: RQ
    verb: SHALL
    clause: "14"
    locator: "§14.4.2"
    text: "The cybersecurity requirements for post-development with regard to decommissioning shall be made available."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-01
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.3.2"
    text: "Damage scenarios shall be identified."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-02
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.3.2"
    text: "Assets with cybersecurity properties whose compromise leads to a damage scenario shall be identified."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-03
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.4.2"
    text: "Threat scenarios shall be identified and include: — targeted asset; — compromised cybersecurity property of the asset; and — cause of compromise of the cybersecurity property."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-04
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.5.2"
    text: "The damage scenarios shall be assessed against potential adverse consequences for road users in the impact categories of safety, financial, operational, and privacy (S, F, O, P) respectively."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-05
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.5.2"
    text: "The impact rating of a damage scenario shall be determined for each impact category to be one of the following: — severe; — major; — moderate; or — negligible."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-06
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.5.2"
    text: "Safety related impact ratings shall be derived from ISO 26262-3:2018, 6.4.3."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#PM-15-07
    type: PM
    verb: MAY
    clause: "15"
    locator: "§15.5.2"
    text: "If a damage scenario results in an impact rating and an argument can be made that every impact of another impact category is considered less critical, then further analysis for that other impact category may be omitted."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-08
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.6.2"
    text: "The threat scenarios shall be analysed to identify attack paths."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-09
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.6.2"
    text: "An attack path shall be associated with the threat scenarios that can be realized by the attack path."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-10
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.7.2"
    text: "For each attack path, the attack feasibility rating shall be determined as described in Table 1."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-15-11
    type: RC
    verb: SHOULD
    clause: "15"
    locator: "§15.7.2"
    text: "The attack feasibility rating method should be defined based on one of the following approaches: a) attack potential-based approach; b) CVSS-based approach; or c) attack vector-based approach."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-15-12
    type: RC
    verb: SHOULD
    clause: "15"
    locator: "§15.7.2"
    text: "If an attack potential-based approach is used, the attack feasibility rating should be determined based on core factors including: a) elapsed time; b) specialist expertise; c) knowledge of the item or component; d) window of opportunity; and e) equipment."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-15-13
    type: RC
    verb: SHOULD
    clause: "15"
    locator: "§15.7.2"
    text: "If a CVSS-based approach is used, the attack feasibility rating should be determined based on the exploitability metrics of the base metric group, including: a) attack vector; b) attack complexity; c) privileges required; and d) user interaction."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RC-15-14
    type: RC
    verb: SHOULD
    clause: "15"
    locator: "§15.7.2"
    text: "If an attack vector-based approach is used, the attack feasibility rating should be determined based on evaluating the predominant attack vector (cf. CVSS [24] 2.1.1) of the attack path."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-15
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.8.2"
    text: "For each threat scenario the risk value shall be determined from the impact of the associated damage scenarios and the attack feasibility of the associated attack paths."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-16
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.8.2"
    text: "The risk value of a threat scenario shall be a value between (and including) 1 and 5, where a value of 1 represents minimal risk."
    kind: stated
    status: active
  - id: iso-sae-21434-2021#RQ-15-17
    type: RQ
    verb: SHALL
    clause: "15"
    locator: "§15.9.2"
    text: "For each threat scenario, considering its risk values, one or more of the following risk treatment option(s) shall be determined: a) avoiding the risk;"
    kind: stated
    status: active

