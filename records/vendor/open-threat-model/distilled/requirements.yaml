note: >
  SOURCE. Open Threat Model (OTM) 0.2.0, iriusrisk/OpenThreatModel at commit
  c88c5a7b4115f0f025e28d5682a2b0d790b389e4 (2025-12-11): README.md, the specification text (2034 lines; field tables
  per object with the keyword at the head of the Description cell), and otm_schema.json (308 lines, JSON Schema
  draft-07, $id https://iriusrisk.com/schema/otm-0.2.0.schema.json). A pure data format: no exchange, no lifecycle;
  beyond structure it states one default (L1404) and reference rules between objects. IDS. open-threat-model#R-NNNN,
  stable and never reused. README.md entries first (R-0001-R-0109), in source order: the line on which the quoted
  text starts, then its column; at the same position a stated entry precedes an inferred one. Then otm_schema.json
  entries (R-0110-R-0287) in source order: line, then column; the names of one required array in array order.
  LOCATOR. 'README.md L<line> › <heading path> › <field>': the README's own heading path (the level-1 heading Schema
  holds every object section; Position object sits under Size object as the README nests it, D-24), then the Field
  cell for a table-row requirement; '(licence footer)' for L2033. 'otm_schema.json L<line> › <JSON pointer>': the
  line on which the quoted member starts and the RFC 6901 pointer of the keyword (of the array element for one name
  of a required array); pointer repeats it. FORMS. prose = a statement in README.md (sentence, list or table cell)
  or the schema's $comment; schema = a JSON Schema keyword of otm_schema.json. TEXT. Verbatim contiguous substrings
  of the source, compared with whitespace runs normalised to one space; markdown and HTML markup kept as written
  (**REQUIRED**, <b>REQUIRED</b>, <b>one parent</b>, <br/>, links), typographic characters kept. A keyword row's
  text is its whole Description cell, which in this source always opens with the keyword. Further rules inside the
  same cell (a range, a should, a must, a uniqueness or reference rule) are separate entries whose texts are
  substrings of the cell and hold no upper-case keyword, so no keyword is counted twice. A list that completes a
  sentence is quoted with it (L189-L193, L1284-L1287). Texts that span a line break (byte-exact otherwise): R-0021,
  R-0059, R-0071, R-0094, R-0095, R-0250, R-0283, R-0284, R-0285, R-0286, R-0287. A schema text is the verbatim
  member, key through value, e.g. "type": ["string", "null"]; the names of one required array share its text. KIND.
  stated = the text states the rule. inferred = a rule derived from a descriptive sentence: the text is that
  sentence and inferred_rule states the rule in our words; 13 entries, all flagged. ACTORS (fixed vocabulary).
  otm-producer = whoever writes an OTM document, a tool or a person; otm-consumer = a tool or person that reads,
  imports, validates or renders one; spec-maintainer = the OTM maintainers who number and evolve the specification;
  licensee = anyone copying, adapting or redistributing README.md or otm_schema.json. Schema constraints bind the
  otm-producer and are checked by validation. VERBS (fixed vocabulary). BCP 14 as written: REQUIRED, RECOMMENDED.
  Lower-case modals: must, should, may (a permission), required ('at least one of them is required'). Other stated:
  unique ('Unique identifier ...'), range ('From 0 to 100'), format (a Data Types format rule), defines (the integer
  definition), not-supported (null), closed (the formats available), normative-reference (the OpenAPI approach; JSON
  Schema Wright Draft 00), supported-values ('currently supported' representation types; 'supported types of
  parents'), case-sensitive, versioning (semver), cardinality ('zero or one parent'), default, licence. Inferred:
  references (the value is the id of an object declared elsewhere in the document, or an external CWE identifier),
  format (otmVersion is a semver string), data-model (a YAML rendering denotes the JSON object). Schema: dialect
  ($schema), type (one JSON type), type-nullable (a type array that includes "null"), required (one name of a
  required array), required-in-branch (one name of a required array inside a oneOf branch), one-of, ref ($ref to a
  definition). EXCLUDED PROSE (all quoted in normative.md). Definitions and descriptions of objects and fields: what
  a field holds, its unit or kind of content ('Width in pixels', 'in units', 'contact email'); purpose and
  motivation (Introduction); pointers (L11, L49, L786); restatements (L984 'It can be either a trust zone or another
  component.' beside the must at L986; L298 'The supported representation types are:'; L372-L376; L1284 'It can be
  either a trust zone or a component.'); the AssetRisk note on the IR rules engine (L784); examples (Examples cells
  and Example blocks); and the README Type column, compared field by field with the schema in normative.md (README ↔
  schema) rather than extracted cell by cell: the Data Types rules carry the fields they govern in applies_to, and
  every schema type is an entry. SCHEMA SET. Complete: every type keyword (119), every name of every required array
  (46, two inside the oneOf), the oneOf, every $ref (10) and $schema. The schema declares no enum, const, numeric
  bound, string format, pattern, length or item-count limit, uniqueItems, additionalProperties, dependencies,
  conditional or default; $id, title, properties, items and definitions constrain nothing by themselves. EXTRA
  FIELDS. pointer (schema entries), variant (the README subsection a row belongs to: Diagram, Code, Representation
  element for diagram, code or threat-model), condition (when a conditional requirement applies), applies_to (the
  README fields a Data Types rule governs), inferred_rule, related (entries that restate, enforce or are enforced by
  this one), note (extractor's remark, not source text). PASS. Pass-1 extraction by agent A, 2026-10-13. Verify and
  cross-check passes by agent C, 2026-10-14 (verification.md).
