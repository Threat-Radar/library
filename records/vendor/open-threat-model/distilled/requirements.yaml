  **REQUIRED**, 1 cell opening <b>RECOMMENDED (required in the next major version)</b>). otm_schema.json,
  CONTRIBUTING.md, EXAMPLE.yaml and EXAMPLE.json: 0 each. LICENSE (the CC BY-SA 4.0 legal code, not specification
  text): 2, the all-capitals disclaimer 'MAY NOT APPLY TO YOU' (LICENSE L327, L337), not BCP 14 usage and not
  counted. Extracted one for one: each keyword is the text of exactly one entry, 51 entries (R-0015 ... R-0108, see
  counts). bin/_bcp14.py over all texts = 51; no other text holds an upper-case keyword, so 51 = 51. (2) Lower case.
  README.md has 16 lower-case occurrences, counted longest match first (no shall, must not, should not, may not or
  not recommended occurs): may 1/4, must 2/2, optional 0/1, required 1/3, should 6/6 extracted as the operative word
  of a requirement; 10 extracted, 6 excluded: may 3 (a possibility in an OTM object row description, L57; two inside
  example values, L1544, L1622), required 2 (the future-version announcement '(required in the next major version)'
  inside the RECOMMENDED cell, L1139; an example value 'state: required', L1495), optional 1 (the label 'Despite all
  fields being optional', L480, which contradicts its own table, D-13). otm_schema.json has 20 lower-case
  'required', each the keyword of a required array; their 46 names are the required and required-in-branch entries.
  CONTRIBUTING.md has 2 (should L47, may L60) about the contribution process, not the format: excluded.
  EXAMPLE.yaml L164 and EXAMPLE.json L220 each hold 'required' only as the example value state: required (a
  mitigation state): excluded. Rule: a
  keyword is extracted when it is the operative modal of a sentence that directs an actor or constrains a value; may
  only when it grants a permission (L23). (3) Derivation. 287 entries = 110 prose + 177 schema. Prose = 51 BCP 14 +
  46 other stated + 13 inferred (the $comment licence statement of otm_schema.json counts as prose). Stated by verb:
  REQUIRED 50, unique 11, range 7, should 6, format 5, licence 2, must 2, normative-reference 2, supported-values 2,
  RECOMMENDED 1, cardinality 1, case-sensitive 1, closed 1, default 1, defines 1, may 1, not-supported 1, required
