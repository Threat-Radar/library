source_defects:
  - id: 'D-01'
    kind: 'reference-mismatch'
    lines: 'README.md L31; otm_schema.json L2'
    finding: 'Data Types bases OTM''s primitive types on the ''JSON Schema Specification Wright Draft 00'' (draft-wright-json-schema-00, section 4.2; L31); the schema that ships with the specification declares JSON Schema draft-07 ("$schema": "http://json-schema.org/draft-07/schema#", L2). Validation semantics are draft-07''s.'
  - id: 'D-02'
    kind: 'stale-version'
    lines: 'README.md L18 L55 L372; otm_schema.json L3'
    finding: 'The current version is 0.2.0 (README L18; schema $id otm-0.2.0, L3; EXAMPLE.yaml L1 otmVersion: 0.2.0), but the OTM object table''s Examples cell gives otmVersion: 0.1.0 (L55) and the RepresentationElement section links ''[OTM version 0.1.0 | Representations-object]'' (L372).'
  - id: 'D-03'
    kind: 'null-contradiction'
    lines: 'README.md L31 L777 L1247; otm_schema.json L45 L182 L265 L268 L269 and 56 others'
    finding: 'README: ''`null` is not supported as a type'' (L31). The schema admits null at 61 of its 119 type keywords (every type array includes "null"): optional fields, the array items of tags, categories, cwes, assets, processed and stored, the mitigation-instance items (L265), and four required fields: repository url (L45), threat risk likelihood (L182), mitigation instance mitigation and state (L268, L269). The README''s own examples leave attributes empty (L777, L1247), which YAML reads as null.'
  - id: 'D-04'
    kind: 'undefined-term'
    lines: 'README.md L27 L31'
    finding: 'L31 points to ''`nullable` for an alternative solution'', but neither the README nor the schema defines nullable. (Extractor''s note: it is the OpenAPI 3.0 Schema Object field behind L27''s OpenAPI reference; the OTM schema expresses nullability with draft-07 type arrays instead.)'
  - id: 'D-05'
    kind: 'type-mismatch'
    lines: 'README.md L31 L37 L541 L800 L812 L824 L1265 L1657 L1681 L1823 L1964 L1976 L2001 L2013; otm_schema.json L65-L67 L89 L182 L184 L207 L218 L219 L237 L238 L251'
    finding: 'Twelve fields are typed integer in the README (line, confidentiality, integrity, availability, trustRating, likelihood, impact, riskReduction, width, height, x, y) and number in the schema. The schema accepts 50.5, which the README''s integer (a JSON number without a fraction or exponent part, L31; signed 32 bits, L37) excludes.'
  - id: 'D-06'
    kind: 'bounds-not-encoded'
    lines: 'README.md L37 L801 L813 L825 L1266 L1658 L1682 L1824; otm_schema.json L65-L67 L89 L182 L184 L207'
    finding: 'Seven fields carry ''From 0 to 100'' (or ''From 0 to a 100'', ''From 0 and 100''): confidentiality, integrity, availability, trustRating, likelihood, impact, riskReduction. The schema declares no minimum or maximum anywhere, nor the signed 32-bit range of integer (L37); 150 or -5 validates.'
  - id: 'D-07'
    kind: 'type-mismatch'
    lines: 'README.md L155 L255 L323 L447 L572 L659 L740 L1018 L1194 L1462 L1602 L1836; otm_schema.json L27 L48 L71 L97 L127 L157 L194 L208 L253'
    finding: 'Every attributes field is typed Map [string, string] in the README (written Map &lt;string, string&gt; in the representation-element tables); the schema declares ["object", "null"] with no constraint on member values, so numbers, arrays or objects validate. The README''s own Diagram example gives an integer value (transparent: 40, L323).'
  - id: 'D-08'
    kind: 'collection-typing'
    lines: 'README.md L57-L63; otm_schema.json L31 L53 L76 L102 L132 L162 L199'
    finding: 'The OTM object table types representations, assets, components, dataflows, trustZones, threats and mitigations as ''... object'' (L57-L63) and the README never says they are arrays; the schema declares each an array of objects, and the README examples use YAML sequences (e.g. L757, L1034).'
  - id: 'D-09'
    kind: 'nullability-inconsistent'
    lines: 'otm_schema.json L24 L76 L83 L92 L132 L182 L184 L185 L223 L229 L230 L263'
    finding: 'Nullability is applied unevenly: root trustZones (L76) and dataflows (L132) are "array" while the other five root collections are ["array", "null"]; trust zone type (L83), threat risk impactComment (L185) and the Parent object''s trustZone and component (L229, L230; each optional outside its oneOf branch) are "string" while every other optional string admits null (likelihoodComment, L183); a trust zone''s optional parent refs the Parent object, typed "object" (L92, L223), while a component''s optional assets refs a nullable assetInstance (L116, L276); project tags items (L24) are "string" while all other tags items admit null; likelihood admits null (L182) but impact does not (L184); threat-instance mitigations is "array" (L263) while its items admit null. A producer that writes null for every absent optional value fails at these places.'
  - id: 'D-10'
    kind: 'required-mismatch'
    lines: 'README.md L298 L304 L308 L334 L354; otm_schema.json L34 L40'
    finding: '''Depending on the type selected, some extra fields must be included'' (L298); the Diagram type marks size REQUIRED (L308), the Code type''s repository is not marked REQUIRED (L334) and Threat-Model has none (L354). The schema requires only name, id and type of a representation (L34), declares size optional (L40) and has no conditional (if/then) on type.'
  - id: 'D-11'
    kind: 'required-mismatch'
    lines: 'README.md L432 L440; otm_schema.json L243 L248 L249'
    finding: 'A representation element for a diagram has position (L432) and size (L440) REQUIRED; the schema''s representationElement requires only representation and id (L243). Which variant applies depends on the type of the representation the element names, which a schema of the element alone cannot see.'
  - id: 'D-12'
    kind: 'required-mismatch'
    lines: 'README.md L1930-L1932; otm_schema.json L43 L45'
    finding: 'Repository url carries no REQUIRED in the README (L1932); the schema requires it whenever repository is present (L43) and at the same time admits null for it (L45).'
  - id: 'D-13'
    kind: 'internal-contradiction'
    lines: 'README.md L480 L494 L518'
    finding: '''Despite all fields being optional, at least one of them is required.'' (L480) opens a table that marks representation (L494) and id (L518) REQUIRED, so the fields are not all optional, and ''at least one of them'' names no field set. The schema has no anyOf or minProperties for it.'
  - id: 'D-14'
    kind: 'type-description-mismatch'
    lines: 'README.md L1175 L1177 L1236; otm_schema.json L92 L223'
    finding: 'TrustZones parent is typed Parent object (L1175; schema L92 refs definitions/parent, an object, L223) but described as ''Unique identifier of the component or trust zone enclosing this trust zone'' (L1177). The README''s TrustZones example writes parent: internet (L1236), a bare string, which the schema rejects.'
  - id: 'D-15'
    kind: 'ambiguous-semantics'
    lines: 'README.md L1175 L1284-L1287 L1302 L1314'
    finding: 'The trustZone row (L1302) and the component row (L1314) of the Parent object share one description: ''Id of the element in which this component is currently enclosed. It can be either a trust zone or another component.'' Each key-specific row thus says its id may name either kind, and both say ''this component'' although trust zones use the Parent object too (L1175). That the key names the kind of the parent is implied (L1284-L1287) but not stated.'
  - id: 'D-16'
    kind: 'strength-mismatch'
    lines: 'README.md L985 L1177 L1302 L1314; otm_schema.json L224-L227'
    finding: 'The README says a parent ''should contain an attribute name stating the component type'' (L985, L1177, L1302, L1314), a recommendation; the schema''s oneOf (L224-L227) makes exactly one of trustZone or component mandatory in every Parent object, so a parent without that attribute is invalid.'
  - id: 'D-17'
    kind: 'integrity-not-enforced'
    lines: 'README.md L93 L221 L396 L420 L494 L518 L624 L648 L697 L865 L880 L934 L1127 L1302 L1314 L1364 L1417 L1429 L1441 L1529 L1731 L1800 L1885'
    finding: 'The README''s identifier rules are prose-only: eleven ids are each a ''Unique identifier'' (scope not stated: per collection or document-wide), and representation elements, parents, dataflow endpoints and assets, asset instances, threat instances and mitigation instances name other objects by id. JSON Schema draft-07 has no keys or references between instance values, and the schema declares no uniqueItems; validation checks none of it.'
  - id: 'D-18'
    kind: 'enumeration-not-encoded'
    lines: 'README.md L189-L193 L298 L372-L376; otm_schema.json L38'
    finding: 'The README lists the ''currently supported representation types'' diagram, code, threat-model (L189-L193, restated L372-L376); the schema types representation type as a plain string (L38) with no enum. Whether another value is invalid is not stated.'
  - id: 'D-19'
    kind: 'unspecified-vocabulary'
    lines: 'README.md L946 L1139 L1744 L1897'
    finding: 'Four fields have no value set: component type (L946; examples ec2-instance, web-service, database, code-class at L949, L1037, L1073, L1088; EXAMPLE.yaml uses CD-V2-WEB-CLIENT and similar at L52), trust zone type (L1139; examples internet, private at L1142, L1232; EXAMPLE.yaml uses UUIDs at L170, L186), threat-instance state (L1744; examples exposed, mitigated at L1747, L1766) and mitigation-instance state (L1897; examples implemented, required at L1769, L1495). The two state fields are REQUIRED.'
  - id: 'D-20'
    kind: 'default-not-encoded'
    lines: 'README.md L1404; otm_schema.json L140'
    finding: 'Dataflows bidirectional defaults to false (L1404); the schema declares no default for it and admits null (L140).'
  - id: 'D-21'
    kind: 'wrong-field-name'
    lines: 'README.md L63 L1885; otm_schema.json L198'
    finding: 'The mitigation instance''s mitigation ''should be declared in the root node mitigation'' (L1885); the root field is mitigations (L63; schema L198), and field names are case sensitive (L25). The parallel threat-instance rule names ''the root node threats'' correctly (L1731-L1732).'
  - id: 'D-22'
    kind: 'wrong-link'
    lines: 'README.md L994 L1186'
    finding: 'Components representations is typed ''array of <a href="#representations-object">Representation Element object</a>'' (L994): the link targets the Representations object, not the RepresentationElement object that TrustZones links correctly (#representationelement-object, L1186).'
  - id: 'D-23'
    kind: 'copy-paste'
    lines: 'README.md L1838'
    finding: 'Mitigations attributes is described as ''This is a free-form list of attributes that complete the description of the threat.'' (L1838): the Threats row''s wording, in the Mitigations table.'
  - id: 'D-24'
    kind: 'heading-level'
    lines: 'README.md L1949 L1986'
    finding: '''### Position object'' (L1986) is a level-3 heading under ''## Size object'' (L1949), while every other object section is level 2, so the README''s own heading path places Position inside Size. Locators in this record keep that path.'
  - id: 'D-25'
    kind: 'example-invalid'
    lines: 'README.md L1210-L1248'
    finding: 'TrustZones example: the key is trustzones (L1211), not trustZones (L61; schema L75), and field names are case sensitive (L25); representations is a single mapping, not an array (L1218, L1238); parent is the string internet (L1236), not a Parent object; postion (L1241) and with (L1245) for position and width. Against the schema the block is not a trust-zone list at all, and under the intended key it fails at representations and parent.'
  - id: 'D-26'
    kind: 'example-invalid'
    lines: 'README.md L462-L476 L588-L606 L674-L681'
    finding: 'The three representation-element examples put one element mapping under representations: (L463, L589, L675) where the field is an array of elements. The diagram example writes with: 100 (L471) for width, so the size lacks its required width (schema L216), and its attributes: (L473) sits at column 0, outside the element.'
  - id: 'D-27'
    kind: 'example-invalid'
    lines: 'README.md L1033-L1097'
    finding: 'Components example: the first component''s attributes is a list of single-key maps (L1065-L1067), not a map (Map [string, string]; schema L127 object); the second component''s representation element writes represetation (L1077), so its required representation is missing (schema L243).'
  - id: 'D-28'
    kind: 'example-invalid'
    lines: 'README.md L1477-L1499'
    finding: 'Dataflows example: target: customer-database (L1484) where the field is destination (L1429), which is required (schema L135); the example fails validation.'
  - id: 'D-29'
    kind: 'example-value'
    lines: 'README.md L160 L179 L1607 L1635 L1735'
    finding: 'Example values that are not what they look like: expirationDate: 2021-05-17 (L1635) is unquoted, which a YAML 1.1 loader reads as a timestamp, a value with no JSON equivalent (L23); the table cell writes the same value with typographic quotes, “2021-05-17” (L1607), as do filePath: “file.xml” (L160, L179), so the curly quotes become part of the string; the threat-instance example cell indents with a no-break space (U+00A0, L1735), which YAML does not treat as indentation.'
  - id: 'D-30'
    kind: 'example-undeclared-fields'
    lines: 'EXAMPLE.yaml L124 L145 L158; EXAMPLE.json L177 L195 L212'
    finding: 'The complete example (README L11) uses members that neither the README nor the schema defines: package in a representation element (EXAMPLE.yaml L124; EXAMPLE.json L177) and representations in dataflows (EXAMPLE.yaml L145, L158; EXAMPLE.json L195, L212). Both files validate only because the schema sets no additionalProperties (an open content model).'
  - id: 'D-31'
    kind: 'licence-split'
    lines: 'README.md L2033; otm_schema.json L5; LICENSE L1'
    finding: 'The repository''s LICENSE is the CC BY-SA 4.0 legal code and the README footer licenses ''This work'' under it (L2033); the schema''s $comment says it ''is published under the terms of the Apache License 2.0'' (schema L5). The schema file thus carries two candidate licences: Apache-2.0 by its own statement, CC BY-SA 4.0 by the repository licence.'
  - id: 'D-32'
    kind: 'typos'
    lines: 'README.md L7 L33 L56 L58 L67 L257 L304 L330 L354 L370 L573 L660 L685 L825 L1266 L1717 L1756 L1812 L1838 L1951'
    finding: 'Kept verbatim, not corrected. In normative text: ''From 0 to a 100'' (L825) and ''From 0 and 100'' (L1266) for the 0-100 range; ''within all the other elements are grouped'' (L56, L67) lacks ''which''; ''Its the unit of work'' (L67) beside ''It''s'' (L56); ''sensible information'' for sensitive (L58, L685); ''The representation element stated how'' (L370); ''add additional data'' (L1717); ''Short descriptions'' (L1812); ''free-form list of attributes'' (L257, L573, L660, L1838) beside ''free-form map'' for the same Map type; typographic quotes opened on both sides, “diagram“ (L304), “code“ (L330), “threat-model“ (L354); ''keep you threat model aware of the changes that happens'' (L7); ''within an OTM files'' (L33); ''Array of mitigation'' (L1756); ''a very basic information'' (L1951). In examples: attakers (L776), represetation (L1077), postgress (L1078), Managages (L1087), accesible (L1156), postion (L1241), psotgress-db (L1432), Creditcard and data base (L1481), attaketr and cyprografy (L1631), rallity, strruggle and monetory (L1633), with for width (L471, L1245), an unbalanced quote in ''MuCustomApp123 (L108).'

