requirements:
  - id: 'open-threat-model#R-0001'
    object: 'Versions'
    field: '(specification version)'
    verb: 'versioning'
    actor: 'spec-maintainer'
    locator: 'README.md L15 › Versions'
    text: 'The Open Threat Model specification is versioned using [Semantic Versioning 2.0.0](https://semver.org/spec/v2.0.0.html) (semver) and follows the semver specification.'
    form: 'prose'
    kind: 'stated'
    testable: 'partial'
    testable_reason: 'Binds how editions are numbered. One edition shows only that its own version, 0.2.0 (L18), is a valid semver string; the major/minor/patch discipline is visible only across editions.'
    related:
      - 'open-threat-model#R-0016'
    note: 'CONTRIBUTING.md L27-L28 qualifies the rule: the standard ''is intended to use Semantic Versioning 2.0.0'' but ''the policy for versioning could change in the future''. open-threat-model#R-0016 applies the rule to the otmVersion field.'
    status: 'active'
  - id: 'open-threat-model#R-0002'
    object: 'Format'
    field: '(document)'
    verb: 'may'
    actor: 'otm-producer'
    locator: 'README.md L23 › Format'
    text: 'An OTM document is itself a JSON object, which may be represented either in JSON or YAML format.'
    form: 'prose'
    kind: 'stated'
    testable: 'yes'
    related:
      - 'open-threat-model#R-0112'
    note: 'Permission to the producer to encode the document as JSON or as YAML. The source does not say a consumer must accept both. The root being an object is also the schema''s root type (open-threat-model#R-0112).'
    status: 'active'
  - id: 'open-threat-model#R-0003'
    object: 'Format'
    field: '(document)'
    verb: 'data-model'
    actor: 'otm-producer'
    locator: 'README.md L23 › Format'
    text: 'An OTM document is itself a JSON object'
    form: 'prose'
    kind: 'inferred'
    testable: 'partial'
    testable_reason: 'Checkable by loading a YAML document with a JSON-compatible loader and comparing the result with its JSON form; YAML 1.1 and YAML 1.2 loaders resolve unquoted scalars differently.'
    inferred_rule: 'A YAML rendering must denote that JSON object: every value must have a JSON equivalent (mapping keys are strings; no YAML-only types). An unquoted 2021-05-17, as in the Threats example at L1635, is a timestamp to a YAML 1.1 loader and has no JSON equivalent.'
    note: 'Derived from ''is itself a JSON object, which may be represented either in JSON or YAML'' (L23): YAML is only a representation of the JSON object. See D-29.'
    status: 'active'
  - id: 'open-threat-model#R-0004'
