note: >-
  The Open Threat Model (OTM) defines a data format and no exchange, so every structure is a message here: the
  root OTM object and each structure that README.md describes under a heading of its own (26 headings: 19 "##
  ... object" sections, the three representation types under "## Representation supported types", the three
  representation element variants and "### Position object"). Each entry is named exactly as its README heading.
  A field is listed once per structure that names it: the README rows of that heading plus, for non-variant
  structures, every property the schema declares at that location. 109 README field rows and 101 schema property
  declarations give 120 field entries: the 19 extra entries are the variants repeating the shared properties of
  representations (size, repository) and of representationElement (6 + 7 + 4). Field names are exactly as
  spelled in both sources (case sensitive, README L25). The source schema declares no enum, const, pattern,
  format, minimum, maximum, additionalProperties, uniqueItems, default or if/then; its only constraints are
  type, required, items, $ref and one oneOf.
conventions:
  name: "structure: README heading text exactly; field: property name exactly"
  readme_type: "the README Type cell as rendered: link markup reduced to its text, HTML entities decoded"
  readme_required: >-
    yes = the README description starts with REQUIRED in bold; recommended = RECOMMENDED; no = neither; null = the
    README has no row for this field at this heading (see readme_defined_in)
  readme_line: >-
    README.md line of the field name cell; readme_required_line = line holding the REQUIRED / RECOMMENDED marker;
    readme_description_lines = first and last line of the description cell
  schema_pointer: "RFC 6901 JSON pointer into schema/otm_schema.json of the property subschema; schema_line = line of its key"
  schema_type: >-
    type of the property after following $ref (schema_ref gives the target); a list, "null" included where the
    schema allows null
  schema_required: "yes = in the enclosing object's required list; oneOf = required only by one branch of a oneOf; no = optional"
  schema_constraints: "what the source schema enforces beyond type (there is no enum, range, pattern or format anywhere)"
  strict: >-
    ids of the additions in schema/otm-0.2.0.derived-strict.schema.json that constrain this field
    (strict_additions below)
  xref: >-
    ids of the derived cross-reference checks that cover this field (derived_checks below); no JSON Schema here
    can express them
  references: >-
    what an id-valued field points at; checked_by_schema is false for every one. kind: stated = the README names
    the target (e.g. "Id of the representation"); inferred = the target is read from the key or the example
    values. That the id must resolve to an object declared in the same document is never stated:
    requirements.yaml marks those resolution rules inferred (R-0029, R-0036, R-0040, R-0053, R-0054, R-0072,
    R-0074, R-0081, R-0083, R-0084, R-0088) and the should rules R-0095, R-0103 stated
  field_examples: "ids of this field's README Examples-column snippets in examples/readme-field-examples.yaml"
  example_json: >-
    EXAMPLE.json: of = instances of the structure, present = instances carrying the field, null = of those, how
    many are null, lines = line of each occurrence of the key. EXAMPLE.yaml parses to identical data
    (examples/expected.yaml X-01)
  constrained_by: >-
    ids of the requirements in requirements.yaml that constrain this structure or field; filled by the coordinator
    and checked in pass 3 (see constrained_by_linking)
