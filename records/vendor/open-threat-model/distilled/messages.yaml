encodings:
  document:
    statement: "An OTM document is itself a JSON object, which may be represented either in JSON or YAML format."
    line: 23
  field_names:
    statement: >-
      All field names in the specification are **case sensitive**. This includes all fields that are used as keys in
      a map.
    line: 25
  approach:
    statement: >-
      The specification follows the same approach to JSON formats as the OpenAPI specification. See
      https://swagger.io/specification/ for more information.
    line: 27
  json: >-
    No JSON RFC, media type, file extension or character encoding is named. The complete example is EXAMPLE.json
    (README L11): UTF-8 with only ASCII characters, LF line ends, 2-space indentation; json.dumps(indent=2)
    reproduces it byte for byte.
  yaml: >-
    The YAML version is not stated. A YAML document is an OTM document only through the JSON data model (L23), so
    its scalars must resolve to JSON types. A YAML 1.1 loader (PyYAML SafeLoader as shipped, SnakeYAML) turns
    unquoted dates such as expirationDate: 2021-05-17 in the README Threats example (L1635) into timestamps, which
    are not JSON values; examples/ therefore loads YAML with the timestamp resolver disabled and reports the stock
    YAML 1.1 result separately where it differs (one fixture). A key with no value (attributes: in EXAMPLE.yaml)
    is null. EXAMPLE.yaml parses to data identical to EXAMPLE.json, key order included.
  layout: >-
    Text only: no binary encoding, framing, canonical form, member ordering, signature or digest is defined.
    Member order carries no meaning in either encoding.
identifier_scheme:
  type: >-
    JSON string on every id field (schema type "string"); no pattern, length, character set or case rule in either
    source
  uniqueness: >-
    The README calls each id a "Unique identifier" (Project L93, representation L221, representation elements L420
    / L518 / L648, asset L697, component L934, trust zone L1127, dataflow L1364, threat L1529, mitigation L1800)
    without saying unique within what. The schema checks no uniqueness; draft-07 cannot express uniqueness of one
    property across array items. Derived check XR-01 checks it per collection.
  cross_collection: >-
    The Parent object names its target collection by key (trustZone or component) "to avoid ambiguity" (L985,
    L1302, L1314). Disambiguating by key suggests that an id is not assumed unique across collections; XR-01
    reports cross-collection reuse as info only.
  references: >-
    By id value only: a string field holding the id of another object of the same document (see references). There
    is no URI form, namespace or versioned id, and no reference to another OTM document.
  example_styles:
    - {value: "project-example-id", where: "README L96", style: "kebab-case slug"}
    - {value: "cc-data", where: "README L700", style: "kebab-case slug"}
    - {value: "org.example.class", where: "README L521", style: "dotted name"}
    - {value: "LOSS-CONTROL_ENV", where: "README L1532", style: "upper case with - and _"}
    - {value: "730df42e-69a4-11ed-bd69-9b318e4f98c5", where: "README L1130", style: "UUID (version 1)"}
    - {value: "22724267-be7e-44c0-8b1f-d7d33e9a34ec", where: "EXAMPLE.json L281", style: "UUID (version 4)"}
    - {value: "database class", where: "EXAMPLE.json L176", style: "contains a space"}
    - {value: "box-for-postgress-DB", where: "EXAMPLE.json L152", style: "mixed case"}
data_types:
  statement: >-
    Primitive data types in the OTM are based on the types supported by the [JSON Schema Specification Wright
    Draft 00](https://datatracker.ietf.org/doc/html/draft-wright-json-schema-00#section-4.2). Note that `integer`
    as a type is also supported and is defined as a JSON number without a fraction or exponent part. `null` is not
    supported as a type (see `nullable` for an alternative solution).
  line: 31
  table_lines: [35, 45]
  types:
    - {type: "integer", comment: "signed 32 bits", line: 37, readme_field_rows: 12}
    - {type: "long", comment: "signed 64 bits (a.k.a long)", line: 38, readme_field_rows: 0}
    - {type: "float", comment: "", line: 39, readme_field_rows: 0}
    - {type: "double", comment: "", line: 40, readme_field_rows: 0}
    - {type: "string", comment: "", line: 41, readme_field_rows: 41}
    - {type: "richText", comment: "Rich text fields are noted as supporting CommonMark markdown formatting.", line: 42, readme_field_rows: 12}
    - {type: "boolean", comment: "", line: 43, readme_field_rows: 1}
    - {type: "date", comment: "As defined by full-date - [RFC3339](https://xml2rfc.tools.ietf.org/public/rfc/html/rfc3339.html#anchor14)", line: 44, readme_field_rows: 0}
    - {type: "datetime", comment: "As defined by date-time - [RFC3339](https://xml2rfc.tools.ietf.org/public/rfc/html/rfc3339.html#anchor14)", line: 45, readme_field_rows: 0}
  other_readme_types: >-
    README Type cells also use object types (a link to a structure), "array of strings", "array of <structure>",
    "Map [string, string]" and "Map <string, string>". boolean is used once (Dataflows bidirectional); long,
    float, double, date and datetime by no field.
