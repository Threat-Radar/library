derived_checks:
  note: >-
    Ours, not the source's: checks for README rules that no draft-07 schema can express. kind stated = the README
    says it; inferred = read from the README with the evidence given. For XR-02 to XR-09, kind is about the
    target the README names, as in references (conventions); that the target is declared in the same document is
    inferred for every one except XR-08 and XR-09 (requirements.yaml).
  checks:
    - {id: "XR-01", kind: "stated", readme_lines: [93, 221, 420, 518, 648, 697, 934, 1127, 1364, 1529, 1800], check: "ids are unique within each collection: representations, assets, components, trustZones, dataflows, threats, mitigations, and the representation elements of the whole document (\"Unique identifier for the ...\"). The README does not say whether ids must also be unique across collections; collisions across collections are reported as info, not as a failure"}
    - {id: "XR-02", kind: "inferred", readme_lines: [1284, 1286, 1302, 1305], check: "Parent object trustZone names the id of a trust zone of the document. Inferred from the key: the two keys are the \"two supported types of parents\" (L1284-1287), but the README gives both the same description, \"Id of the element in which this component is currently enclosed. It can be either a trust zone or another component.\" (L1302, L1314)"}
    - {id: "XR-03", kind: "inferred", readme_lines: [1284, 1287, 1314, 1317], check: "Parent object component names the id of a component of the document. Inferred from the key, as for XR-02"}
    - {id: "XR-04", kind: "stated", readme_lines: [396, 494, 624], check: "a representation element's representation names the id of a representation of the document (\"Id of the representation on which this element is represented\")"}
    - {id: "XR-05", kind: "stated", readme_lines: [1417, 1429], check: "a dataflow's source and destination name the id of a component of the document (\"Unique identifier for the source/destination component of the dataflow\")"}
    - {id: "XR-06", kind: "stated", readme_lines: [865, 880], check: "Asset Instance processed and stored items name ids of assets of the document (\"Array of ids that represent the assets\")"}
    - {id: "XR-07", kind: "inferred", readme_lines: [1441], check: "a dataflow's assets items name ids of assets of the document (the README says \"Array of assets that are transported by the dataflow\", not explicitly ids; its example values are asset ids)"}
    - {id: "XR-08", kind: "stated", readme_lines: [1731, 1732], check: "a threat instance's threat names the id of a threat in the root threats (\"It should be one of the threats described in the root node threats.\")"}
    - {id: "XR-09", kind: "stated", readme_lines: [1885], check: "a mitigation instance's mitigation names the id of a mitigation in the root mitigations (\"It should be declared in the root node mitigation.\")"}
    - {id: "XR-10", kind: "stated", readme_lines: [432, 440], check: "a representation element whose representation is of type diagram has a position and a size (both \"**REQUIRED**\" for a diagram element); the variant is known only by resolving XR-04"}
