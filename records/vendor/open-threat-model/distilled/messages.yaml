constrained_by_linking:
  method: >-
    Filled by the coordinator after pass 1 (scratch script, not committed), from requirements.yaml: a schema-form
    requirement links to the field or structure whose schema_pointer it constrains (a required/N entry to the named
    field of that object; items/type and items/$ref to the array field; a Parent oneOf branch to its key); a
    README-form requirement links to the field of the same name in the structure whose README section holds its
    locator line, or to the structure itself, and also to the same field (or structure) of the structure its
    object names: a variant row (Diagram, or a Representation element variant) thus also links to the shared field
    of Representations object or RepresentationElement object, where the requirement's condition or variant says
    when it applies. R-0026 (L298, under Representation supported types) links to Representations object.
    R-0002..R-0005 and R-0110 bind the whole document and link to the OTM object structure. Pass 3 recomputed
    every link from this rule: R-0034 lacked its variant link (Representation element for code), now added.
  linked: 275
  unlinked:
    - {ids: ["open-threat-model#R-0001"], reason: "Versioning of the specification itself; binds the spec maintainer, not a document field (otmVersion carries R-0016)."}
    - {ids: ["open-threat-model#R-0006", "open-threat-model#R-0007", "open-threat-model#R-0008", "open-threat-model#R-0009", "open-threat-model#R-0010", "open-threat-model#R-0011", "open-threat-model#R-0012", "open-threat-model#R-0013", "open-threat-model#R-0014"], reason: "Data Types rules apply to every field of the named README type, not to one field; see data_types above."}
    - {ids: ["open-threat-model#R-0109", "open-threat-model#R-0111"], reason: "Licence statements (README footer, schema $comment); they bind users of the files, not document content."}
