extension_points:
  attributes_maps:
    description: >-
      A free-form map on 9 structures. The README types it "Map [string, string]" (or "Map <string, string>" on the
      element variants) and calls it "a free-form map of attributes that complete the description of" the object.
      The schema declares ["object", "null"] with no constraint on keys or values (M-11).
    at:
      - {schema_pointer: "/properties/project/properties/attributes", schema_line: 27, strict: "S-27"}
      - {schema_pointer: "/properties/representations/items/properties/attributes", schema_line: 48, strict: "S-28"}
      - {schema_pointer: "/properties/assets/items/properties/attributes", schema_line: 71, strict: "S-29"}
      - {schema_pointer: "/properties/trustZones/items/properties/attributes", schema_line: 97, strict: "S-30"}
      - {schema_pointer: "/properties/components/items/properties/attributes", schema_line: 127, strict: "S-31"}
      - {schema_pointer: "/properties/dataflows/items/properties/attributes", schema_line: 157, strict: "S-32"}
      - {schema_pointer: "/properties/threats/items/properties/attributes", schema_line: 194, strict: "S-33"}
      - {schema_pointer: "/properties/mitigations/items/properties/attributes", schema_line: 208, strict: "S-34"}
      - {schema_pointer: "/definitions/representationElement/properties/attributes", schema_line: 253, strict: "S-35"}
    absent_from:
      - "OTM object"
      - "AssetRisk object"
      - "Asset Instance object"
      - "TrustZoneRisk object"
      - "Parent object"
      - "ThreatRisk object"
      - "Threat instance object"
      - "Mitigation instance object"
      - "Repository object"
      - "Size object"
      - "Position object"
  open_objects: >-
    No subschema sets additionalProperties, so every object accepts undeclared keys and ignores them. EXAMPLE.json
    relies on this: /components/3/representations/0/package (L177) and /dataflows/0/representations,
    /dataflows/1/representations (L195, L212) are declared nowhere. The same openness lets misspelt optional keys
    pass silently (README examples: postion L1241, trustzones L1211); a misspelt required key is caught only
    through the missing required key (represetation L1077, target L1484, with L471).
  open_vocabularies:
    - {field: "Representations object.type", readme: "closed list diagram | code | threat-model (L189-193)", schema: "free string (L38)", strict: "S-02"}
    - {field: "Components object.type", readme: "\"The kind of the described component\" (L946); example ec2-instance (L949)", schema: "free string (L109)", observed: "README: web-service, database, code-class; EXAMPLE.json: CD-V2-WEB-CLIENT, CD-V2-WEB-SERVICE, CD-V2-POSTGRESQL, CD-V2-CODE-SNIPPET-SHARING"}
    - {field: "TrustZones object.type", readme: "\"Type for the trust zone\", RECOMMENDED (L1139); example internet (L1142)", schema: "free string (L83)", observed: "README: internet, private; EXAMPLE.json: two UUIDs (f0ba7722-..., 2ab4effa-...)"}
    - {field: "Threats object.categories", readme: "\"Array of categories that are applicable to the threat\" (L1553)", schema: "array of free strings (L170)", observed: "Spoofing, Authentication, Tampering"}
    - {field: "Threats object.cwes", readme: "\"Array of CWE identifiers of weaknesses associated with the threat\" (L1567)", schema: "array of free strings (L174)", observed: "CWE-79, CWE-787"}
    - {field: "Threat instance object.state", readme: "\"Describes the state in which the threat currently is.\" (L1744)", schema: "free string (L261)", observed: "mitigated, exposed (state-machine.yaml M1)"}
    - {field: "Mitigation instance object.state", readme: "\"State of the mitigation\" (L1897)", schema: "free string or null (L269)", observed: "implemented, required (state-machine.yaml M2)"}
  representation_types: >-
    "Representation is an abstract concept and there might be several implementations." (L187) The README lists
    three "currently supported" types (L189-193) and defines no registration or naming rule for others.
mismatches:
  note: >-
    README.md versus otm_schema.json, as found by this extraction (agent A numbers source defects separately).
    fixtures name the examples/ files that demonstrate each one.
  items:
    - id: "M-01"
      title: "integer in the README, number in the schema"
      readme: >-
        integer for AssetRisk confidentiality / integrity / availability (L800, L812, L824), TrustZoneRisk trustRating
        (L1265), ThreatRisk likelihood / impact (L1657, L1681), Mitigations riskReduction (L1823), Representation
        element for code line (L541), Size width / height (L1964, L1976), Position x / y (L2001, L2013); integer is
        "signed 32 bits" (L37)
      schema: "number at L65-67, L89, L182, L184, L207, L251, L218-219, L237-238"
      effect: "fractions (50.5) and values outside 32 bits pass the source schema"
      strict: ["S-04", "S-05", "S-06", "S-07", "S-08", "S-09", "S-10", "S-11", "S-12", "S-13", "S-14", "S-15"]
      fixtures: ["neg-strict-likelihood-fraction.json"]
    - id: "M-02"
      title: "ranges stated, not enforced"
      readme: >-
        "From 0 to 100" for confidentiality (L801), integrity (L813), availability (L825, "From 0 to a 100"),
        trustRating (L1266, "From 0 and 100"), likelihood (L1658), impact (L1682), riskReduction (L1824)
      schema: "no minimum or maximum anywhere"
      effect: "negative and >100 values pass the source schema"
      strict: ["S-04", "S-05", "S-06", "S-07", "S-08", "S-09", "S-10"]
      fixtures: ["neg-strict-asset-risk-out-of-range.json", "neg-strict-trustrating-negative.json"]
    - id: "M-03"
      title: "representation type is a closed list in the README, a free string in the schema"
      readme: >-
        "These are the currently supported representation types: diagram, code, threat-model" (L189-193); "The
        supported representation types are:" (L298)
      schema: "type: string (L38)"
      effect: "any type string passes"
      strict: ["S-02"]
      fixtures: ["neg-strict-representation-type-unknown.json"]
    - id: "M-04"
      title: "type-specific representation fields are unconditional in the schema"
      readme: >-
        "Depending on the type selected, some extra fields must be included in the representation." (L298): size is
        REQUIRED for diagram (L308); repository belongs to code (L334); threat-model has no extra fields (L354). The
        Representations object table (L197-268) does not list size or repository.
      schema: "size (L40) and repository (L41-47) are optional properties of every representation, whatever its type"
      effect: >-
        a diagram representation without size passes; a code representation may carry size and a diagram one
        repository
      strict: ["S-03"]
      fixtures: ["neg-strict-diagram-without-size.json"]
    - id: "M-05"
      title: "representation element variants collapse into one definition"
      readme: >-
        three variants with different field sets (L380, L478, L608); for diagram elements position and size are
        REQUIRED (L432, L440)
      schema: >-
        one definition representationElement (L241-255) with the union of all fields, required only representation and
        id (L243)
      effect: >-
        a diagram element without position or size passes; any element may carry any variant's fields. The variant is
        known only by resolving representation to a representation and reading its type, which JSON Schema cannot do.
      xref: ["XR-04", "XR-10"]
      fixtures: ["neg-xref-diagram-element-without-position.json"]
    - id: "M-06"
      title: "code element: \"at least one\" rule, unexpressed and self-contradictory"
      readme: >-
        "Despite all fields being optional, at least one of them is required." (L480), in a table that marks
        representation (L494) and id (L518) REQUIRED
      schema: "no at-least-one rule (L241-255)"
      effect: "which fields the rule counts is undetermined; neither the strict profile nor the XR checks implement it"
    - id: "M-07"
      title: "Repository url: optional in the README, required (but nullable) in the schema"
      readme: "url has no REQUIRED marker (L1930-1932); repository itself is optional for code (L334)"
      schema: "required [\"url\"] (L43) with url [\"string\", \"null\"] (L45)"
      effect: "repository: {} fails the source schema although the README allows it; repository: {url: null} passes"
    - id: "M-08"
      title: "null: \"not supported as a type\" in the README, used throughout the schema"
      readme: >-
        "`null` is not supported as a type (see `nullable` for an alternative solution)." (L31); no `nullable` is
        defined anywhere in the README
      schema: "61 type declarations include \"null\"; EXAMPLE.json carries 22 null values"
      effect: >-
        whether null may stand for an absent optional field is decided only by the schema and the examples. The strict
        profile keeps every null of the source except on README-REQUIRED fields and array items (M-09, S-08,
        S-16..S-26).
    - id: "M-09"
      title: "REQUIRED fields the schema lets be null"
      readme: >-
        ThreatRisk likelihood REQUIRED (L1658); Mitigation instance mitigation and state REQUIRED (L1885, L1897);
        Threat instance mitigations is an "array of Mitigation instance object" (L1755)
      schema: >-
        likelihood ["number", "null"] (L182); mitigation, state ["string", "null"] (L268, L269); mitigation items
        ["object", "null"] (L264-265)
      effect: "a required key with a null value, or a null mitigation instance, passes"
      strict: ["S-08", "S-16", "S-17", "S-18"]
      fixtures: ["neg-strict-mitigation-state-null.json"]
    - id: "M-10"
      title: "nullability asymmetries with no README basis"
      readme: >-
        uniform types: likelihoodComment and impactComment are both richText (L1669, L1693); every root collection is
        optional (L57-63); every tags field is "array of strings" (L140, L957, L1387, L1588)
      schema: >-
        impactComment "string" (L185) but likelihoodComment ["string", "null"] (L183) and AssetRisk comment ["string",
        "null"] (L68); impact "number" (L184) but likelihood nullable (L182); root trustZones (L76) and dataflows
        (L132) "array" but representations, assets, components, threats, mitigations nullable (L31, L53, L102, L162,
        L199); Project tags items "string" (L24) but Components / Dataflows / Threats tags items nullable (L124, L154,
        L191); Threat instance mitigations "array" (L263) while components / dataflows threats are nullable (L118,
        L148); trust zone type "string" (L83) and the Parent object's trustZone and component "string" (L229, L230)
        while other optional strings are nullable; trust zone parent refs the Parent object, "object" (L92, L223),
        while component assets refs a nullable assetInstance (L116, L276)
      effect: >-
        trustZones: null, dataflows: null, impactComment: null, a trust zone's type: null or parent: null, and null for
        the absent key of a Parent object fail; the parallel fields accept null
      fixtures: ["neg-trustzones-null.json", "neg-threat-risk-impact-null.json"]
    - id: "M-11"
      title: "attributes typed Map [string, string] in the README, any object in the schema"
      readme: >-
        "Map [string, string]" / "Map <string, string>" (L155, L255, L447, L572, L659, L740, L1018, L1194, L1462,
        L1602, L1836)
      schema: "[\"object\", \"null\"] with no value constraint (L27, L48, L71, L97, L127, L157, L194, L208, L253)"
      effect: "non-string values pass; the README's own Diagram example has transparent: 40 (L323)"
      strict: ["S-27", "S-28", "S-29", "S-30", "S-31", "S-32", "S-33", "S-34", "S-35"]
      fixtures: ["neg-strict-attributes-non-string-value.json", "readme-representation-type-diagram.yaml"]
    - id: "M-12"
      title: "bidirectional default stated, not declared"
      readme: "\"By default, it is false.\" (L1404)"
      schema: "no default (L140)"
      effect: "annotation only: a consumer must treat an absent or null bidirectional as false itself"
      strict: ["S-36"]
    - id: "M-13"
      title: "otmVersion is unconstrained"
      readme: >-
        the specification is versioned with Semantic Versioning 2.0.0 (L15); otmVersion "states the OTM version used
        in the current file" (L55); current version 0.2.0 (L18)
      schema: "type string (L9-11): no pattern, enum or const"
      effect: >-
        the 0.2.0 schema accepts any otmVersion string, "0.1.0" and "v0.2.0" included; nothing ties a document to the
        schema that validates it
      strict: ["S-01"]
      fixtures: ["neg-strict-otmversion-not-semver.yaml"]
    - id: "M-14"
      title: "which JSON Schema"
      readme: >-
        data types "based on the types supported by the JSON Schema Specification Wright Draft 00" (L31); integer
        "defined as a JSON number without a fraction or exponent part" (L31)
      schema: "draft-07 (L2); a draft-07 integer is any number with a zero fractional part, so 1.0 and 1e2 are integers"
      effect: >-
        the README's lexical integer and draft-07's mathematical integer disagree on values such as 100.0; the strict
        profile follows draft-07
    - id: "M-15"
      title: "README format vocabulary has no schema counterpart"
      readme: "formats integer, long, float, double, string, richText (CommonMark), boolean, date, datetime (L35-45)"
      schema: "no format, contentMediaType or integer keyword at all; richText fields are plain strings"
      effect: "minor: no field uses long, float, double, date or datetime; richText cannot be validated beyond string"
    - id: "M-16"
      title: "identifier uniqueness and references are prose only"
      readme: >-
        "Unique identifier" on 11 id fields; 10 fields that name another object of the document by id, plus the
        external cwes and Repository url (unchecked_references, 12 entries)
      schema: "none of either; draft-07 cannot express them"
      effect: "duplicate ids and dangling references pass both schemas"
      xref: ["XR-01", "XR-02", "XR-03", "XR-04", "XR-05", "XR-06", "XR-07", "XR-08", "XR-09"]
      fixtures: ["neg-xref-duplicate-component-id.json", "neg-xref-dangling-dataflow-destination.json", "neg-xref-dangling-threat-reference.json"]
