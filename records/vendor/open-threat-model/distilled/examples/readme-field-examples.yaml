note: >-
  Every snippet in the Examples column of the README field tables, one vector per table row that has one (86 of
  the 109 rows; the other 23 cells are empty). text is the snippet exactly: for an HTML table cell, the lines of
  its indented code block with the 4-space code-block indentation removed and a final newline; for the one
  markdown table cell (OTM object otmVersion), the inline code without its backticks. readme_lines are the first
  and last README.md line of the snippet. Each snippet is parsed as YAML with PyYAML SafeLoader, YAML 1.1
  timestamps disabled (scalars map onto JSON types, as README L23 requires of an OTM document); the value of the
  field (instance, a JSON pointer into the parsed snippet) is validated against the field's property subschema
  (schema_pointer) of schema/otm_schema.json and of schema/otm-0.2.0.derived-strict.schema.json with jsonschema
  Draft7Validator. Results are actual runs (2026-10-14, python 3.14.3, jsonschema 4.26.0, PyYAML 6.0.3). The
  snippets are quoted from README.md of the Open Threat Model (CC BY-SA 4.0); see README.md here.
