    assertion: >-
      json.dumps(EXAMPLE.json data, indent=2, ensure_ascii=False) + LF reproduces EXAMPLE.json byte for byte, so
      each derived .json fixture differs from it only in the lines its diff lists
    result: true
  - id: "X-03"
    assertion: >-
      the schema at tag 0.2.0 (commit 6bcb2ab, sha256
      bf3a9703787b942ca81d08dd7e4288c4b6396258e8e117b181009c4e0c25b18a, same $id) and the pinned schema give
      different results on whole-document fixtures
    result: true
    differing_fixtures: ["neg-asset-risk-confidentiality-string.json", "neg-size-missing-height.json"]
    explanation: >-
      In the tagged schema, representations and assets carried required/properties at the array level, where
      draft-07 ignores them, so representation and asset items were not validated at all; commit 06288a0
      (2024-01-31) moved them under items without changing $id. Both fixtures listed are valid under the tagged
      schema and invalid under the pinned one.
  - id: "X-04"
    assertion: >-
      every category A fixture yields exactly one source-schema error, every B fixture none under the source and
      exactly one under the strict profile, every C fixture none under either and exactly its one XR failure
    result: true
