schema: "library-examples/v1"
record: "open-threat-model"
reviewed_by: ""
note: >-
  Expected and actual results for every fixture in this directory. actual is what jsonschema reported when run
  on 2026-10-14; nothing here is predicted. expected is the result the fixture is meant to have: for a source
  example, that it conforms (the source presents it as an example); for a derived fixture, the one designed
  violation. Where the two differ, matches_expected is false and source_defects says why from the source text. A
  test harness should assert actual (instance_path and keyword are stable; message is jsonschema's wording). The
  README Examples-column snippets are in readme-field-examples.yaml, with their own results.
validation:
  tool: "python 3.14.3, jsonschema 4.26.0 (Draft7Validator), PyYAML 6.0.3"
  run_on: "2026-10-14"
  schemas: {source: {file: "schema/otm_schema.json", sha256: "81e7f5a52a0a7d66b44cc4e0c15f21b5d60e1ca945c810e39622a730545eef0c"}, strict: {file: "schema/otm-0.2.0.derived-strict.schema.json", sha256: "1ffdbbaae740ba3d6148fdce3324be6f28f0c3e21e2cf277d6d3b0b8d676c235"}, tag_0_2_0: {file: "not held: git show 0.2.0:otm_schema.json in the source repository", sha256: "bf3a9703787b942ca81d08dd7e4288c4b6396258e8e117b181009c4e0c25b18a"}}
  document_rule: "a whole document (kind: document) is validated against the root schema (schema_pointer \"\")"
  fragment_rule: >-
    a README example (kind: fragment) is a mapping whose top-level key names a field; the value under that key
    (instance, a JSON pointer into the parsed fixture) is validated against the property subschema that key names
    in the context of the section's structure (schema_pointer). The whole schema document is kept so that its
    $refs resolve: the validator is built from the root with "$ref": "#<schema_pointer>" added (draft-07 ignores
    the siblings of $ref) and $id removed. secondary repeats a check where the README writes a single element as a
    mapping under a key that holds an array.
  yaml_loading: >-
    PyYAML SafeLoader with the YAML 1.1 timestamp resolver removed, so that every scalar maps onto a JSON type
    (README L23: an OTM document is a JSON object); duplicate keys are an error (none occur). Where the stock YAML
    1.1 loader gives a different result, it is recorded as actual_with_stock_yaml_1_1_loader.
  errors: >-
    one entry per jsonschema error, sorted by instance_path: instance_path (RFC 6901 pointer into the instance),
    keyword, schema_path (relative to schema_pointer; jsonschema leaves $ref hops out of it) and message.
  xref: >-
    derived checks XR-01..XR-10 (messages.yaml derived_checks; ours, not the source's), run on whole documents
    only. info lists ids reused across collections, which the README neither allows nor forbids.
  undeclared_keys_accepted: >-
    keys present in the instance that the schema declares no property for at that place; no object in the schema
    is closed, so each is accepted and ignored
